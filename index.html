/* ============================================================
   GENERAR HTML DEL ACTA — V5.1
   ------------------------------------------------------------
   CAMBIOS RESPECTO A V5.0:
   - Se eliminó el bloque "seccion-cierre" que generaba espacios
     en blanco. Ahora el cierre de </tbody></table></div> se
     emite junto con el ÚLTIMO bloque de cada sección o al
     momento de cortar.
   - hojaActual cuenta correctamente: se incrementa en cada
     saltar-pagina, incluyendo el de firmas. El encabezado de
     continuación usa la hoja real (no hardcodeada).
   - El encabezado de continuación se inserta SOLO si las firmas
     van en hoja aparte, y con el ordinal correcto.
   ============================================================ */
function generarHTMLActa(r, oficina, datos){
  const idAsignacion = oficina.id;
  const grupo = IDX.bienesPorAsig.get(idAsignacion) || { fijos:[], fungibles:[], internos:[], prestados:[] };
  const fijos = grupo.fijos;
  const fungibles = grupo.fungibles;
  const internos = grupo.internos;
  const prestados = grupo.prestados;

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  /* Saliente */
  const salienteGrado = r.grado || "";
  const salienteNombres = r.nombres || "";
  const salienteApPat = r.apPat || "";
  const salienteApMat = r.apMat || "";
  let nombreSaliente = construirNombreFirmante(salienteGrado, salienteNombres, salienteApPat, salienteApMat);
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = r.nombre || "";
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();

  /* Entrante */
  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat);
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  /* Supervisores */
  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  /* Vo.Bo. */
  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const tituloL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()} DE LA <span style="white-space:nowrap">DIV-10</span>`;

  /* ============================================================
     CONSTRUIR BLOQUES ATÓMICOS
     ============================================================ */
  const bloques = [];

  /* Header */
  bloques.push({
    tipo: "header",
    html: `
      <div class="acta-membrete">
        <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
        <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
        <div class="linea3">BOLIVIA</div>
      </div>
      <div class="acta-titulo">
        <span class="titulo-linea1">${esc(tituloL1)}</span>
        <span class="titulo-linea2">${tituloL2}</span>
      </div>
    `
  });

  /* Secciones */
  const secciones = [
    { num: "I.- ", titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", lista: fijos, tipo: "fijos" },
    { num: "II.- ", titulo: "INVENTARIO DE ACTIVOS FUNGIBLES", lista: fungibles, tipo: "fungibles" },
    { num: "III.- ", titulo: "INVENTARIO INTERNO", lista: internos, tipo: "internos" },
    { num: "IV.- ", titulo: "INVENTARIO DE BIENES PRESTADOS", lista: prestados, tipo: "prestados" }
  ];

  secciones.forEach(sec => {
    /* Encabezado de sección */
    bloques.push({
      tipo: "seccion-header",
      nombre: sec.tipo,
      html: generarEncabezadoSeccion(sec.num, sec.titulo, sec.tipo)
    });

    /* Filas */
    if(sec.lista.length === 0){
      bloques.push({
        tipo: "fila",
        nombre: sec.tipo,
        html: `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr>`,
        esVacia: true
      });
    } else {
      sec.lista.forEach((b, i) => {
        bloques.push({
          tipo: "fila",
          nombre: sec.tipo,
          html: generarFilaSeccion(b, i, sec.tipo),
          esVacia: false
        });
      });
    }

    /* Marcador de cierre de sección (NO produce HTML por sí mismo;
       sirve para saber cuándo cerrar la tabla antes de la siguiente) */
    bloques.push({
      tipo: "seccion-fin",
      nombre: sec.tipo,
      html: ""
    });
  });

  /* Firmas */
  const firmasHTML = generarBloqueFirmas({
    nombreSaliente, cargoSaliente, nombreEntrante, cargoEntrante,
    nombreSup1, cargoSup1, nombreSup2, cargoSup2,
    nombreVobo, cargoVobo, fechaLarga
  });
  bloques.push({ tipo: "firmas", html: firmasHTML });

  /* ============================================================
     MEDIR CADA BLOQUE
     ============================================================ */
  const contMed = document.getElementById("actaMedicion");
  bloques.forEach(b => {
    if(!b.html){ b.altura = 0; return; }
    contMed.innerHTML = b.html;
    void contMed.offsetHeight;
    b.altura = contMed.getBoundingClientRect().height;
  });

  /* Altura de los encabezados de sección (para re-emisión al cortar) */
  const alturaEncabezadoSeccion = {};
  secciones.forEach(sec => {
    contMed.innerHTML = generarEncabezadoSeccion(sec.num, sec.titulo, sec.tipo);
    alturaEncabezadoSeccion[sec.tipo] = contMed.getBoundingClientRect().height;
  });

  /* ============================================================
     RECORRER Y DECIDIR SALTOS
     ============================================================ */
  let alturaAcumulada = 0;
  let hojaActual = 1;
  let htmlFinal = "";
  let tablaAbierta = null;      // tipo de la sección con <table> abierta
  let firmasVanEnHojaAparte = false;

  const cerrarTabla = () => {
    if(tablaAbierta){
      htmlFinal += `</tbody></table></div>`;
      tablaAbierta = null;
    }
  };

  for(let i = 0; i < bloques.length; i++){
    const b = bloques[i];

    /* Firmas: siempre hoja nueva */
    if(b.tipo === "firmas"){
      cerrarTabla();
      htmlFinal += `<div class="saltar-pagina"></div>`;
      hojaActual++;
      htmlFinal += b.html;
      firmasVanEnHojaAparte = true;
      break;
    }

    /* Sección-header: si hay tabla anterior abierta, cerrarla */
    if(b.tipo === "seccion-header"){
      cerrarTabla();
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
      if(b.altura <= espacioRestante){
        htmlFinal += b.html;
        alturaAcumulada += b.altura;
      } else {
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = b.altura;
        htmlFinal += b.html;
      }
      tablaAbierta = b.nombre;
      continue;
    }

    /* Sección-fin: cerrar tabla, sumar altura de cierre */
    if(b.tipo === "seccion-fin"){
      cerrarTabla();
      /* El cierre </tbody></table></div> no tiene altura medible,
         pero agregamos un pequeño margen para que la próxima sección
         no quede pegada. Usamos 0 para no desperdiciar espacio. */
      continue;
    }

    /* Fila individual */
    if(b.tipo === "fila"){
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
      if(b.altura <= espacioRestante){
        htmlFinal += b.html;
        alturaAcumulada += b.altura;
      } else {
        cerrarTabla();
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;

        /* Re-emitir encabezado de la sección */
        const sec = secciones.find(s => s.tipo === b.nombre);
        if(sec){
          htmlFinal += generarEncabezadoSeccion(sec.num, sec.titulo, sec.tipo);
          alturaAcumulada = alturaEncabezadoSeccion[sec.tipo] + b.altura;
          tablaAbierta = b.nombre;
        } else {
          alturaAcumulada = b.altura;
        }
        htmlFinal += b.html;
      }
      continue;
    }

    /* Header u otros bloques genéricos */
    const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
    if(b.altura <= espacioRestante){
      htmlFinal += b.html;
      alturaAcumulada += b.altura;
    } else {
      cerrarTabla();
      htmlFinal += `<div class="saltar-pagina"></div>`;
      hojaActual++;
      alturaAcumulada = b.altura;
      htmlFinal += b.html;
    }
  }

  /* ============================================================
     CONTINUACIÓN
     ------------------------------------------------------------
     Se inserta SOLO si las firmas van en hoja aparte (es decir,
     hubo salto antes de ellas). El ordinal es hojaActual, que
     ahora sí refleja el número real de hoja donde van las firmas.
     ============================================================ */
  const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);
  if(firmasVanEnHojaAparte && resumenBienes){
    const textoContinuacion = `${ordinalHoja(hojaActual)} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;
    let bloqueContinuacion = `<div class="acta-continuacion">${esc(textoContinuacion)}</div>`;
    bloqueContinuacion += `<div class="acta-continuacion-resumen">${esc(resumenBienes)}</div>`;

    htmlFinal = htmlFinal.replace(
      '<div class="acta-bloque-firmas">',
      `<div class="acta-bloque-firmas">${bloqueContinuacion}`
    );
  }

  return htmlFinal;
}

/* Genera encabezado de sección (subtítulo + apertura de tabla + thead) */
function generarEncabezadoSeccion(numRomano, titulo, tipoClase){
  let columnasHTML = "";
  if(tipoClase === "fijos"){
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:22%;">CÓDIGO (VSIAF.)</th><th style="width:55%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  } else {
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:10%;">CANTIDAD</th><th style="width:67%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  }
  return `<div class="acta-seccion">
    <div class="acta-seccion-titulo">${numRomano}<span class="subrayado">${esc(titulo)}</span>.</div>
    <table class="acta-tabla">
      <thead><tr>${columnasHTML}</tr></thead>
      <tbody>`;
}

/* Genera una fila de la tabla */
function generarFilaSeccion(b, i, tipoClase){
  const codigo = getVal(b, "CODIGO");
  const cant = getVal(b, "CANTIDAD");
  const desc = getVal(b, "DESCRIPCION DEL ACTIVO");
  const estado = getVal(b, "ESTADO");
  if(tipoClase === "fijos"){
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(codigo)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  }
  return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(cant)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
}

/* Genera el bloque de firmas */
function generarBloqueFirmas(d){
  let bloqueFirmasHTML = `
    <div class="acta-firmas-fila">
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">ENTREGUÉ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreSaliente)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSaliente)}</div>
      </div>
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">RECIBÍ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreEntrante)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoEntrante)}</div>
      </div>
    </div>
  `;

  if(d.nombreSup1 && d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firmas-fila">
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
        </div>
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
        </div>
      </div>`;
  } else if(d.nombreSup1){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
      </div>`;
  } else if(d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
      </div>`;
  }

  bloqueFirmasHTML += `
    <div class="acta-firma-bloque">
      <div class="acta-vobo">Vo. Bo.</div>
      <div class="acta-firma-nombre">${esc(d.nombreVobo)}</div>
      <div class="acta-firma-cargo">${esc(d.cargoVobo)}</div>
    </div>
  `;

  return `<div class="acta-bloque-firmas">
    <div class="acta-fecha-firmas">${esc(d.fechaLarga)}</div>
    <div class="acta-firmas">${bloqueFirmasHTML}</div>
  </div>`;
}

function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function abrirLightbox(url){
  const safe = sanitizarUrlFoto(url);
  if(!safe) return;
  document.getElementById("lightbox-img").src = safe;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

   INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  try{
    history.replaceState({ pantalla: "home" }, "");
    history.pushState({ pantalla: "home" }, "");
  }catch(e){}
  cargarDesdeNube(false);
});
