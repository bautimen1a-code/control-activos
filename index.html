<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V3.5</title>
<style>
  :root{
    --bg:#0a0e12;--bg-panel:#141a20;--bg-elevado:#1e252d;--bg-hover:#252d36;
    --texto:#e8ecf0;--texto-suave:#8b96a3;--texto-muy-suave:#5a6472;
    --borde:rgba(212,176,96,.2);--sombra-panel:0 8px 30px rgba(0,0,0,.5);
    --dorado:#d4b060;--dorado-brillante:#f0d088;--dorado-glow:rgba(212,176,96,.4);
    --cian:#26c6da;--cian-brillante:#5ee0f0;--cian-glow:rgba(38,198,218,.35);
    --verde:#4ade80;--verde-glow:rgba(74,222,128,.3);
    --rojo:#ef4444;--rojo-glow:rgba(239,68,68,.3);
    --amarillo:#fbbf24;--vino:#e05878;
    --mono:"JetBrains Mono","Consolas","Monaco",monospace;
    --sans:"Inter","Segoe UI",Roboto,sans-serif;
  }
  body.light{
    --bg:#f4f2eb;--bg-panel:#ffffff;--bg-elevado:#f8f7f3;--bg-hover:#f0edd9;
    --texto:#1e252d;--texto-suave:#5a6472;--texto-muy-suave:#8b96a3;
    --borde:rgba(30,51,37,.15);
    --sombra-panel:0 4px 16px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);background:var(--bg);color:var(--texto);
    font-size:14px;min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;position:relative;
    transition:background .4s ease,color .4s ease;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-elevado);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--dorado),#9e7d35);border-radius:5px;border:2px solid var(--bg-elevado);}
  ::-webkit-scrollbar-thumb:hover{background:var(--dorado-brillante);}
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-layer::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(212,176,96,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,176,96,.03) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;}
  body.light .bg-layer::before{background-image:linear-gradient(rgba(30,51,37,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,51,37,.04) 1px,transparent 1px);}
  @keyframes gridMove{from{transform:translate(0,0);}to{transform:translate(50px,50px);}}
  .bg-layer::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,rgba(38,198,218,.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(212,176,96,.06) 0%,transparent 40%);animation:pulseBg 8s ease-in-out infinite;}
  body.light .bg-layer::after{background:radial-gradient(circle at 20% 30%,rgba(38,198,218,.05) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(212,176,96,.04) 0%,transparent 40%);}
  @keyframes pulseBg{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}
  .scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cian),transparent);opacity:.3;z-index:1;pointer-events:none;animation:scanline 8s linear infinite;}
  body.light .scanline{opacity:.15;}
  @keyframes scanline{from{top:0;}to{top:100vh;}}
  .app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

  /* HEADER */
  .header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(20,26,32,.95),rgba(10,14,18,.9));backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);padding:16px 20px;overflow:hidden;transition:background .4s ease;}
  body.light .header{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,247,243,.95));}
  .header::after{content:"";position:absolute;bottom:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--dorado),var(--cian),var(--dorado),transparent);background-size:200% 100%;animation:borderFlow 3s linear infinite;}
  @keyframes borderFlow{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .header-content{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .header-logo{display:flex;align-items:center;gap:12px;}
  .header-logo-icon{width:40px;height:40px;border:2px solid var(--dorado);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dorado);background:rgba(212,176,96,.05);animation:pulseGlow 3s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--dorado-glow);}50%{box-shadow:0 0 20px 4px var(--dorado-glow);}}
  .header-text h1{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--texto),var(--dorado-brillante));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  body.light .header-text h1{background:linear-gradient(90deg,#1e252d,var(--dorado));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .btn-icon{width:40px;height:40px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s ease;flex-shrink:0;}
  .btn-icon.cyan{color:var(--cian);}
  .btn-icon.gold{color:var(--dorado);}
  .btn-icon.cyan:hover{background:var(--cian);color:var(--bg);border-color:var(--cian-brillante);box-shadow:0 0 20px var(--cian-glow);transform:scale(1.05);}
  .btn-icon.gold:hover{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);transform:rotate(180deg) scale(1.05);box-shadow:0 0 20px var(--dorado-glow);}
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .header-status{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(38,198,218,.08);border:1px solid rgba(38,198,218,.3);border-radius:20px;font-size:10px;font-family:var(--mono);color:var(--cian-brillante);letter-spacing:1px;}
  .status-dot{width:8px;height:8px;background:var(--verde);border-radius:50%;box-shadow:0 0 8px var(--verde);animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .main{flex:1;padding:20px;max-width:1200px;margin:0 auto;width:100%;}

  /* HOME */
  .home{display:flex;flex-direction:column;gap:14px;padding-top:20px;animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .home-btn{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:22px 14px;cursor:pointer;transition:all .3s ease;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .home-btn:hover{transform:translateY(-4px);border-color:var(--color,var(--dorado));box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 25px color-mix(in srgb,var(--color,var(--dorado)) 30%,transparent);}
  .home-btn[data-color="verde"]{--color:var(--verde);}
  .home-btn[data-color="azul"]{--color:var(--cian);}
  .home-btn[data-color="marron"]{--color:#d4a060;}
  .home-btn[data-color="vino"]{--color:var(--vino);}
  .home-btn[data-color="buscar"]{--color:var(--dorado);}
  .home-btn-icon{font-size:32px;color:var(--color,var(--dorado));}
  .home-btn-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:800;}
  .home-btn-count{font-size:26px;font-weight:800;color:var(--color,var(--dorado));font-family:var(--mono);}
  .home-btn.buscar{grid-column:span 4;padding:24px;background:linear-gradient(135deg,rgba(212,176,96,.08),rgba(212,176,96,.02));flex-direction:row;justify-content:center;gap:16px;}
  .home-btn.buscar .home-btn-icon{font-size:28px;}
  .home-btn.buscar .home-btn-label{font-size:14px;letter-spacing:3px;color:var(--dorado-brillante);}

  /* MODO BÚSQUEDA */
  .modo-busqueda{animation:fadeIn .35s ease both;display:flex;flex-direction:column;gap:14px;min-height:60vh;}
  .modo-busqueda-top{display:flex;gap:10px;align-items:center;width:100%;min-width:0;}
  .btn-volver{display:inline-flex;align-items:center;gap:8px;background:var(--bg-elevado);color:var(--dorado);border:1px solid var(--borde);padding:12px 14px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border-radius:10px;font-weight:800;font-family:var(--sans);flex-shrink:0;transition:all .3s ease;white-space:nowrap;}
  .btn-volver:hover{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);transform:translateX(-4px);box-shadow:0 0 20px var(--dorado-glow);}
  .search-wrapper{flex:1;min-width:0;position:relative;}
  .search-box{display:flex;align-items:center;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:4px 12px;width:100%;min-width:0;box-sizing:border-box;transition:all .3s ease;}
  .search-box:focus-within{border-color:var(--dorado);box-shadow:0 0 0 3px rgba(212,176,96,.1),0 0 30px rgba(212,176,96,.2);}
  .search-icon{color:var(--dorado);font-size:18px;margin-right:10px;flex-shrink:0;}
  .search-input{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:14px 0;font-size:15px;color:var(--texto);font-family:var(--sans);font-weight:500;letter-spacing:.5px;width:100%;box-sizing:border-box;}
  .search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:0;}
  .btn-clear{background:transparent;border:none;color:var(--texto-muy-suave);font-size:16px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;transition:all .25s ease;flex-shrink:0;padding:0;margin-left:8px;font-weight:800;}
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{background:var(--rojo);color:#fff;transform:rotate(90deg) scale(1.1);box-shadow:0 0 15px var(--rojo-glow);}

  /* LISTAS Y TARJETAS */
  .list-title{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--borde);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;animation:fadeIn .4s ease both;}
  .list-title .list-count{background:var(--bg-panel);border:1px solid var(--borde);color:var(--dorado);padding:3px 12px;border-radius:12px;font-family:var(--mono);font-weight:800;}
  .resp-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:all .4s ease;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .resp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--dorado),var(--cian));transform:scaleY(0);transform-origin:top;transition:transform .4s ease;}
  .resp-card:hover{transform:translateX(8px);border-color:var(--dorado);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 30px rgba(212,176,96,.15);}
  .resp-card:hover::before{transform:scaleY(1);}
  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{font-size:15px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:6px;transition:color .3s ease;}
  .resp-card:hover .resp-card-name{color:var(--dorado-brillante);}
  body.light .resp-card:hover .resp-card-name{color:var(--dorado);}
  .resp-card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--texto-suave);font-family:var(--mono);}
  .resp-card-arrow{font-size:28px;color:var(--texto-muy-suave);transition:all .4s ease;flex-shrink:0;}
  .resp-card:hover .resp-card-arrow{color:var(--dorado);transform:translateX(8px);}

  .bien-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .4s ease;display:flex;gap:14px;align-items:flex-start;}
  .bien-card:hover{transform:translateX(8px);border-color:var(--cian);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 30px rgba(38,198,218,.15);}
  .bien-card-thumb{width:56px;height:56px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--texto-muy-suave);flex-shrink:0;overflow:hidden;}
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{font-size:11px;font-family:var(--mono);color:var(--dorado);font-weight:700;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
  .bien-card-desc{font-size:13px;font-weight:600;color:var(--texto);line-height:1.3;margin-bottom:6px;}
  .bien-card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;font-family:var(--mono);color:var(--texto-suave);}
  .bien-card-tipo{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--bg-elevado);border:1px solid var(--borde);}
  .bien-card-tipo.fijos{color:var(--verde);border-color:var(--verde-glow);}
  .bien-card-tipo.fungibles{color:var(--cian);border-color:var(--cian-glow);}
  .bien-card-tipo.internos{color:#d4a060;}
  .bien-card-tipo.prestados{color:var(--vino);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  body.light .modal-overlay{background:rgba(30,37,45,.4);}
  .modal-overlay.visible{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--dorado);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.7);}
  .modal-form{max-width:640px;}
  .modal-vista{max-width:900px;}
  .modal-header{padding:18px 22px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(212,176,96,.05),transparent);}
  .modal-header h2{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:700;flex:1;min-width:0;word-break:break-word;}
  .modal-close{width:32px;height:32px;background:transparent;border:1px solid var(--borde);color:var(--texto-suave);border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s ease;flex-shrink:0;}
  .modal-close:hover{background:var(--rojo);border-color:var(--rojo);color:white;transform:rotate(90deg);}
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{display:inline-flex;align-items:center;gap:8px;background:var(--bg-elevado);color:var(--dorado);border:1px solid var(--borde);padding:9px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:8px;font-weight:700;transition:all .3s ease;margin-bottom:16px;font-family:var(--sans);}
  .btn-nav:hover{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);transform:translateX(-4px);box-shadow:0 0 20px var(--dorado-glow);}

  .modal-titulo-seccion{text-align:center;padding:8px 0 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;font-family:var(--mono);border-bottom:1px solid var(--borde);margin-bottom:16px;}

  .oficina-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg-elevado);border:1px solid var(--borde);border-left:4px solid var(--dorado);padding:14px 16px;margin-bottom:10px;border-radius:10px;cursor:pointer;transition:all .3s ease;}
  .oficina-card:hover{border-color:var(--dorado);border-left-color:var(--cian);background:var(--bg-hover);box-shadow:var(--sombra-panel),0 0 25px rgba(212,176,96,.15);transform:translateX(6px);}
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{font-size:13px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:4px;}
  .oficina-card-id{font-size:10px;font-family:var(--mono);color:var(--cian);letter-spacing:1px;}
  .oficina-card-count{background:rgba(212,176,96,.1);border:1px solid var(--dorado);color:var(--dorado-brillante);padding:6px 14px;border-radius:14px;font-size:13px;font-weight:800;font-family:var(--mono);flex-shrink:0;}

  .btn-imprimir{background:linear-gradient(135deg,var(--verde),#2d8a4e);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:1.2px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s ease;font-family:var(--sans);text-transform:uppercase;margin-bottom:16px;}
  .btn-imprimir:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(74,222,128,.5);}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-suave);font-weight:800;margin-bottom:6px;}
  .form-group input{width:100%;padding:11px 14px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:8px;color:var(--texto);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s ease;}
  .form-group input:focus{border-color:var(--dorado);box-shadow:0 0 0 2px rgba(212,176,96,.15);}
  .form-group input::placeholder{color:var(--texto-muy-suave);}
  .form-seccion{margin-top:20px;padding-top:16px;border-top:1px dashed rgba(212,176,96,.2);}
  .form-seccion-titulo{font-size:11px;letter-spacing:2px;color:var(--dorado);text-transform:uppercase;font-weight:800;margin-bottom:12px;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--borde);}
  .btn-cancelar{background:transparent;color:var(--texto-suave);border:1px solid var(--borde);padding:10px 18px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);}
  .btn-cancelar:hover{background:var(--bg-elevado);color:var(--texto);}
  .btn-confirmar{background:linear-gradient(135deg,var(--dorado),#a88840);color:#0a0e12;border:none;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);}
  .btn-confirmar:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--dorado-glow);}

  /* TABLAS */
  .tabla-section{margin-bottom:20px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:10px;overflow:hidden;}
  .tabla-header{padding:12px 16px;background:linear-gradient(180deg,rgba(212,176,96,.08),transparent);border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .tabla-header-titulo{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:800;}
  .tabla-header-titulo .dot{width:8px;height:8px;border-radius:50%;background:var(--color,var(--dorado));box-shadow:0 0 8px var(--color,var(--dorado));}
  .tabla-header[data-color="verde"]{--color:var(--verde);}
  .tabla-header[data-color="azul"]{--color:var(--cian);}
  .tabla-header[data-color="marron"]{--color:#d4a060;}
  .tabla-header[data-color="vino"]{--color:var(--vino);}
  .tabla-header-count{font-family:var(--mono);font-size:12px;color:var(--dorado);font-weight:800;background:rgba(212,176,96,.1);padding:2px 10px;border-radius:10px;border:1px solid rgba(212,176,96,.3);}
  .tabla-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;min-width:400px;}
  thead th{background:rgba(0,0,0,.15);color:var(--texto-suave);text-align:left;padding:10px 12px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--borde);font-family:Arial,sans-serif;}
  body.light thead th{background:rgba(30,51,37,.04);}
  tbody td{padding:10px 12px;border-bottom:1px solid rgba(212,176,96,.08);color:var(--texto);vertical-align:top;word-break:break-word;font-family:Arial,sans-serif;font-size:11px;}
  body.light tbody td{border-bottom-color:rgba(30,51,37,.06);}
  tbody tr{cursor:pointer;transition:all .2s ease;}
  tbody tr:nth-child(even){background:rgba(0,0,0,.15);}

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "control_div10_data_v1";
const CACHE_HOJA_KEY = "control_div10_cache_ts";

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {
  pantalla: "home",
  modalVista: "oficinas",
  responsableActual: null,
  oficinaActual: null,
  bienActual: null,
  vistaGeneralActual: null,
  oficinaFiltroActual: null
};

let actaEnProceso = { responsable: null, oficina: null, datos: null, html: null };

/* ============================================================
   TEMA
   ============================================================ */
function cargarTema(){
  const guardado = localStorage.getItem("tema");
  if(guardado === "light"){
    document.body.classList.add("light");
    document.getElementById("themeIcon").textContent = "◑";
  }
}
function toggleTheme(){
  document.body.classList.toggle("light");
  const isLight = document.body.classList.contains("light");
  document.getElementById("themeIcon").textContent = isLight ? "◑" : "◐";
  localStorage.setItem("tema", isLight ? "light" : "dark");
}
cargarTema();

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){
  const toast = document.getElementById("toast");
  const iconEl = document.getElementById("toastIcon");
  const msgEl = document.getElementById("toastMsg");
  toast.className = "toast visible " + tipo;
  if(icono) iconEl.textContent = icono;
  else if(tipo === "success") iconEl.textContent = "✔";
  else if(tipo === "error") iconEl.textContent = "⚠";
  else iconEl.textContent = "ℹ";
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("visible"); }, 3200);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

/* ============================================================
   CARGA Y CACHÉ
   ============================================================ */
async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");

  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          console.log("✔ Datos desde caché");
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }

  cont.innerHTML = `<div class="loading fade-in">☁ Cargando datos desde Google Drive...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error fade-in">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function recargarDesdeNube(){
  const btn = document.getElementById("btnReload");
  btn.classList.add("spinning");
  setTimeout(() => btn.classList.remove("spinning"), 1500);
  cargarDesdeNube(true);
}

/* ============================================================
   HELPERS
   ============================================================ */
function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return DATA.resp.find(x => getVal(x, "ID") === id.trim()) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  const idLimpio = (id || "").trim();
  let total = 0;
  total += DATA.fijos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.fungibles.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.internos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.prestados.filter(o => obtenerIdAsig(o) === idLimpio).length;
  return total;
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function pushEstado(nombreEstado){
  try{ history.pushState({ pantalla: nombreEstado }, ""); }catch(e){}
}

window.addEventListener("popstate", (e) => {
  if(document.getElementById("modalVistaPrevia").classList.contains("visible")){
    cerrarModalVistaPrevia();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modalEntrante").classList.contains("visible")){
    cerrarModalEntrante();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modal").classList.contains("visible")){
    cerrarModal();
    pushEstado(estado.pantalla);
    return;
  }
  if(estado.pantalla === "busqueda"){
    estado.pantalla = "home";
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "vistaGeneral"){
    estado.pantalla = "home";
    estado.vistaGeneralActual = null;
    estado.oficinaFiltroActual = null;
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "home"){
    const salir = confirm("¿Está seguro que desea salir del sistema?");
    if(salir){ history.back(); }
    else { pushEstado("home"); }
  }
});

   BÚSQUEDA

function irBusqueda(ev, btn){
  if(ev && btn) ripple(ev, btn);
  estado.pantalla = "busqueda";
  pushEstado("busqueda");
  mostrarModoBusqueda();
}

function mostrarModoBusqueda(){
  const cont = document.getElementById("contenido");
  cont.innerHTML = `
    <div class="modo-busqueda">
      <div class="modo-busqueda-top">
        <button class="btn-volver" onclick="volverDeBusqueda()">← Volver</button>
        <div class="search-wrapper">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" class="search-input" id="buscador" placeholder="Nombre, código o ID asignación..." autofocus>
            <button class="btn-clear" id="btnClear" onclick="limpiarBusqueda()" title="Limpiar">✖</button>
          </div>
        </div>
      </div>
      <div id="resultados-busqueda"></div>
    </div>
  `;
  const input = document.getElementById("buscador");
  input.focus();
  initBusquedaLive();
}

function volverDeBusqueda(){
  const input = document.getElementById("buscador");
  if(input) input.value = "";
  estado.pantalla = "home";
  mostrarHome();
  pushEstado("home");
}

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, { cedula: ced, nombre: getNombreCompletoResp(r), cargo: getVal(r, "CARGO"), asignaciones: [] });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables encontrados</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" style="animation-delay:${i * 30}ms" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes encontrados</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b, i) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" style="animation-delay:${i * 25}ms" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function irVistaGeneral(tipo, ev, btn){
  if(ev && btn) ripple(ev, btn);
  estado.pantalla = "vistaGeneral";
  estado.vistaGeneralActual = tipo;
  estado.oficinaFiltroActual = null;
  pushEstado("vistaGeneral");
  renderVistaGeneral(tipo);
}

function renderVistaGeneral(tipo, oficinaFiltro, textoBusqueda){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    let html = `<button class="btn-volver" onclick="volverDeVistaGeneral()">← Volver</button>
      <div class="list-title"><span>◈ ${titulo} — Total</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      html += `
        <div class="resp-card" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function tablaModal(titulo, lista, color){
  if(!lista.length){

  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach((item, i) => {
    const cod = getVal(item, "CODIGO");
    html += `<tr style="animation-delay:${i * 10}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

      </tr></thead><tbody>
        ${prestados.map((b,i) => `<tr><td class="center">${i+1}.-</td><td class="center">${esc(getVal(b,"CANTIDAD"))}</td><td class="descripcion">${esc(getVal(b,"DESCRIPCION DEL ACTIVO"))}</td><td class="center">${esc(getVal(b,"ESTADO"))}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  /* FECHA */
  html += `<div class="acta-fecha">${fechaLarga}</div>`;

  /* FIRMAS */
  let bloqueFirmas = `
    <div class="acta-firmas-fila">
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">ENTREGUÉ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(nombreSaliente)}</div>
        <div class="acta-firma-cargo">${esc(cargoSaliente)}</div>
      </div>
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">RECIBÍ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(nombreEntranteFirma)}</div>
        <div class="acta-firma-cargo">${esc(cargoEntranteFirma)}</div>
      </div>
    </div>
  `;

  if(datos.sup1 && datos.sup2){
    bloqueFirmas += `
      <div class="acta-firmas-fila">
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(nombreSup1Firma)}</div>
          <div class="acta-firma-cargo">${esc(cargoSup1Firma)}</div>
        </div>
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(nombreSup2Firma)}</div>
          <div class="acta-firma-cargo">${esc(cargoSup2Firma)}</div>
        </div>
      </div>`;
  } else if(datos.sup1){
    bloqueFirmas += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(nombreSup1Firma)}</div>
        <div class="acta-firma-cargo">${esc(cargoSup1Firma)}</div>
      </div>`;
  } else if(datos.sup2){
    bloqueFirmas += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(nombreSup2Firma)}</div>
        <div class="acta-firma-cargo">${esc(cargoSup2Firma)}</div>
      </div>`;
  }

  bloqueFirmas += `
    <div class="acta-firma-bloque">
      <div class="acta-vobo">Vo. Bo.</div>
      <div class="acta-firma-nombre">${esc(nombreVoboFirma)}</div>
      <div class="acta-firma-cargo">${esc(cargoVoboFirma)}</div>
    </div>
  `;

  html += `<div class="acta-firmas">${bloqueFirmas}</div>`;

  /* PIE DE PÁGINA */
  html += `<div class="acta-pie">1 - 1</div>`;

  return html;
}

/* ============================================================
   MESES Y NÚMEROS
   ============================================================ */
function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}
function nombreMes(m){
  const meses = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
  return meses[m];
}
function numeroEnLetras(n){
  const unidades = ["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIÚN","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE","TREINTA","TREINTA Y UNO"];
  if(n <= 31) return unidades[n] || n.toString();
  if(n === 2025) return "DOS MIL VEINTICINCO";
  if(n === 2026) return "DOS MIL VEINTISÉIS";
  if(n === 2027) return "DOS MIL VEINTISIETE";
  return n.toString();
}

/* ============================================================
   LIGHTBOX / RIPPLE
   ============================================================ */
function abrirLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }
function ripple(e, btn){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const span = document.createElement("span");
  span.style.position = "absolute";
  span.style.borderRadius = "50%";
  span.style.background = "var(--dorado)";
  span.style.opacity = "0.5";
  span.style.pointerEvents = "none";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = x + "px";
  span.style.top = y + "px";
  span.style.transform = "scale(0)";
  span.style.animation = "rippleAnim .6s ease-out";
  btn.style.position = "relative";
  btn.style.overflow = "hidden";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}
const styleRipple = document.createElement("style");
styleRipple.innerHTML = "@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}";
document.head.appendChild(styleRipple);

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});
