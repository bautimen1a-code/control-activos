<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V5.0 · Orbital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060d;
    --bg-panel:rgba(14,20,36,.72);
    --bg-elevado:rgba(20,28,48,.85);
    --bg-hover:rgba(30,42,72,.9);
    --texto:#eaf2ff;
    --texto-suave:#8899b8;
    --texto-muy-suave:#4d5b7a;

    --borde:rgba(80,220,255,.22);
    --borde-fuerte:rgba(80,220,255,.55);

    --sombra-panel:0 12px 40px rgba(0,0,0,.6);

    --cian:#22d3ee;
    --cian-brillante:#67e8f9;
    --cian-glow:rgba(34,211,238,.55);

    --magenta:#e879f9;
    --magenta-brillante:#f0abfc;
    --magenta-glow:rgba(232,121,249,.5);

    --violeta:#a78bfa;
    --violeta-glow:rgba(167,139,250,.5);

    --verde:#34d399;
    --verde-glow:rgba(52,211,153,.5);

    --rojo:#fb7185;
    --rojo-glow:rgba(251,113,133,.5);

    --ambar:#fbbf24;
    --naranja:#fb923c;

    --mono:"JetBrains Mono","Consolas",monospace;
    --sans:"Inter","Segoe UI",Roboto,sans-serif;
    --display:"Orbitron","Inter",sans-serif;

    --radio:14px;
    --radio-sm:10px;
  }

  body.light{
    --bg:#eef4fb;
    --bg-panel:rgba(255,255,255,.85);
    --bg-elevado:rgba(245,250,255,.95);
    --bg-hover:rgba(230,240,255,1);
    --texto:#0b1a33;
    --texto-suave:#4b5d80;
    --texto-muy-suave:#8899b8;
    --borde:rgba(20,80,180,.18);
    --borde-fuerte:rgba(20,80,180,.4);
    --sombra-panel:0 8px 30px rgba(20,40,90,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--texto);
    font-size:14px;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
    transition:background .4s ease,color .4s ease;
  }

  /* FONDO ESTELAR */
  .starfield{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(34,211,238,.10) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(232,121,249,.10) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(167,139,250,.05) 0%, transparent 60%);
  }
  body.light .starfield{
    background:
      radial-gradient(ellipse at 15% 10%, rgba(34,211,238,.12) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(232,121,249,.12) 0%, transparent 45%);
  }
  .starfield::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 120px 90px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 300px 180px, #67e8f9, transparent),
      radial-gradient(1px 1px at 450px 60px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 600px 220px, #f0abfc, transparent),
      radial-gradient(1.5px 1.5px at 750px 120px, #fff, transparent);
    background-size:800px 300px;
    background-repeat:repeat;
    opacity:.7;
    animation:starDrift 120s linear infinite;
  }
  body.light .starfield::before{opacity:.35;}
  @keyframes starDrift{
    from{transform:translate3d(0,0,0);}
    to{transform:translate3d(-800px,-300px,0);}
  }
  .starfield::after{
    content:"";position:absolute;inset:-20%;
    background-image:
      linear-gradient(rgba(34,211,238,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,121,249,.04) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(600px) rotateX(60deg) translateY(30%);
    transform-origin:center bottom;
    animation:gridPulse 12s ease-in-out infinite;
    mask-image:linear-gradient(180deg, transparent 0%, black 40%, black 60%, transparent 100%);
  }
  body.light .starfield::after{
    background-image:
      linear-gradient(rgba(34,211,238,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,121,249,.08) 1px, transparent 1px);
  }
  @keyframes gridPulse{
    0%,100%{opacity:.6;}
    50%{opacity:1;}
  }

  .scanline{
    position:fixed;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--cian),transparent);
    opacity:.4;z-index:1;pointer-events:none;
    animation:scanline 9s linear infinite;
    box-shadow:0 0 20px var(--cian-glow);
  }
  body.light .scanline{opacity:.25;}
  @keyframes scanline{from{top:0;}to{top:100vh;}}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-elevado);}
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,var(--cian),var(--violeta));
    border-radius:5px;border:2px solid var(--bg-elevado);
  }
  ::-webkit-scrollbar-thumb:hover{background:var(--cian-brillante);}

  .app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

  /* HEADER ORBITAL */
  .header{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(6,10,20,.88),rgba(4,6,13,.72));
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--borde);
    padding:14px 22px;
    overflow:hidden;
    transition:background .4s ease;
  }
  body.light .header{
    background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(238,244,251,.78));
  }
  .header::after{
    content:"";position:absolute;bottom:0;left:0;height:1px;width:100%;
    background:linear-gradient(90deg,transparent,var(--cian),var(--magenta),var(--violeta),transparent);
    background-size:200% 100%;
    animation:borderFlow 4s linear infinite;
    box-shadow:0 0 12px var(--cian-glow);
  }
  @keyframes borderFlow{from{background-position:200% 0;}to{background-position:-200% 0;}}

  .header-content{
    max-width:1280px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
  }

  .header-logo{display:flex;align-items:center;gap:14px;}

  .orbital-hud{
    position:relative;width:52px;height:52px;flex-shrink:0;
  }
  .orbital-hud .ring{
    position:absolute;inset:0;border:1.5px solid var(--cian);
    border-radius:50%;
    border-top-color:transparent;border-left-color:var(--magenta);
    animation:orbitSpin 4s linear infinite;
    box-shadow:0 0 18px var(--cian-glow),inset 0 0 12px rgba(34,211,238,.25);
  }
  .orbital-hud .ring:nth-child(2){
    inset:8px;border-color:var(--violeta);
    border-bottom-color:transparent;border-right-color:transparent;
    animation:orbitSpin 3s linear infinite reverse;
    box-shadow:0 0 12px var(--violeta-glow);
  }
  .orbital-hud .core{
    position:absolute;inset:18px;
    background:radial-gradient(circle,var(--cian-brillante),var(--violeta));
    border-radius:50%;
    box-shadow:0 0 20px var(--cian-glow),0 0 30px var(--violeta-glow);
    animation:pulseCore 2s ease-in-out infinite;
  }
  @keyframes orbitSpin{to{transform:rotate(360deg);}}
  @keyframes pulseCore{0%,100%{opacity:.85;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}

  .header-text h1{
    font-family:var(--display);
    font-size:15px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    background:linear-gradient(90deg,var(--cian-brillante),var(--magenta-brillante),var(--violeta));
    background-size:200% 100%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    animation:hueShift 6s linear infinite;
  }
  .header-text .subtitle{
    font-family:var(--mono);font-size:9px;letter-spacing:2.5px;
    color:var(--texto-suave);text-transform:uppercase;margin-top:2px;
  }
  @keyframes hueShift{from{background-position:0% 50%;}to{background-position:200% 50%;}}

  .header-actions{display:flex;align-items:center;gap:10px;}

  .btn-icon{
    width:42px;height:42px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    flex-shrink:0;color:var(--texto);
    position:relative;overflow:hidden;
  }
  .btn-icon.cyan{color:var(--cian);}
  .btn-icon.magenta{color:var(--magenta);}
  .btn-icon.cyan:hover{
    background:var(--cian);color:var(--bg);
    border-color:var(--cian-brillante);
    box-shadow:0 0 25px var(--cian-glow);
    transform:translateY(-2px) scale(1.05);
  }
  .btn-icon.magenta:hover{
    background:var(--magenta);color:var(--bg);
    border-color:var(--magenta-brillante);
    box-shadow:0 0 25px var(--magenta-glow);
    transform:rotate(180deg) scale(1.05);
  }
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  .header-status{
    display:flex;align-items:center;gap:8px;
    padding:7px 14px;
    background:rgba(34,211,238,.08);
    border:1px solid rgba(34,211,238,.35);
    border-radius:20px;
    font-size:10px;font-family:var(--mono);
    color:var(--cian-brillante);letter-spacing:1.5px;
    text-transform:uppercase;font-weight:700;
  }
  .status-dot{
    width:7px;height:7px;
    background:var(--verde);
    border-radius:50%;
    box-shadow:0 0 10px var(--verde);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  .main{flex:1;padding:24px 22px;max-width:1280px;margin:0 auto;width:100%;}

  /* HOME */
  .home{display:flex;flex-direction:column;gap:16px;padding-top:18px;animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .home-hero{
    text-align:center;padding:14px 0 8px;
  }
  .home-hero-title{
    font-family:var(--display);
    font-size:22px;font-weight:900;letter-spacing:5px;text-transform:uppercase;
    background:linear-gradient(90deg,var(--cian-brillante),var(--violeta),var(--magenta-brillante));
    background-size:200% 100%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    animation:hueShift 8s linear infinite;
    margin-bottom:6px;
  }
  .home-hero-sub{
    font-family:var(--mono);font-size:10px;letter-spacing:3px;
    color:var(--texto-suave);text-transform:uppercase;
  }

  .home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

  .home-btn{
    position:relative;
    background:var(--bg-panel);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:24px 16px;
    cursor:pointer;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--texto);
  }
  .home-btn::before{
    content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:conic-gradient(from 0deg,transparent 0deg,var(--color,var(--cian)) 40deg,transparent 80deg);
    opacity:0;transition:opacity .4s ease;
    animation:conicSpin 4s linear infinite;
  }
  .home-btn:hover::before{opacity:.15;}
  @keyframes conicSpin{to{transform:rotate(360deg);}}

  .home-btn:hover{
    transform:translateY(-6px);
    border-color:var(--color,var(--cian));
    box-shadow:
      0 14px 40px rgba(0,0,0,.5),
      0 0 30px color-mix(in srgb,var(--color,var(--cian)) 40%,transparent);
  }
  .home-btn[data-color="verde"]{--color:var(--verde);}
  .home-btn[data-color="azul"]{--color:var(--cian);}
  .home-btn[data-color="marron"]{--color:var(--naranja);}
  .home-btn[data-color="vino"]{--color:var(--magenta);}
  .home-btn[data-color="buscar"]{--color:var(--violeta);}

  .home-btn-icon{
    font-size:34px;color:var(--color,var(--cian));
    filter:drop-shadow(0 0 10px color-mix(in srgb,var(--color,var(--cian)) 60%,transparent));
    position:relative;z-index:1;
  }
  .home-btn-label{
    font-family:var(--display);
    font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
    position:relative;z-index:1;
  }
  .home-btn-count{
    font-family:var(--mono);
    font-size:28px;font-weight:800;
    color:var(--color,var(--cian));
    position:relative;z-index:1;
    text-shadow:0 0 15px color-mix(in srgb,var(--color,var(--cian)) 50%,transparent);
  }

  .home-btn.buscar{
    grid-column:span 4;
    padding:22px;
    background:linear-gradient(135deg,rgba(167,139,250,.10),rgba(34,211,238,.05));
    flex-direction:row;justify-content:center;gap:16px;
  }
  .home-btn.buscar .home-btn-icon{font-size:28px;}
  .home-btn.buscar .home-btn-label{
    font-size:13px;letter-spacing:4px;color:var(--violeta);
  }

  /* MODO BÚSQUEDA */
  .modo-busqueda{animation:fadeIn .35s ease both;display:flex;flex-direction:column;gap:16px;min-height:60vh;}

  .modo-busqueda-top{display:flex;gap:12px;align-items:center;width:100%;min-width:0;}

  .btn-volver{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-elevado);
    color:var(--cian);
    border:1px solid var(--borde);
    padding:12px 16px;
    font-family:var(--display);
    font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    cursor:pointer;border-radius:var(--radio-sm);font-weight:700;
    flex-shrink:0;transition:all .3s ease;white-space:nowrap;
  }
  .btn-volver:hover{
    background:var(--cian);color:var(--bg);
    border-color:var(--cian-brillante);
    transform:translateX(-4px);
    box-shadow:0 0 22px var(--cian-glow);
  }

  .search-wrapper{flex:1;min-width:0;position:relative;}

  .search-box{
    display:flex;align-items:center;
    background:var(--bg-panel);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:4px 14px;
    width:100%;min-width:0;
    transition:all .3s ease;
  }
  .search-box:focus-within{
    border-color:var(--cian);
    box-shadow:
      0 0 0 3px rgba(34,211,238,.12),
      0 0 35px rgba(34,211,238,.25);
  }
  .search-icon{color:var(--cian);font-size:18px;margin-right:10px;flex-shrink:0;}
  .search-input{
    flex:1;min-width:0;
    background:transparent;border:none;outline:none;
    padding:14px 0;font-size:15px;
    color:var(--texto);font-family:var(--sans);font-weight:500;
    letter-spacing:.4px;width:100%;
  }
  .search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:.3px;}

  .btn-clear{
    background:transparent;border:none;color:var(--texto-muy-suave);
    font-size:16px;cursor:pointer;width:32px;height:32px;
    border-radius:50%;display:none;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;padding:0;margin-left:8px;font-weight:800;
  }
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{
    background:var(--rojo);color:#fff;
    transform:rotate(90deg) scale(1.1);
    box-shadow:0 0 15px var(--rojo-glow);
  }

  /* LISTAS */
  .list-title{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;margin-bottom:14px;
    border-bottom:1px solid var(--borde);
    font-family:var(--display);
    font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
    animation:fadeIn .4s ease both;
  }
  .list-title .list-count{
    background:var(--bg-panel);
    border:1px solid var(--borde-fuerte);
    color:var(--cian);
    padding:4px 14px;border-radius:12px;
    font-family:var(--mono);font-weight:800;
    box-shadow:0 0 12px rgba(34,211,238,.2);
  }

  .resp-card{
    position:relative;
    background:var(--bg-panel);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:18px 22px;margin-bottom:12px;
    cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .resp-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--cian),var(--magenta));
    transform:scaleY(0);transform-origin:top;
    transition:transform .4s ease;
    box-shadow:0 0 12px var(--cian-glow);
  }
  .resp-card:hover{
    transform:translateX(8px);
    border-color:var(--cian);
    background:var(--bg-elevado);
    box-shadow:
      var(--sombra-panel),
      0 0 35px rgba(34,211,238,.2);
  }
  .resp-card:hover::before{transform:scaleY(1);}

  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{
    font-size:15px;font-weight:700;color:var(--texto);
    letter-spacing:.3px;margin-bottom:6px;transition:color .3s ease;
  }
  .resp-card:hover .resp-card-name{color:var(--cian-brillante);}

  .resp-card-meta{
    display:flex;flex-wrap:wrap;gap:12px;
    font-size:11px;color:var(--texto-suave);font-family:var(--mono);
  }
  .resp-card-arrow{
    font-size:26px;color:var(--texto-muy-suave);
    transition:all .4s ease;flex-shrink:0;
  }
  .resp-card:hover .resp-card-arrow{
    color:var(--cian);
    transform:translateX(8px);
  }

  .bien-card{
    position:relative;
    background:var(--bg-panel);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:16px 18px;margin-bottom:12px;
    cursor:pointer;transition:all .4s ease;
    display:flex;gap:14px;align-items:flex-start;
  }
  .bien-card:hover{
    transform:translateX(8px);
    border-color:var(--magenta);
    background:var(--bg-elevado);
    box-shadow:
      var(--sombra-panel),
      0 0 35px rgba(232,121,249,.2);
  }
  .bien-card-thumb{
    width:56px;height:56px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--texto-muy-suave);
    flex-shrink:0;overflow:hidden;
  }
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{
    font-family:var(--mono);font-size:11px;
    color:var(--cian);font-weight:700;letter-spacing:1.2px;
    margin-bottom:4px;text-transform:uppercase;
  }
  .bien-card-desc{
    font-size:13px;font-weight:600;color:var(--texto);
    line-height:1.35;margin-bottom:6px;
  }
  .bien-card-meta{
    display:flex;flex-wrap:wrap;gap:8px;
    font-size:10px;font-family:var(--mono);color:var(--texto-suave);
  }
  .bien-card-tipo{
    padding:2px 8px;border-radius:10px;
    font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    background:var(--bg-elevado);border:1px solid var(--borde);
  }
  .bien-card-tipo.fijos{color:var(--verde);border-color:rgba(52,211,153,.5);}
  .bien-card-tipo.fungibles{color:var(--cian);border-color:rgba(34,211,238,.5);}
  .bien-card-tipo.internos{color:var(--naranja);border-color:rgba(251,146,60,.5);}
  .bien-card-tipo.prestados{color:var(--magenta);border-color:rgba(232,121,249,.5);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(2,4,10,.85);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:100;display:none;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  body.light .modal-overlay{background:rgba(20,40,80,.35);}
  .modal-overlay.visible{display:flex;}

  .modal{
    background:var(--bg-panel);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--borde-fuerte);
    border-radius:20px;
    max-width:760px;width:100%;max-height:90vh;
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:
      0 30px 90px rgba(0,0,0,.7),
      0 0 60px rgba(34,211,238,.15);
    animation:modalIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn{
    from{opacity:0;transform:scale(.94) translateY(20px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .modal-form{max-width:720px;}
  .modal-vista{max-width:960px;}

  .modal-header{
    padding:20px 24px;
    border-bottom:1px solid var(--borde);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:linear-gradient(180deg,rgba(34,211,238,.06),transparent);
  }
  .modal-header h2{
    font-family:var(--display);
    font-size:13px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto);font-weight:700;flex:1;min-width:0;word-break:break-word;
  }
  .modal-close{
    width:34px;height:34px;
    background:transparent;
    border:1px solid var(--borde);
    color:var(--texto-suave);border-radius:var(--radio-sm);
    cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s ease;flex-shrink:0;
  }
  .modal-close:hover{
    background:var(--rojo);border-color:var(--rojo);color:white;
    transform:rotate(90deg);
    box-shadow:0 0 20px var(--rojo-glow);
  }
  .modal-body{padding:22px 24px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-elevado);
    color:var(--cian);
    border:1px solid var(--borde);
    padding:9px 16px;
    font-family:var(--display);
    font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
    cursor:pointer;border-radius:var(--radio-sm);
    font-weight:700;transition:all .3s ease;
    margin-bottom:16px;
  }
  .btn-nav:hover{
    background:var(--cian);color:var(--bg);
    border-color:var(--cian-brillante);
    transform:translateX(-4px);
    box-shadow:0 0 22px var(--cian-glow);
  }

  .modal-titulo-seccion{
    text-align:center;padding:8px 0 16px;
    font-family:var(--mono);
    font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
    border-bottom:1px solid var(--borde);margin-bottom:16px;
  }

  .oficina-card{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-left:3px solid var(--cian);
    padding:14px 18px;margin-bottom:10px;
    border-radius:var(--radio-sm);cursor:pointer;
    transition:all .3s ease;
  }
  .oficina-card:hover{
    border-color:var(--cian);
    border-left-color:var(--magenta);
    background:var(--bg-hover);
    box-shadow:var(--sombra-panel),0 0 28px rgba(34,211,238,.2);
    transform:translateX(6px);
  }
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{
    font-size:13px;font-weight:700;color:var(--texto);
    letter-spacing:.3px;margin-bottom:4px;
  }
  .oficina-card-id{
    font-family:var(--mono);font-size:10px;
    color:var(--cian);letter-spacing:1px;
  }
  .oficina-card-count{
    background:rgba(34,211,238,.12);
    border:1px solid var(--cian);
    color:var(--cian-brillante);
    padding:6px 14px;border-radius:14px;
    font-size:13px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;
    box-shadow:0 0 15px rgba(34,211,238,.25);
  }

  .btn-imprimir{
    background:linear-gradient(135deg,var(--verde),#10b981);
    color:#fff;border:none;
    padding:11px 20px;border-radius:var(--radio-sm);
    font-family:var(--display);
    font-size:11px;font-weight:800;letter-spacing:1.5px;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:all .25s ease;text-transform:uppercase;
    margin-bottom:16px;
  }
  .btn-imprimir:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 22px rgba(52,211,153,.5);
  }

  /* FORMULARIO */
  .form-persona{
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    padding:14px 16px;margin-bottom:12px;
    position:relative;
  }
  .form-persona::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;
    background:linear-gradient(180deg,var(--cian),var(--magenta));
    border-radius:2px;
  }
  .form-persona-titulo{
    font-family:var(--display);
    font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--cian-brillante);font-weight:800;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;
    padding-left:8px;
  }
  .form-persona-titulo .num{
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    color:var(--bg);
    width:20px;height:20px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;
    box-shadow:0 0 12px var(--cian-glow);
    margin-right:8px;
  }

  .form-grid{
    display:grid;grid-template-columns:1fr 2fr 1.2fr 1.2fr;
    gap:10px;margin-bottom:10px;
  }
  .form-grid .form-group{margin-bottom:0;}
  .form-group label{
    display:block;font-family:var(--mono);
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:800;margin-bottom:5px;
  }
  .form-group input{
    width:100%;padding:10px 12px;
    background:var(--bg-panel);
    border:1px solid var(--borde);
    border-radius:8px;color:var(--texto);
    font-family:var(--sans);font-size:13px;
    outline:none;transition:all .2s ease;
  }
  .form-group input:focus{
    border-color:var(--cian);
    box-shadow:0 0 0 3px rgba(34,211,238,.15),0 0 18px rgba(34,211,238,.25);
  }
  .form-group input::placeholder{color:var(--texto-muy-suave);}

  .form-actions{
    display:flex;gap:10px;justify-content:flex-end;
    margin-top:22px;padding-top:18px;
    border-top:1px solid var(--borde);
  }
  .btn-cancelar{
    background:transparent;color:var(--texto-suave);
    border:1px solid var(--borde);
    padding:11px 20px;border-radius:var(--radio-sm);
    font-family:var(--display);
    font-size:11px;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;cursor:pointer;
    transition:all .25s ease;
  }
  .btn-cancelar:hover{
    background:var(--bg-elevado);color:var(--texto);
    border-color:var(--texto-suave);
  }
  .btn-confirmar{
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    color:#fff;border:none;
    padding:11px 22px;border-radius:var(--radio-sm);
    font-family:var(--display);
    font-size:11px;font-weight:800;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;
    transition:all .25s ease;
    box-shadow:0 0 22px var(--cian-glow);
  }
  .btn-confirmar:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px var(--cian-glow),0 0 30px var(--violeta-glow);
  }

  /* TABLAS APP */
  .tabla-section{
    margin-bottom:22px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    overflow:hidden;
  }
  .tabla-header{
    padding:14px 18px;
    background:linear-gradient(180deg,rgba(34,211,238,.08),transparent);
    border-bottom:1px solid var(--borde);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .tabla-header-titulo{
    display:flex;align-items:center;gap:10px;
    font-family:var(--display);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto);font-weight:800;
  }
  .tabla-header-titulo .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--color,var(--cian));
    box-shadow:0 0 10px var(--color,var(--cian));
  }
  .tabla-header[data-color="verde"]{--color:var(--verde);}
  .tabla-header[data-color="azul"]{--color:var(--cian);}
  .tabla-header[data-color="marron"]{--color:var(--naranja);}
  .tabla-header[data-color="vino"]{--color:var(--magenta);}
  .tabla-header-count{
    font-family:var(--mono);font-size:12px;
    color:var(--cian);font-weight:800;
    background:rgba(34,211,238,.12);
    padding:3px 12px;border-radius:10px;
    border:1px solid rgba(34,211,238,.35);
  }
  .tabla-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;min-width:400px;}
  thead th{
    background:rgba(0,0,0,.25);
    color:var(--texto-suave);text-align:left;
    padding:10px 14px;font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;font-weight:800;
    border-bottom:1px solid var(--borde);font-family:Arial,sans-serif;
  }
  body.light thead th{background:rgba(20,80,180,.06);}
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid rgba(34,211,238,.08);
    color:var(--texto);vertical-align:top;
    word-break:break-word;font-family:Arial,sans-serif;font-size:11px;
  }
  body.light tbody td{border-bottom-color:rgba(20,80,180,.08);}
  tbody tr{cursor:pointer;transition:all .2s ease;}
  tbody tr:nth-child(even){background:rgba(0,0,0,.18);}
  body.light tbody tr:nth-child(even){background:rgba(20,80,180,.03);}
  tbody tr:hover{background:rgba(34,211,238,.10);}

  .estado-badge{
    display:inline-block;padding:3px 10px;border-radius:12px;
    font-size:10px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;border:1px solid;
  }
  .estado-regular{color:var(--ambar);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1);}
  .estado-malo{color:var(--rojo);border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.1);}
  .estado-bueno{color:var(--verde);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1);}
  .estado-pendiente{
    color:var(--rojo);border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.15);
    animation:blink 1.5s ease-in-out infinite;
  }

  .oficina-encabezado{
    background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(232,121,249,.08));
    border:1px solid var(--borde);
    border-left:3px solid var(--cian);
    border-radius:var(--radio-sm);
    padding:16px 18px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .oficina-encabezado-nombre{font-size:14px;font-weight:800;color:var(--texto);margin-bottom:4px;}
  .oficina-encabezado-sub{
    font-family:var(--mono);font-size:10px;
    color:var(--cian-brillante);letter-spacing:1.2px;text-transform:uppercase;
  }
  .oficina-encabezado-count{
    background:rgba(34,211,238,.18);
    border:1px solid var(--cian);
    color:var(--cian-brillante);
    padding:7px 16px;border-radius:14px;
    font-size:13px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;
    box-shadow:0 0 18px rgba(34,211,238,.3);
  }

  /* DETALLE DEL BIEN */
  .bien-detalle{
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    overflow:hidden;
  }
  .bien-detalle-header{
    padding:22px;
    background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(232,121,249,.06));
    border-bottom:2px solid var(--cian);
    display:flex;gap:18px;align-items:flex-start;
  }
  .bien-detalle-foto{
    width:84px;height:84px;
    background:var(--bg);
    border:2px solid var(--cian);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:var(--cian);
    flex-shrink:0;overflow:hidden;cursor:pointer;
    transition:all .3s ease;
    box-shadow:0 0 25px rgba(34,211,238,.35);
  }
  .bien-detalle-foto:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(34,211,238,.55);
  }
  .bien-detalle-foto img{width:100%;height:100%;object-fit:cover;}
  .bien-detalle-codigo{
    font-family:var(--mono);font-size:11px;
    color:var(--cian);letter-spacing:2.5px;font-weight:800;
    text-transform:uppercase;margin-bottom:6px;
  }
  .bien-detalle-nombre{
    font-size:15px;font-weight:700;color:var(--texto);
    line-height:1.35;margin-bottom:8px;
  }
  .bien-detalle-tipo-badge{
    display:inline-block;padding:3px 12px;border-radius:12px;
    font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  }
  .bien-detalle-tipo-badge.fijos{color:var(--verde);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);}
  .bien-detalle-tipo-badge.fungibles{color:var(--cian);background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4);}
  .bien-detalle-tipo-badge.internos{color:var(--naranja);background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.4);}
  .bien-detalle-tipo-badge.prestados{color:var(--magenta);background:rgba(232,121,249,.12);border:1px solid rgba(232,121,249,.4);}

  .bien-detalle-campos{padding:0;}
  .bien-detalle-campo{
    display:flex;gap:16px;align-items:flex-start;
    padding:12px 22px;
    border-bottom:1px solid rgba(34,211,238,.08);
  }
  .bien-detalle-campo:last-child{border-bottom:none;}
  .bien-detalle-campo:nth-child(even){background:rgba(0,0,0,.15);}
  body.light .bien-detalle-campo:nth-child(even){background:rgba(20,80,180,.03);}
  .bien-detalle-label{
    flex:0 0 38%;font-family:var(--mono);
    font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    font-weight:800;color:var(--texto-suave);padding-top:2px;
  }
  .bien-detalle-valor{flex:1;font-size:12px;color:var(--texto);line-height:1.45;word-break:break-word;}
  .bien-detalle-valor.vacio{color:var(--texto-muy-suave);font-style:italic;}
  .bien-detalle-valor.pendiente{
    color:var(--rojo);font-weight:800;text-transform:uppercase;
  }

  .empty-state{
    text-align:center;padding:60px 20px;
    color:var(--texto-suave);animation:fadeIn .6s ease both;
  }
  .empty-state-icon{font-size:64px;margin-bottom:16px;opacity:.35;}
  .empty-state-title{
    font-family:var(--display);
    font-size:13px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto);margin-bottom:8px;font-weight:700;
  }
  .empty-state-sub{font-size:12px;color:var(--texto-muy-suave);letter-spacing:.5px;}

  .loading,.error{
    text-align:center;padding:32px;
    font-family:var(--display);
    font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:800;
  }
  .loading{color:var(--cian);animation:blink 1.5s ease-in-out infinite;}
  .error{color:var(--rojo);}

  .footer{
    text-align:center;padding:26px 20px;
    border-top:1px solid var(--borde);
    font-family:var(--mono);
    font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto-muy-suave);font-weight:600;margin-top:auto;
  }

  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.96);
    backdrop-filter:blur(10px);
    z-index:200;display:none;align-items:center;justify-content:center;
    padding:30px;cursor:zoom-out;
  }
  .lightbox.visible{display:flex;}
  .lightbox img{
    max-width:100%;max-height:100%;border-radius:12px;
    box-shadow:0 0 80px rgba(34,211,238,.4);
  }

  .toast{
    position:fixed;top:90px;left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--bg-panel);
    backdrop-filter:blur(16px);
    color:var(--texto);
    border:1px solid var(--cian);
    border-radius:var(--radio);
    padding:14px 24px;z-index:300;
    font-size:12px;letter-spacing:1px;font-weight:700;
    box-shadow:
      0 12px 44px rgba(0,0,0,.55),
      0 0 32px rgba(34,211,238,.25);
    opacity:0;pointer-events:none;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:center;gap:10px;max-width:90vw;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{border-color:var(--verde);box-shadow:0 12px 44px rgba(0,0,0,.55),0 0 32px var(--verde-glow);}
  .toast.error{border-color:var(--rojo);box-shadow:0 12px 44px rgba(0,0,0,.55),0 0 32px var(--rojo-glow);}
  .toast.info{border-color:var(--cian);}
  .toast-icon{font-size:16px;}

  /* ACTA MEDICIÓN */
  .acta-medicion{
    position:absolute;left:-99999px;top:0;
    visibility:hidden;pointer-events:none;
    width: 21.59cm;padding: 0;margin: 0;
    font-family:Arial, sans-serif;font-size:11pt;line-height:1.0;
    color:#000;background:#fff;
  }
  .acta-medicion .acta-membrete{font-family:Arial,sans-serif;font-size:10pt;font-weight:bold;line-height:1.0;margin:0 0 8pt 0;text-transform:uppercase;text-align:left;}
  .acta-medicion .acta-membrete .linea1{padding-left:0;}
  .acta-medicion .acta-membrete .linea2{padding-left:9pt;}
  .acta-medicion .acta-membrete .linea3{padding-left:75pt;text-decoration:underline;}
  .acta-medicion .acta-titulo{font-family:Arial,sans-serif;font-size:16pt;font-weight:bold;text-align:center;text-transform:uppercase;margin:0 0 8pt 0;line-height:1.1;}
  .acta-medicion .acta-titulo .titulo-linea1{display:block;}
  .acta-medicion .acta-titulo .titulo-linea2{display:block;}
  .acta-medicion .acta-seccion{margin-top:8pt;}
  .acta-medicion .acta-seccion-titulo{font-family:Arial,sans-serif;font-size:11pt;font-weight:bold;text-transform:uppercase;margin:0 0 3pt 0;line-height:1.0;}
  .acta-medicion .acta-tabla{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:9pt;margin-bottom:4pt;border:1px solid #000;}
  .acta-medicion .acta-tabla th{border:1px solid #000;padding:2pt 4pt;text-align:center;font-weight:bold;text-transform:uppercase;background:#fff;font-size:9pt;line-height:1.0;}
  .acta-medicion .acta-tabla td{border:1px solid #000;padding:2pt 4pt;font-size:9pt;vertical-align:top;line-height:1.0;}
  .acta-medicion .acta-tabla td.center{text-align:center;}
  .acta-medicion .acta-tabla td.descripcion{text-align:justify;text-transform:uppercase;}
  .acta-medicion .acta-tabla td.vacia{text-align:center;padding:8pt 4pt;font-style:italic;text-transform:uppercase;}
  .acta-medicion .acta-bloque-firmas{margin-top:24pt;}
  .acta-medicion .acta-fecha-firmas{font-family:Arial,sans-serif;font-size:12pt;text-align:right;margin:0 0 20pt 0;line-height:1.0;}
  .acta-medicion .acta-firmas{font-family:Arial,sans-serif;font-size:12pt;line-height:1.0;}
  .acta-medicion .acta-firmas-fila{display:flex;justify-content:space-between;gap:20pt;margin-bottom:26pt;}
  .acta-medicion .acta-firma-bloque-lado{flex:1;text-align:center;}
  .acta-medicion .acta-firma-bloque{text-align:center;margin-bottom:26pt;}
  .acta-medicion .acta-firma-rol{font-weight:bold;text-transform:uppercase;margin-bottom:32pt;font-size:12pt;text-align:center;line-height:1.0;}
  .acta-medicion .acta-firma-nombre{font-weight:normal;text-transform:none;font-size:12pt;margin-top:4pt;line-height:1.2;}

/* Altura útil calculada en runtime: 27.94cm - 4cm = 23.94cm
   El valor en px se calcula dinámicamente según DPI real */
let ALTURA_UTIL_HOJA = 905;

function calcularAlturaUtilHoja(){
  /* 1cm ≈ 37.7952755906px a 96dpi, pero consideramos escalado del navegador */
  const divMedicion = document.createElement("div");
  divMedicion.style.cssText = "position:absolute;visibility:hidden;height:10cm;width:1px;";
  document.body.appendChild(divMedicion);
  const px10cm = divMedicion.getBoundingClientRect().height;
  document.body.removeChild(divMedicion);
  const pxPorCm = px10cm / 10;
  /* Letter 27.94cm - márgenes (2+2)cm = 23.94cm útil */
  ALTURA_UTIL_HOJA = Math.floor(23.94 * pxPorCm);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){

function renderEstado(val){

  const up = v.toUpperCase();

/* ============================================================
   SANITIZACIÓN DE URLs
   ============================================================ */
function sanitizarUrlFoto(url){
  if(!url || typeof url !== "string") return "";
  const u = url.trim();
  if(!u) return "";

  /* ID puro de Google Drive (sin protocolo) */
  if(!u.includes("/") && !u.startsWith("http") && u.length > 20){
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(u)}`;
  }

  try{
    const parsed = new URL(u);
    if(parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
    const host = parsed.hostname.toLowerCase();
    const permitido = DOMINIOS_FOTO_PERMITIDOS.some(d => host === d || host.endsWith("." + d));
    if(!permitido) return "";
    return parsed.href;
  }catch(e){
    return "";
  }
}

function renderFotoMiniatura(url){
  const segura = sanitizarUrlFoto(url);
  if(!segura) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  return `<img src="${escAttr(segura)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}

/* ============================================================
   DETECCIÓN DE TIPO DE BÚSQUEDA (conservadora)
   ============================================================ */
function detectarTipoBusqueda(texto){
  const t = (texto || "").trim().toUpperCase();
  if(!t) return "vacio";

  /* Explícito: prefijo COD o VSIAF */
  if(/^(COD|VSIAF)[-_\s]?/.test(t)) return "codigo";

  /* ID asignación: solo dígitos, opcionalmente 1-2 letras al final (ej: 15, 23A) */
  if(/^\d{1,4}[A-Z]{0,2}$/.test(t)) return "id";

  /* Código: contiene al menos 2 dígitos Y al menos 2 letras, con guiones/espacios */
  const tieneDigitos = (t.match(/\d/g) || []).length >= 2;
  const tieneLetras = (t.match(/[A-Z]/g) || []).length >= 2;
  if(tieneDigitos && tieneLetras && /[-_\s]/.test(t)) return "codigo";

  /* Código alfanumérico compacto: patrón mixto tipo "AF1234" o "VSIAF001" */
  if(/^[A-Z]{2,6}\d{2,8}[A-Z]?$/.test(t)) return "codigo";

  return "nombre";
}

const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";

  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

/* ============================================================
   ABREVIACIÓN DE NOMBRES DE PILA
   ============================================================ */
function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();

  const resultado = tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  });
  return resultado.join(" ");
}

function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();

  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

   ============================================================ */
function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);

  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

/* ============================================================
   CARGA Y CACHÉ
   ============================================================ */
async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");

  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }

  cont.innerHTML = `<div class="loading">☁ Cargando datos desde Google Drive...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

/* ============================================================
   APLICAR DATOS + CONSTRUIR ÍNDICES
   ============================================================ */
function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];

  /* Limpiar índices */
  IDX.fijosPorId.clear();
  IDX.fungiblesPorId.clear();
  IDX.internosPorId.clear();
  IDX.prestadosPorId.clear();
  IDX.respPorId.clear();
  IDX.conteoPorId.clear();
  IDX.porCodigo.clear();

  const indexar = (lista, mapPorId, tipoKey) => {
    lista.forEach(b => {
      const id = obtenerIdAsig(b);
      if(id){
        if(!mapPorId.has(id)) mapPorId.set(id, []);
        mapPorId.get(id).push(b);
        IDX.conteoPorId.set(id, (IDX.conteoPorId.get(id) || 0) + 1);
      }
      const cod = getVal(b, "CODIGO");
      if(cod){
        const key = tipoKey + "|" + cod;
        IDX.porCodigo.set(key, b);
      }
    });
  };

  indexar(DATA.fijos, IDX.fijosPorId, "FIJOS");
  indexar(DATA.fungibles, IDX.fungiblesPorId, "FUNGIBLES");
  indexar(DATA.internos, IDX.internosPorId, "INTERNOS");
  indexar(DATA.prestados, IDX.prestadosPorId, "PRESTADOS");

  DATA.resp.forEach(r => {
    const id = getVal(r, "ID");
    if(id) IDX.respPorId.set(id, r);
  });
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}

    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables detectados</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" style="animation-delay:${i * 30}ms" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes detectados</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b, i) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" style="animation-delay:${i * 25}ms" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function irVistaGeneral(tipo, ev, btn){
  if(ev && btn) ripple(ev, btn);
  estado.pantalla = "vistaGeneral";
  estado.vistaGeneralActual = tipo;
  estado.oficinaFiltroActual = null;
  pushEstado("vistaGeneral");
  renderVistaGeneral(tipo);
}

function renderVistaGeneral(tipo, oficinaFiltro, textoBusqueda){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    let html = `<button class="btn-volver" onclick="volverDeVistaGeneral()">← Volver</button>
      <div class="list-title"><span>◈ ${titulo} — Total</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      html += `
        <div class="resp-card" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

  estado.oficinaFiltroActual = oficina;

}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function buscarBienEnIndice(codigo, tipo){

}

function abrirDetalleBienDirectoPorCodigo(codigo, tipo){

}

function abrirDetalleBienDesdeModal(codigo, tipo){

function volverATablasDesdeDetalleBien(){

function renderModalTablas(){
  const of = estado.oficinaActual;

  if(!of || !r) return "";
  const fijos = IDX.fijosPorId.get(of.id) || [];
  const fungibles = IDX.fungiblesPorId.get(of.id) || [];
  const internos = IDX.internosPorId.get(of.id) || [];

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = sanitizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" loading="lazy" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ============================================================
   GENERAR HTML DEL ACTA CON LAYOUT INTELIGENTE
   ------------------------------------------------------------
   El motor divide las tablas por FILAS, no por bloques enteros.
   Cada fila es un "átomo" medible. El thead se repite al cortar.
   ============================================================ */
function generarHTMLActa(r, oficina, datos){
  const idAsignacion = oficina.id;
  const fijos = IDX.fijosPorId.get(idAsignacion) || [];
  const fungibles = IDX.fungiblesPorId.get(idAsignacion) || [];
  const internos = IDX.internosPorId.get(idAsignacion) || [];
  const prestados = IDX.prestadosPorId.get(idAsignacion) || [];

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  const salienteGrado = r.grado || "";
  const salienteNombres = r.nombres || "";
  const salienteApPat = r.apPat || "";
  const salienteApMat = r.apMat || "";
  let nombreSaliente = construirNombreFirmante(salienteGrado, salienteNombres, salienteApPat, salienteApMat);
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = r.nombre || "";
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();

  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat);
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const tituloL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()} DE LA <span style="white-space:nowrap">DIV-10</span>`;

  /* ============================================================
     CONSTRUIR ÁTOMOS MEDIBLES
     Cada átomo es la unidad mínima que NO se puede dividir.
     ============================================================ */
  const atomos = [];

  /* Encabezado (membrete + título) */
  atomos.push({
    tipo: "header",
    html: `
      <div class="acta-membrete">
        <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
        <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
        <div class="linea3">BOLIVIA</div>
      </div>
      <div class="acta-titulo">
        <span class="titulo-linea1">${esc(tituloL1)}</span>
        <span class="titulo-linea2">${tituloL2}</span>
      </div>
    `
  });

  /* Secciones con filas individuales */
  const secciones = [
    { numRomano: "I.- ", titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", lista: fijos, tipoClase: "fijos" },
    { numRomano: "II.- ", titulo: "INVENTARIO DE ACTIVOS FUNGIBLES", lista: fungibles, tipoClase: "fungibles" },
    { numRomano: "III.- ", titulo: "INVENTARIO INTERNO", lista: internos, tipoClase: "internos" },
    { numRomano: "IV.- ", titulo: "INVENTARIO DE BIENES PRESTADOS", lista: prestados, tipoClase: "prestados" }
  ];

  secciones.forEach(sec => {
    atomos.push({
      tipo: "seccion-titulo",
      html: `<div class="acta-seccion-titulo">${sec.numRomano}<span class="subrayado">${esc(sec.titulo)}</span>.</div>`,
      seccion: sec.tipoClase
    });

    atomos.push({
      tipo: "thead",
      html: generarTheadActa(sec.tipoClase),
      seccion: sec.tipoClase
    });

    if(sec.lista.length === 0){
      atomos.push({
        tipo: "fila-vacia",
        html: `<table class="acta-tabla"><tbody><tr><td class="vacia" colspan="4">NO CUENTA</td></tr></tbody></table>`,
        seccion: sec.tipoClase
      });
    } else {
      sec.lista.forEach((b, i) => {
        atomos.push({
          tipo: "fila",
          html: generarFilaActa(b, i, sec.tipoClase),
          seccion: sec.tipoClase,
          esUltimaFila: i === sec.lista.length - 1
        });
      });
    }
  });

  /* Firmas */
  const firmasHTML = generarBloqueFirmas({
    nombreSaliente, cargoSaliente, nombreEntrante, cargoEntrante,
    nombreSup1, cargoSup1, nombreSup2, cargoSup2,
    nombreVobo, cargoVobo, fechaLarga
  });
  atomos.push({ tipo: "firmas", html: firmasHTML });

  /* ============================================================
     MEDIR ÁTOMOS
     ============================================================ */
  const contMed = document.getElementById("actaMedicion");
  /* Envolvemos cada átomo en un contenedor compatible con impresión para medir tamaño real */
  atomos.forEach(a => {
    contMed.innerHTML = `<div class="acta-seccion" style="margin-top:0;">${a.html}</div>`;
    void contMed.offsetHeight;
    a.altura = contMed.scrollHeight;
  });

  /* ============================================================
     ENSAMBLAR CON PAGE-BREAKS
     ------------------------------------------------------------
     - Acumulamos altura en la hoja actual.
     - Al desbordar, insertamos salto y RE-EMITIMOS thead si estamos en medio de una tabla.
     - Las firmas siempre van en hoja nueva y registramos en qué número quedaron.
     ============================================================ */
  let htmlFinal = "";
  let alturaAcumulada = 0;
  let hojaActual = 1;

  /* Necesitamos saber si estamos dentro de una tabla y qué sección */
  let seccionAbierta = null;         /* tipo de la sección con tabla activa */
  let hayFilasPendientes = false;    /* quedan filas en la sección */
  let indiceAtomo = 0;

  const hayFilaDespues = (idx, seccion) => {
    for(let j = idx + 1; j < atomos.length; j++){
      if(atomos[j].seccion === seccion && (atomos[j].tipo === "fila" || atomos[j].tipo === "fila-vacia")) return true;
      if(atomos[j].seccion !== seccion && atomos[j].tipo !== "thead") return false;
    }
    return false;
  };

  for(let i = 0; i < atomos.length; i++){
    const a = atomos[i];

    /* -------- FIRMAS: siempre en hoja nueva -------- */
    if(a.tipo === "firmas"){
      htmlFinal += `<div class="saltar-pagina"></div>`;
      hojaActual++;
      /* Cerrar cualquier tabla abierta antes de firmas */
      if(seccionAbierta){
        htmlFinal += `</tbody></table>`;
        seccionAbierta = null;
      }
      htmlFinal += a.html;
      continue;
    }

    /* -------- THEAD: abrir tabla nueva -------- */
    if(a.tipo === "thead"){
      /* Si ya había una tabla abierta, cerrarla */
      if(seccionAbierta){
        htmlFinal += `</tbody></table>`;
        seccionAbierta = null;
      }
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
      /* Necesitamos al menos el thead + 1 fila para que valga la pena empezar aquí */
      const siguiente = atomos[i+1];
      const alturaMinima = a.altura + (siguiente ? siguiente.altura : 0);

      if(alturaMinima > espacioRestante && alturaAcumulada > 0){
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = 0;
      }

      htmlFinal += a.html;  /* thead abre tabla */
      seccionAbierta = a.seccion;
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- FILA VACÍA -------- */
    if(a.tipo === "fila-vacia"){
      if(seccionAbierta !== a.seccion){
        /* Abrir tabla si no estaba */
        htmlFinal += `<table class="acta-tabla"><tbody>`;
        seccionAbierta = a.seccion;
      }
      htmlFinal += `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr></tbody></table>`;
      seccionAbierta = null;
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- FILA NORMAL -------- */
    if(a.tipo === "fila"){
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

      if(a.altura <= espacioRestante){
        /* Cabe */
        if(seccionAbierta !== a.seccion){
          /* Reabrir thead si venimos de salto */
          htmlFinal += generarTheadActa(a.seccion);
          seccionAbierta = a.seccion;
        }
        htmlFinal += a.html;
        alturaAcumulada += a.altura;
      } else {
        /* No cabe → saltar de hoja, cerrar tabla y reabrir thead */
        if(seccionAbierta){
          htmlFinal += `</tbody></table>`;
        }
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = 0;

        /* Reabrir thead */
        htmlFinal += generarTheadActa(a.seccion);
        seccionAbierta = a.seccion;
        htmlFinal += a.html;
        alturaAcumulada += a.altura;
      }
      continue;
    }

    /* -------- HEADER / SECCION-TITULO / OTROS BLOQUES -------- */
    const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

    /* Regla: si es título de sección, debe ir acompañado de al menos 2 filas siguientes */
    if(a.tipo === "seccion-titulo"){
      let alturaSiguientes = a.altura;
      for(let j = i + 1; j < atomos.length && j <= i + 2; j++){
        if(atomos[j].tipo === "thead" || atomos[j].tipo === "fila" || atomos[j].tipo === "fila-vacia"){
          alturaSiguientes += atomos[j].altura;
        } else break;
      }
      /* Cerrar tabla previa */
      if(seccionAbierta){
        htmlFinal += `</tbody></table>`;
        seccionAbierta = null;
      }
      if(alturaSiguientes > espacioRestante && alturaAcumulada > 0){
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = 0;
      }
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
      continue;
    }

    /* Bloque genérico (header) */
    if(a.altura <= espacioRestante){
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
    } else {
      if(seccionAbierta){
        htmlFinal += `</tbody></table>`;
        seccionAbierta = null;
      }
      htmlFinal += `<div class="saltar-pagina"></div>`;
      hojaActual++;
      alturaAcumulada = a.altura;
      htmlFinal += a.html;
    }
  }

  /* Cerrar tabla si quedó abierta */
  if(seccionAbierta){
    htmlFinal += `</tbody></table>`;
    seccionAbierta = null;
  }

  /* ============================================================
     INSERTAR ENCABEZADO DE CONTINUACIÓN EN LA HOJA DE FIRMAS
     ============================================================ */
  const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);
  const textoContinuacion = `${ordinalHoja(hojaActual)} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;

  let bloqueContinuacion = `<div class="acta-continuacion">${esc(textoContinuacion)}</div>`;
  if(resumenBienes){
    bloqueContinuacion += `<div class="acta-continuacion-resumen">${esc(resumenBienes)}</div>`;
  }

  htmlFinal = htmlFinal.replace(
    '<div class="acta-bloque-firmas">',
    `<div class="acta-bloque-firmas">${bloqueContinuacion}`
  );

  return htmlFinal;
}

/* Genera solo el thead con <table> abierta (sin cerrar) */
function generarTheadActa(tipoClase){
  let columnasHTML = "";
  if(tipoClase === "fijos"){
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:22%;">CÓDIGO (VSIAF.)</th><th style="width:55%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  } else {
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:10%;">CANTIDAD</th><th style="width:67%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  }
  return `<table class="acta-tabla acta-tabla-fragmento"><thead><tr>${columnasHTML}</tr></thead><tbody>`;
}

/* Genera una sola fila <tr> */
function generarFilaActa(b, i, tipoClase){
  const codigo = getVal(b, "CODIGO");
  const cant = getVal(b, "CANTIDAD");
  const desc = getVal(b, "DESCRIPCION DEL ACTIVO");
  const estado = getVal(b, "ESTADO");
  if(tipoClase === "fijos"){
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(codigo)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  } else {
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(cant)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  }
}

          <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
        </div>
        <div class="acta-firma-bloque-lado">

          <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
        </div>
      </div>`;
  } else if(d.nombreSup1){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
      </div>`;
  } else if(d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>

  bloqueFirmasHTML += `

  return `<div class="acta-bloque-firmas">
    <div class="acta-fecha-firmas">${esc(d.fechaLarga)}</div>

  </div>`;
}

function mesCapitalizado(m){

/* ============================================================
   LIGHTBOX / RIPPLE
   ============================================================ */
function abrirLightbox(url){
  const segura = sanitizarUrlFoto(url);
  if(!segura) return;
  document.getElementById("lightbox-img").src = segura;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }
function ripple(e, btn){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const span = document.createElement("span");
  span.style.position = "absolute";
  span.style.borderRadius = "50%";
  span.style.background = "var(--cian)";
  span.style.opacity = "0.4";
  span.style.pointerEvents = "none";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = x + "px";
  span.style.top = y + "px";
  span.style.transform = "scale(0)";
  span.style.animation = "rippleAnim .6s ease-out";
  btn.style.position = "relative";
  btn.style.overflow = "hidden";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}
const styleRipple = document.createElement("style");
styleRipple.innerHTML = "@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}";
document.head.appendChild(styleRipple);

document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

  try{
    history.replaceState({ pantalla: "home" }, "");
    history.pushState({ pantalla: "home" }, "");
  }catch(e){}
  cargarDesdeNube(false);
});
