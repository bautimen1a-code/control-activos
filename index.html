<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V3.2</title>
<style>
  :root{
    --bg:#0a0e12;--bg-panel:#141a20;--bg-elevado:#1e252d;--bg-hover:#252d36;--bg-input:#0f1419;
    --texto:#e8ecf0;--texto-suave:#8b96a3;--texto-muy-suave:#5a6472;
    --borde:rgba(212,176,96,.2);--borde-fuerte:rgba(212,176,96,.5);
    --sombra-panel:0 8px 30px rgba(0,0,0,.5);--sombra-modal:0 30px 80px rgba(0,0,0,.7);
    --grid-color:rgba(212,176,96,.03);--scanline-opacity:.3;
    --dorado:#d4b060;--dorado-brillante:#f0d088;--dorado-glow:rgba(212,176,96,.4);
    --cian:#26c6da;--cian-brillante:#5ee0f0;--cian-glow:rgba(38,198,218,.35);
    --verde:#4ade80;--verde-glow:rgba(74,222,128,.3);
    --rojo:#ef4444;--rojo-glow:rgba(239,68,68,.3);
    --amarillo:#fbbf24;--vino:#e05878;
    --mono:"JetBrains Mono","Consolas","Monaco",monospace;
    --sans:"Inter","Segoe UI",Roboto,sans-serif;
  }
  body.light{
    --bg:#f4f2eb;--bg-panel:#ffffff;--bg-elevado:#f8f7f3;--bg-hover:#f0edd9;--bg-input:#ffffff;
    --texto:#1e252d;--texto-suave:#5a6472;--texto-muy-suave:#8b96a3;
    --borde:rgba(30,51,37,.15);--borde-fuerte:rgba(30,51,37,.4);
    --sombra-panel:0 4px 16px rgba(0,0,0,.08);--sombra-modal:0 20px 60px rgba(0,0,0,.25);
    --grid-color:rgba(30,51,37,.04);--scanline-opacity:.15;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--sans);background:var(--bg);color:var(--texto);font-size:14px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative;transition:background .4s ease,color .4s ease;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-elevado);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--dorado),#9e7d35);border-radius:5px;border:2px solid var(--bg-elevado);}
  ::-webkit-scrollbar-thumb:hover{background:var(--dorado-brillante);}
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-layer::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;}
  @keyframes gridMove{from{transform:translate(0,0);}to{transform:translate(50px,50px);}}
  .bg-layer::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,rgba(38,198,218,.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(212,176,96,.06) 0%,transparent 40%);animation:pulseBg 8s ease-in-out infinite;}
  body.light .bg-layer::after{background:radial-gradient(circle at 20% 30%,rgba(38,198,218,.05) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(212,176,96,.04) 0%,transparent 40%);}
  @keyframes pulseBg{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}
  .scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cian),transparent);opacity:var(--scanline-opacity);z-index:1;pointer-events:none;animation:scanline 8s linear infinite;}
  @keyframes scanline{from{top:0;}to{top:100vh;}}

  /* LAYOUT */
  .app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}
  .app.focus-mode .header,
  .app.focus-mode .footer,
  .app.focus-mode .view-buttons{display:none !important;}
  .app.focus-mode .search-section{padding-top:14px;}

  /* HEADER */
  .header{position:sticky;top:0;z-index:50;background:var(--bg-panel);backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);padding:16px 20px;overflow:hidden;animation:slideDown .5s cubic-bezier(.4,0,.2,1);transition:background .4s ease,border-color .4s ease;}
  body:not(.light) .header{background:linear-gradient(180deg,rgba(20,26,32,.95),rgba(10,14,18,.9));}
  body.light .header{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,247,243,.95));}
  @keyframes slideDown{from{transform:translateY(-100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .header::after{content:"";position:absolute;bottom:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--dorado),var(--cian),var(--dorado),transparent);background-size:200% 100%;animation:borderFlow 3s linear infinite;}
  @keyframes borderFlow{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .header-content{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .header-logo{display:flex;align-items:center;gap:12px;}
  .header-logo-icon{width:40px;height:40px;border:2px solid var(--dorado);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dorado);background:rgba(212,176,96,.05);animation:pulseGlow 3s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--dorado-glow);}50%{box-shadow:0 0 20px 4px var(--dorado-glow);}}
  .header-text h1{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--texto),var(--dorado-brillante));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  body.light .header-text h1{background:linear-gradient(90deg,#1e252d,var(--dorado));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .btn-header{width:40px;height:40px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:10px;color:var(--cian);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1);flex-shrink:0;position:relative;}
  .btn-header:hover{background:var(--cian);color:var(--bg);border-color:var(--cian-brillante);box-shadow:0 0 20px var(--cian-glow);transform:scale(1.05);}
  .btn-header.theme{color:var(--dorado);}
  .btn-header.theme:hover{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);box-shadow:0 0 20px var(--dorado-glow);transform:rotate(180deg) scale(1.05);}
  .btn-header.search-btn.active{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);}
  .header-status{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(38,198,218,.08);border:1px solid rgba(38,198,218,.3);border-radius:20px;font-size:10px;font-family:var(--mono);color:var(--cian-brillante);letter-spacing:1px;}
  .status-dot{width:8px;height:8px;background:var(--verde);border-radius:50%;box-shadow:0 0 8px var(--verde);animation:blink 2s ease-in-out infinite;}
  .status-dot.loading{background:var(--amarillo);box-shadow:0 0 8px var(--amarillo);}
  .status-dot.error{background:var(--rojo);box-shadow:0 0 8px var(--rojo);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* BUSCADOR */
  .search-section{padding:20px;max-width:1200px;margin:0 auto;width:100%;animation:slideDown .6s cubic-bezier(.4,0,.2,1) .1s both;display:none;}
  .search-section.visible{display:block;}
  .search-box{position:relative;display:flex;align-items:center;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:4px 16px;transition:all .3s cubic-bezier(.4,0,.2,1);}
  .search-box:focus-within{border-color:var(--dorado);box-shadow:0 0 0 3px rgba(212,176,96,.1),0 0 30px rgba(212,176,96,.2);}
  .search-icon{color:var(--dorado);font-size:18px;margin-right:12px;flex-shrink:0;transition:transform .3s ease;}
  .search-box:focus-within .search-icon{transform:scale(1.1);filter:drop-shadow(0 0 8px var(--dorado));}
  .search-input{flex:1;background:transparent;border:none;outline:none;padding:14px 0;font-size:15px;color:var(--texto);font-family:var(--sans);font-weight:500;letter-spacing:.5px;}
  .search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:0;}
  .search-clear{background:transparent;border:none;color:var(--texto-muy-suave);font-size:18px;cursor:pointer;padding:0 6px;transition:all .2s;display:none;}
  .search-clear.visible{display:block;}
  .search-clear:hover{color:var(--rojo);transform:scale(1.1);}

  /* BOTONES VISTA */
  .view-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
  .view-btn{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:10px;padding:14px 12px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);overflow:hidden;text-align:center;animation:slideUp .5s cubic-bezier(.4,0,.2,1) both;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .view-btn:nth-child(1){animation-delay:.15s;}
  .view-btn:nth-child(2){animation-delay:.2s;}
  .view-btn:nth-child(3){animation-delay:.25s;}
  .view-btn:nth-child(4){animation-delay:.3s;}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .view-btn:hover{transform:translateY(-4px);border-color:var(--color,var(--dorado));box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 25px color-mix(in srgb,var(--color,var(--dorado)) 30%,transparent);}
  .view-btn:active{transform:translateY(-2px) scale(.98);}
  .view-btn[data-color="verde"]{--color:var(--verde);}
  .view-btn[data-color="azul"]{--color:var(--cian);}
  .view-btn[data-color="marron"]{--color:#d4a060;}
  .view-btn[data-color="vino"]{--color:var(--vino);}
  .view-btn-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;}
  .view-btn-count{font-size:24px;font-weight:800;color:var(--color,var(--dorado));font-family:var(--mono);text-shadow:0 0 15px color-mix(in srgb,var(--color,var(--dorado)) 40%,transparent);transition:all .3s ease;}
  .view-btn:hover .view-btn-count{transform:scale(1.1);text-shadow:0 0 25px color-mix(in srgb,var(--color,var(--dorado)) 70%,transparent);}
  .view-btn .ripple{position:absolute;border-radius:50%;background:var(--color,var(--dorado));transform:scale(0);animation:ripple .6s ease-out;opacity:.5;pointer-events:none;}
  @keyframes ripple{to{transform:scale(4);opacity:0;}}

  /* CONTENIDO */
  .main{flex:1;padding:0 20px 40px;max-width:1200px;margin:0 auto;width:100%;}
  .list-title{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--borde);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;animation:fadeIn .4s ease both;}
  .list-title .list-count{background:var(--bg-panel);border:1px solid var(--borde);color:var(--dorado);padding:3px 12px;border-radius:12px;font-family:var(--mono);font-weight:800;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .resp-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);overflow:hidden;animation:slideIn .5s cubic-bezier(.4,0,.2,1) both;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  @keyframes slideIn{from{transform:translateX(-20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .resp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--dorado),var(--cian));transform:scaleY(0);transform-origin:top;transition:transform .4s cubic-bezier(.4,0,.2,1);}
  .resp-card:hover{transform:translateX(8px);border-color:var(--dorado);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 30px rgba(212,176,96,.15);}
  .resp-card:hover::before{transform:scaleY(1);}
  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{font-size:15px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:6px;transition:color .3s ease;}
  .resp-card:hover .resp-card-name{color:var(--dorado-brillante);}
  body.light .resp-card:hover .resp-card-name{color:var(--dorado);}
  .resp-card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--texto-suave);font-family:var(--mono);}
  .resp-card-meta span{display:flex;align-items:center;gap:4px;}
  .resp-card-arrow{font-size:28px;color:var(--texto-muy-suave);transition:all .4s cubic-bezier(.4,0,.2,1);flex-shrink:0;}
  .resp-card:hover .resp-card-arrow{color:var(--dorado);transform:translateX(8px);}
  .bien-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);animation:slideIn .5s cubic-bezier(.4,0,.2,1) both;display:flex;gap:14px;align-items:flex-start;}
  .bien-card:hover{transform:translateX(8px);border-color:var(--cian);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 30px rgba(38,198,218,.15);}
  .bien-card-thumb{width:56px;height:56px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--texto-muy-suave);flex-shrink:0;overflow:hidden;transition:all .3s ease;}
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card:hover .bien-card-thumb{border-color:var(--cian);box-shadow:0 0 15px var(--cian-glow);}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{font-size:11px;font-family:var(--mono);color:var(--dorado);font-weight:700;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
  .bien-card-desc{font-size:13px;font-weight:600;color:var(--texto);line-height:1.3;margin-bottom:6px;}
  .bien-card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;font-family:var(--mono);color:var(--texto-suave);}
  .bien-card-meta span{display:flex;align-items:center;gap:4px;}
  .bien-card-tipo{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--bg-elevado);border:1px solid var(--borde);}
  .bien-card-tipo.fijos{color:var(--verde);border-color:var(--verde-glow);}
  .bien-card-tipo.fungibles{color:var(--cian);border-color:var(--cian-glow);}
  .bien-card-tipo.internos{color:#d4a060;border-color:rgba(212,160,96,.3);}
  .bien-card-tipo.prestados{color:var(--vino);border-color:rgba(224,88,120,.3);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s ease;}
  body.light .modal-overlay{background:rgba(30,37,45,.4);}
  .modal-overlay.visible{opacity:1;pointer-events:auto;}
  .modal{background:var(--bg-panel);border:1px solid var(--dorado);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra-modal),0 0 60px rgba(212,176,96,.15);transform:scale(.9) translateY(20px);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);}
  .modal-overlay.visible .modal{transform:scale(1) translateY(0);opacity:1;}
  .modal-header{padding:18px 22px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(212,176,96,.05),transparent);}
  .modal-header h2{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:700;flex:1;min-width:0;word-break:break-word;}
  .modal-close{width:32px;height:32px;background:transparent;border:1px solid var(--borde);color:var(--texto-suave);border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s ease;flex-shrink:0;}
  .modal-close:hover{background:var(--rojo);border-color:var(--rojo);color:white;transform:rotate(90deg);box-shadow:0 0 20px var(--rojo-glow);}
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:200px;}
  .btn-nav{display:inline-flex;align-items:center;gap:8px;background:var(--bg-elevado);color:var(--dorado);border:1px solid var(--borde);padding:9px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:8px;font-weight:700;font-family:var(--sans);transition:all .3s cubic-bezier(.4,0,.2,1);margin-bottom:16px;}
  .btn-nav:hover{background:var(--dorado);color:var(--bg);border-color:var(--dorado-brillante);transform:translateX(-4px);box-shadow:0 0 20px var(--dorado-glow);}
  .modal-titulo-seccion{text-align:center;padding:8px 0 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;font-family:var(--mono);border-bottom:1px solid var(--borde);margin-bottom:16px;}
  .oficina-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg-elevado);border:1px solid var(--borde);border-left:4px solid var(--dorado);padding:14px 16px;margin-bottom:10px;border-radius:10px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);animation:slideIn .4s cubic-bezier(.4,0,.2,1) both;}
  .oficina-card:hover{transform:translateX(8px);border-color:var(--dorado);border-left-color:var(--cian);background:var(--bg-hover);box-shadow:var(--sombra-panel),0 0 25px rgba(212,176,96,.15);}
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{font-size:13px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:4px;transition:color .3s ease;}
  .oficina-card:hover .oficina-card-nombre{color:var(--dorado-brillante);}
  body.light .oficina-card:hover .oficina-card-nombre{color:var(--dorado);}
  .oficina-card-id{font-size:10px;font-family:var(--mono);color:var(--cian);letter-spacing:1px;}
  .oficina-card-count{background:rgba(212,176,96,.1);border:1px solid var(--dorado);color:var(--dorado-brillante);padding:6px 14px;border-radius:14px;font-size:13px;font-weight:800;font-family:var(--mono);flex-shrink:0;transition:all .3s ease;}
  body.light .oficina-card-count{background:rgba(212,176,96,.15);color:#8a6d30;}
  .oficina-card:hover .oficina-card-count{background:var(--dorado);color:var(--bg);box-shadow:0 0 20px var(--dorado-glow);}
  .oficina-encabezado{background:linear-gradient(135deg,rgba(38,198,218,.1),rgba(212,176,96,.1));border:1px solid var(--borde);border-left:4px solid var(--cian);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  body.light .oficina-encabezado{background:linear-gradient(135deg,rgba(38,198,218,.06),rgba(212,176,96,.06));}
  .oficina-encabezado-info{flex:1;min-width:0;}
  .oficina-encabezado-nombre{font-size:14px;font-weight:800;color:var(--texto);letter-spacing:.3px;margin-bottom:4px;}
  .oficina-encabezado-sub{font-size:10px;font-family:var(--mono);color:var(--cian-brillante);letter-spacing:1px;text-transform:uppercase;}
  body.light .oficina-encabezado-sub{color:#1e7b8a;}
  .oficina-encabezado-count{background:rgba(38,198,218,.15);border:1px solid var(--cian);color:var(--cian-brillante);padding:6px 14px;border-radius:14px;font-size:13px;font-weight:800;font-family:var(--mono);flex-shrink:0;}
  body.light .oficina-encabezado-count{background:rgba(38,198,218,.2);color:#0e5a68;}

  /* TABLAS */
  .tabla-section{margin-bottom:20px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:10px;overflow:hidden;}
  .tabla-header{padding:12px 16px;background:linear-gradient(180deg,rgba(212,176,96,.08),transparent);border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .tabla-header-titulo{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:800;}
  .tabla-header-titulo .dot{width:8px;height:8px;border-radius:50%;background:var(--color,var(--dorado));box-shadow:0 0 8px var(--color,var(--dorado));}
  .tabla-header[data-color="verde"]{--color:var(--verde);}
  .tabla-header[data-color="azul"]{--color:var(--cian);}
  .tabla-header[data-color="marron"]{--color:#d4a060;}
  .tabla-header[data-color="vino"]{--color:var(--vino);}

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "div10_data_cache_v1";
const CACHE_TTL = 1000 * 60 * 60; /* 1 hora */

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {
  pantalla: "carga",
  modalVista: "oficinas",
  responsableActual: null,
  oficinaActual: null,
  bienActual: null
};

/* Historial de navegación interna */
let historialInterno = [];

/* ============================================================
   TEMA
   ============================================================ */
function cargarTema(){
  const guardado = localStorage.getItem("tema");
  if(guardado === "light"){
    document.body.classList.add("light");
    document.getElementById("themeIcon").textContent = "◑";
  }
}
function toggleTheme(){
  document.body.classList.toggle("light");
  const isLight = document.body.classList.contains("light");
  document.getElementById("themeIcon").textContent = isLight ? "◑" : "◐";
  localStorage.setItem("tema", isLight ? "light" : "dark");
}
cargarTema();

/* ============================================================
   VISIBILIDAD DEL BUSCADOR
   ============================================================ */
function aplicarVisibilidadBuscador(){
  const visible = localStorage.getItem("buscador_visible") !== "false";
  const section = document.getElementById("searchSection");
  const btn = document.getElementById("btnSearchToggle");
  if(visible){
    section.classList.add("visible");
    btn.classList.add("active");
  } else {
    section.classList.remove("visible");
    btn.classList.remove("active");
  }
}
function toggleSearch(){
  const section = document.getElementById("searchSection");
  const btn = document.getElementById("btnSearchToggle");
  const visible = section.classList.contains("visible");
  if(visible){
    section.classList.remove("visible");
    btn.classList.remove("active");
    localStorage.setItem("buscador_visible", "false");
  } else {
    section.classList.add("visible");
    btn.classList.add("active");
    localStorage.setItem("buscador_visible", "true");
    setTimeout(() => document.getElementById("buscador").focus(), 100);
  }
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){ return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN"); }
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

/* ============================================================
   CACHÉ
   ============================================================ */
function guardarCache(){
  try{
    const payload = {
      timestamp: Date.now(),
      data: DATA
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    console.log("💾 Datos guardados en caché");
  }catch(e){
    console.warn("⚠ No se pudo guardar caché:", e.message);
  }
}

function cargarCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const payload = JSON.parse(raw);
    if(!payload.data) return false;

    /* Restaurar datos */
    DATA.fijos = payload.data.fijos || [];
    DATA.fungibles = payload.data.fungibles || [];
    DATA.internos = payload.data.internos || [];
    DATA.prestados = payload.data.prestados || [];
    DATA.resp = payload.data.resp || [];

    const edad = Date.now() - (payload.timestamp || 0);
    const edadMin = Math.round(edad / 60000);
    console.log(`📦 Caché cargado (edad: ${edadMin} min)`);

    return true;
  }catch(e){
    console.warn("⚠ Error leyendo caché:", e.message);
    return false;
  }
}

/* ============================================================
   STATUS DEL HEADER
   ============================================================ */
function setStatus(tipo, texto){
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  dot.className = "status-dot";
  if(tipo === "loading") dot.classList.add("loading");
  if(tipo === "error") dot.classList.add("error");
  txt.textContent = texto;
}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
async function cargarDesdeNube(silencioso = false){
  if(!silencioso){
    const cont = document.getElementById("contenido");
    if(!DATA.fijos.length){
      cont.innerHTML = `<div class="loading fade-in">☁ Cargando datos desde Google Drive...</div>`;
    }
  }
  setStatus("loading", "CARGANDO");

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<")){
        console.warn(`⚠ ${nombre}: respuesta HTML`);
        return;
      }
      if(texto.trim().startsWith("{")){
        try{
          const j = JSON.parse(texto);
          if(j.error){
            console.warn(`⚠ ${nombre}:`, j.error);
            return;
          }
        }catch(_){}
      }
      DATA[key] = csvAObjetos(texto);
      console.log(`✔ ${nombre}: ${DATA[key].length} registros`);
    });

    DATA.fijos = DATA.fijos.filter(o => obtenerIdAsig(o));
    DATA.fungibles = DATA.fungibles.filter(o => obtenerIdAsig(o));
    DATA.internos = DATA.internos.filter(o => obtenerIdAsig(o));
    DATA.prestados = DATA.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    DATA.resp = DATA.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    guardarCache();
    actualizarContadores();
    document.getElementById("searchSection").classList.add("visible");
    setStatus("online", "ONLINE");
    estado.pantalla = "listo";

    /* Si había contenido visual, mantenerlo; si no, mostrar vacío */
    const cont = document.getElementById("contenido");
    if(!cont.querySelector(".resp-card, .bien-card, .tabla-section")){
      renderVacio();
    }

  }catch(err){
    console.error(err);
    if(!silencioso){
      const cont = document.getElementById("contenido");
      cont.innerHTML = `<div class="error fade-in">
        ⚠ No se pudieron cargar los datos<br><br>
        <small>${esc(err.message)}</small>
      </div>`;
    }
    setStatus("error", "ERROR");
  }
}

function recargarArchivo(){
  cargarDesdeNube(false);
}

/* ============================================================
   CONTADORES
   ============================================================ */
function actualizarContadores(){
  const conteos = {
    fijos: DATA.fijos.length,
    fungibles: DATA.fungibles.length,
    internos: DATA.internos.length,
    prestados: DATA.prestados.length
  };
  Object.keys(conteos).forEach(tipo => {
    const el = document.getElementById(`count-${tipo}`);
    if(el) el.textContent = conteos[tipo];
  });
}

/* ============================================================
   HELPERS RESPONSABLES
   ============================================================ */
function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return DATA.resp.find(x => getVal(x, "ID") === id.trim()) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}

/* ============================================================
   BÚSQUEDA
   ============================================================ */
function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, { cedula: ced, nombre: getNombreCompletoResp(r), cargo: getVal(r, "CARGO"), asignaciones: [] });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}
function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  const todos = [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
  return todos.filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  const todos = [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
  return todos.filter(b => norm(obtenerIdAsig(b)) === t);
}
function contarBienesPorAsignacion(id){
  const idLimpio = (id || "").trim();
  let total = 0;
  total += DATA.fijos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.fungibles.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.internos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.prestados.filter(o => obtenerIdAsig(o) === idLimpio).length;
  return total;
}

/* ============================================================
   HISTORIAL DE NAVEGACIÓN (para botón atrás del navegador)
   ============================================================ */
function pushHistorial(vista){
  historialInterno.push(vista);
  history.pushState({ vista }, "", "");
}

function popHistorial(){
  if(historialInterno.length > 0){
    historialInterno.pop();
  }
  if(historialInterno.length === 0){
    /* Estamos en la pantalla principal */
    const confirmar = confirm("¿Está seguro de salir del sistema?");
    if(confirmar){
      window.history.back();
    } else {
      /* Reingresar un estado para "cancelar" el back */
      history.pushState({ vista: "root" }, "", "");
    }
    return;
  }

  /* Recuperar el estado anterior */
  const anterior = historialInterno[historialInterno.length - 1];
  aplicarVista(anterior, false);
}

function aplicarVista(vista, guardarHistorial = true){
  if(vista.tipo === "inicio"){
    renderVacio();
  } else if(vista.tipo === "listaResponsables"){
    renderListaResponsables(vista.filtro);
  } else if(vista.tipo === "listaBienes"){
    renderListaBienes(vista.filtro, vista.subtipo);
  } else if(vista.tipo === "vistaGeneral"){
    renderVistaGeneral(vista.categoria, vista.oficina, vista.textoBusqueda);
  } else if(vista.tipo === "modalResponsable"){
    /* Reabrir modal */
    estado.responsableActual = vista.responsable;
    estado.modalVista = vista.modalVista || "oficinas";
    estado.oficinaActual = vista.oficina || null;
    document.getElementById("modal-titulo").textContent = vista.responsable ? vista.responsable.nombre : "";
    document.getElementById("modal-body").innerHTML = renderModalBody();
    document.getElementById("modal").classList.add("visible");
  } else if(vista.tipo === "modalDetalleBien"){
    estado.responsableActual = vista.responsable || null;
    estado.bienActual = vista.bien;
    estado.modalVista = "detalleBien";
    document.getElementById("modal-titulo").textContent = "Detalle del Bien";
    document.getElementById("modal-body").innerHTML = renderDetalleBien(vista.bien);
    document.getElementById("modal").classList.add("visible");
  }
}

  </div>`;

        <div class="empty-state-sub">No hay bienes con "${esc(filtro)}"</div>

    <span>◈ Bienes encontrados</span>
    <span class="list-count">${bienes.length}</span>

function tablaModal(titulo, lista, color){
  if(!lista.length){
    return `<div class="tabla-section">
      <div class="tabla-header" data-color="${color}">
        <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
        <div class="tabla-header-count">0</div>
      </div>
      <div class="empty-state" style="padding:30px 20px;">
        <div class="empty-state-sub">NO CUENTA ${titulo}</div>
      </div>
    </div>`;
  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach((item, i) => {
    const cod = getVal(item, "CODIGO");
    html += `<tr style="animation-delay:${i * 15}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto" title="${tieneFoto ? 'Clic para ampliar' : 'Sin foto disponible'}">${fotoHTML}</div>
        <div class="bien-detalle-header-info">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo">
      <div class="bien-detalle-label">${esc(label)}</div>
      <div style="flex:1;">${contenido}</div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function renderVistaGeneral(tipo, oficinaFiltro, textoBusqueda){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();
  if(!oficinaFiltro){
    let html = `<div class="list-title">
      <span>◈ ${titulo} — Total</span>
      <span class="list-count">${listaCompleta.length}</span>
    </div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state">
        <div class="empty-state-icon">◌</div>
        <div class="empty-state-title">Sin registros</div>
        <div class="empty-state-sub">No hay bienes en esta categoría</div>
      </div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      html += `
        <div class="resp-card" style="animation-delay:${i * 30}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }
  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let listaParaMostrar = listaFiltrada;
  if(textoBusqueda && textoBusqueda.trim().length){
    const t = norm(textoBusqueda);
    listaParaMostrar = listaFiltrada.filter(o => Object.values(o).some(v => norm(v).includes(t)));
  }
  let html = `<button class="btn-nav" onclick="renderVistaGeneral('${tipo}')">← Volver a oficinas</button>
    <div class="oficina-encabezado">
      <div class="oficina-encabezado-info">
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>
    <div class="search-box" style="margin-bottom:16px;">
      <span class="search-icon">⌕</span>
      <input type="text" class="search-input" id="miniBuscador"
             placeholder="Filtrar dentro de esta oficina..."
             value="${escAttr(textoBusqueda || "")}"
             oninput="filtrarDentroOficina('${escAttr(oficinaFiltro)}', this.value)"
             style="font-size:13px;padding:10px 0;">
    </div>`;
  if(!listaParaMostrar.length){
    html += `<div class="empty-state">
      <div class="empty-state-icon">◌</div>
      <div class="empty-state-title">Sin resultados</div>
      <div class="empty-state-sub">No hay bienes que coincidan</div>
    </div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaParaMostrar);
  cont.innerHTML = html;
}
function filtrarPorOficina(oficina){
  renderVistaGeneral(vistaGeneralActual, oficina, "");
  pushHistorial({ tipo: "vistaGeneral", categoria: vistaGeneralActual, oficina });
}
function filtrarDentroOficina(oficina, texto){
  renderVistaGeneral(vistaGeneralActual, oficina, texto);
  setTimeout(() => {
    const mb = document.getElementById("miniBuscador");
    if(mb){ mb.focus(); mb.setSelectionRange(mb.value.length, mb.value.length); }
  }, 10);
}
function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 10}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

/* ============================================================
   LIGHTBOX / RIPPLE
   ============================================================ */
function abrirLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }
function ripple(e, btn){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = x + "px";
  span.style.top = y + "px";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

/* ============================================================
   BUSCADOR
   ============================================================ */
function initBuscador(){
  const input = document.getElementById("buscador");
  const clear = document.getElementById("searchClear");
  let timer;

  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();

    /* Mostrar/ocultar botón de limpiar */
    if(val.length > 0) clear.classList.add("visible");
    else clear.classList.remove("visible");

    /* Modo focus: ocultar header, botones vista y footer */
    const app = document.getElementById("app");
    if(val.length > 0){
      app.classList.add("focus-mode");
    } else {
      app.classList.remove("focus-mode");
    }

    /* Quitar estado activo de botones de vista */
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));

    if(val.length < 1){ renderVacio(); return; }

    timer = setTimeout(() => {
      const tipoBusqueda = detectarTipoBusqueda(val);
      if(tipoBusqueda === "nombre"){
        renderListaResponsables(val);
        pushHistorial({ tipo: "listaResponsables", filtro: val });
      } else {
        renderListaBienes(val, tipoBusqueda);
        pushHistorial({ tipo: "listaBienes", filtro: val, subtipo: tipoBusqueda });
      }
    }, 200);
  });
}

function limpiarBuscador(){
  const input = document.getElementById("buscador");
  input.value = "";
  document.getElementById("searchClear").classList.remove("visible");
  document.getElementById("app").classList.remove("focus-mode");
  document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
  renderVacio();
  input.focus();
}

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    const section = document.getElementById("searchSection");
    if(!section.classList.contains("visible")) toggleSearch();
    setTimeout(() => document.getElementById("buscador").focus(), 100);
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
    else if(document.getElementById("buscador").value.trim().length) limpiarBuscador();
  }
});

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  initBuscador();
  aplicarVisibilidadBuscador();

  /* Estado inicial del historial */
  history.replaceState({ vista: "root" }, "", "");
  historialInterno = [];

  /* Intentar cargar desde caché primero */
  const hayCache = cargarCache();

  if(hayCache){
    /* Mostrar datos del caché inmediatamente */
    actualizarContadores();
    document.getElementById("searchSection").classList.add("visible");
    setStatus("online", "ONLINE");
    estado.pantalla = "listo";
    renderVacio();

    /* Actualizar en segundo plano (silencioso) */
    setTimeout(() => cargarDesdeNube(true), 500);
  } else {
    /* Sin caché: cargar desde la nube */
    cargarDesdeNube(false);
  }
});
