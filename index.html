   CONFIGURACIÓN

const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "control_div10_data_v1";
const CACHE_HOJA_KEY = "control_div10_cache_ts";

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){
  const toast = document.getElementById("toast");
  const iconEl = document.getElementById("toastIcon");
  const msgEl = document.getElementById("toastMsg");
  toast.className = "toast visible " + tipo;
  if(icono) iconEl.textContent = icono;
  else if(tipo === "success") iconEl.textContent = "✔";
  else if(tipo === "error") iconEl.textContent = "⚠";
  else iconEl.textContent = "ℹ";
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("visible"); }, 3200);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function limpiarTexto(s){
  return (s || "").toString()
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "")
    .trim();
}
function esc(s){
  const limpio = limpiarTexto(s);
  return limpio.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return limpiarTexto(obj[k]);
    }
  }
  return "";
}
function mismoId(a, b){
  return norm(a) === norm(b);
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   ARTÍCULO DEFINIDO
   ============================================================ */
const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";
  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();
  return tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  }).join(" ");
}

function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();
  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

function ordinalHoja(n){
  const mapa = {1: "1RA.",2: "2DA.",3: "3RA.",4: "4TA.",5: "5TA.",6: "6TA.",7: "7MA.",8: "8VA.",9: "9NA.",10: "10MA."};
  if(mapa[n]) return mapa[n];
  return n + "VA.";
}

function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);
  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

/* ============================================================
   CARGA Y CACHÉ
   ============================================================ */
async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");
  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          console.log("✔ Datos desde caché");
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }

  cont.innerHTML = `<div class="loading fade-in">☁ Cargando datos desde Google Drive...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error fade-in">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function recargarDesdeNube(){
  const btn = document.getElementById("btnReload");
  btn.classList.add("spinning");
  setTimeout(() => btn.classList.remove("spinning"), 1500);
  cargarDesdeNube(true);
}

/* ============================================================
   HELPERS
   ============================================================ */
function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return DATA.resp.find(x => mismoId(getVal(x, "ID"), id)) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  let total = 0;
  total += DATA.fijos.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.fungibles.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.internos.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.prestados.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  return total;
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function pushEstado(nombreEstado){
  try{ history.pushState({ pantalla: nombreEstado }, ""); }catch(e){}
}

window.addEventListener("popstate", (e) => {
  if(document.getElementById("modalVistaPrevia").classList.contains("visible")){
    cerrarModalVistaPrevia();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modalEntrante").classList.contains("visible")){
    cerrarModalEntrante();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modal").classList.contains("visible")){
    cerrarModal();
    pushEstado(estado.pantalla);
    return;
  }
  if(estado.pantalla === "busqueda"){
    estado.pantalla = "home";
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "vistaGeneral"){
    estado.pantalla = "home";
    estado.vistaGeneralActual = null;
    estado.oficinaFiltroActual = null;
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "home"){
    const salir = confirm("¿Está seguro que desea salir del sistema?");
    if(salir){ history.back(); }
    else { pushEstado("home"); }
  }
});

   BÚSQUEDA
   ============================================================ */
function irBusqueda(ev, btn){
  if(ev && btn) ripple(ev, btn);
  estado.pantalla = "busqueda";
  pushEstado("busqueda");
  mostrarModoBusqueda();
}

function mostrarModoBusqueda(){
  const cont = document.getElementById("contenido");
  cont.innerHTML = `
    <div class="modo-busqueda">
      <div class="modo-busqueda-top">
        <button class="btn-volver" onclick="volverDeBusqueda()">← Volver</button>
        <div class="search-wrapper">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" class="search-input" id="buscador" placeholder="Nombre, código o ID asignación..." autofocus>
            <button class="btn-clear" id="btnClear" onclick="limpiarBusqueda()" title="Limpiar">✖</button>
          </div>
        </div>
      </div>
      <div id="resultados-busqueda"></div>
    </div>
  `;
  const input = document.getElementById("buscador");
  input.focus();
  initBusquedaLive();

function volverDeBusqueda(){
  const input = document.getElementById("buscador");
  if(input) input.value = "";
  estado.pantalla = "home";
  mostrarHome();
  pushEstado("home");
}

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  return todosLosBienes().filter(b => mismoId(obtenerIdAsig(b), idAsig));
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables encontrados</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" style="animation-delay:${i * 30}ms" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes encontrados</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b, i) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" style="animation-delay:${i * 25}ms" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function irVistaGeneral(tipo, ev, btn){
  if(ev && btn) ripple(ev, btn);
  estado.pantalla = "vistaGeneral";
  estado.vistaGeneralActual = tipo;
  estado.oficinaFiltroActual = null;
  pushEstado("vistaGeneral");
  renderVistaGeneral(tipo);
}

function renderVistaGeneral(tipo, oficinaFiltro, textoBusqueda){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    let html = `<button class="btn-volver" onclick="volverDeVistaGeneral()">← Volver</button>
      <div class="list-title"><span>◈ ${titulo} — Total</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      html += `
        <div class="resp-card" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function tablaModal(titulo, lista, color){
  if(!lista.length){
    return `<div class="tabla-section"><div class="tabla-header" data-color="${color}"><div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div><div class="tabla-header-count">0</div></div><div class="empty-state" style="padding:30px 20px;"><div class="empty-state-sub">NO CUENTA ${titulo}</div></div></div>`;
  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach((item, i) => {
    const cod = getVal(item, "CODIGO");
    html += `<tr style="animation-delay:${i * 10}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ============================================================
   ⭐ V5.0 — GENERACIÓN DE PDF CON jsPDF
   ------------------------------------------------------------
   - Formato: Letter, márgenes 2/3/2/2 cm
   - Fuente: Helvetica (Arial)
   - Continuaciones SIN thead
   - Firmas bloque atómico
   ============================================================ */

/* Constantes de layout (en mm) */
const PDF_LAYOUT = {
  pageW: 215.9,
  pageH: 279.4,
  marginTop: 20,
  marginBottom: 20,
  marginLeft: 30,
  marginRight: 20,
  get contentW() { return this.pageW - this.marginLeft - this.marginRight; },
  get contentH() { return this.pageH - this.marginTop - this.marginBottom; }
};

function generarPDFActa(r, oficina, datos){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "letter"
  });

  const idAsignacion = oficina.id;
  const fijos = DATA.fijos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const fungibles = DATA.fungibles.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const internos = DATA.internos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const prestados = DATA.prestados.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);
  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  /* Y actual en mm (relativo al top de la página) */
  let yCursor = PDF_LAYOUT.marginTop;

  /* ============================================================
     1) MEMBRETE
     ============================================================ */
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  const xLeft = PDF_LAYOUT.marginLeft;

  doc.text("COMANDO GENERAL DEL EJÉRCITO", xLeft, yCursor);
  yCursor += 4;
  doc.text("DÉCIMA DIVISIÓN DEL EJÉRCITO", xLeft + 3, yCursor);
  yCursor += 4;
  doc.text("BOLIVIA", xLeft + 25, yCursor);
  doc.line(xLeft + 25, yCursor + 0.5, xLeft + 25 + doc.getTextWidth("BOLIVIA"), yCursor + 0.5);
  yCursor += 6;

  /* ============================================================
     2) TÍTULO (2 o 3 líneas)
     ============================================================ */
  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const textoL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()}`;
  const textoSufijo = `DE LA DIV-10`;
  const anchoCompleto = (textoL2 + " " + textoSufijo).length;
  const requiereTresLineas = anchoCompleto > 75;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  const centerX = PDF_LAYOUT.pageW / 2;

  if(requiereTresLineas){
    doc.text(tituloL1, centerX, yCursor, { align: "center" });
    yCursor += 6;
    doc.text(textoL2, centerX, yCursor, { align: "center" });
    yCursor += 6;
    doc.text(textoSufijo, centerX, yCursor, { align: "center" });
    yCursor += 6;
  } else {
    doc.text(tituloL1, centerX, yCursor, { align: "center" });
    yCursor += 6;
    doc.text(textoL2 + " " + textoSufijo, centerX, yCursor, { align: "center" });
    yCursor += 6;
  }

  yCursor += 2;

  /* ============================================================
     3) SECCIONES CON autoTable
     ============================================================ */
  const secciones = [
    { num: "I.- ",   titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)",   lista: fijos,     tipo: "fijos" },
    { num: "II.- ",  titulo: "INVENTARIO DE ACTIVOS FUNGIBLES",         lista: fungibles, tipo: "fungibles" },
    { num: "III.- ", titulo: "INVENTARIO INTERNO",                      lista: internos,  tipo: "internos" },
    { num: "IV.- ",  titulo: "INVENTARIO DE BIENES PRESTADOS",          lista: prestados, tipo: "prestados" }
  ];

  /* Identificar última sección no vacía */
  let ultimaSeccionNoVaciaIdx = -1;
  secciones.forEach((sec, idx) => {
    if(sec.lista.length > 0) ultimaSeccionNoVaciaIdx = idx;
  });

  /* Reserva de firmas: medir altura aproximada del bloque de firmas */
  const alturaFirmasMM = medirBloqueFirmasPDF(doc, datos, r);

  secciones.forEach((sec, idxSec) => {
    const esUltimaNoVacia = (idxSec === ultimaSeccionNoVaciaIdx);
    const reservaFirmas = esUltimaNoVacia ? alturaFirmasMM : 0;

    /* Subtítulo de la sección */
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);

    const subtituloTexto = `${sec.num}${sec.titulo}.`;

    /* Verificar si el subtítulo + thead + 1 fila caben. Si no, nueva página */
    /* Estimación: subtítulo 5mm + thead ~7mm + 1 fila ~6mm = 18mm */
    const espacioRestanteInicial = PDF_LAYOUT.pageH - PDF_LAYOUT.marginBottom - yCursor - reservaFirmas;

    if(espacioRestanteInicial < 20 && sec.lista.length > 0){
      doc.addPage();
      yCursor = PDF_LAYOUT.marginTop;
    }

    /* Dibujar subtítulo (con subrayado) */
    doc.text(subtituloTexto, xLeft, yCursor);
    /* Subrayado del título de sección */
    const anchoSubtitulo = doc.getTextWidth(subtituloTexto);
    const xInicioSubrayado = xLeft + doc.getTextWidth(sec.num);
    doc.setLineWidth(0.2);
    doc.line(xInicioSubrayado, yCursor + 0.5, xLeft + anchoSubtitulo, yCursor + 0.5);
    yCursor += 4;

    /* Preparar filas */
    let head, body, columnStyles;

    if(sec.tipo === "fijos"){
      head = [["N°", "CÓDIGO (VSIAF.)", "DESCRIPCIÓN", "ESTADO"]];
      columnStyles = {
        0: { cellWidth: 15, halign: "center" },
        1: { cellWidth: 45, halign: "center" },
        2: { cellWidth: "auto", halign: "justify" },
        3: { cellWidth: 25, halign: "center" }
      };
      body = sec.lista.map((item, i) => [
        `${i+1}.-`,
        getVal(item, "CODIGO"),
        getVal(item, "DESCRIPCION DEL ACTIVO"),
        getVal(item, "ESTADO")
      ]);
    } else {
      head = [["N°", "CANTIDAD", "DESCRIPCIÓN", "ESTADO"]];
      columnStyles = {
        0: { cellWidth: 15, halign: "center" },
        1: { cellWidth: 20, halign: "center" },
        2: { cellWidth: "auto", halign: "justify" },
        3: { cellWidth: 25, halign: "center" }
      };
      body = sec.lista.map((item, i) => [
        `${i+1}.-`,
        getVal(item, "CANTIDAD"),
        getVal(item, "DESCRIPCION DEL ACTIVO"),
        getVal(item, "ESTADO")
      ]);
    }

    /* Si está vacía → fila "NO CUENTA" */
    if(sec.lista.length === 0){
      body = [["", "", "NO CUENTA", ""]];
    }

    /* Configurar autoTable */
    const opciones = {
      head: head,
      body: body,
      startY: yCursor,
      margin: {
        top: PDF_LAYOUT.marginTop,
        right: PDF_LAYOUT.marginRight,
        bottom: PDF_LAYOUT.marginBottom + reservaFirmas,  /* Reserva de firmas solo si aplica */
        left: PDF_LAYOUT.marginLeft
      },
      tableWidth: PDF_LAYOUT.contentW,
      styles: {
        font: "helvetica",
        fontSize: 9,
        cellPadding: 1.5,
        lineColor: [0, 0, 0],
        lineWidth: 0.15,
        textColor: [0, 0, 0],
        overflow: "linebreak",
        valign: "top"
      },
      headStyles: {
        fontStyle: "bold",
        fillColor: [255, 255, 255],
        textColor: [0, 0, 0],
        halign: "center",
        lineWidth: 0.15,
        lineColor: [0, 0, 0]
      },
      bodyStyles: {
        lineWidth: 0.15,
        lineColor: [0, 0, 0]
      },
      columnStyles: columnStyles,
      /* ⭐ thead NO se repite en continuaciones */
      showHead: "firstPage",
      /* No partir filas */
      rowPageBreak: "avoid",
      /* Evitar que la tabla quede huérfana */
      pageBreak: "auto"
    };

    /* Dibujar la tabla */
    doc.autoTable(opciones);

    /* Actualizar yCursor a donde quedó la tabla */
    yCursor = doc.lastAutoTable.finalY + 4;

    /* Si quedó muy abajo, nueva página */
    if(yCursor > PDF_LAYOUT.pageH - PDF_LAYOUT.marginBottom - reservaFirmas){
      doc.addPage();
      yCursor = PDF_LAYOUT.marginTop;
    }
  });

  /* ============================================================
     4) FIRMAS
     ============================================================ */
  /* Verificar si caben; si no, nueva página */
  const espacioRestanteFirmas = PDF_LAYOUT.pageH - PDF_LAYOUT.marginBottom - yCursor;
  let firmasVanSolas = false;

  if(alturaFirmasMM > espacioRestanteFirmas){
    doc.addPage();
    yCursor = PDF_LAYOUT.marginTop;
    firmasVanSolas = true;

    /* Insertar encabezado de continuación */
    const totalHojas = doc.getNumberOfPages();
    const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);
    const ordinal = ordinalHoja(totalHojas);
    const textoContinuacion = `${ordinal} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;

    doc.setFont("helvetica", "italic");
    doc.setFontSize(8);
    doc.setLineWidth(0.2);
    doc.line(xLeft, yCursor, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, yCursor);
    yCursor += 3;
    doc.text(textoContinuacion, centerX, yCursor, { align: "center" });
    yCursor += 3;
    if(resumenBienes){
      doc.text(resumenBienes, centerX, yCursor, { align: "center" });
      yCursor += 3;
    }
    doc.line(xLeft, yCursor, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, yCursor);
    yCursor += 6;
  }

  dibujarBloqueFirmasPDF(doc, datos, r, yCursor);

  return doc;
}

/* ============================================================
   MEDIR altura del bloque de firmas en mm
   ============================================================ */
function medirBloqueFirmasPDF(doc, datos, r){
  /* Fecha: 6mm
     Fila 1 (ENTREGUÉ/RECIBÍ): ~30mm
     Fila 2 (supervisores): ~20mm (si aplica)
     Vo.Bo.: ~25mm
     Total aprox: 80-100mm según contenido */
  let altura = 8; /* fecha */
  altura += 30; /* Entregué/Recibí */
  if(datos.sup1.grado || datos.sup1.nombres){
    altura += 20;
  }
  if(datos.sup2.grado || datos.sup2.nombres){
    /* Están en la misma fila que sup1 */
  }
  altura += 25; /* Vo.Bo. */
  return altura;
}

/* ============================================================
   DIBUJAR bloque de firmas en el PDF
   ============================================================ */
function dibujarBloqueFirmasPDF(doc, datos, r, yInicio){
  let y = yInicio;

  /* Fecha */
  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.text(fechaLarga, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, y, { align: "right" });
  y += 12;

  /* Preparar nombres */
  const nombreSaliente = construirNombreFirmante(r.grado, r.nombres, r.apPat, r.apMat) || "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();
  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat) || "RESPONSABLE ENTRANTE";
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  /* Columnas para las firmas */
  const colIzqX = PDF_LAYOUT.marginLeft + (PDF_LAYOUT.contentW * 0.25);
  const colDerX = PDF_LAYOUT.marginLeft + (PDF_LAYOUT.contentW * 0.75);

  /* Fila 1: ENTREGUÉ / RECIBÍ */
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("ENTREGUÉ CONFORME:", colIzqX, y, { align: "center" });
  doc.text("RECIBÍ CONFORME:", colDerX, y, { align: "center" });
  y += 22;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(nombreSaliente, colIzqX, y, { align: "center" });
  doc.text(nombreEntrante, colDerX, y, { align: "center" });
  y += 5;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text(cargoSaliente, colIzqX, y, { align: "center" });
  doc.text(cargoEntrante, colDerX, y, { align: "center" });
  y += 12;

  /* Fila 2: Supervisores (si aplica) */
  if(nombreSup1 || nombreSup2){
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    if(nombreSup1 && nombreSup2){
      doc.text(nombreSup1, colIzqX, y, { align: "center" });
      doc.text(nombreSup2, colDerX, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup1, colIzqX, y, { align: "center" });
      doc.text(cargoSup2, colDerX, y, { align: "center" });
      y += 12;
    } else if(nombreSup1){
      doc.text(nombreSup1, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup1, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 12;
    } else if(nombreSup2){
      doc.text(nombreSup2, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup2, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 12;
    }
  }

  /* Vo.Bo. */
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("Vo. Bo.", PDF_LAYOUT.pageW/2, y, { align: "center" });
  y += 18;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(nombreVobo, PDF_LAYOUT.pageW/2, y, { align: "center" });
  y += 5;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text(cargoVobo, PDF_LAYOUT.pageW/2, y, { align: "center" });
}

/* ============================================================
   GENERAR HTML de vista previa (informativo)
   ------------------------------------------------------------
   Este HTML es solo para mostrar al usuario. NO se usa para imprimir.
   ============================================================ */
function generarHTMLPreview(r, oficina, datos){
  const idAsignacion = oficina.id;
  const fijos = DATA.fijos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const fungibles = DATA.fungibles.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const internos = DATA.internos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const prestados = DATA.prestados.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const textoL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()}`;
  const textoSufijo = `DE LA DIV-10`;
  const anchoCompleto = (textoL2 + " " + textoSufijo).length;
  const requiereTresLineas = anchoCompleto > 75;

  let tituloHTML;
  if(requiereTresLineas){
    tituloHTML = `
      <span class="titulo-linea1">${esc(tituloL1)}</span>
      <span class="titulo-linea2">${esc(textoL2)}</span>
      <span class="titulo-linea3">${esc(textoSufijo)}</span>
    `;
  } else {
    tituloHTML = `
      <span class="titulo-linea1">${esc(tituloL1)}</span>
      <span class="titulo-linea2">${esc(textoL2)} <span style="white-space:nowrap">${esc(textoSufijo)}</span></span>
    `;
  }

  function tablaPreview(sec, lista){
    const colgroupHTML = (sec.tipo === "fijos")
      ? `<colgroup><col style="width:8%;"><col style="width:22%;"><col style="width:55%;"><col style="width:15%;"></colgroup>`
      : `<colgroup><col style="width:8%;"><col style="width:10%;"><col style="width:67%;"><col style="width:15%;"></colgroup>`;

    const columnasHTML = (sec.tipo === "fijos")
      ? `<th>N°</th><th>CÓDIGO (VSIAF.)</th><th>DESCRIPCIÓN</th><th>ESTADO</th>`
      : `<th>N°</th><th>CANTIDAD</th><th>DESCRIPCIÓN</th><th>ESTADO</th>`;

    let filasHTML;
    if(lista.length === 0){
      filasHTML = `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr>`;
    } else {
      filasHTML = lista.map((item, i) => {
        if(sec.tipo === "fijos"){
          return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(getVal(item, "CODIGO"))}</td><td class="descripcion">${esc(getVal(item, "DESCRIPCION DEL ACTIVO"))}</td><td class="center">${esc(getVal(item, "ESTADO"))}</td></tr>`;
        }
        return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(getVal(item, "CANTIDAD"))}</td><td class="descripcion">${esc(getVal(item, "DESCRIPCION DEL ACTIVO"))}</td><td class="center">${esc(getVal(item, "ESTADO"))}</td></tr>`;
      }).join("");
    }

    return `<div class="acta-seccion">
      <div class="acta-seccion-titulo">${sec.num}<span class="subrayado">${esc(sec.titulo)}</span>.</div>
      <table class="acta-tabla">
        ${colgroupHTML}
        <thead><tr>${columnasHTML}</tr></thead>
        <tbody>${filasHTML}</tbody>
      </table>
    </div>`;
  }

  let html = `
    <div class="acta-membrete">
      <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
      <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
      <div class="linea3">BOLIVIA</div>
    </div>
    <div class="acta-titulo">${tituloHTML}</div>
  `;

  html += tablaPreview({ num: "I.- ", titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", tipo: "fijos" }, fijos);
  html += tablaPreview({ num: "II.- ", titulo: "INVENTARIO DE ACTIVOS FUNGIBLES", tipo: "fungibles" }, fungibles);
  html += tablaPreview({ num: "III.- ", titulo: "INVENTARIO INTERNO", tipo: "internos" }, internos);
  html += tablaPreview({ num: "IV.- ", titulo: "INVENTARIO DE BIENES PRESTADOS", tipo: "prestados" }, prestados);

  return html;
}

/* ============================================================
   ACCIONES DE LOS BOTONES PDF
   ============================================================ */
function descargarPDF(){
  if(!actaEnProceso.pdfDoc){
    mostrarToast("No hay PDF generado", "error", "⚠");
    return;
  }
  const nombreArchivo = `acta_${norm(actaEnProceso.oficina.oficina).replace(/\s+/g, "_")}_${new Date().toISOString().slice(0,10)}.pdf`;
  actaEnProceso.pdfDoc.save(nombreArchivo);
  mostrarToast("PDF descargado", "success", "✔");
}

function imprimirPDF(){
  if(!actaEnProceso.pdfDoc){
    mostrarToast("No hay PDF generado", "error", "⚠");
    return;
  }
  const blobURL = actaEnProceso.pdfDoc.output("bloburl");
  window.open(blobURL, "_blank");
}

/* ============================================================
   MESES
   ============================================================ */
function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }
function ripple(e, btn){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const span = document.createElement("span");
  span.style.position = "absolute";
  span.style.borderRadius = "50%";
  span.style.background = "var(--dorado)";
  span.style.opacity = "0.5";
  span.style.pointerEvents = "none";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = x + "px";
  span.style.top = y + "px";
  span.style.transform = "scale(0)";
  span.style.animation = "rippleAnim .6s ease-out";
  btn.style.position = "relative";
  btn.style.overflow = "hidden";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}
const styleRipple = document.createElement("style");
styleRipple.innerHTML = "@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}";
document.head.appendChild(styleRipple);

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  try{
    history.replaceState({ pantalla: "home" }, "");
    history.pushState({ pantalla: "home" }, "");
  }catch(e){}
  cargarDesdeNube(false);
});
