<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     V5.0 — TEMA "PANEL DE OFICINA"
     Verde militar + ámbar + cobre
     ============================================================ */
  :root{
    --bg:#0d1210;
    --bg-panel:#141b18;
    --bg-elevado:#1c2521;
    --bg-hover:#243029;
    --bg-card:#1a221e;

    --texto:#e6ece8;
    --texto-suave:#8fa197;
    --texto-muy-suave:#5e6d64;

    --borde:rgba(180,200,120,.14);
    --borde-fuerte:rgba(180,200,120,.28);

    --sombra-panel:0 10px 40px rgba(0,0,0,.55);
    --sombra-card:0 4px 20px rgba(0,0,0,.35);

    /* Paleta principal */
    --verde-mil:#5a8c3e;
    --verde-mil-br:#7fb356;
    --verde-mil-glow:rgba(122,179,86,.35);

    --ambar:#e0a838;
    --ambar-br:#f5c65a;
    --ambar-glow:rgba(224,168,56,.35);

    --cobre:#b87333;
    --cobre-br:#d99058;
    --cobre-glow:rgba(184,115,51,.35);

    --cian:#4fb8c4;
    --cian-br:#7dd4de;
    --cian-glow:rgba(79,184,196,.3);

    --rojo:#d94a4a;
    --rojo-glow:rgba(217,74,74,.3);
    --verde-ok:#4dbf6e;
    --amarillo:#e0c34a;
    --vino:#c25a78;

    --mono:"IBM Plex Mono","Consolas","Monaco",monospace;
    --sans:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;

    --radio-sm:6px;
    --radio-md:10px;
    --radio-lg:14px;
  }

  body.light{
    --bg:#eae6dc;
    --bg-panel:#ffffff;
    --bg-elevado:#f6f3ea;
    --bg-hover:#ece7d8;
    --bg-card:#ffffff;

    --texto:#1a221e;
    --texto-suave:#4f5e55;
    --texto-muy-suave:#8a978e;

    --borde:rgba(30,45,35,.14);
    --borde-fuerte:rgba(30,45,35,.24);

    --sombra-panel:0 6px 24px rgba(0,0,0,.1);
    --sombra-card:0 2px 10px rgba(0,0,0,.06);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}

  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--texto);
    font-size:14px;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
  }

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-elevado);}
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,var(--verde-mil),#3d6028);
    border-radius:5px;border:2px solid var(--bg-elevado);
  }
  ::-webkit-scrollbar-thumb:hover{background:var(--verde-mil-br);}

  /* Fondo decorativo sutil */
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-layer::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 15% 20%,rgba(122,179,86,.06) 0%,transparent 35%),
      radial-gradient(circle at 85% 80%,rgba(224,168,56,.05) 0%,transparent 40%);
  }
  .bg-layer::after{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(122,179,86,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(122,179,86,.025) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
  }

  .app{
    position:relative;z-index:2;min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    grid-template-columns:280px 1fr;
    grid-template-areas:
      "sidebar header"
      "sidebar main"
      "sidebar footer";
  }

  /* ============================================================
     HEADER COMPACTO
     ============================================================ */
  .header{
    grid-area:header;
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,rgba(20,27,24,.96),rgba(13,18,16,.92));
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--borde);
    padding:12px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  body.light .header{
    background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,243,234,.95));
  }

  .breadcrumb{
    display:flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:600;font-family:var(--mono);
  }
  .breadcrumb-item{color:var(--texto-suave);}
  .breadcrumb-item.active{color:var(--ambar);font-weight:700;}
  .breadcrumb-sep{color:var(--texto-muy-suave);opacity:.5;}

  .header-actions{display:flex;align-items:center;gap:8px;}

  .btn-icon{
    width:36px;height:36px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;color:var(--texto-suave);
  }
  .btn-icon:hover{
    background:var(--bg-hover);
    border-color:var(--borde-fuerte);
    color:var(--ambar);
    transform:translateY(-1px);
  }
  .btn-icon.cyan:hover{color:var(--cian);border-color:var(--cian);}
  .btn-icon.gold:hover{color:var(--ambar);border-color:var(--ambar);}
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  .header-status{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px;
    background:rgba(122,179,86,.08);
    border:1px solid rgba(122,179,86,.3);
    border-radius:20px;
    font-size:10px;font-family:var(--mono);
    color:var(--verde-mil-br);letter-spacing:1.2px;font-weight:600;
  }
  .status-dot{
    width:7px;height:7px;background:var(--verde-ok);
    border-radius:50%;box-shadow:0 0 8px var(--verde-ok);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* ============================================================
     SIDEBAR
     ============================================================ */
  .sidebar{
    grid-area:sidebar;
    background:linear-gradient(180deg,var(--bg-panel),var(--bg));
    border-right:1px solid var(--borde);
    padding:20px 16px;
    display:flex;flex-direction:column;gap:20px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }

  .sidebar-logo{
    display:flex;align-items:center;gap:12px;
    padding:8px 8px 16px;
    border-bottom:1px solid var(--borde);
  }
  .sidebar-logo-icon{
    width:44px;height:44px;
    background:linear-gradient(135deg,var(--verde-mil),#2d4d1e);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;
    box-shadow:0 6px 18px rgba(122,179,86,.3);
    flex-shrink:0;
  }
  .sidebar-logo-text{min-width:0;}
  .sidebar-logo-text h1{
    font-size:14px;font-weight:800;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--texto);
    line-height:1.2;
  }
  .sidebar-logo-text span{
    font-size:9px;letter-spacing:2px;
    color:var(--texto-muy-suave);
    font-family:var(--mono);font-weight:600;
  }

  .sidebar-section{
    display:flex;flex-direction:column;gap:6px;
  }
  .sidebar-section-title{
    font-size:9px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-muy-suave);font-weight:800;
    padding:0 8px;margin-bottom:4px;font-family:var(--mono);
  }

  .sidebar-btn{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--radio-md);
    cursor:pointer;color:var(--texto-suave);
    font-family:var(--sans);font-size:13px;font-weight:600;
    text-align:left;width:100%;
    transition:all .2s ease;
    position:relative;overflow:hidden;
  }
  .sidebar-btn:hover{
    background:var(--bg-elevado);
    color:var(--texto);
    border-color:var(--borde);
  }
  .sidebar-btn.active{
    background:linear-gradient(90deg,rgba(122,179,86,.15),transparent);
    border-color:rgba(122,179,86,.3);
    color:var(--verde-mil-br);
  }
  .sidebar-btn.active::before{
    content:"";position:absolute;left:0;top:20%;bottom:20%;
    width:3px;background:var(--verde-mil-br);
    border-radius:0 3px 3px 0;
  }
  .sidebar-btn-icon{
    width:20px;text-align:center;font-size:16px;
    color:var(--texto-muy-suave);flex-shrink:0;
  }
  .sidebar-btn.active .sidebar-btn-icon{color:var(--verde-mil-br);}
  .sidebar-btn-count{
    margin-left:auto;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    color:var(--texto-suave);
    padding:2px 8px;border-radius:10px;
    font-size:10px;font-family:var(--mono);font-weight:700;
    flex-shrink:0;
  }
  .sidebar-btn.active .sidebar-btn-count{
    background:rgba(122,179,86,.15);
    border-color:rgba(122,179,86,.35);
    color:var(--verde-mil-br);
  }

  .sidebar-footer{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--borde);
    font-size:9px;letter-spacing:1.5px;
    color:var(--texto-muy-suave);
    font-family:var(--mono);text-align:center;
    line-height:1.6;
  }

  /* ============================================================
     MAIN
     ============================================================ */
  .main{
    grid-area:main;
    padding:24px;
    max-width:1400px;width:100%;
    margin:0 auto;
  }

  /* ============================================================
     HOME — DASHBOARD
     ============================================================ */
  .home{animation:fadeIn .4s ease both;display:flex;flex-direction:column;gap:24px;}

  .home-hero{
    background:linear-gradient(135deg,rgba(122,179,86,.08),rgba(224,168,56,.04));
    border:1px solid var(--borde);
    border-radius:var(--radio-lg);
    padding:28px 32px;
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    position:relative;overflow:hidden;
  }
  .home-hero::before{
    content:"";position:absolute;right:-40px;top:-40px;
    width:200px;height:200px;
    background:radial-gradient(circle,rgba(122,179,86,.15) 0%,transparent 70%);
    border-radius:50%;
  }
  .home-hero-text h2{
    font-size:22px;font-weight:800;letter-spacing:.5px;
    margin-bottom:6px;color:var(--texto);
  }
  .home-hero-text p{
    font-size:13px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.5px;
  }
  .home-hero-badge{
    background:var(--bg-panel);
    border:1px solid var(--borde-fuerte);
    border-radius:var(--radio-md);
    padding:12px 20px;
    font-family:var(--mono);font-size:11px;
    letter-spacing:1.5px;color:var(--texto-suave);
    text-align:center;position:relative;z-index:1;
  }
  .home-hero-badge strong{
    display:block;font-size:22px;color:var(--ambar);
    font-weight:800;margin-bottom:2px;
  }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .stat-card{
    background:var(--bg-card);
    border:1px solid var(--borde);
    border-radius:var(--radio-lg);
    padding:20px;
    cursor:pointer;
    transition:all .3s ease;
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;gap:14px;
  }
  .stat-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--color,var(--verde-mil));
    transform:scaleX(0);transform-origin:left;
    transition:transform .4s ease;
  }
  .stat-card:hover{
    transform:translateY(-4px);
    border-color:var(--color,var(--verde-mil));
    box-shadow:var(--sombra-card),0 0 30px color-mix(in srgb,var(--color,var(--verde-mil)) 20%,transparent);
  }
  .stat-card:hover::before{transform:scaleX(1);}
  .stat-card[data-color="verde"]{--color:var(--verde-mil-br);}
  .stat-card[data-color="azul"]{--color:var(--cian-br);}
  .stat-card[data-color="marron"]{--color:var(--cobre-br);}
  .stat-card[data-color="vino"]{--color:var(--vino);}

  .stat-card-top{
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .stat-card-icon{
    width:42px;height:42px;
    background:color-mix(in srgb,var(--color,var(--verde-mil)) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--color,var(--verde-mil)) 30%,transparent);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--color,var(--verde-mil-br));
  }
  .stat-card-arrow{
    font-size:20px;color:var(--texto-muy-suave);
    transition:all .3s ease;
  }
  .stat-card:hover .stat-card-arrow{
    color:var(--color,var(--verde-mil-br));
    transform:translate(3px,-3px);
  }
  .stat-card-label{
    font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
  }
  .stat-card-count{
    font-size:32px;font-weight:800;
    color:var(--color,var(--verde-mil-br));
    font-family:var(--mono);line-height:1;
  }

  .search-cta{
    background:linear-gradient(135deg,var(--bg-card),var(--bg-elevado));
    border:1px solid var(--borde);
    border-radius:var(--radio-lg);
    padding:20px 24px;
    display:flex;align-items:center;gap:16px;
    cursor:pointer;transition:all .3s ease;
  }
  .search-cta:hover{
    border-color:var(--ambar);
    box-shadow:0 0 30px var(--ambar-glow);
    transform:translateY(-2px);
  }
  .search-cta-icon{
    width:48px;height:48px;
    background:linear-gradient(135deg,var(--ambar),#a87d28);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#0d1210;flex-shrink:0;
  }
  .search-cta-text{flex:1;min-width:0;}
  .search-cta-text strong{
    display:block;font-size:15px;font-weight:700;
    color:var(--texto);margin-bottom:2px;
  }
  .search-cta-text span{
    font-size:11px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.5px;
  }
  .search-cta-kbd{
    background:var(--bg-panel);
    border:1px solid var(--borde-fuerte);
    border-radius:6px;
    padding:4px 10px;
    font-family:var(--mono);font-size:11px;
    color:var(--texto-suave);font-weight:700;
    flex-shrink:0;
  }

  /* ============================================================
     MODO BÚSQUEDA
     ============================================================ */
  .modo-busqueda{
    animation:fadeIn .35s ease both;
    display:flex;flex-direction:column;gap:16px;
  }

  .search-bar-wrap{
    display:flex;gap:10px;align-items:center;width:100%;
  }
  .btn-volver{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-elevado);color:var(--ambar);
    border:1px solid var(--borde);
    padding:12px 16px;
    font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    cursor:pointer;border-radius:var(--radio-md);
    font-weight:700;font-family:var(--sans);
    flex-shrink:0;transition:all .25s ease;white-space:nowrap;
  }
  .btn-volver:hover{
    background:var(--ambar);color:var(--bg);
    border-color:var(--ambar-br);
    transform:translateX(-3px);
    box-shadow:0 0 20px var(--ambar-glow);
  }

  .search-box{
    display:flex;align-items:center;
    background:var(--bg-card);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    padding:4px 14px;
    flex:1;min-width:0;
    transition:all .3s ease;
  }
  .search-box:focus-within{
    border-color:var(--verde-mil);
    box-shadow:0 0 0 3px rgba(122,179,86,.12),0 0 24px rgba(122,179,86,.15);
  }
  .search-icon{color:var(--verde-mil-br);font-size:16px;margin-right:10px;flex-shrink:0;}
  .search-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    padding:12px 0;font-size:14px;color:var(--texto);
    font-family:var(--sans);font-weight:500;letter-spacing:.3px;
  }
  .search-input::placeholder{color:var(--texto-muy-suave);}
  .btn-clear{
    background:transparent;border:none;color:var(--texto-muy-suave);
    font-size:14px;cursor:pointer;
    width:28px;height:28px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;padding:0;font-weight:800;
  }
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{
    background:var(--rojo);color:#fff;
    transform:rotate(90deg) scale(1.1);
    box-shadow:0 0 15px var(--rojo-glow);
  }

  /* ============================================================
     LISTAS — TARJETAS ESTILO CARPETA DE OFICINA
     ============================================================ */
  .list-title{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;margin-bottom:14px;
    border-bottom:1px solid var(--borde);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
  }
  .list-title .list-count{
    background:var(--bg-card);
    border:1px solid var(--borde-fuerte);
    color:var(--ambar);
    padding:3px 12px;border-radius:12px;
    font-family:var(--mono);font-weight:800;
  }

  /* Tarjeta de oficina — nuevo diseño estilo carpeta */
  .oficina-folder{
    position:relative;
    background:var(--bg-card);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    padding:0;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .3s ease;
    display:flex;align-items:stretch;
    overflow:hidden;
    min-height:76px;
  }
  .oficina-folder:hover{
    border-color:var(--verde-mil);
    background:var(--bg-elevado);
    transform:translateX(6px);
    box-shadow:var(--sombra-card),0 0 30px rgba(122,179,86,.12);
  }

  /* Pestaña lateral tipo carpeta */
  .oficina-folder-tab{
    width:8px;
    background:linear-gradient(180deg,var(--verde-mil),#2d4d1e);
    flex-shrink:0;
    transition:width .3s ease;
  }
  .oficina-folder:hover .oficina-folder-tab{width:12px;}

  .oficina-folder[data-color="azul"] .oficina-folder-tab{
    background:linear-gradient(180deg,var(--cian),#2a6b73);
  }
  .oficina-folder[data-color="marron"] .oficina-folder-tab{
    background:linear-gradient(180deg,var(--cobre),#6d4420);
  }
  .oficina-folder[data-color="vino"] .oficina-folder-tab{
    background:linear-gradient(180deg,var(--vino),#6d2f42);
  }
  .oficina-folder[data-color="ambar"] .oficina-folder-tab{
    background:linear-gradient(180deg,var(--ambar),#8a6318);
  }

  .oficina-folder-content{
    flex:1;min-width:0;
    padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }

  .oficina-folder-info{flex:1;min-width:0;}
  .oficina-folder-name{
    font-size:14px;font-weight:700;color:var(--texto);
    letter-spacing:.3px;margin-bottom:6px;
    transition:color .25s ease;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .oficina-folder:hover .oficina-folder-name{color:var(--verde-mil-br);}
  body.light .oficina-folder:hover .oficina-folder-name{color:var(--verde-mil);}

  .oficina-folder-meta{
    display:flex;flex-wrap:wrap;gap:10px;
    font-size:10px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.5px;
  }
  .oficina-folder-meta span{
    display:inline-flex;align-items:center;gap:4px;
  }
  .oficina-folder-meta .dot-mini{
    width:4px;height:4px;border-radius:50%;
    background:var(--texto-muy-suave);opacity:.5;
  }

  .oficina-folder-count{
    background:linear-gradient(135deg,rgba(122,179,86,.15),rgba(122,179,86,.05));
    border:1px solid rgba(122,179,86,.35);
    color:var(--verde-mil-br);
    padding:8px 14px;border-radius:10px;
    font-size:16px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;min-width:56px;text-align:center;
    transition:all .25s ease;
  }
  .oficina-folder:hover .oficina-folder-count{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(122,179,86,.25);
  }
  .oficina-folder[data-color="azul"] .oficina-folder-count{
    background:linear-gradient(135deg,rgba(79,184,196,.15),rgba(79,184,196,.05));
    border-color:rgba(79,184,196,.35);
    color:var(--cian-br);
  }
  .oficina-folder[data-color="marron"] .oficina-folder-count{
    background:linear-gradient(135deg,rgba(184,115,51,.15),rgba(184,115,51,.05));
    border-color:rgba(184,115,51,.35);
    color:var(--cobre-br);
  }
  .oficina-folder[data-color="vino"] .oficina-folder-count{
    background:linear-gradient(135deg,rgba(194,90,120,.15),rgba(194,90,120,.05));
    border-color:rgba(194,90,120,.35);
    color:var(--vino);
  }

  .oficina-folder-arrow{
    font-size:22px;color:var(--texto-muy-suave);
    transition:all .3s ease;flex-shrink:0;
  }
  .oficina-folder:hover .oficina-folder-arrow{
    color:var(--verde-mil-br);
    transform:translateX(4px);
  }

  /* Tarjeta de bien */
  .bien-card{
    background:var(--bg-card);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    padding:14px 16px;
    margin-bottom:8px;
    cursor:pointer;
    transition:all .3s ease;
    display:flex;gap:12px;align-items:flex-start;
  }
  .bien-card:hover{
    transform:translateX(6px);
    border-color:var(--cian);
    background:var(--bg-elevado);
    box-shadow:var(--sombra-card),0 0 24px rgba(79,184,196,.12);
  }
  .bien-card-thumb{
    width:48px;height:48px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--texto-muy-suave);
    flex-shrink:0;overflow:hidden;
  }
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{
    font-size:10px;font-family:var(--mono);
    color:var(--ambar);font-weight:700;
    letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;
  }
  .bien-card-desc{
    font-size:12px;font-weight:600;color:var(--texto);
    line-height:1.3;margin-bottom:5px;
  }
  .bien-card-meta{
    display:flex;flex-wrap:wrap;gap:8px;
    font-size:9px;font-family:var(--mono);
    color:var(--texto-suave);
  }
  .bien-card-tipo{
    padding:2px 8px;border-radius:8px;
    font-size:8px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;
    background:var(--bg-elevado);border:1px solid var(--borde);
  }
  .bien-card-tipo.fijos{color:var(--verde-mil-br);border-color:rgba(122,179,86,.4);}
  .bien-card-tipo.fungibles{color:var(--cian-br);border-color:rgba(79,184,196,.4);}
  .bien-card-tipo.internos{color:var(--cobre-br);border-color:rgba(184,115,51,.4);}
  .bien-card-tipo.prestados{color:var(--vino);border-color:rgba(194,90,120,.4);}

  /* Tarjeta responsable */
  .resp-card{
    position:relative;
    background:var(--bg-card);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    padding:16px 20px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .3s ease;
    overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .resp-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--verde-mil),var(--ambar));
    transform:scaleY(0);transform-origin:top;
    transition:transform .35s ease;
  }
  .resp-card:hover{
    transform:translateX(6px);
    border-color:var(--verde-mil);
    background:var(--bg-elevado);
    box-shadow:var(--sombra-card),0 0 26px rgba(122,179,86,.13);
  }
  .resp-card:hover::before{transform:scaleY(1);}
  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{
    font-size:14px;font-weight:700;color:var(--texto);
    letter-spacing:.3px;margin-bottom:6px;
    transition:color .25s ease;
  }
  .resp-card:hover .resp-card-name{color:var(--verde-mil-br);}
  body.light .resp-card:hover .resp-card-name{color:var(--verde-mil);}
  .resp-card-meta{
    display:flex;flex-wrap:wrap;gap:10px;
    font-size:10px;color:var(--texto-suave);
    font-family:var(--mono);
  }
  .resp-card-arrow{
    font-size:24px;color:var(--texto-muy-suave);
    transition:all .3s ease;flex-shrink:0;
  }
  .resp-card:hover .resp-card-arrow{
    color:var(--verde-mil-br);
    transform:translateX(6px);
  }

  /* ============================================================
     OFICINA ENCABEZADO
     ============================================================ */
  .oficina-encabezado{
    background:linear-gradient(135deg,rgba(122,179,86,.1),rgba(224,168,56,.05));
    border:1px solid var(--borde);
    border-left:4px solid var(--verde-mil);
    border-radius:var(--radio-md);
    padding:16px 20px;
    margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .oficina-encabezado-nombre{
    font-size:15px;font-weight:800;color:var(--texto);
    margin-bottom:4px;
  }
  .oficina-encabezado-sub{
    font-size:10px;font-family:var(--mono);
    color:var(--verde-mil-br);letter-spacing:1px;
    text-transform:uppercase;
  }
  .oficina-encabezado-count{
    background:rgba(122,179,86,.15);
    border:1px solid var(--verde-mil);
    color:var(--verde-mil-br);
    padding:8px 16px;border-radius:12px;
    font-size:16px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;
  }

  /* ============================================================
     TABLAS
     ============================================================ */
  .tabla-section{
    margin-bottom:18px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    overflow:hidden;
  }
  .tabla-header{
    padding:12px 16px;
    background:linear-gradient(180deg,rgba(122,179,86,.06),transparent);
    border-bottom:1px solid var(--borde);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .tabla-header-titulo{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--texto);font-weight:800;
  }
  .tabla-header-titulo .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--color,var(--verde-mil));
    box-shadow:0 0 8px var(--color,var(--verde-mil));
  }
  .tabla-header[data-color="verde"]{--color:var(--verde-mil-br);}
  .tabla-header[data-color="azul"]{--color:var(--cian-br);}
  .tabla-header[data-color="marron"]{--color:var(--cobre-br);}
  .tabla-header[data-color="vino"]{--color:var(--vino);}
  .tabla-header-count{
    font-family:var(--mono);font-size:12px;
    color:var(--ambar);font-weight:800;
    background:rgba(224,168,56,.1);
    padding:3px 12px;border-radius:10px;
    border:1px solid rgba(224,168,56,.3);
  }
  .tabla-scroll{overflow-x:auto;}
  table{
    width:100%;border-collapse:collapse;
    font-size:11px;font-family:var(--sans);
    min-width:400px;
  }
  thead th{
    background:rgba(0,0,0,.2);
    color:var(--texto-suave);
    text-align:left;padding:10px 12px;
    font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;font-weight:800;
    border-bottom:1px solid var(--borde);
  }
  body.light thead th{background:rgba(30,45,35,.04);}
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid rgba(122,179,86,.06);
    color:var(--texto);vertical-align:top;
    word-break:break-word;font-size:11px;
  }
  body.light tbody td{border-bottom-color:rgba(30,45,35,.05);}
  tbody tr{cursor:pointer;transition:background .2s ease;}
  tbody tr:nth-child(even){background:rgba(0,0,0,.12);}
  body.light tbody tr:nth-child(even){background:rgba(30,45,35,.02);}
  tbody tr:hover{background:rgba(122,179,86,.08);}

  .estado-badge{
    display:inline-block;padding:3px 10px;
    border-radius:10px;font-size:9px;
    font-weight:800;letter-spacing:1px;
    text-transform:uppercase;border:1px solid;
  }
  .estado-regular{color:var(--amarillo);border-color:rgba(224,195,74,.4);background:rgba(224,195,74,.08);}
  .estado-malo{color:var(--rojo);border-color:rgba(217,74,74,.4);background:rgba(217,74,74,.08);}
  .estado-bueno{color:var(--verde-ok);border-color:rgba(77,191,110,.4);background:rgba(77,191,110,.08);}
  .estado-pendiente{color:var(--rojo);border-color:rgba(217,74,74,.5);background:rgba(217,74,74,.12);animation:blink 1.5s ease-in-out infinite;}

  /* ============================================================
     MODAL
     ============================================================ */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(5,8,6,.85);
    backdrop-filter:blur(8px);
    z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  body.light .modal-overlay{background:rgba(30,37,33,.4);}
  .modal-overlay.visible{display:flex;}
  .modal{
    background:var(--bg-panel);
    border:1px solid var(--borde-fuerte);
    border-radius:var(--radio-lg);
    max-width:720px;width:100%;
    max-height:90vh;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
    animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-form{max-width:680px;}
  .modal-vista{max-width:900px;}
  .modal-header{
    padding:18px 22px;
    border-bottom:1px solid var(--borde);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:linear-gradient(180deg,rgba(122,179,86,.05),transparent);
  }
  .modal-header h2{
    font-size:13px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--texto);
    font-weight:700;flex:1;min-width:0;word-break:break-word;
  }
  .modal-close{
    width:32px;height:32px;
    background:transparent;border:1px solid var(--borde);
    color:var(--texto-suave);border-radius:8px;
    cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;
  }
  .modal-close:hover{
    background:var(--rojo);border-color:var(--rojo);
    color:white;transform:rotate(90deg);
  }
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-elevado);color:var(--ambar);
    border:1px solid var(--borde);
    padding:9px 16px;font-size:11px;
    letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;border-radius:8px;
    font-weight:700;transition:all .25s ease;
    margin-bottom:16px;font-family:var(--sans);
  }
  .btn-nav:hover{
    background:var(--ambar);color:var(--bg);
    border-color:var(--ambar-br);
    transform:translateX(-3px);
    box-shadow:0 0 20px var(--ambar-glow);
  }

  .modal-titulo-seccion{
    text-align:center;padding:8px 0 16px;
    font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--texto-suave);
    font-weight:700;font-family:var(--mono);
    border-bottom:1px solid var(--borde);margin-bottom:16px;
  }

  /* Tarjeta de oficina en modal */
  .oficina-card{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-left:4px solid var(--verde-mil);
    padding:14px 16px;margin-bottom:10px;
    border-radius:var(--radio-md);cursor:pointer;
    transition:all .3s ease;
  }
  .oficina-card:hover{
    border-color:var(--verde-mil);
    border-left-color:var(--ambar);
    background:var(--bg-hover);
    box-shadow:var(--sombra-card),0 0 22px rgba(122,179,86,.13);
    transform:translateX(5px);
  }
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{
    font-size:13px;font-weight:700;color:var(--texto);
    letter-spacing:.3px;margin-bottom:4px;
  }
  .oficina-card-id{
    font-size:10px;font-family:var(--mono);
    color:var(--verde-mil-br);letter-spacing:1px;
  }
  .oficina-card-count{
    background:rgba(122,179,86,.1);
    border:1px solid var(--verde-mil);
    color:var(--verde-mil-br);
    padding:6px 14px;border-radius:12px;
    font-size:13px;font-weight:800;
    font-family:var(--mono);flex-shrink:0;
  }

  .btn-imprimir{
    background:linear-gradient(135deg,var(--verde-mil),#3d6028);
    color:#fff;border:none;
    padding:10px 18px;border-radius:8px;
    font-size:11px;font-weight:800;
    letter-spacing:1.2px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:all .2s ease;font-family:var(--sans);
    text-transform:uppercase;margin-bottom:16px;
  }
  .btn-imprimir:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(122,179,86,.5);
  }

  /* ============================================================
     FORMULARIO
     ============================================================ */
  .form-persona{
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    padding:12px 14px;margin-bottom:12px;
  }
  .form-persona-titulo{
    font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--verde-mil-br);
    font-weight:800;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .form-persona-titulo .num{
    background:var(--verde-mil);color:var(--bg);
    width:18px;height:18px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 2fr 1.2fr 1.2fr;
    gap:10px;margin-bottom:10px;
  }
  .form-grid .form-group{margin-bottom:0;}
  .form-group label{
    display:block;font-size:10px;
    letter-spacing:1.2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:800;margin-bottom:5px;
  }
  .form-group input{
    width:100%;padding:10px 12px;
    background:var(--bg-panel);
    border:1px solid var(--borde);
    border-radius:8px;color:var(--texto);
    font-family:var(--sans);font-size:13px;
    outline:none;transition:border-color .2s ease;
  }
  .form-group input:focus{
    border-color:var(--verde-mil);
    box-shadow:0 0 0 2px rgba(122,179,86,.15);
  }
  .form-group input::placeholder{color:var(--texto-muy-suave);}
  .form-persona .form-grid{grid-template-columns:1fr 1.5fr 1fr 1fr;}

  .form-actions{
    display:flex;gap:10px;justify-content:flex-end;
    margin-top:20px;padding-top:16px;
    border-top:1px solid var(--borde);
  }
  .btn-cancelar{
    background:transparent;color:var(--texto-suave);
    border:1px solid var(--borde);
    padding:10px 18px;border-radius:8px;
    font-size:11px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;font-family:var(--sans);
  }
  .btn-cancelar:hover{background:var(--bg-elevado);color:var(--texto);}
  .btn-confirmar{
    background:linear-gradient(135deg,var(--verde-mil),#3d6028);
    color:#fff;border:none;
    padding:10px 20px;border-radius:8px;
    font-size:11px;font-weight:800;
    letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;font-family:var(--sans);
  }
  .btn-confirmar:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px var(--verde-mil-glow);
  }

  /* ============================================================
     DETALLE DEL BIEN
     ============================================================ */
  .bien-detalle{
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-md);
    overflow:hidden;
  }
  .bien-detalle-header{
    padding:20px;
    background:linear-gradient(135deg,rgba(122,179,86,.1),rgba(224,168,56,.05));
    border-bottom:2px solid var(--verde-mil);
    display:flex;gap:16px;align-items:flex-start;
  }
  .bien-detalle-foto{
    width:80px;height:80px;
    background:var(--bg);
    border:2px solid var(--verde-mil);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:var(--verde-mil-br);
    flex-shrink:0;overflow:hidden;cursor:pointer;
    transition:all .3s ease;
  }
  .bien-detalle-foto:hover{transform:scale(1.05);box-shadow:0 0 20px var(--verde-mil-glow);}
  .bien-detalle-foto img{width:100%;height:100%;object-fit:cover;}
  .bien-detalle-codigo{
    font-size:11px;font-family:var(--mono);
    color:var(--ambar);letter-spacing:2px;
    font-weight:800;text-transform:uppercase;margin-bottom:6px;
  }
  .bien-detalle-nombre{
    font-size:15px;font-weight:700;color:var(--texto);
    line-height:1.3;margin-bottom:8px;
  }
  .bien-detalle-tipo-badge{
    display:inline-block;padding:3px 10px;
    border-radius:10px;font-size:9px;
    font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  }
  .bien-detalle-tipo-badge.fijos{color:var(--verde-mil-br);background:rgba(122,179,86,.1);border:1px solid rgba(122,179,86,.3);}
  .bien-detalle-tipo-badge.fungibles{color:var(--cian-br);background:rgba(79,184,196,.1);border:1px solid rgba(79,184,196,.3);}
  .bien-detalle-tipo-badge.internos{color:var(--cobre-br);background:rgba(184,115,51,.1);border:1px solid rgba(184,115,51,.3);}
  .bien-detalle-tipo-badge.prestados{color:var(--vino);background:rgba(194,90,120,.1);border:1px solid rgba(194,90,120,.3);}
  .bien-detalle-campo{
    display:flex;gap:16px;align-items:flex-start;
    padding:12px 20px;
    border-bottom:1px solid rgba(122,179,86,.06);
  }
  .bien-detalle-campo:last-child{border-bottom:none;}
  .bien-detalle-campo:nth-child(even){background:rgba(0,0,0,.15);}
  body.light .bien-detalle-campo:nth-child(even){background:rgba(30,45,35,.02);}
  .bien-detalle-label{
    flex:0 0 38%;font-size:10px;
    letter-spacing:1.2px;text-transform:uppercase;
    font-weight:800;color:var(--texto-suave);
    padding-top:2px;font-family:var(--mono);
  }
  .bien-detalle-valor{
    flex:1;font-size:12px;color:var(--texto);
    line-height:1.4;word-break:break-word;
  }
  .bien-detalle-valor.vacio{color:var(--texto-muy-suave);font-style:italic;}
  .bien-detalle-valor.pendiente{color:var(--rojo);font-weight:800;text-transform:uppercase;}

  /* ============================================================
     EMPTY / LOADING
     ============================================================ */
  .empty-state{
    text-align:center;padding:60px 20px;
    color:var(--texto-suave);animation:fadeIn .6s ease both;
  }
  .empty-state-icon{font-size:56px;margin-bottom:16px;opacity:.35;}
  .empty-state-title{
    font-size:13px;letter-spacing:2px;
    text-transform:uppercase;color:var(--texto);
    margin-bottom:8px;font-weight:700;
  }
  .empty-state-sub{font-size:12px;color:var(--texto-muy-suave);letter-spacing:.5px;}
  .loading,.error{
    text-align:center;padding:32px;
    font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;font-weight:800;
  }
  .loading{color:var(--verde-mil-br);}
  .error{color:var(--rojo);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ============================================================
     FOOTER
     ============================================================ */
  .footer{
    grid-area:footer;
    text-align:center;padding:20px;
    border-top:1px solid var(--borde);
    font-size:9px;letter-spacing:2px;
    text-transform:uppercase;color:var(--texto-muy-suave);
    font-family:var(--mono);font-weight:600;
  }

  /* ============================================================
     LIGHTBOX / TOAST

  .lightbox{

  .toast{
    position:fixed;top:80px;left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--bg-panel);color:var(--texto);
    border:1px solid var(--ambar);
    border-radius:var(--radio-md);
    padding:14px 22px;z-index:300;
    font-size:12px;letter-spacing:.5px;font-weight:600;
    box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px var(--ambar-glow);
    opacity:0;pointer-events:none;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:center;gap:10px;
    max-width:90vw;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{border-color:var(--verde-ok);}
  .toast.error{border-color:var(--rojo);}

   Útil = 23.94cm. A 96 DPI: 23.94 / 2.54 * 96 ≈ 905 px.

function calcularAlturaUtilHoja(){
  const cmAUtil = 23.94;
  const pxPorCm = 96 / 2.54;

/* Sanitización de URL de foto: whitelist de dominios */
const DOMINIOS_FOTO_PERMITIDOS = [
  "drive.google.com",
  "docs.google.com",
  "lh3.googleusercontent.com",
  "lh4.googleusercontent.com",
  "lh5.googleusercontent.com",
  "lh6.googleusercontent.com",
  "i.imgur.com",
  "imgur.com"
];
function sanitizarUrlFoto(url){
  if(!url || typeof url !== "string") return "";
  const trimmed = url.trim();
  if(!trimmed) return "";

  // ID de Drive (string largo sin http)
  if(!trimmed.startsWith("http") && trimmed.length > 20){
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(trimmed)}`;
  }

  try{
    const u = new URL(trimmed);
    if(u.protocol !== "https:" && u.protocol !== "http:") return "";
    const host = u.hostname.toLowerCase();
    const permitido = DOMINIOS_FOTO_PERMITIDOS.some(d => host === d || host.endsWith("." + d));
    if(!permitido) return "";
    return u.toString();
  }catch(e){ return ""; }
}

/* Detección de tipo de búsqueda — patrones exactos */
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";

  // ID de asignación típico: número + letras opcionales (ej: 12, 12A, 105B)
  if(/^\d{1,4}[A-Z]?$/.test(t)) return "id";

  // Código VSIAF típico: alfanumérico con al menos 1 letra y 1 dígito, 6+ chars
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";

  return "nombre";
}

  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";

  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

/* ============================================================

   ============================================================ */
function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();

  const resultado = tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  });
  return resultado.join(" ");
}

}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}

/* ============================================================

   ============================================================ */
function construirIndices(){
  IDX.bienesPorAsig.clear();
  IDX.respPorId.clear();
  IDX.asigsPorCedula.clear();

  const initGrupo = () => ({ fijos:[], fungibles:[], internos:[], prestados:[] });
  const addBien = (tipo, item) => {
    const id = obtenerIdAsig(item);
    if(!id) return;
    if(!IDX.bienesPorAsig.has(id)) IDX.bienesPorAsig.set(id, initGrupo());
    IDX.bienesPorAsig.get(id)[tipo].push(item);
  };

  DATA.fijos.forEach(b => addBien("fijos", b));
  DATA.fungibles.forEach(b => addBien("fungibles", b));
  DATA.internos.forEach(b => addBien("internos", b));
  DATA.prestados.forEach(b => addBien("prestados", b));

  DATA.resp.forEach(r => {
    const idResp = getVal(r, "ID");
    if(idResp && !IDX.respPorId.has(idResp)) IDX.respPorId.set(idResp, r);
    const ced = getCedulaResp(r);
    if(ced){
      if(!IDX.asigsPorCedula.has(ced)) IDX.asigsPorCedula.set(ced, []);
      IDX.asigsPorCedula.get(ced).push(r);
    }
  });
}

    }
  }

  cont.innerHTML = `<div class="loading">☁ Cargando datos desde Google Drive...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
  construirIndices();
  actualizarContadores();
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

window.addEventListener("popstate", (e) => {
  if(document.getElementById("modalVistaPrevia").classList.contains("visible")){

    return;
  }
  if(document.getElementById("modalEntrante").classList.contains("visible")){

    return;
  }
  if(document.getElementById("modal").classList.contains("visible")){
    cerrarModal();
    pushEstado(estado.pantalla);
    return;
  }
  if(estado.pantalla === "busqueda"){
    estado.pantalla = "home";
    mostrarHome();

    return;
  }
  if(estado.pantalla === "vistaGeneral"){

      estado.oficinaFiltroActual = null;
      renderVistaGeneral(estado.vistaGeneralActual);

      return;
    }
    estado.pantalla = "home";
    estado.vistaGeneralActual = null;
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "home"){
    const salir = confirm("¿Está seguro que desea salir del sistema?");
    if(salir){ history.back(); }
    else { pushEstado("home"); }
  }
});

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div><div class="empty-state-sub">Pruebe con otro término</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables encontrados</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" style="animation-delay:${i * 25}ms" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div><div class="empty-state-sub">No se encontraron bienes</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes encontrados</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b, i) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" style="animation-delay:${i * 20}ms" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function renderVistaGeneral(tipo, oficinaFiltro){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "ACTIVOS FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colores = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    setSidebarActive(tipo);
    setBreadcrumb(["Panel", titulo]);
    let html = `<div class="list-title"><span>◈ ${titulo} — Agrupado por oficina</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      const idEjemplo = obtenerIdAsig(regs[0]);
      html += `
        <div class="oficina-folder" data-color="${colores[tipo]}" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="oficina-folder-tab"></div>
          <div class="oficina-folder-content">
            <div class="oficina-folder-info">
              <div class="oficina-folder-name">${esc(ofi)}</div>
              <div class="oficina-folder-meta">
                <span>◈ ID ${esc(idEjemplo)}</span>
                <span class="dot-mini"></span>
                <span>${regs.length} registro(s)</span>
              </div>
            </div>
            <div class="oficina-folder-count">${regs.length}</div>
            <div class="oficina-folder-arrow">›</div>
          </div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  setBreadcrumb(["Panel", titulo, oficinaFiltro]);
  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

  estado.oficinaFiltroActual = oficina;
  pushEstado("vistaGeneral");

}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach(item => {
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function abrirModalResponsable(idx){
  const lista = window.__listaResponsablesActual || [];
  const r = lista[idx];
  if(!r) return;
  estado.responsableActual = r;
  if(r.asignaciones.length === 1){
    estado.modalVista = "tablas";
    estado.oficinaActual = r.asignaciones[0];
  } else {
    estado.modalVista = "oficinas";
    estado.oficinaActual = null;
  }

function tablaModal(titulo, lista, color){
  if(!lista.length){
    return `<div class="tabla-section"><div class="tabla-header" data-color="${color}"><div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div><div class="tabla-header-count">0</div></div><div class="empty-state" style="padding:26px 20px;"><div class="empty-state-sub">NO CUENTA ${titulo}</div></div></div>`;
  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach(item => {
    const cod = getVal(item, "CODIGO");
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}
