<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V5.1 · Orbital Sobrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14;
    --bg-panel:rgba(15,22,38,.78);
    --bg-elevado:rgba(22,31,52,.9);
    --bg-hover:rgba(32,44,72,.95);

    --texto:#e6eefc;
    --texto-suave:#7d8cab;
    --texto-muy-suave:#4a5876;

    --borde:rgba(90,200,255,.18);
    --borde-fuerte:rgba(90,200,255,.42);

    --sombra-panel:0 10px 30px rgba(0,0,0,.5);

    --cian:#38bdf8;
    --cian-brillante:#7dd3fc;
    --cian-glow:rgba(56,189,248,.4);

    --violeta:#a78bfa;
    --violeta-glow:rgba(167,139,250,.4);

    --magenta:#e879f9;
    --magenta-glow:rgba(232,121,249,.4);

    --verde:#34d399;
    --verde-glow:rgba(52,211,153,.4);

    --rojo:#fb7185;
    --rojo-glow:rgba(251,113,133,.4);

    --ambar:#fbbf24;
    --naranja:#fb923c;

    --mono:"JetBrains Mono","Consolas",monospace;
    --sans:"Inter","Segoe UI",Roboto,sans-serif;
    --display:"Space Grotesk","Inter",sans-serif;

    --radio:12px;
    --radio-sm:9px;
  }

  body.light{
    --bg:#eef2f9;
    --bg-panel:rgba(255,255,255,.92);
    --bg-elevado:rgba(248,250,255,.98);
    --bg-hover:rgba(235,242,255,1);
    --texto:#0b1a33;
    --texto-suave:#4b5d80;
    --texto-muy-suave:#8899b8;
    --borde:rgba(30,80,180,.2);
    --borde-fuerte:rgba(30,80,180,.45);
    --sombra-panel:0 6px 20px rgba(20,40,90,.1);
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--texto);
    font-size:14px;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease,color .3s ease;
    position:relative;
  }

  /* FONDO ESTÁTICO SOBRIO */
  .bg-layer{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(56,189,248,.08) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(167,139,250,.08) 0%, transparent 60%);
  }
  body.light .bg-layer{
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(56,189,248,.1) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(167,139,250,.1) 0%, transparent 60%);
  }
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(90,200,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,200,255,.025) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 90%);
  }
  body.light .bg-grid{
    background-image:
      linear-gradient(rgba(30,80,180,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,80,180,.04) 1px, transparent 1px);
  }

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{
    background:rgba(90,200,255,.25);
    border-radius:5px;border:2px solid transparent;background-clip:padding-box;
  }
  ::-webkit-scrollbar-thumb:hover{background:rgba(90,200,255,.45);background-clip:padding-box;}

  .app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

  /* HEADER */
  .header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,11,20,.82);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--borde);
    padding:14px 22px;
    transition:background .3s ease;
  }
  body.light .header{background:rgba(255,255,255,.85);}
  .header-content{
    max-width:1280px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
  }
  .header-logo{display:flex;align-items:center;gap:12px;}
  .header-mark{
    width:38px;height:38px;
    border:1.5px solid var(--cian);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:16px;
    color:var(--cian);
    background:rgba(56,189,248,.06);
    box-shadow:0 0 0 4px rgba(56,189,248,.05);
    flex-shrink:0;
  }
  .header-text h1{
    font-family:var(--display);
    font-size:15px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--texto);
  }
  .header-text .subtitle{
    font-family:var(--mono);font-size:9px;letter-spacing:2px;
    color:var(--texto-suave);text-transform:uppercase;margin-top:1px;
  }
  .header-actions{display:flex;align-items:center;gap:10px;}

  .btn-icon{
    width:38px;height:38px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s ease;flex-shrink:0;
    color:var(--texto-suave);
  }
  .btn-icon:hover{
    color:var(--cian);
    border-color:var(--borde-fuerte);
    background:var(--bg-hover);
  }
  .btn-icon.magenta:hover{color:var(--magenta);}
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .header-status{
    display:flex;align-items:center;gap:7px;
    padding:6px 13px;
    background:rgba(56,189,248,.06);
    border:1px solid rgba(56,189,248,.28);
    border-radius:16px;
    font-size:10px;font-family:var(--mono);
    color:var(--cian-brillante);letter-spacing:1.2px;
    text-transform:uppercase;font-weight:700;
  }
  .status-dot{
    width:6px;height:6px;
    background:var(--verde);border-radius:50%;
    box-shadow:0 0 6px var(--verde);
  }

  .main{flex:1;padding:22px;max-width:1280px;margin:0 auto;width:100%;}

  /* ANIMACIÓN ÚNICA */
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* HOME */
  .home{display:flex;flex-direction:column;gap:16px;padding-top:12px;}
  .home-hero{
    text-align:center;padding:8px 0 4px;
  }
  .home-hero-title{
    font-family:var(--display);
    font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    color:var(--texto);
    margin-bottom:4px;
  }
  .home-hero-sub{
    font-family:var(--mono);font-size:10px;letter-spacing:2.5px;
    color:var(--texto-suave);text-transform:uppercase;
  }

  .home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

  .home-btn{
    background:var(--bg-panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:22px 14px;
    cursor:pointer;
    transition:border-color .18s ease,background .18s ease,transform .18s ease;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--texto);
    position:relative;
  }
  .home-btn:hover{
    transform:translateY(-2px);
    border-color:var(--color,var(--cian));
    background:var(--bg-elevado);
  }
  .home-btn[data-color="verde"]{--color:var(--verde);}
  .home-btn[data-color="azul"]{--color:var(--cian);}
  .home-btn[data-color="marron"]{--color:var(--naranja);}
  .home-btn[data-color="vino"]{--color:var(--magenta);}
  .home-btn[data-color="buscar"]{--color:var(--violeta);}

  .home-btn-icon{
    font-size:26px;color:var(--color,var(--cian));
    opacity:.9;
  }
  .home-btn-label{
    font-family:var(--display);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
  }
  .home-btn-count{
    font-family:var(--mono);
    font-size:24px;font-weight:700;
    color:var(--color,var(--cian));
  }
  .home-btn.buscar{
    grid-column:span 4;
    padding:18px;
    flex-direction:row;justify-content:center;gap:14px;
  }
  .home-btn.buscar .home-btn-icon{font-size:22px;}
  .home-btn.buscar .home-btn-label{
    font-size:12px;letter-spacing:3px;color:var(--violeta);
  }

  /* BÚSQUEDA */
  .modo-busqueda{display:flex;flex-direction:column;gap:14px;min-height:60vh;}
  .modo-busqueda-top{display:flex;gap:10px;align-items:center;width:100%;min-width:0;}
  .btn-volver{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-elevado);
    color:var(--cian);
    border:1px solid var(--borde);
    padding:10px 14px;
    font-family:var(--display);
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;border-radius:var(--radio-sm);font-weight:700;
    flex-shrink:0;transition:all .18s ease;white-space:nowrap;
  }
  .btn-volver:hover{
    border-color:var(--borde-fuerte);
    background:var(--bg-hover);
  }
  .search-wrapper{flex:1;min-width:0;position:relative;}
  .search-box{
    display:flex;align-items:center;
    background:var(--bg-panel);
    backdrop-filter:blur(10px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:3px 12px;
    width:100%;min-width:0;
    transition:border-color .18s ease;
  }
  .search-box:focus-within{border-color:var(--borde-fuerte);}
  .search-icon{color:var(--texto-suave);font-size:16px;margin-right:8px;flex-shrink:0;}
  .search-input{
    flex:1;min-width:0;
    background:transparent;border:none;outline:none;
    padding:12px 0;font-size:14px;
    color:var(--texto);font-family:var(--sans);font-weight:500;
    width:100%;
  }
  .search-input::placeholder{color:var(--texto-muy-suave);}
  .btn-clear{
    background:transparent;border:none;color:var(--texto-muy-suave);
    font-size:15px;cursor:pointer;width:28px;height:28px;
    border-radius:50%;display:none;align-items:center;justify-content:center;
    transition:all .18s ease;flex-shrink:0;padding:0;margin-left:6px;font-weight:700;
  }
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{background:var(--rojo);color:#fff;}

  /* LISTAS */
  .list-title{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;margin-bottom:12px;
    border-bottom:1px solid var(--borde);
    font-family:var(--display);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
  }
  .list-title .list-count{
    background:var(--bg-panel);
    border:1px solid var(--borde-fuerte);
    color:var(--cian);
    padding:3px 11px;border-radius:10px;
    font-family:var(--mono);font-weight:700;font-size:11px;
  }

  .resp-card{
    background:var(--bg-panel);
    backdrop-filter:blur(10px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:16px 20px;margin-bottom:10px;
    cursor:pointer;transition:all .18s ease;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    position:relative;overflow:hidden;
  }
  .resp-card::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
    background:linear-gradient(180deg,var(--cian),var(--violeta));
    border-radius:2px;opacity:.7;
  }
  .resp-card:hover{
    border-color:var(--borde-fuerte);
    background:var(--bg-elevado);
    transform:translateX(4px);
  }
  .resp-card-info{flex:1;min-width:0;padding-left:10px;}
  .resp-card-name{
    font-size:14px;font-weight:600;color:var(--texto);
    margin-bottom:5px;
  }
  .resp-card-meta{
    display:flex;flex-wrap:wrap;gap:12px;
    font-size:11px;color:var(--texto-suave);font-family:var(--mono);
  }
  .resp-card-arrow{
    font-size:22px;color:var(--texto-muy-suave);
    transition:all .18s ease;flex-shrink:0;
  }
  .resp-card:hover .resp-card-arrow{color:var(--cian);}

  .bien-card{
    background:var(--bg-panel);
    backdrop-filter:blur(10px);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:all .18s ease;
    display:flex;gap:12px;align-items:flex-start;
  }
  .bien-card:hover{
    border-color:var(--borde-fuerte);
    background:var(--bg-elevado);
    transform:translateX(4px);
  }
  .bien-card-thumb{
    width:52px;height:52px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--texto-muy-suave);
    flex-shrink:0;overflow:hidden;
  }
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{
    font-family:var(--mono);font-size:11px;
    color:var(--cian);font-weight:700;letter-spacing:1px;
    margin-bottom:3px;text-transform:uppercase;
  }
  .bien-card-desc{
    font-size:13px;font-weight:500;color:var(--texto);
    line-height:1.35;margin-bottom:6px;
  }
  .bien-card-meta{
    display:flex;flex-wrap:wrap;gap:8px;
    font-size:10px;font-family:var(--mono);color:var(--texto-suave);
  }
  .bien-card-tipo{
    padding:2px 8px;border-radius:9px;
    font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    background:var(--bg-elevado);border:1px solid var(--borde);
  }
  .bien-card-tipo.fijos{color:var(--verde);border-color:rgba(52,211,153,.4);}
  .bien-card-tipo.fungibles{color:var(--cian);border-color:rgba(56,189,248,.4);}
  .bien-card-tipo.internos{color:var(--naranja);border-color:rgba(251,146,60,.4);}
  .bien-card-tipo.prestados{color:var(--magenta);border-color:rgba(232,121,249,.4);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(2,5,12,.78);
    backdrop-filter:blur(6px);
    z-index:100;display:none;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  body.light .modal-overlay{background:rgba(20,40,80,.3);}
  .modal-overlay.visible{display:flex;}
  .modal{
    background:var(--bg-panel);
    backdrop-filter:blur(16px);
    border:1px solid var(--borde-fuerte);
    border-radius:16px;
    max-width:740px;width:100%;max-height:90vh;
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:var(--sombra-panel);
    animation:fadeIn .25s ease;
  }
  .modal-form{max-width:700px;}
  .modal-vista{max-width:940px;}
  .modal-header{
    padding:18px 22px;
    border-bottom:1px solid var(--borde);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .modal-header h2{
    font-family:var(--display);
    font-size:13px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--texto);font-weight:700;flex:1;min-width:0;word-break:break-word;
  }
  .modal-close{
    width:32px;height:32px;
    background:transparent;
    border:1px solid var(--borde);
    color:var(--texto-suave);border-radius:var(--radio-sm);
    cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s ease;flex-shrink:0;
  }
  .modal-close:hover{
    background:var(--rojo);border-color:var(--rojo);color:white;
  }
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-elevado);
    color:var(--texto-suave);
    border:1px solid var(--borde);
    padding:8px 14px;
    font-family:var(--display);
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;border-radius:var(--radio-sm);
    font-weight:700;transition:all .18s ease;
    margin-bottom:14px;
  }
  .btn-nav:hover{
    color:var(--cian);
    border-color:var(--borde-fuerte);
    background:var(--bg-hover);
  }
  .modal-titulo-seccion{
    text-align:center;padding:6px 0 14px;
    font-family:var(--mono);
    font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
    border-bottom:1px solid var(--borde);margin-bottom:14px;
  }
  .oficina-card{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-left:3px solid var(--cian);
    padding:13px 16px;margin-bottom:8px;
    border-radius:var(--radio-sm);cursor:pointer;
    transition:all .18s ease;
  }
  .oficina-card:hover{
    border-left-color:var(--violeta);
    background:var(--bg-hover);
    transform:translateX(3px);
  }
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{
    font-size:13px;font-weight:600;color:var(--texto);
    margin-bottom:3px;
  }
  .oficina-card-id{
    font-family:var(--mono);font-size:10px;
    color:var(--cian);letter-spacing:.8px;
  }
  .oficina-card-count{
    background:rgba(56,189,248,.1);
    border:1px solid rgba(56,189,248,.35);
    color:var(--cian-brillante);
    padding:5px 12px;border-radius:12px;
    font-size:12px;font-weight:700;font-family:var(--mono);
    flex-shrink:0;
  }
  .btn-imprimir{
    background:rgba(52,211,153,.12);
    color:var(--verde);
    border:1px solid rgba(52,211,153,.45);
    padding:10px 16px;border-radius:var(--radio-sm);
    font-family:var(--display);
    font-size:11px;font-weight:700;letter-spacing:1.2px;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:all .18s ease;text-transform:uppercase;
    margin-bottom:14px;
  }
  .btn-imprimir:hover{
    background:rgba(52,211,153,.2);
    border-color:var(--verde);
  }

  /* FORM */
  .form-persona{
    background:var(--bg-elevado);
    border:1px solid var(--borde);
    border-radius:var(--radio-sm);
    padding:12px 14px;margin-bottom:10px;
    position:relative;
  }
  .form-persona::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;
    background:linear-gradient(180deg,var(--cian),var(--violeta));
    border-radius:2px;opacity:.7;
  }
  .form-persona-titulo{
    font-family:var(--display);
    font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--cian-brillante);font-weight:700;margin-bottom:9px;
    display:flex;align-items:center;padding-left:8px;
  }
  .form-persona-titulo .num{
    background:rgba(56,189,248,.18);
    color:var(--cian-brillante);
    border:1px solid rgba(56,189,248,.4);
    width:18px;height:18px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    margin-right:8px;
  }
  .form-grid{display:grid;grid-template-columns:1fr 2fr 1.2fr 1.2fr;gap:9px;margin-bottom:9px;}
  .form-grid .form-group{margin-bottom:0;}
  .form-group label{
    display:block;font-family:var(--mono);
    font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;margin-bottom:4px;
  }
  .form-group input{
    width:100%;padding:9px 11px;
    background:var(--bg-panel);
    border:1px solid var(--borde);
    border-radius:7px;color:var(--texto);
    font-family:var(--sans);font-size:13px;
    outline:none;transition:border-color .15s ease;
  }
  .form-group input:focus{border-color:var(--borde-fuerte);}

  .empty-state{

  }
  .empty-state-icon{font-size:52px;margin-bottom:14px;opacity:.3;}

    font-family:var(--display);

  .loading,.error{

  .error{color:var(--rojo);}

  .footer{
    text-align:center;padding:22px 20px;
    border-top:1px solid var(--borde);
    font-family:var(--mono);
    font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-muy-suave);font-weight:600;margin-top:auto;

  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.95);

  }

  .toast{
    position:fixed;top:80px;left:50%;

  .toast.error{border-color:var(--rojo);}
  .toast.info{border-color:var(--cian);}

  /* ============================================================
     ACTA — MEDICIÓN Y VISTA PREVIA (mismas métricas)
     ============================================================ */
  .acta-medicion,
  .preview-acta-wrap{
    font-family:Arial, Helvetica, sans-serif;
    font-size:11pt;
    line-height:1.05;
    color:#000;
    background:#fff;
  }
  .acta-medicion{
    position:absolute;left:-99999px;top:0;
    visibility:hidden;pointer-events:none;
    width:21.59cm;padding:0;margin:0;
  }

  /* Reset de márgenes para evitar aire */
  .acta-medicion *,
  .preview-acta-wrap *{

    padding:0;
    box-sizing:border-box;
  }

  }

  .acta-titulo .titulo-linea2{display:block;}

  .acta-tabla{

    border:1px solid #000;
    table-layout:fixed;
  }
  .acta-tabla th{
    border:1px solid #000;padding:2pt 3pt;
    text-align:center;font-weight:bold;text-transform:uppercase;
    background:#fff;font-size:9pt;line-height:1.05;
  }
  .acta-tabla td{

  }

    display:flex;justify-content:space-between;gap:20pt;
    margin-bottom:22pt;
  }
  .acta-firma-bloque-lado{flex:1;text-align:center;}
  .acta-firma-bloque{text-align:center;margin-bottom:22pt;}
  .acta-firma-rol{
    font-weight:bold;text-transform:uppercase;

  }
  .acta-firma-nombre{

  }
  .acta-firma-cargo{
    font-weight:bold;text-transform:uppercase;
    font-size:12pt;margin-top:1pt;line-height:1.05;
  }
  .acta-vobo{
    font-weight:bold;margin-bottom:26pt;text-align:center;
    font-size:12pt;line-height:1.05;
  }
  .acta-continuacion{
    font-size:8pt;font-style:italic;font-weight:normal;
    text-align:center;text-transform:uppercase;
    margin:14pt 0 3pt 0;padding-top:6pt;
    border-top:1px solid #000;line-height:1.2;
  }
  .acta-continuacion-resumen{
    font-size:8pt;font-style:italic;font-weight:normal;
    text-align:center;text-transform:uppercase;
    margin:0 0 14pt 0;padding-bottom:6pt;
    border-bottom:1px solid #000;line-height:1.2;
  }

  /* VISTA PREVIA */
  .preview-acta-wrap{
    padding:30px 45px;
    max-height:65vh;overflow-y:auto;
    box-shadow:inset 0 0 0 1px #d0d0d0;
  }
  .preview-acta-wrap .page-break-indicator{
    display:block;height:18px;
    background:repeating-linear-gradient(90deg,#d0d0d0 0px,#d0d0d0 6px,transparent 6px,transparent 12px);

    text-align:center;
    font-size:8pt;color:#777;
    letter-spacing:1px;line-height:18px;
    position:relative;
  }

    content:"▼ PÁGINA SIGUIENTE ▼";
    background:#fff;padding:0 10px;font-weight:bold;font-size:7pt;
  }
  .preview-actions{
    padding:14px 20px;border-top:1px solid var(--borde);
    display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;
    background:var(--bg-panel);
  }
  .btn-preview{
    background:var(--bg-elevado);color:var(--texto);
    border:1px solid var(--borde);
    padding:10px 16px;border-radius:var(--radio-sm);
    font-family:var(--display);
    font-size:11px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;
    transition:all .18s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-preview:hover{background:var(--bg-hover);border-color:var(--borde-fuerte);}
  .btn-preview.primary{
    background:rgba(56,189,248,.15);
    color:var(--cian-brillante);
    border-color:rgba(56,189,248,.5);
  }
  .btn-preview.primary:hover{background:rgba(56,189,248,.25);}
  .btn-preview.green{
    background:rgba(52,211,153,.15);
    color:var(--verde);
    border-color:rgba(52,211,153,.5);
  }
  .btn-preview.green:hover{background:rgba(52,211,153,.25);}

  /* ACTA PRINT */
  .acta-print{display:none;}

  @media print{
    .bg-layer,.bg-grid,.app,.modal-overlay,.no-print,.toast,.lightbox,.acta-medicion{display:none !important;}
    body{background:#fff !important;color:#000 !important;}
    .acta-print{display:block !important;}

    @page{size: letter portrait; margin: 2cm 2cm 2cm 3cm;}

    .acta-print, .acta-print *{color:#000 !important;}

    /* Mismas métricas que medición y preview */
    .acta-print, .acta-print *{margin:0;padding:0;box-sizing:border-box;}

    .acta-print{
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11pt;
      line-height: 1.05;
    }

    .acta-membrete{font-size:10pt;font-weight:bold;line-height:1;margin:0 0 6pt 0;text-transform:uppercase;text-align:left;}

    .acta-membrete .linea3{padding-left:75pt;text-decoration:underline;}

    .acta-titulo{font-size:15pt;font-weight:bold;text-align:center;text-transform:uppercase;margin:0 0 6pt 0;line-height:1.1;}
    .acta-titulo .titulo-linea1{display:block;}
    .acta-titulo .titulo-linea2{display:block;}

    .acta-seccion{margin:0;padding:0;}
    .acta-seccion-titulo{font-size:11pt;font-weight:bold;text-transform:uppercase;margin:0 0 2pt 0;line-height:1.05;}
    .acta-seccion-titulo .subrayado{text-decoration:underline;}

    .acta-tabla{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:3pt;border:1px solid #000;table-layout:fixed;}
    .acta-tabla th{border:1px solid #000;padding:2pt 3pt;text-align:center;font-weight:bold;text-transform:uppercase;background:#fff;font-size:9pt;line-height:1.05;}
    .acta-tabla td{border:1px solid #000;padding:2pt 3pt;font-size:9pt;vertical-align:top;line-height:1.1;word-wrap:break-word;overflow-wrap:break-word;}
    .acta-tabla td.center{text-align:center;}
    .acta-tabla td.descripcion{text-align:justify;text-transform:uppercase;}
    .acta-tabla td.vacia{text-align:center;padding:6pt 3pt;font-style:italic;text-transform:uppercase;}

    /* Fragmentos: repetir thead en cada hoja */
    .acta-tabla-fragmento{page-break-inside:auto;break-inside:auto;}
    .acta-tabla-fragmento thead{display:table-header-group;}
    .acta-tabla-fragmento tbody tr{page-break-inside:avoid;break-inside:avoid;}

    .saltar-pagina{
      page-break-before:always;
      break-before:page;
      display:block;
      height:0;
    }

    .acta-bloque-firmas{break-inside:avoid;page-break-inside:avoid;}
    .acta-fecha-firmas{font-size:12pt;text-align:right;margin:0 0 14pt 0;line-height:1.1;}

    .acta-continuacion{font-size:8pt;font-style:italic;font-weight:normal;text-align:center;text-transform:uppercase;margin:14pt 0 3pt 0;padding-top:6pt;border-top:1px solid #000;line-height:1.2;}
    .acta-continuacion-resumen{font-size:8pt;font-style:italic;font-weight:normal;text-align:center;text-transform:uppercase;margin:0 0 14pt 0;padding-bottom:6pt;border-bottom:1px solid #000;line-height:1.2;}

    .acta-firmas{font-size:12pt;line-height:1.1;}
    .acta-firmas-fila{display:flex;justify-content:space-between;gap:20pt;margin-bottom:22pt;break-inside:avoid;page-break-inside:avoid;}
    .acta-firma-bloque-lado{flex:1;text-align:center;break-inside:avoid;page-break-inside:avoid;}
    .acta-firma-bloque{text-align:center;margin-bottom:22pt;break-inside:avoid;page-break-inside:avoid;}
    .acta-firma-rol{font-weight:bold;text-transform:uppercase;margin-bottom:26pt;font-size:12pt;text-align:center;line-height:1.05;}
    .acta-firma-nombre{font-weight:normal;text-transform:none;font-size:12pt;margin-top:3pt;line-height:1.2;}

    .acta-vobo{font-weight:bold;margin-bottom:26pt;text-align:center;font-size:12pt;line-height:1.05;}
  }

  @media (max-width:600px){
    .header-text h1{font-size:12px;letter-spacing:1.5px;}
    .header-text .subtitle{font-size:8px;letter-spacing:1.5px;}

    .preview-actions{flex-direction:column;}
    .btn-preview{width:100%;justify-content:center;}
    .form-grid, .form-persona .form-grid{grid-template-columns:1fr 1fr;}
    .form-grid .form-group.ancho-completo{grid-column:1 / -1;}
  }
</style>

function calcularAlturaUtilHoja(){
  const div = document.createElement("div");
  div.style.cssText = "position:absolute;visibility:hidden;height:10cm;width:1px;";

let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){

  const msgEl = document.getElementById("toastMsg");

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}

/* ============================================================
   SANITIZACIÓN DE URLs
   ============================================================ */
function sanitizarUrlFoto(url){
  if(!url || typeof url !== "string") return "";
  const u = url.trim();
  if(!u) return "";

  if(!u.includes("/") && !u.startsWith("http") && u.length > 20){
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(u)}`;
  }

  try{
    const parsed = new URL(u);
    if(parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
    const host = parsed.hostname.toLowerCase();
    const permitido = DOMINIOS_FOTO_PERMITIDOS.some(d => host === d || host.endsWith("." + d));
    if(!permitido) return "";
    return parsed.href;
  }catch(e){
    return "";
  }
}

function renderFotoMiniatura(url){
  const segura = sanitizarUrlFoto(url);
  if(!segura) return `<span style="font-size:20px;opacity:.4;">◈</span>`;
  return `<img src="${escAttr(segura)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:20px;opacity:.4;&quot;>◈</span>'">`;
}

/* ============================================================
   DETECCIÓN DE TIPO DE BÚSQUEDA
   ============================================================ */
function detectarTipoBusqueda(texto){
  const t = (texto || "").trim().toUpperCase();
  if(!t) return "vacio";

  if(/^(COD|VSIAF)[-_\s]?/.test(t)) return "codigo";

  if(/^\d{1,4}[A-Z]{0,2}$/.test(t)) return "id";

  const tieneDigitos = (t.match(/\d/g) || []).length >= 2;
  const tieneLetras = (t.match(/[A-Z]/g) || []).length >= 2;
  if(tieneDigitos && tieneLetras && /[-_\s]/.test(t)) return "codigo";

  if(/^[A-Z]{2,6}\d{2,8}[A-Z]?$/.test(t)) return "codigo";

  return "nombre";
}

/* ============================================================
   ARTÍCULO DEFINIDO
   ============================================================ */
const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";

  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

/* ============================================================
   ABREVIACIÓN DE NOMBRES DE PILA
   ============================================================ */
function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();

  const resultado = tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  });
  return resultado.join(" ");
}

function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();

  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

/* ============================================================

function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);

  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

/* ============================================================
   CARGA
   ============================================================ */
async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");

  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          mostrarHome();
          return;
        }
      }catch(e){}
    }
  }

  cont.innerHTML = `<div class="loading">☁ Cargando datos...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    cont.innerHTML = `<div class="error">⚠ No se pudieron cargar los datos<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];

  IDX.fijosPorId.clear();
  IDX.fungiblesPorId.clear();
  IDX.internosPorId.clear();
  IDX.prestadosPorId.clear();
  IDX.respPorId.clear();
  IDX.conteoPorId.clear();
  IDX.porCodigo.clear();

  const indexar = (lista, mapPorId, tipoKey) => {
    lista.forEach(b => {
      const id = obtenerIdAsig(b);
      if(id){
        if(!mapPorId.has(id)) mapPorId.set(id, []);
        mapPorId.get(id).push(b);
        IDX.conteoPorId.set(id, (IDX.conteoPorId.get(id) || 0) + 1);
      }
      const cod = getVal(b, "CODIGO");
      if(cod){
        IDX.porCodigo.set(tipoKey + "|" + cod, b);
      }
    });
  };

  indexar(DATA.fijos, IDX.fijosPorId, "FIJOS");
  indexar(DATA.fungibles, IDX.fungiblesPorId, "FUNGIBLES");
  indexar(DATA.internos, IDX.internosPorId, "INTERNOS");
  indexar(DATA.prestados, IDX.prestadosPorId, "PRESTADOS");

  DATA.resp.forEach(r => {
    const id = getVal(r, "ID");
    if(id) IDX.respPorId.set(id, r);
  });
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return IDX.respPorId.get(id.trim()) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  if(!id) return 0;
  return IDX.conteoPorId.get(id.trim()) || 0;
}

function pushEstado(nombreEstado){
  try{ history.pushState({ pantalla: nombreEstado }, ""); }catch(e){}
}

window.addEventListener("popstate", () => {
  if(ignorarPopstate) return;

  if(document.getElementById("modalVistaPrevia").classList.contains("visible")){
    cerrarModalVistaPrevia(); pushEstado(estado.pantalla); return;
  }
  if(document.getElementById("modalEntrante").classList.contains("visible")){
    cerrarModalEntrante(); pushEstado(estado.pantalla); return;
  }
  if(document.getElementById("modal").classList.contains("visible")){
    cerrarModal(); pushEstado(estado.pantalla); return;
  }
  if(estado.pantalla === "busqueda"){
    estado.pantalla = "home"; mostrarHome(); pushEstado("home"); return;
  }
  if(estado.pantalla === "vistaGeneral"){
    estado.pantalla = "home";
    estado.vistaGeneralActual = null;
    estado.oficinaFiltroActual = null;
    mostrarHome(); pushEstado("home"); return;
  }
  if(estado.pantalla === "home"){
    ignorarPopstate = true;
    const salir = window.confirm("¿Está seguro que desea salir del sistema?");
    if(salir){ history.back(); }
    else {
      pushEstado("home");
      setTimeout(() => { ignorarPopstate = false; }, 100);
    }
  }
});

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function renderVistaGeneral(tipo, oficinaFiltro){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    let html = `<button class="btn-volver" onclick="volverDeVistaGeneral()">← Volver</button>
      <div class="list-title"><span>◈ ${titulo} — Total</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs]) => {
      html += `
        <div class="resp-card" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item) => {
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function tablaModal(titulo, lista, color){
  if(!lista.length){
    return `<div class="tabla-section"><div class="tabla-header" data-color="${color}"><div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div><div class="tabla-header-count">0</div></div><div class="empty-state" style="padding:24px 16px;"><div class="empty-state-sub">NO CUENTA ${titulo}</div></div></div>`;
  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach((item) => {
    const cod = getVal(item, "CODIGO");
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = sanitizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" loading="lazy" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:24px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ============================================================
   GENERADOR DEL ACTA
   ============================================================
   ENFOQUE V5.1:
   1. Construir átomos (unidades atómicas medibles):
      - header (membrete + título)              → atómico
      - seccion-titulo (I.- INVENTARIO...)       → atómico con regla "huérfano"
      - thead (abre <table> sin cerrar)          → atómico
      - fila (una <tr>)                          → atómico
      - fila-vacia (NO CUENTA)                   → atómico
      - firmas                                   → atómico (siempre en hoja nueva)
   2. Medir CADA átomo en contenedor oculto.
   3. Recorrer y acumular altura. Cuando un átomo no cabe:
        - Cerrar tabla abierta (</tbody></table>)
        - Insertar .saltar-pagina
        - Reabrir thead si seguimos en tabla
        - Continuar
   4. Llevar la cuenta REAL de hojaActual (número de páginas).
      Un bloque que ocupa exactamente la hoja 1 no cuenta como salto:
      solo los .saltar-pagina efectivos incrementan hojaActual.
      El número total de hojas = hojaActual (donde cae firmas).
   ============================================================ */
function generarHTMLActa(r, oficina, datos){
  const idAsignacion = oficina.id;
  const fijos = IDX.fijosPorId.get(idAsignacion) || [];
  const fungibles = IDX.fungiblesPorId.get(idAsignacion) || [];
  const internos = IDX.internosPorId.get(idAsignacion) || [];
  const prestados = IDX.prestadosPorId.get(idAsignacion) || [];

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  const salienteGrado = r.grado || "";
  const salienteNombres = r.nombres || "";
  const salienteApPat = r.apPat || "";
  const salienteApMat = r.apMat || "";
  let nombreSaliente = construirNombreFirmante(salienteGrado, salienteNombres, salienteApPat, salienteApMat);
  if(!nombreSaliente.trim()) nombreSaliente = r.nombre || "";
  if(!nombreSaliente.trim()) nombreSaliente = "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();

  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat);
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const tituloL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()} DE LA <span style="white-space:nowrap">DIV-10</span>`;

  /* ============================================================
     CONSTRUIR ÁTOMOS
     ============================================================ */
  const atomos = [];

  atomos.push({
    tipo: "header",
    html: `
      <div class="acta-membrete">
        <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
        <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
        <div class="linea3">BOLIVIA</div>
      </div>
      <div class="acta-titulo">
        <span class="titulo-linea1">${esc(tituloL1)}</span>
        <span class="titulo-linea2">${tituloL2}</span>
      </div>
    `
  });

  const secciones = [
    { numRomano: "I.- ", titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", lista: fijos, tipoClase: "fijos" },
    { numRomano: "II.- ", titulo: "INVENTARIO DE ACTIVOS FUNGIBLES", lista: fungibles, tipoClase: "fungibles" },
    { numRomano: "III.- ", titulo: "INVENTARIO INTERNO", lista: internos, tipoClase: "internos" },
    { numRomano: "IV.- ", titulo: "INVENTARIO DE BIENES PRESTADOS", lista: prestados, tipoClase: "prestados" }
  ];

  secciones.forEach(sec => {
    atomos.push({
      tipo: "seccion-titulo",
      html: `<div class="acta-seccion-titulo">${sec.numRomano}<span class="subrayado">${esc(sec.titulo)}</span>.</div>`,
      seccion: sec.tipoClase
    });

    atomos.push({
      tipo: "thead",
      html: generarTheadActa(sec.tipoClase),
      seccion: sec.tipoClase
    });

    if(sec.lista.length === 0){
      atomos.push({
        tipo: "fila-vacia",
        html: `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr>`,
        seccion: sec.tipoClase
      });
    } else {
      sec.lista.forEach((b, i) => {
        atomos.push({
          tipo: "fila",
          html: generarFilaActa(b, i, sec.tipoClase),
          seccion: sec.tipoClase
        });
      });
    }
  });

  const firmasHTML = generarBloqueFirmas({
    nombreSaliente, cargoSaliente, nombreEntrante, cargoEntrante,
    nombreSup1, cargoSup1, nombreSup2, cargoSup2,
    nombreVobo, cargoVobo, fechaLarga
  });
  atomos.push({ tipo: "firmas", html: firmasHTML });

  /* ============================================================
     MEDIR ÁTOMOS
     Envolvemos cada uno en una .acta-seccion (sin margen extra)
     para simular el layout real y medir con la métrica correcta.
     ============================================================ */
  const contMed = document.getElementById("actaMedicion");
  atomos.forEach(a => {
    contMed.innerHTML = a.html;
    void contMed.offsetHeight;
    a.altura = Math.ceil(contMed.getBoundingClientRect().height);
  });

  /* ============================================================
     ENSAMBLAR CON PAGE-BREAKS REALES
     ============================================================
     Reglas:
     - .saltar-pagina cierra la hoja actual y abre la siguiente.
     - Solo se emite si efectivamente hay contenido nuevo.
     - La primera hoja NO lleva salto.
     - "hojaActual" = número de páginas ya usadas (empieza en 1).
     - Las firmas van solas en la última hoja y NO cuentan doble.
     ============================================================ */
  let htmlFinal = "";
  let alturaAcumulada = 0;
  let hojaActual = 1;             /* página en la que estamos escribiendo */
  let tablaAbierta = null;        /* tipoClase de la tabla abierta, o null */

  const cerrarTablaSiAbierta = () => {
    if(tablaAbierta){
      htmlFinal += `</tbody></table>`;
      tablaAbierta = null;
    }
  };

  const abrirThead = (tipoClase) => {
    htmlFinal += generarTheadActa(tipoClase);
    tablaAbierta = tipoClase;
  };

  const hacerSalto = () => {
    cerrarTablaSiAbierta();
    htmlFinal += `<div class="saltar-pagina"></div>`;
    hojaActual++;
    alturaAcumulada = 0;
  };

  for(let i = 0; i < atomos.length; i++){
    const a = atomos[i];

    /* -------- FIRMAS: siempre en hoja nueva -------- */
    if(a.tipo === "firmas"){
      /* Si ya tenemos contenido en la hoja actual, saltamos.
         Si la hoja actual está vacía (imposible pero defensivo), no. */
      if(alturaAcumulada > 0 || htmlFinal.trim() !== ""){
        hacerSalto();
      }
      cerrarTablaSiAbierta();
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- THEAD: abre tabla nueva -------- */
    if(a.tipo === "thead"){
      cerrarTablaSiAbierta();

      const siguiente = atomos[i+1];
      const alturaMinima = a.altura + (siguiente ? siguiente.altura : 0);
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

      /* Si no cabe ni el thead + 1 fila, y ya hay contenido, saltamos */
      if(alturaMinima > espacioRestante && alturaAcumulada > 0){
        hacerSalto();
      }

      abrirThead(a.seccion);
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- FILA VACÍA -------- */
    if(a.tipo === "fila-vacia"){
      if(tablaAbierta !== a.seccion){
        cerrarTablaSiAbierta();
        abrirThead(a.seccion);
      }
      /* La fila vacía + cierre + apertura del siguiente thead viene después.
         La tratamos como una fila más para la altura. */
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
      if(a.altura > espacioRestante && alturaAcumulada > 0){
        hacerSalto();
        abrirThead(a.seccion);
      }
      htmlFinal += a.html;
      htmlFinal += `</tbody></table>`;  /* cerramos la tabla porque es la única fila */
      tablaAbierta = null;
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- FILA NORMAL -------- */
    if(a.tipo === "fila"){
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

      if(a.altura <= espacioRestante){
        if(tablaAbierta !== a.seccion){
          cerrarTablaSiAbierta();
          abrirThead(a.seccion);
        }
        htmlFinal += a.html;
        alturaAcumulada += a.altura;
      } else {
        /* No cabe → saltar de hoja */
        hacerSalto();
        abrirThead(a.seccion);
        htmlFinal += a.html;
        alturaAcumulada += a.altura;
      }
      continue;
    }

    /* -------- HEADER Y SECCION-TITULO (bloques especiales) -------- */
    if(a.tipo === "seccion-titulo"){
      cerrarTablaSiAbierta();

      /* Regla anti-huérfano: el título debe ir con al menos thead + 2 filas */
      let alturaCompañia = a.altura;
      let contadas = 0;
      for(let j = i + 1; j < atomos.length && contadas < 3; j++){
        const sig = atomos[j];
        if(sig.tipo === "thead" || sig.tipo === "fila" || sig.tipo === "fila-vacia"){
          alturaCompañia += sig.altura;
          contadas++;
        } else {
          break;
        }
      }

      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
      if(alturaCompañia > espacioRestante && alturaAcumulada > 0){
        hacerSalto();
      }
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
      continue;
    }

    /* -------- HEADER u otros bloques genéricos -------- */
    const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;
    if(a.altura <= espacioRestante){
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
    } else {
      hacerSalto();
      htmlFinal += a.html;
      alturaAcumulada += a.altura;
    }
  }

  /* Cerrar la última tabla si quedó abierta */
  cerrarTablaSiAbierta();

  /* ============================================================
     INSERTAR ENCABEZADO DE CONTINUACIÓN ANTES DE LAS FIRMAS
     ============================================================
     hojaActual es el número TOTAL de páginas (donde van las firmas).
     El texto "NMA. HOJA DEL INVENTARIO..." va en la hoja de firmas.
     ============================================================ */
  const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);
  const textoContinuacion = `${ordinalHoja(hojaActual)} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;

  let bloqueContinuacion = `<div class="acta-continuacion">${esc(textoContinuacion)}</div>`;
  if(resumenBienes){
    bloqueContinuacion += `<div class="acta-continuacion-resumen">${esc(resumenBienes)}</div>`;
  }

  /* Reemplazamos solo la primera apertura de .acta-bloque-firmas
     (la de la hoja final) para insertar la continuación justo antes
     del contenido de firmas. */
  htmlFinal = htmlFinal.replace(
    '<div class="acta-bloque-firmas">',
    `<div class="acta-bloque-firmas">${bloqueContinuacion}`
  );

  return htmlFinal;
}

/* Genera apertura de tabla con thead; queda SIN cerrar </tbody></table> */
function generarTheadActa(tipoClase){
  let columnasHTML = "";
  if(tipoClase === "fijos"){
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:22%;">CÓDIGO (VSIAF.)</th><th style="width:55%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  } else {
    columnasHTML = `<th style="width:8%;">N°</th><th style="width:10%;">CANTIDAD</th><th style="width:67%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  }
  return `<table class="acta-tabla acta-tabla-fragmento"><thead><tr>${columnasHTML}</tr></thead><tbody>`;
}

function generarFilaActa(b, i, tipoClase){
  const codigo = getVal(b, "CODIGO");
  const cant = getVal(b, "CANTIDAD");
  const desc = getVal(b, "DESCRIPCION DEL ACTIVO");
  const estado = getVal(b, "ESTADO");
  if(tipoClase === "fijos"){
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(codigo)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  } else {
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(cant)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  }
}

function generarBloqueFirmas(d){
  let bloqueFirmasHTML = `
    <div class="acta-firmas-fila">
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">ENTREGUÉ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreSaliente)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSaliente)}</div>
      </div>
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">RECIBÍ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreEntrante)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoEntrante)}</div>
      </div>
    </div>
  `;

  if(d.nombreSup1 && d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firmas-fila">
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
        </div>
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
        </div>
      </div>`;
  } else if(d.nombreSup1){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
      </div>`;
  } else if(d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
      </div>`;
  }

  bloqueFirmasHTML += `
    <div class="acta-firma-bloque">
      <div class="acta-vobo">Vo. Bo.</div>
      <div class="acta-firma-nombre">${esc(d.nombreVobo)}</div>
      <div class="acta-firma-cargo">${esc(d.cargoVobo)}</div>
    </div>
  `;

  return `<div class="acta-bloque-firmas">
    <div class="acta-fecha-firmas">${esc(d.fechaLarga)}</div>
    <div class="acta-firmas">${bloqueFirmasHTML}</div>
  </div>`;
}

function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function abrirLightbox(url){
  const segura = sanitizarUrlFoto(url);
  if(!segura) return;
  document.getElementById("lightbox-img").src = segura;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

document.addEventListener("DOMContentLoaded", () => {

    history.pushState({ pantalla: "home" }, "");

  cargarDesdeNube(false);
});
