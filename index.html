<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V5.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     V5.1 — TEMA "GLASS"
     Índigo profundo + cian eléctrico + coral + ámbar
     ============================================================ */
  :root{
    --bg-1:#0a0e1f;
    --bg-2:#111834;
    --bg-3:#1a1040;

    --glass:rgba(255,255,255,.045);
    --glass-strong:rgba(255,255,255,.07);
    --glass-hover:rgba(255,255,255,.09);
    --glass-border:rgba(255,255,255,.1);
    --glass-border-hover:rgba(255,255,255,.2);

    --texto:#eef1f8;
    --texto-suave:#9ba4c0;
    --texto-muy-suave:#5d6684;

    --cian:#22d3ee;
    --cian-br:#67e8f9;
    --cian-glow:rgba(34,211,238,.35);

    --coral:#fb7185;
    --coral-br:#fda4af;
    --coral-glow:rgba(251,113,133,.35);

    --ambar:#fbbf24;
    --ambar-br:#fcd34d;
    --ambar-glow:rgba(251,191,36,.35);

    --violeta:#a78bfa;
    --violeta-br:#c4b5fd;
    --violeta-glow:rgba(167,139,250,.35);

    --verde:#4ade80;
    --verde-glow:rgba(74,222,128,.3);
    --rojo:#ef4444;
    --rojo-glow:rgba(239,68,68,.3);

    --mono:"JetBrains Mono","Consolas",monospace;
    --sans:"Outfit","Segoe UI",Roboto,sans-serif;

    --radio-sm:8px;
    --radio-md:14px;
    --radio-lg:20px;
    --radio-xl:28px;

    --blur:20px;
  }

  body.light{
    --bg-1:#eef2fa;
    --bg-2:#e6ecf8;
    --bg-3:#f0e8fa;

    --glass:rgba(255,255,255,.55);
    --glass-strong:rgba(255,255,255,.72);
    --glass-hover:rgba(255,255,255,.85);
    --glass-border:rgba(255,255,255,.75);
    --glass-border-hover:rgba(120,90,200,.3);

    --texto:#1a1f38;
    --texto-suave:#4d5673;
    --texto-muy-suave:#8891aa;

    --cian:#0891b2;
    --cian-br:#06b6d4;
    --coral:#e11d48;
    --coral-br:#f43f5e;
    --ambar:#d97706;
    --ambar-br:#f59e0b;
    --violeta:#7c3aed;
    --violeta-br:#8b5cf6;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}

  body{
    font-family:var(--sans);
    background:var(--bg-1);
    color:var(--texto);
    font-size:14px;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .5s ease,color .5s ease;
    position:relative;
  }

  /* Fondo animado con orbes */
  .bg-anim{
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
    overflow:hidden;
  }
  .bg-anim::before,
  .bg-anim::after{
    content:"";position:absolute;border-radius:50%;
    filter:blur(80px);opacity:.55;
    animation:orbFloat 18s ease-in-out infinite;
  }
  .bg-anim::before{
    width:520px;height:520px;
    background:radial-gradient(circle,var(--cian),transparent 70%);
    top:-150px;left:-100px;
  }
  .bg-anim::after{
    width:600px;height:600px;
    background:radial-gradient(circle,var(--violeta),transparent 70%);
    bottom:-200px;right:-150px;
    animation-delay:-8s;
  }
  body.light .bg-anim::before{opacity:.35;}
  body.light .bg-anim::after{opacity:.3;}

  .bg-orb-extra{
    position:fixed;width:400px;height:400px;
    border-radius:50%;filter:blur(90px);opacity:.4;
    background:radial-gradient(circle,var(--coral),transparent 70%);
    top:40%;left:50%;transform:translate(-50%,-50%);
    animation:orbFloat2 22s ease-in-out infinite;
    z-index:0;pointer-events:none;
  }
  body.light .bg-orb-extra{opacity:.2;}

  @keyframes orbFloat{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(80px,-40px) scale(1.1);}
    66%{transform:translate(-60px,50px) scale(.95);}
  }
  @keyframes orbFloat2{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-40%,-60%) scale(1.15);}
  }

  /* Grano sutil encima */
  .bg-grain{
    position:fixed;inset:0;z-index:1;
    opacity:.035;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);
    border-radius:5px;border:2px solid transparent;
    background-clip:padding-box;
  }
  ::-webkit-scrollbar-thumb:hover{background:var(--cian);background-clip:padding-box;}

  .app{
    position:relative;z-index:2;
    min-height:100vh;
    display:flex;flex-direction:column;
  }

  /* ============================================================
     HEADER GLASS
     ============================================================ */
  .header{
    position:sticky;top:0;z-index:50;
    background:var(--glass);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border-bottom:1px solid var(--glass-border);
    padding:14px 24px;
    transition:background .5s ease,border-color .5s ease;
  }
  .header-inner{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
  }

  .brand{
    display:flex;align-items:center;gap:14px;
    min-width:0;flex-shrink:0;
  }
  .brand-icon{
    width:44px;height:44px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;
    box-shadow:0 8px 24px var(--cian-glow);
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .brand-icon::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);
    animation:shine 3s ease-in-out infinite;
  }
  @keyframes shine{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }
  .brand-text h1{
    font-size:16px;font-weight:700;
    letter-spacing:.5px;
    background:linear-gradient(135deg,var(--texto),var(--cian-br));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1.1;
  }
  body.light .brand-text h1{
    background:linear-gradient(135deg,var(--texto),var(--violeta));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .brand-text span{
    font-size:9px;letter-spacing:2px;
    color:var(--texto-muy-suave);
    font-family:var(--mono);font-weight:600;
  }

  /* Nav principal */
  .main-nav{
    display:flex;gap:4px;align-items:center;
    padding:4px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:14px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    flex:1;
    max-width:640px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .main-nav::-webkit-scrollbar{display:none;}

  .nav-btn{
    display:flex;align-items:center;gap:8px;
    padding:9px 14px;
    background:transparent;
    border:1px solid transparent;
    border-radius:10px;
    color:var(--texto-suave);
    font-family:var(--sans);
    font-size:12px;font-weight:600;
    letter-spacing:.3px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .25s ease;
    flex-shrink:0;
  }
  .nav-btn:hover{
    background:var(--glass-hover);
    color:var(--texto);
  }
  .nav-btn.active{
    background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.12));
    border-color:rgba(34,211,238,.35);
    color:var(--cian-br);
    box-shadow:0 0 20px rgba(34,211,238,.15);
  }
  body.light .nav-btn.active{
    background:linear-gradient(135deg,rgba(8,145,178,.12),rgba(124,58,237,.08));
    color:var(--violeta);
    border-color:rgba(124,58,237,.3);
  }
  .nav-btn-icon{font-size:15px;}
  .nav-btn-count{
    font-family:var(--mono);font-size:10px;
    padding:1px 6px;border-radius:6px;
    background:rgba(255,255,255,.08);
    color:var(--texto-suave);
    font-weight:700;
  }
  .nav-btn.active .nav-btn-count{
    background:rgba(34,211,238,.2);
    color:var(--cian-br);
  }

  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  .btn-icon{
    width:38px;height:38px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:12px;
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s ease;
    color:var(--texto-suave);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .btn-icon:hover{
    background:var(--glass-hover);
    border-color:var(--glass-border-hover);
    color:var(--cian-br);
    transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(34,211,238,.2);
  }
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  .status-pill{
    display:flex;align-items:center;gap:7px;
    padding:6px 12px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:20px;
    font-size:10px;font-family:var(--mono);
    color:var(--verde);letter-spacing:1.2px;font-weight:600;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .status-dot{
    width:7px;height:7px;background:var(--verde);
    border-radius:50%;box-shadow:0 0 8px var(--verde);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* ============================================================
     MAIN
     ============================================================ */
  .main{
    flex:1;
    padding:24px;
    max-width:1400px;width:100%;
    margin:0 auto;
  }

  /* ============================================================
     HOME
     ============================================================ */
  .home{animation:fadeIn .5s ease both;display:flex;flex-direction:column;gap:20px;}

  .hero{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-xl);
    padding:32px 36px;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    display:flex;justify-content:space-between;align-items:center;
    gap:24px;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--cian),var(--violeta),transparent);
    opacity:.6;
  }
  .hero::after{
    content:"";position:absolute;
    right:-80px;top:-80px;
    width:280px;height:280px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.15),transparent 70%);
    pointer-events:none;
  }
  .hero-text{position:relative;z-index:1;}
  .hero-text h2{
    font-size:26px;font-weight:700;
    letter-spacing:-.3px;
    margin-bottom:8px;
    background:linear-gradient(135deg,var(--texto),var(--cian-br));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  body.light .hero-text h2{
    background:linear-gradient(135deg,var(--texto),var(--violeta));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero-text p{
    font-size:13px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.5px;
  }
  .hero-stat{
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-lg);
    padding:16px 24px;
    text-align:center;position:relative;z-index:1;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    flex-shrink:0;
  }
  .hero-stat strong{
    display:block;font-size:32px;font-weight:800;
    background:linear-gradient(135deg,var(--cian-br),var(--violeta-br));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
    font-family:var(--mono);
  }
  .hero-stat span{
    font-size:9px;letter-spacing:2px;
    color:var(--texto-suave);
    font-family:var(--mono);font-weight:600;
    text-transform:uppercase;
  }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  .stat-card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-lg);
    padding:22px;
    cursor:pointer;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;gap:14px;
  }
  .stat-card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 100% 0%,var(--color,var(--cian)) 0%,transparent 60%);
    opacity:.08;transition:opacity .35s ease;
    pointer-events:none;
  }
  .stat-card:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:var(--glass-border-hover);
    box-shadow:
      0 20px 40px rgba(0,0,0,.35),
      0 0 40px color-mix(in srgb,var(--color,var(--cian)) 25%,transparent);
  }
  .stat-card:hover::before{opacity:.18;}
  .stat-card[data-color="cian"]{--color:var(--cian);}
  .stat-card[data-color="violeta"]{--color:var(--violeta);}
  .stat-card[data-color="ambar"]{--color:var(--ambar);}
  .stat-card[data-color="coral"]{--color:var(--coral);}

  .stat-card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .stat-card-icon{
    width:44px;height:44px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    background:color-mix(in srgb,var(--color,var(--cian)) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--color,var(--cian)) 30%,transparent);
    color:var(--color,var(--cian));
    box-shadow:0 0 20px color-mix(in srgb,var(--color,var(--cian)) 20%,transparent);
  }
  .stat-card-arrow{
    font-size:20px;color:var(--texto-muy-suave);
    transition:all .3s ease;
  }
  .stat-card:hover .stat-card-arrow{
    color:var(--color,var(--cian));
    transform:translate(3px,-3px);
  }
  .stat-card-label{
    font-size:11px;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--texto-suave);
    font-weight:700;
    position:relative;z-index:1;
  }
  .stat-card-count{
    font-size:34px;font-weight:800;
    color:var(--color,var(--cian));
    font-family:var(--mono);line-height:1;
    position:relative;z-index:1;
    text-shadow:0 0 30px color-mix(in srgb,var(--color,var(--cian)) 50%,transparent);
  }

  .search-cta{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-lg);
    padding:20px 26px;
    display:flex;align-items:center;gap:16px;
    cursor:pointer;
    transition:all .3s ease;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  .search-cta:hover{
    border-color:var(--cian);
    box-shadow:0 10px 30px rgba(34,211,238,.15),0 0 40px rgba(34,211,238,.1);
    transform:translateY(-2px);
    background:var(--glass-strong);
  }
  .search-cta-icon{
    width:50px;height:50px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;flex-shrink:0;
    box-shadow:0 8px 24px rgba(34,211,238,.3);
  }
  .search-cta-text{flex:1;min-width:0;}
  .search-cta-text strong{
    display:block;font-size:15px;font-weight:600;
    color:var(--texto);margin-bottom:3px;
  }
  .search-cta-text span{
    font-size:11px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.3px;
  }
  .search-cta-kbd{
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:8px;
    padding:6px 12px;
    font-family:var(--mono);font-size:11px;
    color:var(--texto-suave);font-weight:700;
    flex-shrink:0;
  }

  /* ============================================================
     BÚSQUEDA
     ============================================================ */
  .modo-busqueda{animation:fadeIn .4s ease both;display:flex;flex-direction:column;gap:16px;}
  .search-bar-wrap{display:flex;gap:10px;align-items:center;width:100%;}

  .btn-volver{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--glass);
    color:var(--cian-br);
    border:1px solid var(--glass-border);
    padding:12px 18px;
    font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    cursor:pointer;border-radius:12px;
    font-weight:700;font-family:var(--sans);
    flex-shrink:0;transition:all .25s ease;white-space:nowrap;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .btn-volver:hover{
    background:var(--cian);color:var(--bg-1);
    border-color:var(--cian-br);
    transform:translateX(-3px);
    box-shadow:0 0 25px var(--cian-glow);
  }
  body.light .btn-volver:hover{color:#fff;}

  .search-box{
    display:flex;align-items:center;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:14px;
    padding:4px 16px;
    flex:1;min-width:0;
    transition:all .3s ease;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  .search-box:focus-within{
    border-color:var(--cian);
    box-shadow:0 0 0 3px rgba(34,211,238,.12),0 0 30px rgba(34,211,238,.2);
  }
  .search-icon{color:var(--cian-br);font-size:18px;margin-right:10px;flex-shrink:0;}
  .search-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    padding:13px 0;font-size:14px;color:var(--texto);
    font-family:var(--sans);font-weight:500;letter-spacing:.3px;
  }
  .search-input::placeholder{color:var(--texto-muy-suave);}
  .btn-clear{
    background:transparent;border:none;color:var(--texto-muy-suave);
    font-size:14px;cursor:pointer;
    width:28px;height:28px;border-radius:50%;
    display:none;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;padding:0;font-weight:800;
  }
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{
    background:var(--coral);color:#fff;
    transform:rotate(90deg) scale(1.1);
    box-shadow:0 0 15px var(--coral-glow);
  }

  /* ============================================================
     LISTAS
     ============================================================ */
  .list-title{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;margin-bottom:14px;
    border-bottom:1px solid var(--glass-border);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:700;
  }
  .list-title .list-count{
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    color:var(--cian-br);
    padding:3px 14px;border-radius:12px;
    font-family:var(--mono);font-weight:800;
  }

  /* Tarjeta carpeta */
  .oficina-folder{
    position:relative;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-md);
    margin-bottom:10px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:stretch;
    overflow:hidden;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    min-height:78px;
  }
  .oficina-folder:hover{
    border-color:var(--glass-border-hover);
    background:var(--glass-hover);
    transform:translateX(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 30px color-mix(in srgb,var(--color,var(--cian)) 20%,transparent);
  }
  .oficina-folder::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--color,var(--cian)),transparent);
    transition:width .3s ease;
  }
  .oficina-folder:hover::before{width:6px;}

  .oficina-folder[data-color="cian"]{--color:var(--cian);}
  .oficina-folder[data-color="violeta"]{--color:var(--violeta);}
  .oficina-folder[data-color="ambar"]{--color:var(--ambar);}
  .oficina-folder[data-color="coral"]{--color:var(--coral);}

  .oficina-folder-content{
    flex:1;min-width:0;
    padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .oficina-folder-info{flex:1;min-width:0;}
  .oficina-folder-name{
    font-size:14px;font-weight:700;color:var(--texto);
    letter-spacing:.2px;margin-bottom:6px;
    transition:color .25s ease;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .oficina-folder:hover .oficina-folder-name{color:var(--color,var(--cian-br));}
  .oficina-folder-meta{
    display:flex;flex-wrap:wrap;gap:10px;
    font-size:10px;color:var(--texto-suave);
    font-family:var(--mono);letter-spacing:.3px;
  }
  .oficina-folder-count{
    background:color-mix(in srgb,var(--color,var(--cian)) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--color,var(--cian)) 35%,transparent);
    color:var(--color,var(--cian));
    padding:10px 16px;border-radius:12px;
    font-size:16px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;min-width:60px;text-align:center;
    transition:all .3s ease;
    box-shadow:0 0 20px color-mix(in srgb,var(--color,var(--cian)) 15%,transparent);
  }
  .oficina-folder:hover .oficina-folder-count{
    transform:scale(1.08);
    box-shadow:0 0 30px color-mix(in srgb,var(--color,var(--cian)) 35%,transparent);
  }
  .oficina-folder-arrow{
    font-size:22px;color:var(--texto-muy-suave);
    transition:all .3s ease;flex-shrink:0;
  }
  .oficina-folder:hover .oficina-folder-arrow{
    color:var(--color,var(--cian));
    transform:translateX(6px);
  }

  /* Bien card */
  .bien-card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-md);
    padding:14px 18px;
    margin-bottom:8px;
    cursor:pointer;
    transition:all .3s ease;
    display:flex;gap:14px;align-items:flex-start;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  .bien-card:hover{
    transform:translateX(6px);
    border-color:var(--cian);
    background:var(--glass-strong);
    box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 30px rgba(34,211,238,.15);
  }
  .bien-card-thumb{
    width:52px;height:52px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--texto-muy-suave);
    flex-shrink:0;overflow:hidden;
  }
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{
    font-size:10px;font-family:var(--mono);
    color:var(--ambar-br);font-weight:700;
    letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;
  }
  .bien-card-desc{
    font-size:12px;font-weight:600;color:var(--texto);
    line-height:1.3;margin-bottom:5px;
  }
  .bien-card-meta{
    display:flex;flex-wrap:wrap;gap:8px;
    font-size:9px;font-family:var(--mono);
    color:var(--texto-suave);
  }
  .bien-card-tipo{
    padding:2px 8px;border-radius:8px;
    font-size:8px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
  }
  .bien-card-tipo.fijos{color:var(--verde);border-color:rgba(74,222,128,.4);}
  .bien-card-tipo.fungibles{color:var(--cian-br);border-color:rgba(34,211,238,.4);}
  .bien-card-tipo.internos{color:var(--ambar-br);border-color:rgba(251,191,36,.4);}
  .bien-card-tipo.prestados{color:var(--coral-br);border-color:rgba(251,113,133,.4);}

  /* Responsable card */
  .resp-card{
    position:relative;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-md);
    padding:16px 22px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  .resp-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--cian),var(--violeta));
    transform:scaleY(0);transform-origin:top;
    transition:transform .35s ease;
  }
  .resp-card:hover{
    transform:translateX(6px);
    border-color:var(--cian);
    background:var(--glass-strong);
    box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 30px rgba(34,211,238,.15);
  }
  .resp-card:hover::before{transform:scaleY(1);}
  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{
    font-size:14px;font-weight:700;color:var(--texto);
    letter-spacing:.2px;margin-bottom:6px;
    transition:color .25s ease;
  }
  .resp-card:hover .resp-card-name{color:var(--cian-br);}
  .resp-card-meta{
    display:flex;flex-wrap:wrap;gap:10px;
    font-size:10px;color:var(--texto-suave);
    font-family:var(--mono);
  }
  .resp-card-arrow{
    font-size:24px;color:var(--texto-muy-suave);
    transition:all .3s ease;flex-shrink:0;
  }
  .resp-card:hover .resp-card-arrow{
    color:var(--cian-br);
    transform:translateX(6px);
  }

  /* Encabezado de oficina */
  .oficina-encabezado{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-left:4px solid var(--cian);
    border-radius:var(--radio-md);
    padding:16px 22px;
    margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    box-shadow:0 0 30px rgba(34,211,238,.08);
  }
  .oficina-encabezado-nombre{
    font-size:15px;font-weight:800;color:var(--texto);
    margin-bottom:4px;
  }
  .oficina-encabezado-sub{
    font-size:10px;font-family:var(--mono);
    color:var(--cian-br);letter-spacing:1px;
    text-transform:uppercase;
  }
  .oficina-encabezado-count{
    background:rgba(34,211,238,.15);
    border:1px solid rgba(34,211,238,.35);
    color:var(--cian-br);
    padding:8px 16px;border-radius:12px;
    font-size:16px;font-weight:800;font-family:var(--mono);
    flex-shrink:0;
  }

  /* ============================================================
     TABLAS
     ============================================================ */
  .tabla-section{
    margin-bottom:18px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radio-md);
    overflow:hidden;
    backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
  }
  .tabla-header{
    padding:12px 18px;
    background:var(--glass-strong);
    border-bottom:1px solid var(--glass-border);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .tabla-header-titulo{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--texto);font-weight:800;
  }
  .tabla-header-titulo .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--color,var(--cian));
    box-shadow:0 0 10px var(--color,var(--cian));
  }
  .tabla-header[data-color="verde"]{--color:var(--verde);}
  .tabla-header[data-color="cian"]{--color:var(--cian);}
  .tabla-header[data-color="ambar"]{--color:var(--ambar);}
  .tabla-header[data-color="coral"]{--color:var(--coral);}
  .tabla-header-count{
    font-family:var(--mono);font-size:12px;
    color:var(--color,var(--cian));font-weight:800;
    background:color-mix(in srgb,var(--color,var(--cian)) 12%,transparent);
    padding:3px 12px;border-radius:10px;
    border:1px solid color-mix(in srgb,var(--color,var(--cian)) 30%,transparent);
  }
  .tabla-scroll{overflow-x:auto;}
  table{
    width:100%;border-collapse:collapse;
    font-size:11px;font-family:var(--sans);
    min-width:400px;
  }
  thead th{
    background:rgba(0,0,0,.15);
    color:var(--texto-suave);
    text-align:left;padding:10px 12px;
    font-size:10px;letter-spacing:1.2px;
    text-transform:uppercase;font-weight:800;
    border-bottom:1px solid var(--glass-border);
  }
  body.light thead th{background:rgba(255,255,255,.4);}
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid rgba(255,255,255,.04);
    color:var(--texto);vertical-align:top;
    word-break:break-word;font-size:11px;
  }
  body.light tbody td{border-bottom-color:rgba(0,0,0,.05);}
  tbody tr{cursor:pointer;transition:background .2s ease;}
  tbody tr:nth-child(even){background:rgba(255,255,255,.02);}
  body.light tbody tr:nth-child(even){background:rgba(0,0,0,.02);}
  tbody tr:hover{background:rgba(34,211,238,.08);}

  .estado-badge{
    display:inline-block;padding:3px 10px;
    border-radius:10px;font-size:9px;
    font-weight:800;letter-spacing:1px;
    text-transform:uppercase;border:1px solid;
  }
  .estado-regular{color:var(--ambar);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08);}
  .estado-malo{color:var(--rojo);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);}
  .estado-bueno{color:var(--verde);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08);}
  .estado-pendiente{color:var(--rojo);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.12);animation:blink 1.5s ease-in-out infinite;}

  /* ============================================================
     MODAL
     ============================================================ */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(5,8,20,.75);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    z-index:100;
    display:none;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  body.light .modal-overlay{background:rgba(60,70,110,.35);}
  .modal-overlay.visible{display:flex;}
  .modal{
    background:var(--glass-strong);
    border:1px solid var(--glass-border-hover);
    border-radius:var(--radio-xl);
    max-width:720px;width:100%;
    max-height:90vh;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(34,211,238,.08);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    animation:modalIn .35s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes modalIn{
    from{opacity:0;transform:scale(.94) translateY(20px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .modal-form{max-width:680px;}
  .modal-vista{max-width:900px;}
  .modal-header{
    padding:20px 24px;
    border-bottom:1px solid var(--glass-border);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:linear-gradient(180deg,rgba(34,211,238,.05),transparent);
  }
  .modal-header h2{
    font-size:13px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--texto);
    font-weight:700;flex:1;min-width:0;word-break:break-word;
  }
  .modal-close{
    width:34px;height:34px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    color:var(--texto-suave);border-radius:10px;
    cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s ease;flex-shrink:0;
  }
  .modal-close:hover{
    background:var(--coral);border-color:var(--coral);
    color:#fff;transform:rotate(90deg);
    box-shadow:0 0 20px var(--coral-glow);
  }
  .modal-body{padding:22px 24px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--glass);
    color:var(--cian-br);
    border:1px solid var(--glass-border);
    padding:9px 16px;font-size:11px;
    letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;border-radius:10px;
    font-weight:700;transition:all .25s ease;
    margin-bottom:16px;font-family:var(--sans);
  }
  .btn-nav:hover{
    background:var(--cian);color:var(--bg-1);
    border-color:var(--cian-br);
    transform:translateX(-3px);
    box-shadow:0 0 25px var(--cian-glow);
  }
  body.light .btn-nav:hover{color:#fff;}

  .modal-titulo-seccion{
    text-align:center;padding:8px 0 16px;
    font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--texto-suave);
    font-weight:700;font-family:var(--mono);
    border-bottom:1px solid var(--glass-border);margin-bottom:16px;
  }

  .oficina-card{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-left:4px solid var(--cian);
    padding:14px 18px;margin-bottom:10px;
    border-radius:12px;cursor:pointer;
    transition:all .3s ease;
  }
  .oficina-card:hover{
    border-color:var(--glass-border-hover);
    border-left-color:var(--violeta);
    background:var(--glass-hover);
    box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 25px rgba(34,211,238,.12);
    transform:translateX(5px);
  }
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{
    font-size:13px;font-weight:700;color:var(--texto);
    letter-spacing:.2px;margin-bottom:4px;
  }
  .oficina-card-id{
    font-size:10px;font-family:var(--mono);
    color:var(--cian-br);letter-spacing:1px;
  }
  .oficina-card-count{
    background:rgba(34,211,238,.12);
    border:1px solid rgba(34,211,238,.3);
    color:var(--cian-br);
    padding:6px 14px;border-radius:12px;
    font-size:13px;font-weight:800;
    font-family:var(--mono);flex-shrink:0;
  }

  .btn-imprimir{
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    color:#fff;border:none;
    padding:11px 20px;border-radius:12px;
    font-size:11px;font-weight:800;
    letter-spacing:1.2px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:all .25s ease;font-family:var(--sans);
    text-transform:uppercase;margin-bottom:16px;
    box-shadow:0 6px 20px rgba(34,211,238,.3);
  }
  .btn-imprimir:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(34,211,238,.45);
    filter:brightness(1.1);
  }

  /* ============================================================
     FORMULARIO
     ============================================================ */
  .form-persona{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:12px;
    padding:14px 16px;margin-bottom:12px;
  }
  .form-persona-titulo{
    font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--cian-br);
    font-weight:800;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .form-persona-titulo .num{
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    color:#fff;
    width:20px;height:20px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 2fr 1.2fr 1.2fr;
    gap:10px;margin-bottom:10px;
  }
  .form-grid .form-group{margin-bottom:0;}
  .form-group label{
    display:block;font-size:10px;
    letter-spacing:1.2px;text-transform:uppercase;
    color:var(--texto-suave);font-weight:800;margin-bottom:5px;
  }
  .form-group input{
    width:100%;padding:10px 12px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:10px;color:var(--texto);
    font-family:var(--sans);font-size:13px;
    outline:none;transition:all .2s ease;
  }
  .form-group input:focus{
    border-color:var(--cian);
    box-shadow:0 0 0 2px rgba(34,211,238,.15);
    background:var(--glass-hover);
  }
  .form-group input::placeholder{color:var(--texto-muy-suave);}
  .form-persona .form-grid{grid-template-columns:1fr 1.5fr 1fr 1fr;}

  .form-actions{
    display:flex;gap:10px;justify-content:flex-end;
    margin-top:20px;padding-top:16px;
    border-top:1px solid var(--glass-border);
  }
  .btn-cancelar{
    background:transparent;color:var(--texto-suave);
    border:1px solid var(--glass-border);
    padding:10px 18px;border-radius:10px;
    font-size:11px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;font-family:var(--sans);
    transition:all .25s ease;
  }
  .btn-cancelar:hover{background:var(--glass-hover);color:var(--texto);}
  .btn-confirmar{
    background:linear-gradient(135deg,var(--cian),var(--violeta));
    color:#fff;border:none;
    padding:10px 22px;border-radius:10px;
    font-size:11px;font-weight:800;
    letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;font-family:var(--sans);
    transition:all .25s ease;
    box-shadow:0 6px 20px rgba(34,211,238,.3);
  }
  .btn-confirmar:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(34,211,238,.45);
  }

  /* ============================================================
     DETALLE DEL BIEN
     ============================================================ */
  .bien-detalle{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:14px;
    overflow:hidden;
  }
  .bien-detalle-header{
    padding:22px;
    background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(167,139,250,.06));
    border-bottom:2px solid var(--cian);
    display:flex;gap:16px;align-items:flex-start;
  }
  .bien-detalle-foto{
    width:84px;height:84px;
    background:var(--glass-strong);
    border:2px solid var(--cian);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:var(--cian-br);
    flex-shrink:0;overflow:hidden;cursor:pointer;
    transition:all .3s ease;
  }
  .bien-detalle-foto:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px var(--cian-glow);
  }
  .bien-detalle-foto img{width:100%;height:100%;object-fit:cover;}
  .bien-detalle-codigo{
    font-size:11px;font-family:var(--mono);
    color:var(--ambar-br);letter-spacing:2px;
    font-weight:800;text-transform:uppercase;margin-bottom:6px;
  }
  .bien-detalle-nombre{
    font-size:15px;font-weight:700;color:var(--texto);
    line-height:1.3;margin-bottom:8px;
  }
  .bien-detalle-tipo-badge{
    display:inline-block;padding:3px 12px;
    border-radius:10px;font-size:9px;
    font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  }
  .bien-detalle-tipo-badge.fijos{color:var(--verde);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);}
  .bien-detalle-tipo-badge.fungibles{color:var(--cian-br);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);}
  .bien-detalle-tipo-badge.internos{color:var(--ambar-br);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);}
  .bien-detalle-tipo-badge.prestados{color:var(--coral-br);background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);}
  .bien-detalle-campo{
    display:flex;gap:16px;align-items:flex-start;
    padding:12px 22px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .bien-detalle-campo:last-child{border-bottom:none;}
  .bien-detalle-campo:nth-child(even){background:rgba(255,255,255,.02);}
  body.light .bien-detalle-campo:nth-child(even){background:rgba(0,0,0,.02);}
  .bien-detalle-label{
    flex:0 0 38%;font-size:10px;

/* ============================================================

function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}

const DOMINIOS_FOTO_PERMITIDOS = [
  "drive.google.com","docs.google.com",
  "lh3.googleusercontent.com","lh4.googleusercontent.com",
  "lh5.googleusercontent.com","lh6.googleusercontent.com",
  "i.imgur.com","imgur.com"
];
function sanitizarUrlFoto(url){
  if(!url || typeof url !== "string") return "";
  const trimmed = url.trim();
  if(!trimmed) return "";
  if(!trimmed.startsWith("http") && trimmed.length > 20){
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(trimmed)}`;
  }
  try{
    const u = new URL(trimmed);
    if(u.protocol !== "https:" && u.protocol !== "http:") return "";
    const host = u.hostname.toLowerCase();
    const permitido = DOMINIOS_FOTO_PERMITIDOS.some(d => host === d || host.endsWith("." + d));
    if(!permitido) return "";
    return u.toString();
  }catch(e){ return ""; }
}

/* ============================================================

const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",

  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",

];

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";
  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();
  const resultado = tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  });
  return resultado.join(" ");
}

function construirNombreFirmante(grado, nombres, apPat, apMat){

  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);
  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  const idLimpio = (id || "").trim();
  const grupo = IDX.bienesPorAsig.get(idLimpio);
  if(!grupo) return 0;
  return grupo.fijos.length + grupo.fungibles.length + grupo.internos.length + grupo.prestados.length;
}

function construirIndices(){
  IDX.bienesPorAsig.clear();
  IDX.respPorId.clear();
  IDX.asigsPorCedula.clear();

  const initGrupo = () => ({ fijos:[], fungibles:[], internos:[], prestados:[] });
  const addBien = (tipo, item) => {
    const id = obtenerIdAsig(item);
    if(!id) return;
    if(!IDX.bienesPorAsig.has(id)) IDX.bienesPorAsig.set(id, initGrupo());
    IDX.bienesPorAsig.get(id)[tipo].push(item);
  };

  DATA.fijos.forEach(b => addBien("fijos", b));
  DATA.fungibles.forEach(b => addBien("fungibles", b));
  DATA.internos.forEach(b => addBien("internos", b));
  DATA.prestados.forEach(b => addBien("prestados", b));

  DATA.resp.forEach(r => {
    const idResp = getVal(r, "ID");
    if(idResp && !IDX.respPorId.has(idResp)) IDX.respPorId.set(idResp, r);
    const ced = getCedulaResp(r);
    if(ced){
      if(!IDX.asigsPorCedula.has(ced)) IDX.asigsPorCedula.set(ced, []);
      IDX.asigsPorCedula.get(ced).push(r);
    }
  });
}

    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
  construirIndices();
  actualizarContadores();
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function pushEstado(nombreEstado){
  try{ history.pushState({ pantalla: nombreEstado }, ""); }catch(e){}
}

function setNavActive(nav){
  document.querySelectorAll(".nav-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.nav === nav);
  });
}

window.addEventListener("popstate", () => {
  if(document.getElementById("modalVistaPrevia").classList.contains("visible")){
    cerrarModalVistaPrevia();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modalEntrante").classList.contains("visible")){
    cerrarModalEntrante();
    pushEstado(estado.pantalla);
    return;
  }
  if(document.getElementById("modal").classList.contains("visible")){
    cerrarModal();
    pushEstado(estado.pantalla);
    return;
  }
  if(estado.pantalla === "busqueda"){
    estado.pantalla = "home";
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "vistaGeneral"){
    if(estado.oficinaFiltroActual){
      estado.oficinaFiltroActual = null;
      renderVistaGeneral(estado.vistaGeneralActual);
      pushEstado("vistaGeneral");
      return;
    }
    estado.pantalla = "home";
    estado.vistaGeneralActual = null;
    mostrarHome();
    pushEstado("home");
    return;
  }
  if(estado.pantalla === "home"){
    const salir = confirm("¿Está seguro que desea salir del sistema?");
    if(salir){ history.back(); }
    else { pushEstado("home"); }
  }
});

function mostrarModoBusqueda(){
  const cont = document.getElementById("contenido");
  cont.innerHTML = `

      <div class="search-bar-wrap">
        <button class="btn-volver" onclick="navHome()">← Volver</button>

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function renderResultadosResponsables(filtro, cont){
  const lista = buscarResponsables(filtro);
  if(!lista.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div><div class="empty-state-sub">Pruebe con otro término</div></div>`;
    return;
  }
  let html = `<div class="list-title"><span>◈ Responsables encontrados</span><span class="list-count">${lista.length}</span></div>`;
  lista.forEach((r, i) => {
    const totalBienes = r.asignaciones.reduce((a, o) => a + contarBienesPorAsignacion(o.id), 0);
    html += `
      <div class="resp-card" style="animation-delay:${i * 25}ms" onclick="abrirModalResponsable(${i})">
        <div class="resp-card-info">
          <div class="resp-card-name">${esc(r.nombre)}</div>
          <div class="resp-card-meta">
            <span>◈ C.I. ${esc(r.cedula)}</span>
            <span>▪ ${r.asignaciones.length} oficina(s)</span>
            <span>▪ ${totalBienes} bienes</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
  window.__listaResponsablesActual = lista;
}

function renderResultadosBienes(filtro, tipoBusqueda, cont){
  const bienes = tipoBusqueda === "id" ? buscarBienesPorIdAsig(filtro) : buscarBienesPorCodigo(filtro);
  if(!bienes.length){
    cont.innerHTML = `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div><div class="empty-state-sub">No se encontraron bienes</div></div>`;
    return;
  }
  if(bienes.length === 1){ abrirDetalleBienDirecto(bienes[0]); return; }
  let html = `<div class="list-title"><span>◈ Bienes encontrados</span><span class="list-count">${bienes.length}</span></div>`;
  bienes.forEach((b, i) => {
    const idAsig = obtenerIdAsig(b);
    const oficina = getOficinaResponsablePorId(idAsig);
    const tipoClase = b.__tipo.toLowerCase();
    const foto = obtenerFoto(b);
    html += `
      <div class="bien-card" style="animation-delay:${i * 20}ms" onclick="abrirDetalleBienDirectoPorCodigo('${escAttr(getVal(b, 'CODIGO'))}', '${escAttr(b.__tipo)}')">
        <div class="bien-card-thumb">${renderFotoMiniatura(foto)}</div>
        <div class="bien-card-info">
          <div class="bien-card-code">${esc(getVal(b, "CODIGO"))}</div>
          <div class="bien-card-desc">${esc(getVal(b, "DESCRIPCION DEL ACTIVO"))}</div>
          <div class="bien-card-meta">
            <span class="bien-card-tipo ${tipoClase}">${esc(b.__tipo)}</span>
            <span>▪ ID ${esc(idAsig)}</span>
            <span>▪ ${esc(oficina)}</span>
          </div>
        </div>
        <div class="resp-card-arrow">›</div>
      </div>`;
  });
  cont.innerHTML = html;
}

function renderVistaGeneral(tipo, oficinaFiltro){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "ACTIVOS FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colores = { fijos: "cian", fungibles: "violeta", internos: "ambar", prestados: "coral" };
  const listaCompleta = DATA[tipo] || [];
  const titulo = titulos[tipo] || tipo.toUpperCase();

  if(!oficinaFiltro){
    setNavActive(tipo);
    let html = `<div class="list-title"><span>◈ ${titulo} — Agrupado por oficina</span><span class="list-count">${listaCompleta.length}</span></div>`;
    if(!listaCompleta.length){
      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      const idEjemplo = obtenerIdAsig(regs[0]);
      html += `
        <div class="oficina-folder" data-color="${colores[tipo]}" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="oficina-folder-content">
            <div class="oficina-folder-info">
              <div class="oficina-folder-name">${esc(ofi)}</div>
              <div class="oficina-folder-meta">
                <span>◈ ID ${esc(idEjemplo)}</span>
                <span>▪ ${regs.length} registro(s)</span>
              </div>
            </div>
            <div class="oficina-folder-count">${regs.length}</div>
            <div class="oficina-folder-arrow">›</div>
          </div>
        </div>`;
    });
    cont.innerHTML = html;
    return;
  }

  const listaFiltrada = listaCompleta.filter(b => getOficinaResponsablePorId(obtenerIdAsig(b)) === oficinaFiltro);
  let html = `<button class="btn-volver" onclick="renderVistaGeneral('${tipo}')">← Volver</button>
    <div class="oficina-encabezado">
      <div>
        <div class="oficina-encabezado-nombre">${esc(oficinaFiltro)}</div>
        <div class="oficina-encabezado-sub">◈ ${esc(titulo)} · ${listaFiltrada.length} bien(es)</div>
      </div>
      <div class="oficina-encabezado-count">${listaFiltrada.length}</div>
    </div>`;
  if(!listaFiltrada.length){
    html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin resultados</div></div>`;
    cont.innerHTML = html;
    return;
  }
  html += tablaGeneral(tipo, listaFiltrada);
  cont.innerHTML = html;
}

function filtrarPorOficina(oficina){
  estado.oficinaFiltroActual = oficina;
  pushEstado("vistaGeneral");
  renderVistaGeneral(estado.vistaGeneralActual, oficina);
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "cian", internos: "ambar", prestados: "coral" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach(item => {
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function abrirModalResponsable(idx){
  const lista = window.__listaResponsablesActual || [];
  const r = lista[idx];

  estado.responsableActual = r;
  if(r.asignaciones.length === 1){

  document.getElementById("modal-body").innerHTML = renderModalBody();
  document.getElementById("modal").classList.add("visible");
  pushEstado("modal");
}

  const r = estado.responsableActual;

  const oficina = r.asignaciones.find(o => o.id === idAsig);
  if(!oficina) return;
  estado.modalVista = "tablas";
  estado.oficinaActual = oficina;
  document.getElementById("modal-body").innerHTML = renderModalBody();
}

function abrirDetalleBienDirecto(bien){
  estado.modalVista = "detalleBien";

function tablaModal(titulo, lista, color){
  if(!lista.length){
    return `<div class="tabla-section"><div class="tabla-header" data-color="${color}"><div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div><div class="tabla-header-count">0</div></div><div class="empty-state" style="padding:26px 20px;"><div class="empty-state-sub">NO CUENTA ${titulo}</div></div></div>`;
  }
  let columnas = [];
  if(titulo === "FIJOS") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(titulo === "FUNGIBLES") columnas = ["CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  lista.forEach(item => {
    const cod = getVal(item, "CODIGO");
    html += `<tr onclick="abrirDetalleBienDesdeModal('${escAttr(cod)}', '${titulo}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}
