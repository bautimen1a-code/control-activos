<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control DIV-10 · V6.1</title>
<style>
/* ============================================================
   [01] VARIABLES Y TEMA
   ============================================================ */
:root{
  --bg:#0d1410;
  --bg-panel:#121a15;
  --bg-elevado:#18241c;
  --bg-hover:#1f2e24;
  --bg-card:#141d17;
  --bg-terminal:#0a100c;

  --texto:#e8f0e6;
  --texto-suave:#8fa396;
  --texto-muy-suave:#5a6b60;

  --borde:rgba(143,163,150,.15);
  --borde-fuerte:rgba(143,163,150,.35);

  --ambar:#e8a93a;
  --ambar-brillante:#ffc55c;
  --ambar-glow:rgba(232,169,58,.4);

  --verde:#7cb342;
  --verde-brillante:#a8d86e;
  --verde-glow:rgba(124,179,66,.4);

  --rojo:#d64545;
  --rojo-brillante:#ff6666;
  --rojo-glow:rgba(214,69,69,.4);

  --azul:#4a9eff;
  --azul-glow:rgba(74,158,255,.4);

  --gris-metal:#2a362e;
  --gris-metal-claro:#3a4a3e;

  --mono:"JetBrains Mono","Fira Code","Consolas",monospace;
  --sans:"Inter","Segoe UI",Roboto,system-ui,sans-serif;

  --sombra-panel:0 8px 24px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
  --sombra-elevado:0 12px 36px rgba(0,0,0,.6);
}
body.light{
  --bg:#e8ede8;
  --bg-panel:#ffffff;
  --bg-elevado:#f4f7f4;
  --bg-hover:#e8efe8;
  --bg-card:#fafcfa;
  --bg-terminal:#1a1a1a;
  --texto:#1a2418;
  --texto-suave:#5a6b58;
  --texto-muy-suave:#8fa39a;
  --borde:rgba(26,36,24,.15);
  --borde-fuerte:rgba(26,36,24,.35);
  --ambar:#b8801a;
  --ambar-brillante:#d99c2e;
  --verde:#4a7a22;
  --verde-brillante:#6ba832;
  --rojo:#b83030;
  --rojo-brillante:#d64545;
  --azul:#1e6fd9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--texto);
  font-size:14px;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
  transition:background .4s ease,color .4s ease;
}

/* ============================================================
   [02] FONDO
   ============================================================ */
.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(232,169,58,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(124,179,66,.05) 0%, transparent 50%),
    var(--bg);
}
.bg-layer::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.015) 75%),
    linear-gradient(45deg, rgba(255,255,255,.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.015) 75%);
  background-size:6px 6px;
  background-position:0 0, 3px 3px;
  opacity:.5;
}
body.light .bg-layer::before{
  background-image:
    linear-gradient(45deg, rgba(0,0,0,.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.02) 75%),
    linear-gradient(45deg, rgba(0,0,0,.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.02) 75%);
}
.bg-layer::after{
  content:"";
  position:absolute;
  top:50%;left:50%;
  width:200vmax;height:200vmax;
  transform:translate(-50%,-50%);
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      transparent 0deg, rgba(124,179,66,.025) 1deg, transparent 2deg, transparent 90deg,
      transparent 90deg, rgba(232,169,58,.025) 91deg, transparent 92deg, transparent 180deg);
  opacity:.6;
  animation:radarSpin 60s linear infinite;
  pointer-events:none;
}
@keyframes radarSpin{from{transform:translate(-50%,-50%) rotate(0);}to{transform:translate(-50%,-50%) rotate(360deg);}}

.scanline{
  position:fixed;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--ambar),var(--verde),transparent);
  box-shadow:0 0 8px var(--ambar-glow);
  opacity:.4;z-index:1;pointer-events:none;
  animation:scanline 8s linear infinite;
}
@keyframes scanline{from{top:-1px;}to{top:100vh;}}

/* ============================================================
   [03] SCROLLBAR
   ============================================================ */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-terminal);}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--gris-metal),var(--gris-metal-claro));
  border:2px solid var(--bg-terminal);
  border-radius:2px;
}
::-webkit-scrollbar-thumb:hover{background:var(--verde);}

/* ============================================================
   [04] APP LAYOUT
   ============================================================ */
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

/* ============================================================
   [05] HEADER
   ============================================================ */
.header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, var(--bg-panel) 0%, rgba(13,20,16,.95) 100%);
  border-bottom:2px solid var(--borde-fuerte);
  padding:0;
  overflow:hidden;
  transition:background .4s ease;
  box-shadow:0 2px 0 rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.4);
}
body.light .header{
  background:linear-gradient(180deg, #ffffff 0%, #f0f4f0 100%);
}
.header::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--rojo) 0%, var(--ambar) 30%, var(--verde) 70%, var(--rojo) 100%);
  opacity:.75;
}
.header-content{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:12px 22px;
}
.header-logo{display:flex;align-items:center;gap:14px;}
.header-logo-icon{
  width:46px;height:46px;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:var(--bg-terminal);
  background:linear-gradient(135deg, var(--ambar), #c68a1a);
  border:2px solid var(--gris-metal-claro);
  border-radius:6px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -2px 4px rgba(0,0,0,.3),
    0 4px 12px rgba(0,0,0,.5);
  transform:rotate(-3deg);
  transition:transform .3s ease;
}
.header-logo-icon:hover{transform:rotate(0deg) scale(1.05);}

.header-text h1{
  font-size:16px;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--texto);
  line-height:1.1;
}
.header-text h1 .highlight{
  color:var(--ambar);
  text-shadow:0 0 12px var(--ambar-glow);
}
.header-text .subtitle{
  font-family:var(--mono);
  font-size:9px;letter-spacing:3px;
  color:var(--texto-suave);
  text-transform:uppercase;
  margin-top:3px;
  display:flex;align-items:center;gap:8px;
}
.header-text .subtitle::before{
  content:"";
  display:inline-block;
  width:6px;height:6px;border-radius:50%;
  background:var(--verde);
  box-shadow:0 0 8px var(--verde);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

.header-actions{display:flex;align-items:center;gap:10px;}

.btn-icon{
  width:44px;height:44px;
  background:linear-gradient(180deg, var(--gris-metal-claro) 0%, var(--gris-metal) 100%);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  color:var(--texto);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -2px 4px rgba(0,0,0,.3),
    0 2px 4px rgba(0,0,0,.3);
}
.btn-icon::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,.15) 100%);
  pointer-events:none;
}
.btn-icon:hover{
  background:linear-gradient(180deg, var(--ambar) 0%, #c68a1a 100%);
  color:var(--bg-terminal);
  transform:translateY(-1px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -2px 4px rgba(0,0,0,.3),
    0 4px 12px var(--ambar-glow);
}
.btn-icon:active{
  transform:translateY(1px);
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.4),
    0 1px 2px rgba(0,0,0,.3);
}
.btn-icon.spinning{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

.header-status{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--bg-terminal);
  border:1px solid var(--borde-fuerte);
  border-radius:4px;
  font-size:10px;font-family:var(--mono);
  color:var(--verde-brillante);
  letter-spacing:2px;
  position:relative;
  overflow:hidden;
}
.header-status::before{
  content:"";
  position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--verde);
  box-shadow:0 0 8px var(--verde);
}
.status-dot{
  width:8px;height:8px;background:var(--verde);
  border-radius:50%;
  box-shadow:0 0 8px var(--verde);
  animation:blink 1.6s ease-in-out infinite;
}

/* ============================================================
   [06] MAIN
   ============================================================ */
.main{flex:1;padding:24px 22px;max-width:1400px;margin:0 auto;width:100%;}

/* ============================================================
   [07] HOME
   ============================================================ */
.home{display:flex;flex-direction:column;gap:20px;padding-top:8px;animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.home-title{
  font-size:11px;letter-spacing:6px;
  color:var(--texto-suave);
  text-transform:uppercase;
  padding:8px 0;
  border-bottom:1px solid var(--borde);
  display:flex;align-items:center;gap:12px;
}
.home-title::before,
.home-title::after{
  content:"";
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--borde-fuerte),transparent);
}

.home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

.home-btn{
  position:relative;
  background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-panel) 100%);
  border:1px solid var(--borde);
  border-radius:8px;
  padding:24px 16px;
  cursor:pointer;
  transition:all .2s ease;
  overflow:hidden;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  color:var(--texto);
  box-shadow:var(--sombra-panel);
}
.home-btn::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--color,var(--ambar));
  transform:scaleX(0);transform-origin:left;
  transition:transform .3s ease;
  box-shadow:0 0 8px var(--color,var(--ambar));
}
.home-btn:hover{
  transform:translateY(-3px);
  border-color:var(--color,var(--ambar));
  box-shadow:var(--sombra-elevado), 0 0 30px var(--color-glow, var(--ambar-glow));
}
.home-btn:hover::before{transform:scaleX(1);}
.home-btn:active{transform:translateY(0);}

.home-btn[data-color="verde"]{--color:var(--verde);--color-glow:var(--verde-glow);}
.home-btn[data-color="azul"]{--color:var(--azul);--color-glow:var(--azul-glow);}
.home-btn[data-color="marron"]{--color:var(--ambar);--color-glow:var(--ambar-glow);}
.home-btn[data-color="vino"]{--color:var(--rojo);--color-glow:var(--rojo-glow);}
.home-btn[data-color="buscar"]{--color:var(--ambar);--color-glow:var(--ambar-glow);}

.home-btn-icon{
  font-size:32px;
  color:var(--color,var(--ambar));
  filter:drop-shadow(0 0 8px var(--color,var(--ambar)));
  transition:transform .3s ease;
}
.home-btn:hover .home-btn-icon{transform:scale(1.15);}

.home-btn-label{
  font-size:10px;letter-spacing:3px;
  text-transform:uppercase;
  color:var(--texto-suave);
  font-weight:700;
}
.home-btn-count{
  font-size:30px;font-weight:900;
  color:var(--color,var(--ambar));
  line-height:1;
  text-shadow:0 0 16px var(--color-glow, var(--ambar-glow));
}

.home-btn.buscar{
  grid-column:span 4;
  padding:22px;
  background:linear-gradient(180deg, var(--bg-terminal) 0%, var(--bg-panel) 100%);
  flex-direction:row;justify-content:center;gap:16px;
  border-color:var(--ambar);
}
.home-btn.buscar .home-btn-icon{font-size:26px;}
.home-btn.buscar .home-btn-label{font-size:13px;letter-spacing:6px;color:var(--ambar-brillante);}

/* ============================================================
   [08] MODO BÚSQUEDA
   ============================================================ */
.modo-busqueda{animation:fadeIn .35s ease both;display:flex;flex-direction:column;gap:16px;min-height:60vh;}
.modo-busqueda-top{display:flex;gap:12px;align-items:center;width:100%;min-width:0;}

.btn-volver{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg, var(--gris-metal-claro) 0%, var(--gris-metal) 100%);
  color:var(--texto);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  padding:12px 18px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-weight:700;
  flex-shrink:0;white-space:nowrap;
  transition:all .15s ease;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 2px 4px rgba(0,0,0,.3);
}
.btn-volver:hover{
  background:linear-gradient(180deg, var(--ambar) 0%, #c68a1a 100%);
  color:var(--bg-terminal);
  transform:translateY(-1px);
  box-shadow:0 4px 12px var(--ambar-glow);
}
.btn-volver:active{transform:translateY(1px);}

.search-wrapper{flex:1;min-width:0;position:relative;}
.search-box{
  display:flex;align-items:center;
  background:var(--bg-terminal);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  padding:4px 14px;
  width:100%;
  transition:all .2s ease;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
}
.search-box:focus-within{
  border-color:var(--ambar);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4), 0 0 20px var(--ambar-glow);
}
.search-icon{
  color:var(--ambar);font-size:18px;margin-right:12px;flex-shrink:0;
  filter:drop-shadow(0 0 6px var(--ambar-glow));
}
.search-input{
  flex:1;min-width:0;
  background:transparent;border:none;outline:none;
  padding:14px 0;
  font-size:14px;color:var(--texto);
  font-family:var(--mono);font-weight:500;letter-spacing:.5px;
  width:100%;
}
.search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:0;}
.btn-clear{
  background:transparent;border:none;color:var(--texto-muy-suave);
  font-size:16px;cursor:pointer;width:32px;height:32px;
  border-radius:50%;display:none;align-items:center;justify-content:center;
  transition:all .2s ease;flex-shrink:0;padding:0;margin-left:8px;font-weight:800;
}
.btn-clear.visible{display:flex;}
.btn-clear:hover{
  background:var(--rojo);color:#fff;
  transform:rotate(90deg) scale(1.1);
  box-shadow:0 0 12px var(--rojo-glow);
}

/* ============================================================
   [09] LISTAS Y TARJETAS
   ============================================================ */
.list-title{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;margin-bottom:14px;
  border-bottom:2px solid var(--borde-fuerte);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto-suave);font-weight:700;
  animation:fadeIn .4s ease both;
}
.list-count{
  background:var(--bg-terminal);
  border:1px solid var(--ambar);
  color:var(--ambar);
  padding:4px 14px;
  border-radius:4px;
  font-family:var(--mono);font-weight:800;
  box-shadow:inset 0 0 8px rgba(232,169,58,.15);
}

.resp-card{
  position:relative;
  background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-panel) 100%);
  border:1px solid var(--borde);
  border-left:4px solid var(--ambar);
  border-radius:8px;
  padding:18px 22px;
  margin-bottom:12px;
  cursor:pointer;
  transition:all .2s ease;
  overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  box-shadow:var(--sombra-panel);
}
.resp-card::before{
  content:"";
  position:absolute;
  top:0;right:0;
  width:80px;height:100%;
  background:linear-gradient(90deg, transparent, rgba(232,169,58,.04));
  pointer-events:none;
}
.resp-card:hover{
  transform:translateX(6px);
  border-color:var(--ambar);
  border-left-color:var(--verde);
  box-shadow:var(--sombra-elevado), 0 0 24px var(--ambar-glow);
}
.resp-card:active{transform:translateX(3px);}

.resp-card-info{flex:1;min-width:0;position:relative;z-index:1;}
.resp-card-name{
  font-size:15px;font-weight:700;color:var(--texto);
  letter-spacing:.3px;margin-bottom:8px;
  transition:color .2s ease;
}
.resp-card:hover .resp-card-name{color:var(--ambar-brillante);}
.resp-card-meta{
  display:flex;flex-wrap:wrap;gap:12px;
  font-size:11px;color:var(--texto-suave);
  font-family:var(--mono);
}
.resp-card-arrow{
  font-size:28px;color:var(--texto-muy-suave);
  transition:all .3s ease;flex-shrink:0;
}
.resp-card:hover .resp-card-arrow{
  color:var(--ambar);
  transform:translateX(8px);
}

.bien-card{
  position:relative;
  background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-panel) 100%);
  border:1px solid var(--borde);
  border-left:4px solid var(--verde);
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:12px;
  cursor:pointer;
  transition:all .2s ease;
  display:flex;gap:16px;align-items:flex-start;
  box-shadow:var(--sombra-panel);
}
.bien-card:hover{
  transform:translateX(6px);
  border-color:var(--verde);
  border-left-color:var(--ambar);
  box-shadow:var(--sombra-elevado), 0 0 24px var(--verde-glow);
}
.bien-card-thumb{
  width:64px;height:64px;
  background:var(--bg-terminal);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--texto-muy-suave);
  flex-shrink:0;overflow:hidden;
}
.bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
.bien-card-info{flex:1;min-width:0;}
.bien-card-code{
  font-family:var(--mono);
  font-size:11px;color:var(--ambar);
  font-weight:700;letter-spacing:1.5px;
  margin-bottom:5px;text-transform:uppercase;
}
.bien-card-desc{
  font-size:13px;font-weight:600;color:var(--texto);
  line-height:1.4;margin-bottom:8px;
}
.bien-card-meta{
  display:flex;flex-wrap:wrap;gap:8px;
  font-size:10px;font-family:var(--mono);
  color:var(--texto-suave);
}
.bien-card-tipo{
  padding:3px 10px;
  font-size:9px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;
  border-radius:3px;
  background:var(--bg-terminal);
  border:1px solid var(--borde);
}
.bien-card-tipo.fijos{color:var(--verde);border-color:var(--verde);}
.bien-card-tipo.fungibles{color:var(--azul);border-color:var(--azul);}
.bien-card-tipo.internos{color:var(--ambar);border-color:var(--ambar);}
.bien-card-tipo.prestados{color:var(--rojo);border-color:var(--rojo);}

/* ============================================================
   [10] MODALES
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(5,10,7,.85);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:20px;overflow-y:auto;
}
body.light .modal-overlay{background:rgba(20,30,20,.4);}
.modal-overlay.visible{display:flex;}

.modal{
  background:var(--bg-panel);
  border:2px solid var(--borde-fuerte);
  border-radius:12px;
  max-width:780px;width:100%;max-height:92vh;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5);
  position:relative;
  animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--ambar) 0%, var(--verde) 50%, var(--ambar) 100%);
  z-index:1;
}
.modal-form{max-width:740px;}
.modal-vista{max-width:980px;}

.modal-header{
  padding:18px 24px;
  border-bottom:2px solid var(--borde);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(180deg, var(--bg-elevado), var(--bg-panel));
}
.modal-header h2{
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto);font-weight:700;
  flex:1;min-width:0;word-break:break-word;
}
.modal-close{
  width:34px;height:34px;
  background:var(--gris-metal);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  color:var(--texto-suave);
  cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;flex-shrink:0;
}
.modal-close:hover{
  background:var(--rojo);
  border-color:var(--rojo-brillante);
  color:white;
  transform:rotate(90deg);
  box-shadow:0 0 16px var(--rojo-glow);
}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1;min-height:200px;}

/* ============================================================
   [11] BOTONES DE ACCIÓN
   ============================================================ */
.btn-nav{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg, var(--gris-metal-claro), var(--gris-metal));
  color:var(--texto);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  padding:10px 18px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-weight:700;
  transition:all .15s ease;
  margin-bottom:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.3);
}
.btn-nav:hover{
  background:linear-gradient(180deg, var(--ambar), #c68a1a);
  color:var(--bg-terminal);
  transform:translateY(-1px);
  box-shadow:0 4px 12px var(--ambar-glow);
}
.btn-nav:active{transform:translateY(1px);}

.btn-imprimir{
  background:linear-gradient(180deg, var(--verde-brillante), var(--verde));
  color:var(--bg-terminal);
  border:none;
  border-radius:6px;
  padding:12px 22px;
  font-size:11px;font-weight:800;letter-spacing:2px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:all .15s ease;
  text-transform:uppercase;
  margin-bottom:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 3px 8px rgba(0,0,0,.3);
}
.btn-imprimir:hover{
  transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px var(--verde-glow);
}
.btn-imprimir:active{transform:translateY(0);}

.modal-titulo-seccion{
  text-align:center;padding:10px 0 18px;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto-suave);font-weight:700;
  border-bottom:1px solid var(--borde);margin-bottom:18px;
}

/* ============================================================
   [12] TARJETAS DE OFICINA
   ============================================================ */
.oficina-card{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(180deg, var(--bg-card), var(--bg-panel));
  border:1px solid var(--borde);
  border-left:4px solid var(--azul);
  border-radius:6px;
  padding:16px 18px;margin-bottom:12px;
  cursor:pointer;transition:all .2s ease;
}
.oficina-card:hover{
  border-color:var(--azul);
  border-left-color:var(--ambar);
  background:var(--bg-hover);
  box-shadow:var(--sombra-panel), 0 0 20px var(--azul-glow);
  transform:translateX(4px);
}
.oficina-card-info{flex:1;min-width:0;}
.oficina-card-nombre{
  font-size:13px;font-weight:700;color:var(--texto);
  letter-spacing:.3px;margin-bottom:5px;
}
.oficina-card-id{
  font-family:var(--mono);
  font-size:10px;color:var(--azul);letter-spacing:1.5px;
}
.oficina-card-count{
  background:var(--bg-terminal);
  border:1px solid var(--azul);
  color:var(--azul);
  border-radius:4px;
  padding:8px 16px;
  font-size:14px;font-weight:800;
  flex-shrink:0;
  box-shadow:inset 0 0 8px rgba(74,158,255,.15);
}

/* ============================================================
   [13] FORMULARIO
   ============================================================ */
.form-persona{
  background:var(--bg-elevado);
  border:1px solid var(--borde);
  border-left:4px solid var(--ambar);
  border-radius:6px;
  padding:14px 16px;margin-bottom:14px;
}
.form-persona-titulo{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--ambar);font-weight:800;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;
}
.form-persona-titulo .num{
  background:var(--ambar);
  color:var(--bg-terminal);
  width:22px;height:22px;
  border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;
  box-shadow:0 0 12px var(--ambar-glow);
}
.form-grid{display:grid;grid-template-columns:1fr 2fr 1.2fr 1.2fr;gap:10px;margin-bottom:10px;}
.form-grid .form-group{margin-bottom:0;}
.form-group label{
  display:block;
  font-family:var(--mono);
  font-size:9px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--texto-suave);
  font-weight:700;margin-bottom:6px;
}
.form-group input{
  width:100%;padding:10px 12px;
  background:var(--bg-terminal);
  border:1px solid var(--borde-fuerte);
  border-radius:4px;
  color:var(--texto);
  font-family:var(--mono);font-size:13px;
  outline:none;
  transition:all .2s ease;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
}
.form-group input:focus{
  border-color:var(--ambar);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3), 0 0 0 3px var(--ambar-glow);
}
.form-group input::placeholder{color:var(--texto-muy-suave);}
.form-persona .form-grid{grid-template-columns:1fr 1.5fr 1fr 1fr;}

.form-actions{
  display:flex;gap:12px;justify-content:flex-end;
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--borde);
}
.btn-cancelar{
  background:transparent;
  color:var(--texto-suave);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  padding:11px 20px;
  font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .2s ease;
}
.btn-cancelar:hover{
  background:var(--gris-metal);
  color:var(--texto);
  border-color:var(--texto-suave);
}
.btn-confirmar{
  background:linear-gradient(180deg, var(--ambar-brillante), var(--ambar));
  color:var(--bg-terminal);
  border:none;
  border-radius:6px;
  padding:11px 24px;
  font-size:11px;font-weight:900;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .15s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 3px 8px rgba(0,0,0,.3);
}
.btn-confirmar:hover{
  transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px var(--ambar-glow);
}
.btn-confirmar:active{transform:translateY(0);}

@media (max-width:600px){
  .form-grid, .form-persona .form-grid{grid-template-columns:1fr 1fr;}
  .form-grid .form-group.ancho-completo{grid-column:1 / -1;}
}

/* ============================================================
   [14] TABLAS EN APP
   ============================================================ */
.tabla-section{
  margin-bottom:22px;
  background:var(--bg-panel);
  border:1px solid var(--borde);
  border-radius:8px;
  overflow:hidden;
  box-shadow:var(--sombra-panel);
}
.tabla-header{
  padding:12px 18px;
  background:linear-gradient(180deg, var(--bg-elevado), var(--bg-panel));
  border-bottom:2px solid var(--borde);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.tabla-header-titulo{
  display:flex;align-items:center;gap:10px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--texto);font-weight:700;
}
.tabla-header-titulo .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--color,var(--ambar));
  box-shadow:0 0 10px var(--color,var(--ambar));
}
.tabla-header[data-color="verde"]{--color:var(--verde);}
.tabla-header[data-color="azul"]{--color:var(--azul);}
.tabla-header[data-color="marron"]{--color:var(--ambar);}
.tabla-header[data-color="vino"]{--color:var(--rojo);}
.tabla-header-count{
  font-family:var(--mono);
  font-size:12px;color:var(--ambar);
  font-weight:800;
  background:var(--bg-terminal);
  border:1px solid var(--ambar);
  border-radius:4px;
  padding:3px 12px;
}
.tabla-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;min-width:400px;}
thead th{
  background:var(--bg-terminal);
  color:var(--texto-suave);
  text-align:left;
  padding:11px 12px;
  font-size:9px;letter-spacing:2px;
  text-transform:uppercase;font-weight:700;
  border-bottom:2px solid var(--borde-fuerte);
}
tbody td{
  padding:11px 12px;
  border-bottom:1px solid var(--borde);
  color:var(--texto);vertical-align:top;
  word-break:break-word;
  font-family:Arial,sans-serif;font-size:11px;
}
tbody tr{cursor:pointer;transition:all .15s ease;}
tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
body.light tbody tr:nth-child(even){background:rgba(0,0,0,.015);}
tbody tr:hover{background:var(--bg-hover);}
tbody tr:active{background:var(--gris-metal);}

/* ============================================================
   [15] BADGES DE ESTADO
   ============================================================ */
.estado-badge{
  display:inline-block;padding:4px 12px;
  font-family:var(--mono);
  font-size:10px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;
  border-radius:3px;
  border:1px solid;
}
.estado-regular{color:var(--ambar);border-color:var(--ambar);background:rgba(232,169,58,.08);}
.estado-malo{color:var(--rojo);border-color:var(--rojo);background:rgba(214,69,69,.08);}
.estado-bueno{color:var(--verde);border-color:var(--verde);background:rgba(124,179,66,.08);}
.estado-pendiente{
  color:var(--rojo);border-color:var(--rojo);background:rgba(214,69,69,.15);
  animation:blink 1.5s ease-in-out infinite;
}

/* ============================================================
   [16] ENCABEZADO DE OFICINA
   ============================================================ */
.oficina-encabezado{
  background:linear-gradient(135deg, var(--bg-elevado), var(--bg-panel));
  border:1px solid var(--borde);
  border-left:4px solid var(--ambar);
  border-radius:6px;
  padding:16px 18px;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  box-shadow:var(--sombra-panel);
}
.oficina-encabezado-nombre{
  font-size:14px;font-weight:800;color:var(--texto);margin-bottom:5px;
}
.oficina-encabezado-sub{
  font-family:var(--mono);
  font-size:10px;color:var(--ambar-brillante);
  letter-spacing:1.5px;text-transform:uppercase;
}
.oficina-encabezado-count{
  background:var(--bg-terminal);
  border:1px solid var(--ambar);
  color:var(--ambar);
  border-radius:4px;
  padding:8px 16px;
  font-size:14px;font-weight:800;
  flex-shrink:0;
  box-shadow:inset 0 0 8px rgba(232,169,58,.15);
}

/* ============================================================
   [17] DETALLE DEL BIEN
   ============================================================ */
.bien-detalle{
  background:var(--bg-panel);
  border:1px solid var(--borde);
  border-radius:10px;
  overflow:hidden;
  box-shadow:var(--sombra-panel);
}
.bien-detalle-header{
  padding:22px;
  background:linear-gradient(135deg, var(--bg-elevado), var(--bg-panel));
  border-bottom:3px solid var(--ambar);
  display:flex;gap:18px;align-items:flex-start;
}
.bien-detalle-foto{
  width:92px;height:92px;
  background:var(--bg-terminal);
  border:2px solid var(--ambar);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;color:var(--ambar);
  flex-shrink:0;overflow:hidden;cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 0 20px var(--ambar-glow);
}
.bien-detalle-foto:hover{
  box-shadow:0 0 30px var(--ambar-glow);
  transform:scale(1.03);
}
.bien-detalle-foto img{width:100%;height:100%;object-fit:cover;}
.bien-detalle-codigo{
  font-family:var(--mono);
  font-size:11px;color:var(--ambar);
  letter-spacing:2px;font-weight:800;text-transform:uppercase;
  margin-bottom:8px;
}
.bien-detalle-nombre{
  font-size:15px;font-weight:700;color:var(--texto);
  line-height:1.35;margin-bottom:10px;
}
.bien-detalle-tipo-badge{
  display:inline-block;padding:4px 12px;
  font-size:9px;font-weight:800;letter-spacing:1.8px;
  text-transform:uppercase;
  border-radius:3px;
}
.bien-detalle-tipo-badge.fijos{color:var(--verde);background:rgba(124,179,66,.1);border:1px solid var(--verde);}
.bien-detalle-tipo-badge.fungibles{color:var(--azul);background:rgba(74,158,255,.1);border:1px solid var(--azul);}
.bien-detalle-tipo-badge.internos{color:var(--ambar);background:rgba(232,169,58,.1);border:1px solid var(--ambar);}
.bien-detalle-tipo-badge.prestados{color:var(--rojo);background:rgba(214,69,69,.1);border:1px solid var(--rojo);}
.bien-detalle-campos{padding:0;}
.bien-detalle-campo{
  display:flex;gap:16px;align-items:flex-start;
  padding:14px 22px;
  border-bottom:1px solid var(--borde);
}
.bien-detalle-campo:last-child{border-bottom:none;}
.bien-detalle-campo:nth-child(even){background:rgba(255,255,255,.015);}
body.light .bien-detalle-campo:nth-child(even){background:rgba(0,0,0,.015);}
.bien-detalle-label{
  flex:0 0 38%;
  font-family:var(--mono);
  font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:700;color:var(--texto-suave);
  padding-top:2px;
}
.bien-detalle-valor{
  flex:1;font-size:12px;color:var(--texto);
  line-height:1.4;word-break:break-word;
}
.bien-detalle-valor.vacio{color:var(--texto-muy-suave);font-style:italic;}
.bien-detalle-valor.pendiente{color:var(--rojo);font-weight:800;text-transform:uppercase;}

/* ============================================================
   [18] ESTADOS VACÍOS / LOADING
   ============================================================ */
.empty-state{
  text-align:center;padding:70px 20px;
  color:var(--texto-suave);
  animation:fadeIn .6s ease both;
}
.empty-state-icon{
  font-size:70px;margin-bottom:18px;opacity:.3;
  color:var(--ambar);
  filter:drop-shadow(0 0 16px var(--ambar-glow));
}
.empty-state-title{
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto);margin-bottom:10px;font-weight:700;
}
.empty-state-sub{font-size:12px;color:var(--texto-muy-suave);letter-spacing:.5px;}
.loading,.error{
  text-align:center;padding:40px;
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  font-weight:700;
}
.loading{color:var(--ambar);}
.error{color:var(--rojo);}

/* ============================================================
   [19] FOOTER
   ============================================================ */
.footer{
  text-align:center;padding:24px 22px;
  border-top:2px solid var(--borde);
  font-size:9px;letter-spacing:4px;text-transform:uppercase;
  color:var(--texto-muy-suave);font-weight:700;
  margin-top:auto;
  background:linear-gradient(0deg, var(--bg-terminal), transparent);
  position:relative;
}
.footer::before{
  content:"";
  position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:80px;height:2px;
  background:var(--ambar);
  box-shadow:0 0 12px var(--ambar-glow);
}

/* ============================================================
   [20] LIGHTBOX / TOAST
   ============================================================ */
.lightbox{
  position:fixed;inset:0;
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(10px);
  z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:30px;cursor:zoom-out;
}
.lightbox.visible{display:flex;}
.lightbox img{
  max-width:100%;max-height:100%;
  border-radius:6px;
  box-shadow:0 0 60px var(--ambar-glow);
  border:2px solid var(--ambar);
  animation:lightboxIn .3s ease;
}
@keyframes lightboxIn{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}

.toast{
  position:fixed;top:90px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:var(--bg-panel);
  color:var(--texto);
  border:2px solid var(--ambar);
  border-radius:8px;
  padding:14px 24px;
  z-index:300;
  font-family:var(--mono);
  font-size:12px;letter-spacing:1.5px;font-weight:700;
  box-shadow:0 20px 50px rgba(0,0,0,.7), 0 0 30px var(--ambar-glow);
  opacity:0;pointer-events:none;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:12px;
  max-width:90vw;
}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--verde);box-shadow:0 20px 50px rgba(0,0,0,.7), 0 0 30px var(--verde-glow);}
.toast.error{border-color:var(--rojo);box-shadow:0 20px 50px rgba(0,0,0,.7), 0 0 30px var(--rojo-glow);}
.toast.info{border-color:var(--azul);}
.toast-icon{font-size:16px;}

/* ============================================================
   [21] VISTA PREVIA DEL ACTA
   ============================================================ */
.preview-acta-wrap{
  background:#fff;color:#000;
  padding:30px 40px;
  font-family:Arial, sans-serif;
  font-size:11pt;line-height:1.0;
  box-shadow:0 0 0 1px #ccc inset;
  max-height:65vh;overflow-y:auto;
}
.preview-acta-wrap, .preview-acta-wrap *{color:#000;}

.preview-actions{
  padding:16px 22px;
  border-top:2px solid var(--borde);
  display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;
  background:var(--bg-panel);
}
.btn-preview{
  background:linear-gradient(180deg, var(--gris-metal-claro), var(--gris-metal));
  color:var(--texto);
  border:1px solid var(--borde-fuerte);
  border-radius:6px;
  padding:11px 18px;
  font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .15s ease;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.3);
}
.btn-preview:hover{
  background:linear-gradient(180deg, var(--ambar), #c68a1a);
  color:var(--bg-terminal);
  transform:translateY(-1px);
  box-shadow:0 4px 12px var(--ambar-glow);
}
.btn-preview:active{transform:translateY(1px);}
.btn-preview.primary{
  background:linear-gradient(180deg, var(--ambar-brillante), var(--ambar));
  color:var(--bg-terminal);
  border-color:transparent;
  font-weight:900;
}
.btn-preview.primary:hover{
  box-shadow:0 6px 16px var(--ambar-glow);
}
.btn-preview.green{
  background:linear-gradient(180deg, var(--verde-brillante), var(--verde));
  color:var(--bg-terminal);
  border-color:transparent;
  font-weight:900;
}
.btn-preview.green:hover{
  box-shadow:0 6px 16px var(--verde-glow);
}

.preview-acta-wrap .page-break-indicator{
  display:block;height:26px;
  background:repeating-linear-gradient(90deg,#d0d0d0 0px,#d0d0d0 8px,transparent 8px,transparent 16px);
  margin:12px -40px;
  position:relative;text-align:center;
  font-size:9pt;color:#666;letter-spacing:1px;line-height:26px;
}
.preview-acta-wrap .page-break-indicator::before{
  content:"▲ PÁGINA SIGUIENTE ▲";
  background:#fff;padding:0 12px;font-weight:bold;font-size:8pt;
}

/* ============================================================
   [22] CONTENEDOR DE MEDICIÓN DEL ACTA
   ============================================================ */
.acta-medicion{
  position:absolute;left:-99999px;top:0;
  visibility:hidden;pointer-events:none;
  width:21.59cm;padding:0;margin:0;
  font-family:Arial, sans-serif;
  font-size:11pt;line-height:1.0;color:#000;background:#fff;
}

/* ============================================================
   [23] ACTA — ESTILOS COMPARTIDOS

<script>
/* ============================================================
   [S01] CONFIGURACIÓN GLOBAL
   ============================================================ */
const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "control_div10_data_v1";
const CACHE_HOJA_KEY = "control_div10_cache_ts";

const ALTURA_UTIL_HOJA = 890;

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {
  pantalla: "home",
  modalVista: "oficinas",
  responsableActual: null,
  oficinaActual: null,
  bienActual: null,
  vistaGeneralActual: null,
  oficinaFiltroActual: null
};

let actaEnProceso = { responsable: null, oficina: null, datos: null, html: null };

/* ============================================================
   [S02] TEMA CLARO / OSCURO
   ============================================================ */
function cargarTema(){
  const guardado = localStorage.getItem("tema");
  if(guardado === "light"){
    document.body.classList.add("light");
    document.getElementById("themeIcon").textContent = "◑";
  }
}
function toggleTheme(){
  document.body.classList.toggle("light");
  const isLight = document.body.classList.contains("light");
  document.getElementById("themeIcon").textContent = isLight ? "◑" : "◐";
  localStorage.setItem("tema", isLight ? "light" : "dark");
}
cargarTema();

/* ============================================================
   [S03] NOTIFICACIONES TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){
  const toast = document.getElementById("toast");
  const iconEl = document.getElementById("toastIcon");
  const msgEl = document.getElementById("toastMsg");
  toast.className = "toast visible " + tipo;
  if(icono) iconEl.textContent = icono;
  else if(tipo === "success") iconEl.textContent = "✔";
  else if(tipo === "error") iconEl.textContent = "⚠";
  else iconEl.textContent = "ℹ";
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("visible"); }, 3200);
}

/* ============================================================
   [S04] UTILIDADES GENERALES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   [S04.1] EFECTOS DE CLICK
   ============================================================ */
function aplicarEfectoClick(el, x, y){
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.4;
  const clickX = (x !== undefined ? x : rect.left + rect.width / 2) - rect.left;
  const clickY = (y !== undefined ? y : rect.top + rect.height / 2) - rect.top;

  const posOriginal = getComputedStyle(el).position;
  if(posOriginal === "static") el.style.position = "relative";
  if(getComputedStyle(el).overflow === "visible") el.style.overflow = "hidden";

  const r1 = document.createElement("span");
  r1.className = "click-ripple cian";
  r1.style.width = size + "px";
  r1.style.height = size + "px";
  r1.style.left = (clickX - size / 2) + "px";
  r1.style.top = (clickY - size / 2) + "px";
  el.appendChild(r1);

  setTimeout(() => {
    const r2 = document.createElement("span");
    r2.className = "click-ripple magenta";
    r2.style.width = size * 0.7 + "px";
    r2.style.height = size * 0.7 + "px";
    r2.style.left = (clickX - size * 0.35) + "px";
    r2.style.top = (clickY - size * 0.35) + "px";
    el.appendChild(r2);
    setTimeout(() => r2.remove(), 600);
  }, 80);

  el.classList.remove("click-flash");
  void el.offsetWidth;
  el.classList.add("click-flash");
  setTimeout(() => el.classList.remove("click-flash"), 450);

   ============================================================ */
const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];
function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";
  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}
function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

/* ============================================================
   [S06] NOMBRES
   ============================================================ */
function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();
  return tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  }).join(" ");
}
function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();
  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

  const mapa = {1:"1RA.",2:"2DA.",3:"3RA.",4:"4TA.",5:"5TA.",6:"6TA.",7:"7MA.",8:"8VA.",9:"9NA.",10:"10MA."};

function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);
  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   [S09] PARSER CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");
  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          console.log("✔ Datos desde caché");
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }
  cont.innerHTML = `<div class="loading">◈ SINCRONIZANDO CON EL SERVIDOR...</div>`;
  document.getElementById("statusText").textContent = "SYNC";
  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];
    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );
    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });
    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));
    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());
    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();
  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error">⚠ NO SE PUDIERON CARGAR LOS DATOS<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}
function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
}
function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return DATA.resp.find(x => getVal(x, "ID") === id.trim()) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  const idLimpio = (id || "").trim();
  let total = 0;
  total += DATA.fijos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.fungibles.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.internos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.prestados.filter(o => obtenerIdAsig(o) === idLimpio).length;
  return total;
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}
function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];

function buscarBienesPorCodigo(termino){
  const t = norm(termino);

function buscarBienesPorIdAsig(idAsig){
  const t = norm(idAsig);
  return todosLosBienes().filter(b => norm(obtenerIdAsig(b)) === t);
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],

  });

}

/* ============================================================
   [S18] GENERAR HTML DEL ACTA — LLENADO EXACTO v7
   ------------------------------------------------------------
   CAMBIOS V6.1:
     1. El subtítulo NUNCA queda huérfano. Antes de escribir el
        título, se verifica que el bloque MÍNIMO (gap + título +
        thead + 1ra fila) quepa en el espacio restante.
        Si NO cabe → page-break ANTES del título.
     2. Se mide el gap real de .acta-seccion y se suma.
     3. Se mide fila por fila para máximo aprovechamiento.
     4. Encabezado de continuación SOLO si las firmas van solas.
   ============================================================ */
function generarHTMLActa(r, oficina, datos){
  const idAsignacion = oficina.id;
  const fijos = DATA.fijos.filter(b => obtenerIdAsig(b) === idAsignacion);
  const fungibles = DATA.fungibles.filter(b => obtenerIdAsig(b) === idAsignacion);
  const internos = DATA.internos.filter(b => obtenerIdAsig(b) === idAsignacion);
  const prestados = DATA.prestados.filter(b => obtenerIdAsig(b) === idAsignacion);

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;
  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  const salienteGrado = r.grado || "";
  const salienteNombres = r.nombres || "";
  const salienteApPat = r.apPat || "";
  const salienteApMat = r.apMat || "";
  let nombreSaliente = construirNombreFirmante(salienteGrado, salienteNombres, salienteApPat, salienteApMat);
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = r.nombre || "";
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();

  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat);
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const tituloL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()} DE LA <span style="white-space:nowrap">DIV-10</span>`;

  /* ============================================================
     [S18.1] MEDICIÓN
     ============================================================ */
  const contMed = document.getElementById("actaMedicion");
  function medirHTML(html){
    contMed.innerHTML = html;
    void contMed.offsetHeight;
    return contMed.scrollHeight;
  }

  const headerHTML = `
    <div class="acta-membrete">
      <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
      <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
      <div class="linea3">BOLIVIA</div>
    </div>
    <div class="acta-titulo">
      <span class="titulo-linea1">${esc(tituloL1)}</span>
      <span class="titulo-linea2">${tituloL2}</span>
    </div>
  `;
  const headerAltura = medirHTML(headerHTML);

  const firmasHTML = generarBloqueFirmas({
    nombreSaliente, cargoSaliente, nombreEntrante, cargoEntrante,
    nombreSup1, cargoSup1, nombreSup2, cargoSup2,
    nombreVobo, cargoVobo, fechaLarga
  });
  const firmasAltura = medirHTML(firmasHTML);

  const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);

  function generarEncabezadoContinuacion(numHoja){
    const texto = `${ordinalHoja(numHoja)} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;
    let h = `<div class="acta-continuacion">${esc(texto)}</div>`;
    if(resumenBienes){
      h += `<div class="acta-continuacion-resumen">${esc(resumenBienes)}</div>`;
    }
    return h;
  }

  /* ============================================================
     [S18.2] CONSTRUCCIÓN DE SECCIONES CON ALTURA POR FILA
     ============================================================ */
  const seccionesDef = [
    { nombre: "FIJOS",     num: "I.- ",   titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", lista: fijos,     tipo: "fijos" },
    { nombre: "FUNGIBLES", num: "II.- ",  titulo: "INVENTARIO DE ACTIVOS FUNGIBLES",     lista: fungibles, tipo: "fungibles" },
    { nombre: "INTERNOS",  num: "III.- ", titulo: "INVENTARIO INTERNO",                  lista: internos,  tipo: "internos" },
    { nombre: "PRESTADOS", num: "IV.- ",  titulo: "INVENTARIO DE BIENES PRESTADOS",      lista: prestados, tipo: "prestados" }
  ];

  function medirThead(tipo){
    const html = `<table class="acta-tabla"><thead><tr>${columnasDeTipo(tipo)}</tr></thead></table>`;
    return medirHTML(html);
  }

  function medirFilaIncremental(filaHTML, tipo, alturaThead){
    const htmlCon = `<table class="acta-tabla"><thead><tr>${columnasDeTipo(tipo)}</tr></thead><tbody>${filaHTML}</tbody></table>`;
    const totalCon = medirHTML(htmlCon);
    return Math.max(totalCon - alturaThead, 14);
  }

  function medirTituloSeccion(num, titulo){
    const html = `<div class="acta-seccion"><div class="acta-seccion-titulo">${num}<span class="subrayado">${esc(titulo)}</span>.</div></div>`;
    return medirHTML(html);
  }

  function medirGapSeccion(){
    const html = `<div class="acta-seccion"></div>`;
    return medirHTML(html);
  }
  const gapSeccion = medirGapSeccion();

  const secciones = seccionesDef.map(sec => {
    const alturaThead = medirThead(sec.tipo);
    const alturaTitulo = medirTituloSeccion(sec.num, sec.titulo);

    if(!sec.lista.length){
      const filaVacia = `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr>`;
      const alturaFila = medirFilaIncremental(filaVacia, sec.tipo, alturaThead);
      return {
        ...sec,
        alturaTitulo,
        alturaThead,
        filas: [{ html: filaVacia, altura: alturaFila }],
        vacia: true
      };
    }

    const filas = sec.lista.map((b, i) => {
      const filaStr = generarFilaTabla(b, i, sec.tipo);
      const altura = medirFilaIncremental(filaStr, sec.tipo, alturaThead);
      return { html: filaStr, altura };
    });

    return {
      ...sec,
      alturaTitulo,
      alturaThead,
      filas,
      vacia: false
    };
  });

  /* ============================================================
     [S18.3] EMPAQUETADOR — LLENADO EXACTO POR FILA
     ------------------------------------------------------------
     Regla de oro: el subtítulo NUNCA queda huérfano.
     Antes de escribir el título de la sección, se verifica que
     el bloque mínimo (gap + título + thead + 1ra fila) quepa.
     Si no cabe → page-break ANTES del título.
     ============================================================ */
  let htmlFinal = "";
  let alturaAcumulada = 0;
  let hojaActual = 1;

  htmlFinal += headerHTML;
  alturaAcumulada += headerAltura;

  for(let s = 0; s < secciones.length; s++){
    const sec = secciones[s];

    /* Espacio necesario para el INICIO COMPLETO de la sección */
    const primeraFilaAltura = sec.filas.length > 0 ? sec.filas[0].altura : 0;
    const espacioNecesarioInicio = gapSeccion + sec.alturaTitulo + sec.alturaThead + primeraFilaAltura;
    const espacioRestanteInicial = ALTURA_UTIL_HOJA - alturaAcumulada;

    /* Si NO cabe el inicio completo Y ya hay contenido en la hoja → page-break */
    if(espacioNecesarioInicio > espacioRestanteInicial && alturaAcumulada > 0){
      htmlFinal += `<div class="saltar-pagina"></div>`;
      hojaActual++;
      alturaAcumulada = 0;
    }

    /* Escribir título + tabla con thead */
    htmlFinal += `<div class="acta-seccion">`;
    htmlFinal += `<div class="acta-seccion-titulo">${sec.num}<span class="subrayado">${esc(sec.titulo)}</span>.</div>`;
    htmlFinal += `<table class="acta-tabla"><thead><tr>${columnasDeTipo(sec.tipo)}</tr></thead><tbody>`;
    alturaAcumulada += gapSeccion + sec.alturaTitulo + sec.alturaThead;

    /* Colocar filas una por una */
    for(let f = 0; f < sec.filas.length; f++){
      const fila = sec.filas[f];
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

      if(fila.altura <= espacioRestante){
        htmlFinal += fila.html;
        alturaAcumulada += fila.altura;
      } else {
        /* No cabe → cerrar tabla, page-break, reabrir con thead */
        htmlFinal += `</tbody></table></div>`;
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = 0;

        htmlFinal += `<div class="acta-seccion">`;
        htmlFinal += `<table class="acta-tabla"><thead><tr>${columnasDeTipo(sec.tipo)}</tr></thead><tbody>`;
        alturaAcumulada += gapSeccion + sec.alturaThead;

        htmlFinal += fila.html;
        alturaAcumulada += fila.altura;
      }
    }

    htmlFinal += `</tbody></table></div>`;
  }

  /* ============================================================
     [S18.4] DECISIÓN DE LAS FIRMAS
     ============================================================ */
  const espacioParaFirmas = ALTURA_UTIL_HOJA - alturaAcumulada;

  if(firmasAltura <= espacioParaFirmas){
    htmlFinal += firmasHTML;
  } else {
    htmlFinal += `<div class="saltar-pagina"></div>`;
    hojaActual++;
    const enc = generarEncabezadoContinuacion(hojaActual);
    htmlFinal += enc;
    htmlFinal += firmasHTML;
  }

  return htmlFinal;
}

/* ============================================================
   [S19] HELPERS DE TABLA DEL ACTA
   ============================================================ */
function columnasDeTipo(tipo){
  if(tipo === "fijos"){
    return `<th style="width:8%;">N°</th><th style="width:22%;">CÓDIGO (VSIAF.)</th><th style="width:55%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  }
  return `<th style="width:8%;">N°</th><th style="width:10%;">CANTIDAD</th><th style="width:67%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
}
function generarFilaTabla(b, i, tipo){
  const codigo = getVal(b, "CODIGO");
  const cant = getVal(b, "CANTIDAD");
  const desc = getVal(b, "DESCRIPCION DEL ACTIVO");
  const estado = getVal(b, "ESTADO");
  if(tipo === "fijos"){
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(codigo)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  }
  return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(cant)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
}

/* ============================================================
   [S20] BLOQUE DE FIRMAS
   ============================================================ */
function generarBloqueFirmas(d){
  let bloqueFirmasHTML = `
    <div class="acta-firmas-fila">
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">ENTREGUÉ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreSaliente)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSaliente)}</div>
      </div>
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">RECIBÍ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreEntrante)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoEntrante)}</div>
      </div>
    </div>
  `;
  if(d.nombreSup1 && d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firmas-fila">
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
        </div>
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
        </div>
      </div>`;
  } else if(d.nombreSup1){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
      </div>`;
  } else if(d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
      </div>`;
  }
  bloqueFirmasHTML += `
    <div class="acta-firma-bloque">
      <div class="acta-vobo">Vo. Bo.</div>
      <div class="acta-firma-nombre">${esc(d.nombreVobo)}</div>
      <div class="acta-firma-cargo">${esc(d.cargoVobo)}</div>
    </div>
  `;
  return `<div class="acta-bloque-firmas">
    <div class="acta-fecha-firmas">${esc(d.fechaLarga)}</div>
    <div class="acta-firmas">${bloqueFirmasHTML}</div>
  </div>`;
}

/* ============================================================
   [S21] MESES
   ============================================================ */
function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

/* ============================================================
   [S22] LIGHTBOX
   ============================================================ */
function abrirLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }

/* ============================================================
   [S23] ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

/* ============================================================
   [S24] INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  try{
    history.replaceState({ pantalla: "home" }, "");
    history.pushState({ pantalla: "home" }, "");
  }catch(e){}
  cargarDesdeNube(false);
});
