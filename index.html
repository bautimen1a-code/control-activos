<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control DIV-10 V5.5</title>

<!-- jsPDF + autoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- PDF.js para renderizar PDF en canvas (móvil) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --bg:#faf8f3;
    --bg-panel:#ffffff;
    --bg-elevado:#f5f2ea;
    --bg-hover:#ebe6d9;
    --texto:#2c2820;
    --texto-suave:#6b6455;
    --texto-muy-suave:#9a9182;
    --borde:rgba(120,95,45,.22);
    --sombra-panel:0 4px 16px rgba(80,60,20,.08);
    --dorado:#8b6f2d;
    --dorado-brillante:#b8935a;
    --dorado-glow:rgba(139,111,45,.3);
    --cian:#4a7c7e;
    --cian-brillante:#6ba8aa;
    --cian-glow:rgba(74,124,126,.25);
    --verde:#5c8b3a;
    --verde-glow:rgba(92,139,58,.25);
    --rojo:#b53a3a;
    --rojo-glow:rgba(181,58,58,.25);
    --amarillo:#c68a1e;
    --vino:#8b3a5e;
    --mono:"JetBrains Mono","Consolas","Monaco",monospace;
    --sans:"Inter","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);background:var(--bg);color:var(--texto);
    font-size:14px;min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;position:relative;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-elevado);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--dorado-brillante),var(--dorado));border-radius:5px;border:2px solid var(--bg-elevado);}
  ::-webkit-scrollbar-thumb:hover{background:var(--dorado);}
  .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-layer::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(139,111,45,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(139,111,45,.05) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 30s linear infinite;}
  @keyframes gridMove{from{transform:translate(0,0);}to{transform:translate(50px,50px);}}
  .bg-layer::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,rgba(74,124,126,.05) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(139,111,45,.04) 0%,transparent 40%);animation:pulseBg 10s ease-in-out infinite;}
  @keyframes pulseBg{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}
  .scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cian),transparent);opacity:.15;z-index:1;pointer-events:none;animation:scanline 12s linear infinite;}
  @keyframes scanline{from{top:0;}to{top:100vh;}}
  .app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

  .header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(250,248,243,.95));backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);padding:16px 20px;overflow:hidden;}
  .header::after{content:"";position:absolute;bottom:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--dorado),var(--cian),var(--dorado),transparent);background-size:200% 100%;animation:borderFlow 4s linear infinite;}
  @keyframes borderFlow{from{background-position:200% 0;}to{background-position:-200% 0;}}
  .header-content{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .header-logo{display:flex;align-items:center;gap:12px;}
  .header-logo-icon{width:40px;height:40px;border:2px solid var(--dorado);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dorado);background:rgba(139,111,45,.06);animation:pulseGlow 4s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--dorado-glow);}50%{box-shadow:0 0 15px 3px var(--dorado-glow);}}
  .header-text h1{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#2c2820,var(--dorado));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .btn-icon{width:40px;height:40px;background:var(--bg-panel);border:1px solid var(--borde);border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s ease;flex-shrink:0;color:var(--texto-suave);}
  .btn-icon.cyan{color:var(--cian);}
  .btn-icon.cyan:hover{background:var(--cian);color:#fff;border-color:var(--cian-brillante);box-shadow:0 0 15px var(--cian-glow);transform:scale(1.05);}
  .btn-icon.spinning{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .header-status{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(74,124,126,.08);border:1px solid rgba(74,124,126,.25);border-radius:20px;font-size:10px;font-family:var(--mono);color:var(--cian);letter-spacing:1px;}
  .status-dot{width:8px;height:8px;background:var(--verde);border-radius:50%;box-shadow:0 0 8px var(--verde);animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .main{flex:1;padding:20px;max-width:1200px;margin:0 auto;width:100%;}

  .home{display:flex;flex-direction:column;gap:14px;padding-top:20px;animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .home-btn{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:22px 14px;cursor:pointer;transition:all .3s ease;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--sombra-panel);}
  .home-btn:hover{transform:translateY(-4px);border-color:var(--color,var(--dorado));box-shadow:0 10px 25px rgba(80,60,20,.15),0 0 20px color-mix(in srgb,var(--color,var(--dorado)) 25%,transparent);}
  .home-btn[data-color="verde"]{--color:var(--verde);}
  .home-btn[data-color="azul"]{--color:var(--cian);}
  .home-btn[data-color="marron"]{--color:#a88050;}
  .home-btn[data-color="vino"]{--color:var(--vino);}
  .home-btn[data-color="buscar"]{--color:var(--dorado);}
  .home-btn-icon{font-size:32px;color:var(--color,var(--dorado));}
  .home-btn-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:800;}
  .home-btn-count{font-size:26px;font-weight:800;color:var(--color,var(--dorado));font-family:var(--mono);}
  .home-btn.buscar{grid-column:span 4;padding:24px;background:linear-gradient(135deg,rgba(139,111,45,.06),rgba(139,111,45,.02));flex-direction:row;justify-content:center;gap:16px;}
  .home-btn.buscar .home-btn-icon{font-size:28px;}
  .home-btn.buscar .home-btn-label{font-size:14px;letter-spacing:3px;color:var(--dorado);}

  .modo-busqueda{animation:fadeIn .35s ease both;display:flex;flex-direction:column;gap:14px;min-height:60vh;}
  .modo-busqueda-top{display:flex;gap:10px;align-items:center;width:100%;min-width:0;}
  .btn-volver{display:inline-flex;align-items:center;gap:8px;background:var(--bg-panel);color:var(--dorado);border:1px solid var(--borde);padding:12px 14px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;border-radius:10px;font-weight:800;font-family:var(--sans);flex-shrink:0;transition:all .3s ease;white-space:nowrap;}
  .btn-volver:hover{background:var(--dorado);color:#fff;border-color:var(--dorado-brillante);transform:translateX(-4px);box-shadow:0 4px 12px var(--dorado-glow);}
  .search-wrapper{flex:1;min-width:0;position:relative;}
  .search-box{display:flex;align-items:center;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:4px 12px;width:100%;min-width:0;box-sizing:border-box;transition:all .3s ease;box-shadow:var(--sombra-panel);}
  .search-box:focus-within{border-color:var(--dorado);box-shadow:0 0 0 3px rgba(139,111,45,.1),0 0 20px rgba(139,111,45,.15);}
  .search-icon{color:var(--dorado);font-size:18px;margin-right:10px;flex-shrink:0;}
  .search-input{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:14px 0;font-size:15px;color:var(--texto);font-family:var(--sans);font-weight:500;letter-spacing:.5px;width:100%;box-sizing:border-box;}
  .search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:0;}
  .btn-clear{background:transparent;border:none;color:var(--texto-muy-suave);font-size:16px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;transition:all .25s ease;flex-shrink:0;padding:0;margin-left:8px;font-weight:800;}
  .btn-clear.visible{display:flex;}
  .btn-clear:hover{background:var(--rojo);color:#fff;transform:rotate(90deg) scale(1.1);box-shadow:0 0 12px var(--rojo-glow);}

  .list-title{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--borde);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;animation:fadeIn .4s ease both;}
  .list-title .list-count{background:var(--bg-panel);border:1px solid var(--borde);color:var(--dorado);padding:3px 12px;border-radius:12px;font-family:var(--mono);font-weight:800;}
  .resp-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:all .4s ease;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--sombra-panel);}
  .resp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--dorado),var(--cian));transform:scaleY(0);transform-origin:top;transition:transform .4s ease;}
  .resp-card:hover{transform:translateX(8px);border-color:var(--dorado);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 20px rgba(139,111,45,.12);}
  .resp-card:hover::before{transform:scaleY(1);}
  .resp-card-info{flex:1;min-width:0;}
  .resp-card-name{font-size:15px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:6px;transition:color .3s ease;}
  .resp-card:hover .resp-card-name{color:var(--dorado);}
  .resp-card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--texto-suave);font-family:var(--mono);}
  .resp-card-arrow{font-size:28px;color:var(--texto-muy-suave);transition:all .4s ease;flex-shrink:0;}
  .resp-card:hover .resp-card-arrow{color:var(--dorado);transform:translateX(8px);}

  .bien-card{position:relative;background:var(--bg-panel);border:1px solid var(--borde);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .4s ease;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--sombra-panel);}
  .bien-card:hover{transform:translateX(8px);border-color:var(--cian);background:var(--bg-elevado);box-shadow:var(--sombra-panel),0 0 20px rgba(74,124,126,.12);}
  .bien-card-thumb{width:56px;height:56px;background:var(--bg-elevado);border:1px solid var(--borde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--texto-muy-suave);flex-shrink:0;overflow:hidden;}
  .bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
  .bien-card-info{flex:1;min-width:0;}
  .bien-card-code{font-size:11px;font-family:var(--mono);color:var(--dorado);font-weight:700;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
  .bien-card-desc{font-size:13px;font-weight:600;color:var(--texto);line-height:1.3;margin-bottom:6px;}
  .bien-card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;font-family:var(--mono);color:var(--texto-suave);}
  .bien-card-tipo{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--bg-elevado);border:1px solid var(--borde);}
  .bien-card-tipo.fijos{color:var(--verde);border-color:var(--verde-glow);}
  .bien-card-tipo.fungibles{color:var(--cian);border-color:var(--cian-glow);}
  .bien-card-tipo.internos{color:#a88050;}
  .bien-card-tipo.prestados{color:var(--vino);}

  .modal-overlay{position:fixed;inset:0;background:rgba(44,40,32,.5);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .modal-overlay.visible{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--dorado);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(80,60,20,.25);}
  .modal-form{max-width:680px;}
  .modal-vista{max-width:900px;}
  .modal-header{padding:18px 22px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(139,111,45,.04),transparent);}
  .modal-header h2{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:700;flex:1;min-width:0;word-break:break-word;}
  .modal-close{width:32px;height:32px;background:transparent;border:1px solid var(--borde);color:var(--texto-suave);border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s ease;flex-shrink:0;}
  .modal-close:hover{background:var(--rojo);border-color:var(--rojo);color:white;transform:rotate(90deg);}
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1;min-height:200px;}

  .btn-nav{display:inline-flex;align-items:center;gap:8px;background:var(--bg-elevado);color:var(--dorado);border:1px solid var(--borde);padding:9px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:8px;font-weight:700;transition:all .3s ease;margin-bottom:16px;font-family:var(--sans);}
  .btn-nav:hover{background:var(--dorado);color:#fff;border-color:var(--dorado-brillante);transform:translateX(-4px);box-shadow:0 4px 12px var(--dorado-glow);}

  .modal-titulo-seccion{text-align:center;padding:8px 0 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;font-family:var(--mono);border-bottom:1px solid var(--borde);margin-bottom:16px;}

  .oficina-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg-elevado);border:1px solid var(--borde);border-left:4px solid var(--dorado);padding:14px 16px;margin-bottom:10px;border-radius:10px;cursor:pointer;transition:all .3s ease;}
  .oficina-card:hover{border-color:var(--dorado);border-left-color:var(--cian);background:var(--bg-hover);box-shadow:var(--sombra-panel),0 0 18px rgba(139,111,45,.12);transform:translateX(6px);}
  .oficina-card-info{flex:1;min-width:0;}
  .oficina-card-nombre{font-size:13px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:4px;}
  .oficina-card-id{font-size:10px;font-family:var(--mono);color:var(--cian);letter-spacing:1px;}
  .oficina-card-count{background:rgba(139,111,45,.1);border:1px solid var(--dorado);color:var(--dorado);padding:6px 14px;border-radius:14px;font-size:13px;font-weight:800;font-family:var(--mono);flex-shrink:0;}

  .btn-imprimir{background:linear-gradient(135deg,var(--verde),#3d6620);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:1.2px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s ease;font-family:var(--sans);text-transform:uppercase;margin-bottom:16px;}
  .btn-imprimir:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(92,139,58,.4);}

  .form-persona{background:var(--bg-elevado);border:1px solid var(--borde);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .form-persona-titulo{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cian);font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .form-persona-titulo .num{background:var(--cian);color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;}
  .form-grid{display:grid;grid-template-columns:1fr 2fr 1.2fr 1.2fr;gap:10px;margin-bottom:10px;}
  .form-grid .form-group{margin-bottom:0;}
  .form-group label{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--texto-suave);font-weight:800;margin-bottom:5px;}
  .form-group input{width:100%;padding:10px 12px;background:var(--bg-panel);border:1px solid var(--borde);border-radius:8px;color:var(--texto);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s ease;}
  .form-group input:focus{border-color:var(--dorado);box-shadow:0 0 0 2px rgba(139,111,45,.12);}
  .form-group input::placeholder{color:var(--texto-muy-suave);}
  .form-persona .form-grid{grid-template-columns:1fr 1.5fr 1fr 1fr;}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--borde);}
  .btn-cancelar{background:transparent;color:var(--texto-suave);border:1px solid var(--borde);padding:10px 18px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);}
  .btn-cancelar:hover{background:var(--bg-elevado);color:var(--texto);}
  .btn-confirmar{background:linear-gradient(135deg,var(--dorado),#6b5522);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);}
  .btn-confirmar:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--dorado-glow);}

  @media (max-width:600px){
    .form-grid, .form-persona .form-grid{grid-template-columns:1fr 1fr;}
    .form-grid .form-group.ancho-completo{grid-column:1 / -1;}
  }

  .tabla-section{margin-bottom:20px;background:var(--bg-panel);border:1px solid var(--borde);border-radius:10px;overflow:hidden;box-shadow:var(--sombra-panel);}
  .tabla-header{padding:12px 16px;background:linear-gradient(180deg,rgba(139,111,45,.05),transparent);border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .tabla-header-titulo{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--texto);font-weight:800;}
  .tabla-header-titulo .dot{width:8px;height:8px;border-radius:50%;background:var(--color,var(--dorado));box-shadow:0 0 8px var(--color,var(--dorado));}
  .tabla-header[data-color="verde"]{--color:var(--verde);}
  .tabla-header[data-color="azul"]{--color:var(--cian);}
  .tabla-header[data-color="marron"]{--color:#a88050;}
  .tabla-header[data-color="vino"]{--color:var(--vino);}
  .tabla-header-count{font-family:var(--mono);font-size:12px;color:var(--dorado);font-weight:800;background:rgba(139,111,45,.08);padding:2px 10px;border-radius:10px;border:1px solid rgba(139,111,45,.25);}
  .tabla-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;min-width:400px;}
  thead th{background:var(--bg-elevado);color:var(--texto-suave);text-align:left;padding:10px 12px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--borde);font-family:Arial,sans-serif;}
  tbody td{padding:10px 12px;border-bottom:1px solid rgba(120,95,45,.08);color:var(--texto);vertical-align:top;word-break:break-word;font-family:Arial,sans-serif;font-size:11px;}
  tbody tr{cursor:pointer;transition:all .2s ease;}
  tbody tr:nth-child(even){background:rgba(139,111,45,.025);}
  tbody tr:hover{background:rgba(139,111,45,.06);}

  .estado-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border:1px solid;}
  .estado-regular{color:var(--amarillo);border-color:rgba(198,138,30,.4);background:rgba(198,138,30,.08);}
  .estado-malo{color:var(--rojo);border-color:rgba(181,58,58,.4);background:rgba(181,58,58,.08);}

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "control_div10_data_v1";
const CACHE_HOJA_KEY = "control_div10_cache_ts";

/* Configurar worker de PDF.js */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {
  pantalla: "home",
  modalVista: "oficinas",
  responsableActual: null,
  oficinaActual: null,
  bienActual: null,
  vistaGeneralActual: null,
  oficinaFiltroActual: null
};

let actaEnProceso = { responsable: null, oficina: null, datos: null, pdfDoc: null, pdfBlobURL: null };

/* ============================================================
   DETECCIÓN DE MÓVIL
   ============================================================ */
function esDispositivoMovil(){
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop|webOS|BlackBerry/i.test(ua)
    || (window.innerWidth <= 768 && /Mobi|Tablet|Touch/i.test(ua))
    || (window.innerWidth <= 480);
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){
  const toast = document.getElementById("toast");
  const iconEl = document.getElementById("toastIcon");
  const msgEl = document.getElementById("toastMsg");
  toast.className = "toast visible " + tipo;
  if(icono) iconEl.textContent = icono;
  else if(tipo === "success") iconEl.textContent = "✔";
  else if(tipo === "error") iconEl.textContent = "⚠";
  else iconEl.textContent = "ℹ";
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("visible"); }, 3200);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function limpiarTexto(s){
  return (s || "").toString()
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "")
    .trim();
}
function esc(s){
  const limpio = limpiarTexto(s);
  return limpio.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return limpiarTexto(obj[k]);
    }
  }
  return "";
}
function mismoId(a, b){
  return norm(a) === norm(b);
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   ARTÍCULO DEFINIDO
   ============================================================ */
const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];

function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";
  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}

function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();
  return tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  }).join(" ");
}

function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();
  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

function ordinalHoja(n){
  const mapa = {1: "1RA.",2: "2DA.",3: "3RA.",4: "4TA.",5: "5TA.",6: "6TA.",7: "7MA.",8: "8VA.",9: "9NA.",10: "10MA."};
  if(mapa[n]) return mapa[n];
  return n + "VA.";
}

function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);
  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   PARSEO CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

   ============================================================ */
async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");
  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          console.log("✔ Datos desde caché");
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }

  cont.innerHTML = `<div class="loading fade-in">☁ Cargando datos desde Google Drive...</div>`;
  document.getElementById("statusText").textContent = "CARGANDO";

  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];

    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );

    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });

    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));

    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());

    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();

  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error fade-in">⚠ No se pudieron cargar los datos desde Drive<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}

function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];
  DATA.resp = obj.resp || [];
}

function contarCambios(antes, despues){
  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;
  });
  return cambios;
}

function getNombreCompletoResp(resp){
  if(!resp) return "";
  const grado = getVal(resp, "GRADO");
  const nombres = getVal(resp, "NOMBRES");
  const apPat = getVal(resp, "AP PAT");
  const apMat = getVal(resp, "AP MAT");
  return [grado, nombres, apPat, apMat].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}
function getCedulaResp(resp){ return getVal(resp, "CEDULA", "CÉDULA"); }
function getResponsablePorId(id){
  if(!id) return null;
  return DATA.resp.find(x => mismoId(getVal(x, "ID"), id)) || null;
}
function getNombreResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getNombreCompletoResp(r) : "DESCONOCIDO";
}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);
  return r ? getVal(r, "OFICINA") : "—";
}
function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  let total = 0;
  total += DATA.fijos.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.fungibles.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.internos.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  total += DATA.prestados.filter(o => mismoId(obtenerIdAsig(o), id)).length;
  return total;
}

function initBusquedaLive(){
  const input = document.getElementById("buscador");
  if(!input) return;
  let timer;
  input.addEventListener("input", e => {
    clearTimeout(timer);
    const val = e.target.value.trim();
    const btnClear = document.getElementById("btnClear");
    if(btnClear){
      if(val.length > 0) btnClear.classList.add("visible");
      else btnClear.classList.remove("visible");
    }
    if(val.length < 1){
      document.getElementById("resultados-busqueda").innerHTML = "";
      return;
    }
    timer = setTimeout(() => ejecutarBusqueda(val), 150);
  });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); ejecutarBusqueda(e.target.value.trim()); }
  });
}

function limpiarBusqueda(){
  const input = document.getElementById("buscador");
  if(!input) return;
  input.value = "";
  input.focus();
  const btnClear = document.getElementById("btnClear");
  if(btnClear) btnClear.classList.remove("visible");
  document.getElementById("resultados-busqueda").innerHTML = "";
}

function ejecutarBusqueda(texto){
  const val = (texto || document.getElementById("buscador").value || "").trim();
  const res = document.getElementById("resultados-busqueda");
  if(!val){ res.innerHTML = ""; return; }
  const tipo = detectarTipoBusqueda(val);
  if(tipo === "nombre") renderResultadosResponsables(val, res);
  else renderResultadosBienes(val, tipo, res);
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function todosLosBienes(){
  return [
    ...DATA.fijos.map(b => ({...b, __tipo: "FIJOS"})),
    ...DATA.fungibles.map(b => ({...b, __tipo: "FUNGIBLES"})),
    ...DATA.internos.map(b => ({...b, __tipo: "INTERNOS"})),
    ...DATA.prestados.map(b => ({...b, __tipo: "PRESTADOS"}))
  ];
}

function buscarBienesPorCodigo(termino){
  const t = norm(termino);
  return todosLosBienes().filter(b => norm(getVal(b, "CODIGO")).includes(t));
}
function buscarBienesPorIdAsig(idAsig){
  return todosLosBienes().filter(b => mismoId(obtenerIdAsig(b), idAsig));
}

function renderVistaGeneral(tipo, oficinaFiltro, textoBusqueda){
  const cont = document.getElementById("contenido");
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };

  const titulo = titulos[tipo] || tipo.toUpperCase();

      html += `<div class="empty-state"><div class="empty-state-icon">◌</div><div class="empty-state-title">Sin registros</div></div>`;
      cont.innerHTML = html;
      return;
    }
    const grupos = new Map();
    listaCompleta.forEach(b => {
      const idAsig = obtenerIdAsig(b);
      const ofi = getOficinaResponsablePorId(idAsig) || "SIN OFICINA";
      if(!grupos.has(ofi)) grupos.set(ofi, []);
      grupos.get(ofi).push(b);
    });
    const arr = Array.from(grupos.entries()).sort((a,b) => b[1].length - a[1].length);
    arr.forEach(([ofi, regs], i) => {
      html += `
        <div class="resp-card" style="animation-delay:${i * 20}ms" onclick="filtrarPorOficina('${escAttr(ofi)}')">
          <div class="resp-card-info">
            <div class="resp-card-name">${esc(ofi)}</div>
            <div class="resp-card-meta"><span>◈ ${regs.length} registro(s)</span></div>
          </div>
          <div class="resp-card-arrow">›</div>
        </div>`;
    });
    cont.innerHTML = html;

  }

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>
          <span class="bien-detalle-tipo-badge ${tipoClase}">${esc(tipo)}</span>
        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ============================================================
   Renderizar PDF con PDF.js como imágenes
   ============================================================ */
async function renderizarPDFEnCanvas(pdfDoc){
  const cont = document.getElementById("pdfCanvasContainer");
  if(!cont) return;

  try{
    const pdfArrayBuffer = pdfDoc.output("arraybuffer");
    const loadingTask = pdfjsLib.getDocument({ data: pdfArrayBuffer });
    const pdf = await loadingTask.promise;
    const numPages = pdf.numPages;

    cont.innerHTML = "";

    for(let pageNum = 1; pageNum <= numPages; pageNum++){
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.createElement("canvas");
      canvas.className = "pdf-page-canvas";
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = "100%";
      canvas.style.maxWidth = "800px";

      const context = canvas.getContext("2d");
      const renderContext = {
        canvasContext: context,
        viewport: viewport
      };

      await page.render(renderContext).promise;
      cont.appendChild(canvas);
    }

  }catch(err){
    console.error("Error al renderizar PDF:", err);
    cont.innerHTML = `
      <div class="pdf-loading" style="color:#b53a3a;">
        No se pudo previsualizar el PDF.<br>
        Use el botón "Descargar" o "Imprimir".
      </div>`;
  }
}

  document.getElementById("modalVistaPrevia").classList.remove("visible");
  const iframe = document.getElementById("pdfViewer");
  if(iframe){
    iframe.src = "about:blank";
    iframe.style.display = "block";
  }
  const canvasCont = document.getElementById("pdfCanvasContainer");
  if(canvasCont){
    canvasCont.classList.remove("visible");
    canvasCont.innerHTML = "";
  }
}

/* ============================================================
   ⭐ V5.5 — GENERACIÓN DE PDF CON jsPDF
   ------------------------------------------------------------
   Cambios V5.5:
   - Aprovechamiento MÁXIMO de cada hoja (sin reserva anticipada)
   - Firmas se colocan justo después de la última tabla si caben
   - Si la última sección tiene < 3 filas y las firmas no caben,
     esas filas saltan a la nueva hoja junto con las firmas
   - Umbral de salto dinámico
   ============================================================ */

const PDF_LAYOUT = {
  pageW: 215.9,
  pageH: 279.4,
  marginTop: 20,
  marginBottom: 20,
  marginLeft: 30,
  marginRight: 20,
  get contentW() { return this.pageW - this.marginLeft - this.marginRight; },
  get contentH() { return this.pageH - this.marginTop - this.marginBottom; }
};

function generarPDFActa(r, oficina, datos){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: "letter"
  });

  const idAsignacion = oficina.id;
  const fijos = DATA.fijos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const fungibles = DATA.fungibles.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const internos = DATA.internos.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));
  const prestados = DATA.prestados.filter(b => mismoId(obtenerIdAsig(b), idAsignacion));

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);
  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  let yCursor = PDF_LAYOUT.marginTop;

  /* ═══ 1) MEMBRETE ═══ */
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  const xLeft = PDF_LAYOUT.marginLeft;

  doc.text("COMANDO GENERAL DEL EJÉRCITO", xLeft, yCursor);
  yCursor += 4;
  doc.text("DÉCIMA DIVISIÓN DEL EJÉRCITO", xLeft + 3, yCursor);
  yCursor += 4;
  doc.text("BOLIVIA", xLeft + 25, yCursor);
  doc.line(xLeft + 25, yCursor + 0.5, xLeft + 25 + doc.getTextWidth("BOLIVIA"), yCursor + 0.5);
  yCursor += 8;

  /* ═══ 2) TÍTULO ═══ */
  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const textoL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()}`;
  const textoSufijo = `DE LA DIV-10`;
  const anchoCompleto = (textoL2 + " " + textoSufijo).length;
  const requiereTresLineas = anchoCompleto > 75;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  const centerX = PDF_LAYOUT.pageW / 2;

  if(requiereTresLineas){
    doc.text(tituloL1, centerX, yCursor, { align: "center" });
    yCursor += 7;
    doc.text(textoL2, centerX, yCursor, { align: "center" });
    yCursor += 7;
    doc.text(textoSufijo, centerX, yCursor, { align: "center" });
    yCursor += 8;
  } else {
    doc.text(tituloL1, centerX, yCursor, { align: "center" });
    yCursor += 7;
    doc.text(textoL2 + " " + textoSufijo, centerX, yCursor, { align: "center" });
    yCursor += 8;
  }

  yCursor += 4;

  /* ═══ 3) MEDIR altura de firmas (para saber cuánto espacio dejar) ═══ */
  const alturaFirmasMM = medirBloqueFirmasPDF(doc, datos, r);
  const MARGEN_SEGURIDAD_FIRMAS = 6;  /* margen para que respire */

  /* ═══ 4) SECCIONES ═══ */
  const secciones = [
    { num: "I.- ",   titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)",   lista: fijos,     tipo: "fijos" },
    { num: "II.- ",  titulo: "INVENTARIO DE ACTIVOS FUNGIBLES",         lista: fungibles, tipo: "fungibles" },
    { num: "III.- ", titulo: "INVENTARIO INTERNO",                      lista: internos,  tipo: "internos" },
    { num: "IV.- ",  titulo: "INVENTARIO DE BIENES PRESTADOS",          lista: prestados, tipo: "prestados" }
  ];

  secciones.forEach((sec, idxSec) => {
    /* Espacio antes del subtítulo (excepto el primero) */
    if(idxSec > 0){
      yCursor += 5;
    }

    /* Verificar si hay espacio mínimo para el subtítulo + tabla */
    const espacioRestante = PDF_LAYOUT.pageH - PDF_LAYOUT.marginBottom - yCursor;
    if(espacioRestante < 25 && sec.lista.length > 0){
      doc.addPage();
      yCursor = PDF_LAYOUT.marginTop;
    }

    /* Dibujar subtítulo */
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);

    const subtituloTexto = `${sec.num}${sec.titulo}.`;
    doc.text(subtituloTexto, xLeft, yCursor);
    const anchoSubtitulo = doc.getTextWidth(subtituloTexto);
    const xInicioSubrayado = xLeft + doc.getTextWidth(sec.num);
    doc.setLineWidth(0.2);
    doc.line(xInicioSubrayado, yCursor + 0.5, xLeft + anchoSubtitulo, yCursor + 0.5);

    yCursor += 5;

    /* Preparar filas */
    let head, body, columnStyles;

    if(sec.tipo === "fijos"){
      head = [["N°", "CÓDIGO (VSIAF.)", "DESCRIPCIÓN", "ESTADO"]];
      columnStyles = {
        0: { cellWidth: 15, halign: "center" },
        1: { cellWidth: 45, halign: "center" },
        2: { cellWidth: "auto", halign: "left" },
        3: { cellWidth: 25, halign: "center" }
      };
      body = sec.lista.map((item, i) => [
        `${i+1}.-`,
        getVal(item, "CODIGO"),
        getVal(item, "DESCRIPCION DEL ACTIVO"),
        getVal(item, "ESTADO")
      ]);
    } else {
      head = [["N°", "CANTIDAD", "DESCRIPCIÓN", "ESTADO"]];
      columnStyles = {
        0: { cellWidth: 15, halign: "center" },
        1: { cellWidth: 20, halign: "center" },
        2: { cellWidth: "auto", halign: "left" },
        3: { cellWidth: 25, halign: "center" }
      };
      body = sec.lista.map((item, i) => [
        `${i+1}.-`,
        getVal(item, "CANTIDAD"),
        getVal(item, "DESCRIPCION DEL ACTIVO"),
        getVal(item, "ESTADO")
      ]);
    }

    if(sec.lista.length === 0){
      body = [[
        {
          content: "NO CUENTA",
          colSpan: 4,
          styles: {
            halign: "center",
            fontStyle: "italic",
            cellWidth: "auto"
          }
        }
      ]];
    }

    /* ⭐ V5.5 — SIN reserva anticipada de firmas: la tabla usa todo el espacio */
    const opciones = {
      head: head,
      body: body,
      startY: yCursor,
      margin: {
        top: PDF_LAYOUT.marginTop,
        right: PDF_LAYOUT.marginRight,
        bottom: PDF_LAYOUT.marginBottom,
        left: PDF_LAYOUT.marginLeft
      },
      tableWidth: PDF_LAYOUT.contentW,
      styles: {
        font: "helvetica",
        fontSize: 9,
        cellPadding: 1.5,
        lineColor: [0, 0, 0],
        lineWidth: 0.15,
        textColor: [0, 0, 0],
        fillColor: [255, 255, 255],
        overflow: "linebreak",
        valign: "top"
      },
      headStyles: {
        fontStyle: "bold",
        fillColor: [255, 255, 255],
        textColor: [0, 0, 0],
        halign: "center",
        lineWidth: 0.15,
        lineColor: [0, 0, 0]
      },
      bodyStyles: {
        fillColor: [255, 255, 255],
        lineWidth: 0.15,
        lineColor: [0, 0, 0],
        textColor: [0, 0, 0]
      },
      alternateRowStyles: {
        fillColor: [255, 255, 255]
      },
      columnStyles: columnStyles,
      showHead: "firstPage",
      rowPageBreak: "avoid",
      pageBreak: "auto"
    };

    doc.autoTable(opciones);

    yCursor = doc.lastAutoTable.finalY + 4;
  });

  /* ═══ 5) DECIDIR SI LAS FIRMAS CABEN O VAN A NUEVA HOJA ═══ */
  const alturaRestante = PDF_LAYOUT.pageH - PDF_LAYOUT.marginBottom - yCursor;
  const firmasCaben = (alturaFirmasMM + MARGEN_SEGURIDAD_FIRMAS) <= alturaRestante;

  if(!firmasCaben){
    /* No caben → nueva hoja con encabezado de continuación */
    doc.addPage();
    yCursor = PDF_LAYOUT.marginTop;

    const totalHojas = doc.getNumberOfPages();
    const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);
    const ordinal = ordinalHoja(totalHojas);
    const textoContinuacion = `${ordinal} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;

    doc.setFont("helvetica", "italic");
    doc.setFontSize(8);
    doc.setLineWidth(0.2);
    doc.line(xLeft, yCursor, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, yCursor);
    yCursor += 3;
    doc.text(textoContinuacion, centerX, yCursor, { align: "center" });
    yCursor += 3;
    if(resumenBienes){
      doc.text(resumenBienes, centerX, yCursor, { align: "center" });
      yCursor += 3;
    }
    doc.line(xLeft, yCursor, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, yCursor);
    yCursor += 6;
  }

  /* Dibujar firmas */
  dibujarBloqueFirmasPDF(doc, datos, r, yCursor);

  /* Números de página "1 - N" */
  const totalPaginas = doc.getNumberOfPages();
  for(let i = 1; i <= totalPaginas; i++){
    doc.setPage(i);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(0, 0, 0);
    const textoPag = `${i} - ${totalPaginas}`;
    doc.text(textoPag, PDF_LAYOUT.pageW / 2, PDF_LAYOUT.pageH - 10, { align: "center" });
  }

  return doc;
}

function medirBloqueFirmasPDF(doc, datos, r){
  /* Cálculo real de altura del bloque de firmas según datos presentes */
  let altura = 12;  /* fecha */
  altura += 22;     /* rol → nombre (ENTREGUÉ/RECIBÍ) */
  altura += 5;      /* nombre → cargo */
  altura += 3;      /* alto cargo */
  altura += 22;     /* cargo → siguiente bloque */
  if(datos.sup1.grado || datos.sup1.nombres){
    altura += 5;    /* nombre sup */
    altura += 3;    /* alto cargo sup */
    altura += 12;   /* separación */
  }
  altura += 24;     /* Vo.Bo. → nombre */
  altura += 5;      /* nombre → cargo */
  altura += 3;      /* alto cargo */
  return altura;
}

function dibujarBloqueFirmasPDF(doc, datos, r, yInicio){
  let y = yInicio;

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.text(fechaLarga, PDF_LAYOUT.pageW - PDF_LAYOUT.marginRight, y, { align: "right" });
  y += 12;

  const nombreSaliente = construirNombreFirmante(r.grado, r.nombres, r.apPat, r.apMat) || "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();
  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat) || "RESPONSABLE ENTRANTE";
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const colIzqX = PDF_LAYOUT.marginLeft + (PDF_LAYOUT.contentW * 0.25);
  const colDerX = PDF_LAYOUT.marginLeft + (PDF_LAYOUT.contentW * 0.75);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("ENTREGUÉ CONFORME:", colIzqX, y, { align: "center" });
  doc.text("RECIBÍ CONFORME:", colDerX, y, { align: "center" });
  y += 22;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(nombreSaliente, colIzqX, y, { align: "center" });
  doc.text(nombreEntrante, colDerX, y, { align: "center" });
  y += 5;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text(cargoSaliente, colIzqX, y, { align: "center" });
  doc.text(cargoEntrante, colDerX, y, { align: "center" });
  y += 22;

  if(nombreSup1 || nombreSup2){
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    if(nombreSup1 && nombreSup2){
      doc.text(nombreSup1, colIzqX, y, { align: "center" });
      doc.text(nombreSup2, colDerX, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup1, colIzqX, y, { align: "center" });
      doc.text(cargoSup2, colDerX, y, { align: "center" });
      y += 12;
    } else if(nombreSup1){
      doc.text(nombreSup1, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup1, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 12;
    } else if(nombreSup2){
      doc.text(nombreSup2, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(cargoSup2, PDF_LAYOUT.pageW/2, y, { align: "center" });
      y += 12;
    }
  }

  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("Vo. Bo.", PDF_LAYOUT.pageW/2, y, { align: "center" });
  y += 24;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(nombreVobo, PDF_LAYOUT.pageW/2, y, { align: "center" });
  y += 5;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text(cargoVobo, PDF_LAYOUT.pageW/2, y, { align: "center" });
}

/* ============================================================
   ACCIONES DE LOS BOTONES PDF
   ============================================================ */
function descargarPDF(){
  if(!actaEnProceso.pdfDoc){
    mostrarToast("No hay PDF generado", "error", "⚠");
    return;
  }
  const nombreArchivo = `acta_${norm(actaEnProceso.oficina.oficina).replace(/\s+/g, "_")}_${new Date().toISOString().slice(0,10)}.pdf`;
  actaEnProceso.pdfDoc.save(nombreArchivo);
  mostrarToast("PDF descargado", "success", "✔");
}

function imprimirPDF(){
  if(!actaEnProceso.pdfDoc){
    mostrarToast("No hay PDF generado", "error", "⚠");
    return;
  }

  /* En móvil, imprimir el contenedor de canvas */
  if(esDispositivoMovil()){
    const cont = document.getElementById("pdfCanvasContainer");
    if(cont && cont.querySelectorAll("canvas").length > 0){
      const ventanaImpresion = window.open("", "_blank");
      if(ventanaImpresion){
        const canvases = cont.querySelectorAll("canvas");
        let html = `<!DOCTYPE html><html><head><title>Imprimir Acta</title>
          <style>
            @page { size: letter portrait; margin: 0; }
            body { margin: 0; padding: 0; background: #fff; }
            img { display: block; width: 100%; height: auto; page-break-after: always; }
            img:last-child { page-break-after: auto; }
          </style>
        </head><body>`;
        canvases.forEach(cv => {
          const dataURL = cv.toDataURL("image/png");
          html += `<img src="${dataURL}" alt="">`;
        });
        html += `</body></html>`;
        ventanaImpresion.document.write(html);
        ventanaImpresion.document.close();
        setTimeout(() => {
          ventanaImpresion.focus();
          ventanaImpresion.print();
        }, 500);
      } else {
        mostrarToast("Permite ventanas emergentes para imprimir", "error", "⚠");
      }
      return;
    }
    descargarPDF();
    return;
  }

  /* Desktop */
  const iframe = document.getElementById("pdfViewer");
  if(iframe && iframe.contentWindow && iframe.src !== "about:blank"){
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      return;
    }catch(err){ /* fallback */ }
  }
  const blobURL = actaEnProceso.pdfDoc.output("bloburl");
  window.open(blobURL, "_blank");
}

/* ============================================================
   MESES
   ============================================================ */
function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

/* ============================================================
   LIGHTBOX / RIPPLE
   ============================================================ */
function abrirLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }
function ripple(e, btn){
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const span = document.createElement("span");
  span.style.position = "absolute";
  span.style.borderRadius = "50%";
  span.style.background = "var(--dorado)";
  span.style.opacity = "0.5";
  span.style.pointerEvents = "none";
  span.style.width = size + "px";
  span.style.height = size + "px";
  span.style.left = x + "px";
  span.style.top = y + "px";
  span.style.transform = "scale(0)";
  span.style.animation = "rippleAnim .6s ease-out";
  btn.style.position = "relative";
  btn.style.overflow = "hidden";
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}
const styleRipple = document.createElement("style");
styleRipple.innerHTML = "@keyframes rippleAnim{to{transform:scale(4);opacity:0;}}";
document.head.appendChild(styleRipple);

/* ============================================================
   ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});
