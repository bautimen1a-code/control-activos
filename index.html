<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control DIV-10 · V5.1</title>
<style>
/* ============================================================
   [01] VARIABLES Y TEMA
   ============================================================ */
:root{
  --bg:#05080d;
  --bg-panel:#0b1119;
  --bg-elevado:#111a26;
  --bg-hover:#182333;
  --bg-glass:rgba(11,17,25,.72);
  --texto:#d8e4f0;
  --texto-suave:#6b7c92;
  --texto-muy-suave:#3d4a5c;
  --borde:rgba(0,229,255,.18);
  --borde-fuerte:rgba(0,229,255,.45);
  --cian:#00e5ff;
  --cian-brillante:#7cf5ff;
  --cian-glow:rgba(0,229,255,.55);
  --magenta:#ff2bd6;
  --magenta-glow:rgba(255,43,214,.5);
  --verde:#00ff9d;
  --verde-glow:rgba(0,255,157,.5);
  --ambar:#ffb800;
  --ambar-glow:rgba(255,184,0,.5);
  --rojo:#ff3860;
  --rojo-glow:rgba(255,56,96,.5);
  --vino:#ff2bd6;
  --mono:"JetBrains Mono","Fira Code","Consolas",monospace;
  --sans:"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --sombra-panel:0 0 40px rgba(0,229,255,.06), 0 20px 60px rgba(0,0,0,.7);
  --sombra-glow:0 0 25px var(--cian-glow);
}
body.light{
  --bg:#eef2f8;
  --bg-panel:#ffffff;
  --bg-elevado:#f6f9fd;
  --bg-hover:#e5eef9;
  --bg-glass:rgba(255,255,255,.85);
  --texto:#0a1520;
  --texto-suave:#5a6b82;
  --texto-muy-suave:#9aa8ba;
  --borde:rgba(0,100,140,.2);
  --borde-fuerte:rgba(0,100,140,.5);
  --cian:#0088a8;
  --cian-brillante:#00b8d4;
  --cian-glow:rgba(0,136,168,.35);
  --magenta:#c400a3;
  --verde:#00a866;
  --ambar:#cc8800;
  --rojo:#d40048;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans);background:var(--bg);color:var(--texto);
  font-size:14px;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;position:relative;
  transition:background .4s ease,color .4s ease;
}

/* ============================================================
   [02] FONDO ANIMADO HUD
   ============================================================ */
.bg-layer{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(0,229,255,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(255,43,214,.06) 0%,transparent 50%),
    var(--bg);
}
.bg-layer::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 30s linear infinite;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);
}
@keyframes gridMove{from{transform:translate(0,0);}to{transform:translate(40px,40px);}}
.bg-layer::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(2px 2px at 15% 25%,var(--cian) 50%,transparent),
    radial-gradient(2px 2px at 85% 45%,var(--magenta) 50%,transparent),
    radial-gradient(1.5px 1.5px at 45% 75%,var(--verde) 50%,transparent),
    radial-gradient(1.5px 1.5px at 70% 15%,var(--cian) 50%,transparent),
    radial-gradient(2px 2px at 30% 85%,var(--magenta) 50%,transparent);
  opacity:.6;
  animation:pulseParticles 6s ease-in-out infinite;
}
@keyframes pulseParticles{0%,100%{opacity:.35;}50%{opacity:.75;}}
.scanline{
  position:fixed;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cian),var(--magenta),var(--cian),transparent);
  box-shadow:0 0 20px var(--cian-glow);
  opacity:.55;z-index:1;pointer-events:none;
  animation:scanline 6s linear infinite;
}
@keyframes scanline{from{top:-2px;}to{top:100vh;}}

/* ============================================================
   [03] SCROLLBAR
   ============================================================ */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-elevado);}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--cian),var(--magenta));
  border-radius:5px;border:2px solid var(--bg-elevado);
}
::-webkit-scrollbar-thumb:hover{background:var(--cian-brillante);}

/* ============================================================
   [04] APP LAYOUT
   ============================================================ */
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}

/* ============================================================
   [05] HEADER HUD
   ============================================================ */
.header{
  position:sticky;top:0;z-index:50;
  background:var(--bg-glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--borde);
  padding:14px 22px;overflow:hidden;
  transition:background .4s ease;
}
.header::after{
  content:"";position:absolute;bottom:0;left:0;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--cian),var(--magenta),var(--cian),transparent);
  background-size:200% 100%;
  animation:borderFlow 3s linear infinite;
  box-shadow:0 0 12px var(--cian-glow);
}
@keyframes borderFlow{from{background-position:200% 0;}to{background-position:-200% 0;}}
.header::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  background:
    linear-gradient(135deg,var(--cian) 0 12px,transparent 12px) top left/20px 20px no-repeat,
    linear-gradient(-135deg,var(--cian) 0 12px,transparent 12px) top right/20px 20px no-repeat;
  opacity:.5;
}
.header-content{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.header-logo{display:flex;align-items:center;gap:14px;}
.header-logo-icon{
  width:44px;height:44px;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--cian);
  background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(255,43,214,.06));
  clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
  animation:pulseGlow 3s ease-in-out infinite;
}
.header-logo-icon::before{
  content:"";position:absolute;inset:2px;
  background:var(--bg-panel);
  clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
  z-index:-1;
}
@keyframes pulseGlow{
  0%,100%{filter:drop-shadow(0 0 6px var(--cian-glow));}
  50%{filter:drop-shadow(0 0 18px var(--cian-glow));}
}
.header-text h1{
  font-family:var(--mono);font-size:15px;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cian),var(--magenta),var(--cian));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:gradientShift 4s linear infinite;
}
@keyframes gradientShift{to{background-position:200% center;}}
.header-text .subtitle{
  font-family:var(--mono);font-size:9px;letter-spacing:4px;
  color:var(--texto-suave);margin-top:2px;text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;gap:10px;}

/* Botones icono */
.btn-icon{
  width:42px;height:42px;
  background:var(--bg-elevado);
  border:1px solid var(--borde);
  color:var(--cian);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  flex-shrink:0;
  clip-path:polygon(25% 0,100% 0,100% 75%,75% 100%,0 100%,0 25%);
  position:relative;overflow:hidden;
}
.btn-icon:hover{
  background:var(--cian);color:var(--bg);
  border-color:var(--cian-brillante);
  box-shadow:0 0 25px var(--cian-glow);
  transform:scale(1.05);
}
.btn-icon.gold{color:var(--ambar);}
.btn-icon.gold:hover{
  background:var(--ambar);color:var(--bg);
  box-shadow:0 0 25px var(--ambar-glow);
  transform:rotate(180deg) scale(1.05);
}
.btn-icon.spinning{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

/* ═══ NUEVO: Efecto "presión" en botones ═══ */
.btn-icon:active,
.btn-volver:active,
.btn-nav:active,
.btn-imprimir:active,
.btn-confirmar:active,
.btn-cancelar:active,
.btn-preview:active,
.home-btn:active{
  transform:scale(.95) !important;
  transition:transform .08s ease !important;
}

.header-status{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:rgba(0,229,255,.06);
  border:1px solid var(--borde);
  font-size:10px;font-family:var(--mono);
  color:var(--cian-brillante);letter-spacing:1.5px;
  clip-path:polygon(8% 0,100% 0,100% 100%,0 100%,0 30%);
}
.status-dot{
  width:8px;height:8px;background:var(--verde);
  box-shadow:0 0 10px var(--verde-glow);border-radius:50%;
  animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ============================================================
   [06] MAIN
   ============================================================ */
.main{flex:1;padding:24px 22px;max-width:1280px;margin:0 auto;width:100%;}

/* ============================================================
   [07] HOME
   ============================================================ */
.home{display:flex;flex-direction:column;gap:16px;padding-top:8px;animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.home-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.home-btn{
  position:relative;
  background:var(--bg-panel);
  border:1px solid var(--borde);
  padding:26px 16px;cursor:pointer;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
  color:var(--texto);
}
.home-btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,var(--color,var(--cian)) 0%,transparent 60%);
  opacity:0;transition:opacity .35s ease;pointer-events:none;
}
.home-btn::after{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--color,var(--cian));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease;
  box-shadow:0 0 12px var(--color,var(--cian));
}
.home-btn:hover{
  transform:translateY(-4px);
  border-color:var(--color,var(--cian));
  box-shadow:0 0 30px color-mix(in srgb,var(--color,var(--cian)) 40%,transparent), 0 20px 40px rgba(0,0,0,.5);
}
.home-btn:hover::before{opacity:.08;}
.home-btn:hover::after{transform:scaleX(1);}
.home-btn[data-color="verde"]{--color:var(--verde);}
.home-btn[data-color="azul"]{--color:var(--cian);}
.home-btn[data-color="marron"]{--color:var(--ambar);}
.home-btn[data-color="vino"]{--color:var(--magenta);}
.home-btn[data-color="buscar"]{--color:var(--cian);}
.home-btn-icon{font-size:34px;color:var(--color,var(--cian));filter:drop-shadow(0 0 8px var(--color,var(--cian)));}
.home-btn-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--texto-suave);font-weight:800;font-family:var(--mono);}
.home-btn-count{
  font-size:28px;font-weight:800;
  color:var(--color,var(--cian));
  font-family:var(--mono);
  text-shadow:0 0 12px var(--color,var(--cian));
  line-height:1;
}
.home-btn.buscar{
  grid-column:span 4;padding:26px;
  background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(255,43,214,.04));
  flex-direction:row;justify-content:center;gap:20px;
}
.home-btn.buscar .home-btn-icon{font-size:30px;}
.home-btn.buscar .home-btn-label{font-size:14px;letter-spacing:6px;color:var(--cian-brillante);}

/* ============================================================
   [08] MODO BÚSQUEDA
   ============================================================ */
.modo-busqueda{animation:fadeIn .35s ease both;display:flex;flex-direction:column;gap:16px;min-height:60vh;}
.modo-busqueda-top{display:flex;gap:12px;align-items:center;width:100%;min-width:0;}
.btn-volver{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-elevado);color:var(--cian);
  border:1px solid var(--borde);
  padding:12px 16px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-weight:800;font-family:var(--mono);
  flex-shrink:0;white-space:nowrap;transition:all .3s ease;
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 30%);
  position:relative;overflow:hidden;
}
.btn-volver:hover{
  background:var(--cian);color:var(--bg);
  border-color:var(--cian-brillante);
  transform:translateX(-4px);
  box-shadow:0 0 20px var(--cian-glow);
}
.search-wrapper{flex:1;min-width:0;position:relative;}
.search-box{
  display:flex;align-items:center;
  background:var(--bg-panel);
  border:1px solid var(--borde);
  padding:4px 14px;width:100%;min-width:0;
  transition:all .3s ease;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.search-box:focus-within{
  border-color:var(--cian);
  box-shadow:0 0 0 1px var(--cian),0 0 25px rgba(0,229,255,.2);
}
.search-icon{color:var(--cian);font-size:18px;margin-right:12px;flex-shrink:0;filter:drop-shadow(0 0 6px var(--cian-glow));}
.search-input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  padding:14px 0;font-size:15px;color:var(--texto);
  font-family:var(--mono);font-weight:500;letter-spacing:.5px;width:100%;
}
.search-input::placeholder{color:var(--texto-muy-suave);letter-spacing:0;}
.btn-clear{
  background:transparent;border:none;color:var(--texto-muy-suave);
  font-size:16px;cursor:pointer;width:32px;height:32px;
  border-radius:50%;display:none;align-items:center;justify-content:center;
  transition:all .25s ease;flex-shrink:0;padding:0;margin-left:8px;font-weight:800;
}
.btn-clear.visible{display:flex;}
.btn-clear:hover{
  background:var(--rojo);color:#fff;
  transform:rotate(90deg) scale(1.1);
  box-shadow:0 0 15px var(--rojo-glow);
}

/* ============================================================
   [09] LISTAS
   ============================================================ */
.list-title{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;margin-bottom:14px;
  border-bottom:1px solid var(--borde);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto-suave);font-weight:700;
  font-family:var(--mono);
  animation:fadeIn .4s ease both;
}
.list-count{
  background:var(--bg-panel);border:1px solid var(--borde);
  color:var(--cian);padding:4px 14px;
  font-family:var(--mono);font-weight:800;
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 40%);
}
.resp-card{
  position:relative;
  background:var(--bg-panel);
  border:1px solid var(--borde);
  padding:20px 22px;margin-bottom:12px;cursor:pointer;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
}
.resp-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--cian),var(--magenta));
  transform:scaleY(0);transform-origin:top;
  transition:transform .4s ease;
}
.resp-card::after{
  content:"";position:absolute;top:0;right:0;
  width:60px;height:60px;
  background:radial-gradient(circle at top right,var(--cian-glow),transparent 70%);
  opacity:0;transition:opacity .4s ease;pointer-events:none;
}
.resp-card:hover{
  transform:translateX(8px);
  border-color:var(--cian);
  background:var(--bg-elevado);
  box-shadow:var(--sombra-panel),0 0 30px rgba(0,229,255,.15);
}
.resp-card:hover::before{transform:scaleY(1);}
.resp-card:hover::after{opacity:1;}
.resp-card-info{flex:1;min-width:0;}
.resp-card-name{
  font-size:15px;font-weight:700;color:var(--texto);
  letter-spacing:.3px;margin-bottom:8px;transition:color .3s ease;
}
.resp-card:hover .resp-card-name{color:var(--cian-brillante);}
.resp-card-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--texto-suave);font-family:var(--mono);}
.resp-card-arrow{
  font-size:28px;color:var(--texto-muy-suave);
  transition:all .4s ease;flex-shrink:0;
}
.resp-card:hover .resp-card-arrow{
  color:var(--cian);transform:translateX(8px);
  filter:drop-shadow(0 0 8px var(--cian-glow));
}
.bien-card{
  position:relative;
  background:var(--bg-panel);
  border:1px solid var(--borde);
  padding:18px 20px;margin-bottom:12px;cursor:pointer;
  transition:all .35s ease;
  display:flex;gap:16px;align-items:flex-start;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.bien-card:hover{
  transform:translateX(8px);
  border-color:var(--magenta);
  background:var(--bg-elevado);
  box-shadow:var(--sombra-panel),0 0 30px rgba(255,43,214,.15);
}
.bien-card-thumb{
  width:60px;height:60px;
  background:var(--bg-elevado);
  border:1px solid var(--borde);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--texto-muy-suave);
  flex-shrink:0;overflow:hidden;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.bien-card-thumb img{width:100%;height:100%;object-fit:cover;}
.bien-card-info{flex:1;min-width:0;}
.bien-card-code{
  font-size:11px;font-family:var(--mono);color:var(--cian);
  font-weight:700;letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase;
  text-shadow:0 0 8px var(--cian-glow);
}
.bien-card-desc{font-size:13px;font-weight:600;color:var(--texto);line-height:1.35;margin-bottom:8px;}
.bien-card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;font-family:var(--mono);color:var(--texto-suave);}
.bien-card-tipo{
  padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;background:var(--bg-elevado);border:1px solid var(--borde);
}
.bien-card-tipo.fijos{color:var(--verde);border-color:var(--verde-glow);}
.bien-card-tipo.fungibles{color:var(--cian);border-color:var(--cian-glow);}
.bien-card-tipo.internos{color:var(--ambar);border-color:var(--ambar-glow);}
.bien-card-tipo.prestados{color:var(--magenta);border-color:var(--magenta-glow);}

/* ============================================================
   [10] MODALES
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,4,8,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:100;display:none;align-items:center;justify-content:center;
  padding:20px;overflow-y:auto;
}
body.light .modal-overlay{background:rgba(10,20,30,.5);}
.modal-overlay.visible{display:flex;}
.modal{
  background:var(--bg-panel);
  border:1px solid var(--cian);
  max-width:760px;width:100%;max-height:92vh;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:
    0 0 0 1px rgba(0,229,255,.1),
    0 0 60px rgba(0,229,255,.15),
    0 40px 100px rgba(0,0,0,.8);
  clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px);
  position:relative;
  animation:modalIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cian),var(--magenta),var(--cian),transparent);
  background-size:200% 100%;
  animation:borderFlow 3s linear infinite;
}
.modal-form{max-width:720px;}
.modal-vista{max-width:960px;}
.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--borde);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(0,229,255,.04),transparent);
}
.modal-header h2{
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto);font-weight:700;font-family:var(--mono);
  flex:1;min-width:0;word-break:break-word;
}
.modal-close{
  width:36px;height:36px;background:transparent;
  border:1px solid var(--borde);color:var(--texto-suave);
  cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;flex-shrink:0;
  clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
}
.modal-close:hover{
  background:var(--rojo);border-color:var(--rojo);color:white;
  transform:rotate(90deg);
  box-shadow:0 0 20px var(--rojo-glow);
}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1;min-height:200px;}

/* ============================================================
   [11] BOTONES INTERNOS
   ============================================================ */
.btn-nav{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-elevado);color:var(--cian);
  border:1px solid var(--borde);
  padding:10px 18px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-weight:700;transition:all .3s ease;margin-bottom:18px;
  font-family:var(--mono);
  clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 30%);
  position:relative;overflow:hidden;
}
.btn-nav:hover{
  background:var(--cian);color:var(--bg);
  border-color:var(--cian-brillante);
  transform:translateX(-4px);
  box-shadow:0 0 20px var(--cian-glow);
}
.btn-imprimir{
  background:linear-gradient(135deg,var(--verde),#00c878);
  color:#001a10;border:none;
  padding:12px 22px;font-size:11px;font-weight:800;letter-spacing:2px;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:all .25s ease;font-family:var(--mono);text-transform:uppercase;
  margin-bottom:18px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  position:relative;overflow:hidden;
}
.btn-imprimir:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px var(--verde-glow);
}
.modal-titulo-seccion{
  text-align:center;padding:10px 0 18px;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto-suave);font-weight:700;font-family:var(--mono);
  border-bottom:1px solid var(--borde);margin-bottom:18px;
}

/* ============================================================
   [12] TARJETAS DE OFICINA
   ============================================================ */
.oficina-card{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--bg-elevado);border:1px solid var(--borde);
  border-left:3px solid var(--cian);
  padding:16px 18px;margin-bottom:12px;cursor:pointer;
  transition:all .3s ease;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  position:relative;overflow:hidden;
}
.oficina-card:hover{
  border-color:var(--cian);border-left-color:var(--magenta);
  background:var(--bg-hover);
  box-shadow:var(--sombra-panel),0 0 25px rgba(0,229,255,.15);
  transform:translateX(6px);
}
.oficina-card-info{flex:1;min-width:0;}
.oficina-card-nombre{font-size:13px;font-weight:700;color:var(--texto);letter-spacing:.3px;margin-bottom:5px;}
.oficina-card-id{font-size:10px;font-family:var(--mono);color:var(--cian);letter-spacing:1.5px;}
.oficina-card-count{
  background:rgba(0,229,255,.1);border:1px solid var(--cian);
  color:var(--cian-brillante);padding:8px 16px;
  font-size:14px;font-weight:800;font-family:var(--mono);
  flex-shrink:0;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 30%);
  text-shadow:0 0 8px var(--cian-glow);
}

/* ============================================================
   [13] FORMULARIO
   ============================================================ */
.form-persona{
  background:var(--bg-elevado);border:1px solid var(--borde);
  border-left:3px solid var(--magenta);
  padding:14px 16px;margin-bottom:14px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.form-persona-titulo{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--magenta);font-weight:800;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);
}
.form-persona-titulo .num{
  background:var(--magenta);color:var(--bg);
  width:20px;height:20px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;
  box-shadow:0 0 12px var(--magenta-glow);
}
.form-grid{display:grid;grid-template-columns:1fr 2fr 1.2fr 1.2fr;gap:10px;margin-bottom:10px;}
.form-grid .form-group{margin-bottom:0;}
.form-group label{
  display:block;font-size:9px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--texto-suave);
  font-weight:800;margin-bottom:6px;font-family:var(--mono);
}
.form-group input{
  width:100%;padding:10px 12px;
  background:var(--bg-panel);border:1px solid var(--borde);
  color:var(--texto);font-family:var(--mono);font-size:13px;
  outline:none;transition:all .2s ease;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.form-group input:focus{
  border-color:var(--cian);
  box-shadow:0 0 0 1px var(--cian),0 0 16px rgba(0,229,255,.2);
}
.form-group input::placeholder{color:var(--texto-muy-suave);}
.form-persona .form-grid{grid-template-columns:1fr 1.5fr 1fr 1fr;}
.form-actions{
  display:flex;gap:12px;justify-content:flex-end;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--borde);
}
.btn-cancelar{
  background:transparent;color:var(--texto-suave);
  border:1px solid var(--borde);
  padding:11px 20px;font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;font-family:var(--mono);
  transition:all .2s ease;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 30%);
  position:relative;overflow:hidden;
}
.btn-cancelar:hover{background:var(--bg-elevado);color:var(--texto);border-color:var(--texto-suave);}
.btn-confirmar{
  background:linear-gradient(135deg,var(--cian),#00a8cc);
  color:var(--bg);border:none;
  padding:11px 24px;font-size:11px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;font-family:var(--mono);
  transition:all .25s ease;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  position:relative;overflow:hidden;
}
.btn-confirmar:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--cian-glow);}

@media (max-width:600px){
  .form-grid, .form-persona .form-grid{grid-template-columns:1fr 1fr;}
  .form-grid .form-group.ancho-completo{grid-column:1 / -1;}
}

/* ============================================================
   [14] TABLAS EN APP
   ============================================================ */
.tabla-section{
  margin-bottom:22px;background:var(--bg-elevado);
  border:1px solid var(--borde);overflow:hidden;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
}
.tabla-header{
  padding:14px 18px;
  background:linear-gradient(180deg,rgba(0,229,255,.06),transparent);
  border-bottom:1px solid var(--borde);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.tabla-header-titulo{
  display:flex;align-items:center;gap:10px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--texto);font-weight:800;font-family:var(--mono);
}
.tabla-header-titulo .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--color,var(--cian));
  box-shadow:0 0 10px var(--color,var(--cian));
}
.tabla-header[data-color="verde"]{--color:var(--verde);}
.tabla-header[data-color="azul"]{--color:var(--cian);}
.tabla-header[data-color="marron"]{--color:var(--ambar);}
.tabla-header[data-color="vino"]{--color:var(--magenta);}
.tabla-header-count{
  font-family:var(--mono);font-size:12px;color:var(--cian);font-weight:800;
  background:rgba(0,229,255,.08);padding:3px 12px;
  border:1px solid rgba(0,229,255,.3);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 40%);
}
.tabla-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;min-width:400px;}
thead th{
  background:rgba(0,0,0,.25);color:var(--texto-suave);text-align:left;
  padding:11px 12px;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:800;
  border-bottom:1px solid var(--borde);font-family:var(--mono);
}
body.light thead th{background:rgba(0,100,140,.05);}
tbody td{
  padding:11px 12px;border-bottom:1px solid rgba(0,229,255,.06);
  color:var(--texto);vertical-align:top;
  word-break:break-word;font-family:Arial,sans-serif;font-size:11px;
}
body.light tbody td{border-bottom-color:rgba(0,100,140,.06);}
tbody tr{cursor:pointer;transition:all .2s ease;}
tbody tr:nth-child(even){background:rgba(0,229,255,.02);}
body.light tbody tr:nth-child(even){background:rgba(0,100,140,.02);}
tbody tr:hover{background:rgba(0,229,255,.06);}

/* ============================================================
   [15] BADGES
   ============================================================ */
.estado-badge{
  display:inline-block;padding:4px 12px;
  font-size:10px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;border:1px solid;
  font-family:var(--mono);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 40%);
}
.estado-regular{color:var(--ambar);border-color:var(--ambar-glow);background:rgba(255,184,0,.08);}
.estado-malo{color:var(--rojo);border-color:var(--rojo-glow);background:rgba(255,56,96,.08);}
.estado-bueno{color:var(--verde);border-color:var(--verde-glow);background:rgba(0,255,157,.08);}
.estado-pendiente{
  color:var(--rojo);border-color:var(--rojo-glow);background:rgba(255,56,96,.12);
  animation:blink 1.5s ease-in-out infinite;
}

/* ============================================================
   [16] ENCABEZADO OFICINA
   ============================================================ */
.oficina-encabezado{
  background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(255,43,214,.05));
  border:1px solid var(--borde);border-left:3px solid var(--cian);
  padding:16px 18px;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.oficina-encabezado-nombre{font-size:14px;font-weight:800;color:var(--texto);margin-bottom:5px;}
.oficina-encabezado-sub{font-size:10px;font-family:var(--mono);color:var(--cian-brillante);letter-spacing:1.5px;text-transform:uppercase;}
.oficina-encabezado-count{
  background:rgba(0,229,255,.15);border:1px solid var(--cian);
  color:var(--cian-brillante);padding:8px 16px;
  font-size:14px;font-weight:800;font-family:var(--mono);
  flex-shrink:0;
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 30%);
  text-shadow:0 0 8px var(--cian-glow);
}

/* ============================================================
   [17] DETALLE DEL BIEN
   ============================================================ */
.bien-detalle{
  background:var(--bg-elevado);border:1px solid var(--borde);
  overflow:hidden;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
}
.bien-detalle-header{
  padding:22px;
  background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(255,43,214,.05));
  border-bottom:2px solid var(--cian);
  display:flex;gap:18px;align-items:flex-start;
}
.bien-detalle-foto{
  width:88px;height:88px;background:var(--bg);
  border:2px solid var(--cian);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--cian);
  flex-shrink:0;overflow:hidden;cursor:pointer;
  transition:all .3s ease;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 20px rgba(0,229,255,.2);
}
.bien-detalle-foto:hover{
  box-shadow:0 0 35px rgba(0,229,255,.5);
  transform:scale(1.03);
}
.bien-detalle-foto img{width:100%;height:100%;object-fit:cover;}
.bien-detalle-codigo{
  font-size:11px;font-family:var(--mono);color:var(--cian);
  letter-spacing:2px;font-weight:800;text-transform:uppercase;
  margin-bottom:8px;text-shadow:0 0 8px var(--cian-glow);
}
.bien-detalle-nombre{font-size:15px;font-weight:700;color:var(--texto);line-height:1.35;margin-bottom:10px;}
.bien-detalle-tipo-badge{
  display:inline-block;padding:4px 12px;
  font-size:9px;font-weight:800;letter-spacing:1.8px;
  text-transform:uppercase;font-family:var(--mono);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 40%);
}
.bien-detalle-tipo-badge.fijos{color:var(--verde);background:rgba(0,255,157,.1);border:1px solid var(--verde-glow);}
.bien-detalle-tipo-badge.fungibles{color:var(--cian);background:rgba(0,229,255,.1);border:1px solid var(--cian-glow);}
.bien-detalle-tipo-badge.internos{color:var(--ambar);background:rgba(255,184,0,.1);border:1px solid var(--ambar-glow);}
.bien-detalle-tipo-badge.prestados{color:var(--magenta);background:rgba(255,43,214,.1);border:1px solid var(--magenta-glow);}
.bien-detalle-campos{padding:0;}
.bien-detalle-campo{
  display:flex;gap:16px;align-items:flex-start;
  padding:14px 22px;border-bottom:1px solid rgba(0,229,255,.06);
}
.bien-detalle-campo:last-child{border-bottom:none;}
.bien-detalle-campo:nth-child(even){background:rgba(0,229,255,.02);}
body.light .bien-detalle-campo:nth-child(even){background:rgba(0,100,140,.02);}
.bien-detalle-label{
  flex:0 0 38%;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:800;color:var(--texto-suave);
  padding-top:2px;font-family:var(--mono);
}
.bien-detalle-valor{flex:1;font-size:12px;color:var(--texto);line-height:1.4;word-break:break-word;}
.bien-detalle-valor.vacio{color:var(--texto-muy-suave);font-style:italic;}
.bien-detalle-valor.pendiente{color:var(--rojo);font-weight:800;text-transform:uppercase;}

/* ============================================================
   [18] EMPTY / LOADING
   ============================================================ */
.empty-state{text-align:center;padding:70px 20px;color:var(--texto-suave);animation:fadeIn .6s ease both;}
.empty-state-icon{
  font-size:70px;margin-bottom:18px;opacity:.35;color:var(--cian);
  filter:drop-shadow(0 0 20px var(--cian-glow));
}
.empty-state-title{
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto);margin-bottom:10px;font-weight:700;font-family:var(--mono);
}
.empty-state-sub{font-size:12px;color:var(--texto-muy-suave);letter-spacing:.5px;}
.loading,.error{
  text-align:center;padding:40px;
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  font-weight:800;font-family:var(--mono);
}
.loading{color:var(--cian);}
.error{color:var(--rojo);}

/* ============================================================
   [19] FOOTER
   ============================================================ */
.footer{
  text-align:center;padding:26px 22px;border-top:1px solid var(--borde);
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--texto-muy-suave);font-family:var(--mono);font-weight:600;
  margin-top:auto;
  background:linear-gradient(0deg,rgba(0,229,255,.02),transparent);
}

/* ============================================================
   [20] LIGHTBOX / TOAST
   ============================================================ */
.lightbox{
  position:fixed;inset:0;background:rgba(0,4,8,.96);
  backdrop-filter:blur(14px);z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:30px;cursor:zoom-out;
}
.lightbox.visible{display:flex;}
.lightbox img{
  max-width:100%;max-height:100%;
  box-shadow:0 0 80px rgba(0,229,255,.4);
  border:1px solid var(--cian);
  animation:lightboxIn .3s ease;
}
@keyframes lightboxIn{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.toast{
  position:fixed;top:90px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:var(--bg-panel);color:var(--texto);
  border:1px solid var(--cian);padding:14px 24px;
  z-index:300;font-size:12px;letter-spacing:1.5px;font-weight:700;
  font-family:var(--mono);
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px var(--cian-glow);
  opacity:0;pointer-events:none;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:12px;max-width:90vw;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--verde);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px var(--verde-glow);}
.toast.error{border-color:var(--rojo);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px var(--rojo-glow);}
.toast.info{border-color:var(--cian);}
.toast-icon{font-size:16px;}

/* ============================================================
   [21] VISTA PREVIA DEL ACTA
   ============================================================ */
.preview-acta-wrap{
  background:#fff;color:#000;
  padding:30px 40px;
  font-family:Arial, sans-serif;
  font-size:11pt;line-height:1.0;
  box-shadow:0 0 0 1px #ccc inset;
  max-height:65vh;overflow-y:auto;
}
.preview-acta-wrap, .preview-acta-wrap *{color:#000;}
.preview-actions{
  padding:16px 22px;border-top:1px solid var(--borde);
  display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;
  background:var(--bg-panel);
}
.btn-preview{
  background:var(--bg-elevado);color:var(--texto);
  border:1px solid var(--borde);
  padding:11px 18px;font-size:11px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;font-family:var(--mono);
  transition:all .2s ease;
  display:inline-flex;align-items:center;gap:8px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  position:relative;overflow:hidden;
}
.btn-preview:hover{background:var(--bg-hover);}
.btn-preview.primary{
  background:linear-gradient(135deg,var(--cian),#00a8cc);
  color:var(--bg);border-color:transparent;
}
.btn-preview.primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--cian-glow);}
.btn-preview.green{
  background:linear-gradient(135deg,var(--verde),#00c878);
  color:#001a10;border-color:transparent;
}
.btn-preview.green:hover{transform:translateY(-2px);box-shadow:0 8px 20px var(--verde-glow);}
.preview-acta-wrap .page-break-indicator{
  display:block;height:26px;
  background:repeating-linear-gradient(90deg,#d0d0d0 0px,#d0d0d0 8px,transparent 8px,transparent 16px);
  margin:12px -40px;position:relative;text-align:center;
  font-size:9pt;color:#666;letter-spacing:1px;line-height:26px;
}
.preview-acta-wrap .page-break-indicator::before{
  content:"▲ PÁGINA SIGUIENTE ▲";
  background:#fff;padding:0 12px;font-weight:bold;font-size:8pt;
}

/* ============================================================
   [22] CONTENEDOR DE MEDICIÓN
   ============================================================ */
.acta-medicion{
  position:absolute;left:-99999px;top:0;
  visibility:hidden;pointer-events:none;
  width:21.59cm;padding:0;margin:0;
  font-family:Arial, sans-serif;
  font-size:11pt;line-height:1.0;color:#000;background:#fff;
}

/* ============================================================
   [23] ACTA — ESTILOS COMPARTIDOS
   ============================================================ */
.acta-medicion .acta-membrete,
.preview-acta-wrap .acta-membrete,
.acta-print .acta-membrete{
  font-family:Arial,sans-serif;font-size:10pt;font-weight:bold;
  line-height:1.0;margin:0 0 10pt 0;text-transform:uppercase;text-align:left;
}
.acta-membrete .linea1{padding-left:0;}
.acta-membrete .linea2{padding-left:9pt;}
.acta-membrete .linea3{padding-left:75pt;text-decoration:underline;}

.acta-medicion .acta-titulo,

/* Ripple universal inyectado por JS */
.click-ripple{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  transform:scale(0);
  animation:rippleAnim .7s cubic-bezier(.34,1.56,.64,1);
  z-index:1;
}
.click-ripple.cian{background:radial-gradient(circle,rgba(0,229,255,.7),rgba(0,229,255,0) 70%);}
.click-ripple.magenta{background:radial-gradient(circle,rgba(255,43,214,.6),rgba(255,43,214,0) 70%);}
@keyframes rippleAnim{
  0%{transform:scale(0);opacity:1;}
  100%{transform:scale(4);opacity:0;}
}
/* Flash momentáneo del borde */
.click-flash{
  animation:clickFlash .5s ease-out;
}
@keyframes clickFlash{
  0%{box-shadow:0 0 0 0 var(--cian-glow),0 0 0 0 var(--magenta-glow);}
  50%{box-shadow:0 0 25px 4px var(--cian-glow),0 0 40px 8px rgba(255,43,214,.3);}
  100%{box-shadow:0 0 0 0 transparent,0 0 0 0 transparent;}
}
/* Micro shake para tarjetas */
.click-shake{
  animation:clickShake .35s ease-out;
}
@keyframes clickShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}
/* Pulse para botones de acción */
.click-pulse{
  animation:clickPulse .4s ease-out;
}
@keyframes clickPulse{
  0%{transform:scale(1);}
  50%{transform:scale(.96);}
  100%{transform:scale(1);}
}

<script>
/* ============================================================
   [S01] CONFIGURACIÓN GLOBAL
   ============================================================ */
const API_URL_NUBE = "https://script.google.com/macros/s/AKfycbzMfNUGlVPgurteK1ZZZcNDDou-pZhNuM9ISanIoArFFnsMh_A6yracR78WXZ1jv5wwFg/exec";
const CACHE_KEY = "control_div10_data_v1";
const CACHE_HOJA_KEY = "control_div10_cache_ts";
const ALTURA_UTIL_HOJA = 905;

const DATA = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };

let estado = {
  pantalla: "home",
  modalVista: "oficinas",
  responsableActual: null,
  oficinaActual: null,
  bienActual: null,
  vistaGeneralActual: null,
  oficinaFiltroActual: null
};

let actaEnProceso = { responsable: null, oficina: null, datos: null, html: null };

/* ============================================================
   [S02] TEMA CLARO / OSCURO
   ============================================================ */
function cargarTema(){
  const guardado = localStorage.getItem("tema");
  if(guardado === "light"){
    document.body.classList.add("light");
    document.getElementById("themeIcon").textContent = "◑";
  }
}
function toggleTheme(){
  document.body.classList.toggle("light");
  const isLight = document.body.classList.contains("light");
  document.getElementById("themeIcon").textContent = isLight ? "◑" : "◐";
  localStorage.setItem("tema", isLight ? "light" : "dark");
}
cargarTema();

/* ============================================================
   [S03] NOTIFICACIONES TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg, tipo = "info", icono = null){
  const toast = document.getElementById("toast");
  const iconEl = document.getElementById("toastIcon");
  const msgEl = document.getElementById("toastMsg");
  toast.className = "toast visible " + tipo;
  if(icono) iconEl.textContent = icono;
  else if(tipo === "success") iconEl.textContent = "✔";
  else if(tipo === "error") iconEl.textContent = "⚠";
  else iconEl.textContent = "ℹ";
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove("visible"); }, 3200);
}

/* ============================================================
   [S04] UTILIDADES GENERALES
   ============================================================ */
function norm(s){
  return (s || "").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim();
}
function esc(s){
  return (s || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return esc(s).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}
function normalizarClave(h){
  return h.toString().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/\s+/g," ")
    .toUpperCase().trim();
}
function getVal(obj, ...claves){
  if(!obj) return "";
  for(const k of claves){
    if(obj[k] !== undefined && obj[k] !== null && obj[k].toString().trim() !== ""){
      return obj[k].toString().trim();
    }
  }
  return "";
}
function obtenerIdAsig(o){
  return getVal(o, "ASIGNACION ID", "ASIGNACIÓN ID", "ASIGNACON ID", "ASIGNACION", "ASIGNACIÓN", "ID");
}
function obtenerFoto(o){
  return getVal(o, "FOTO", "URL_IMAGEN", "IMAGEN");
}
function renderEstado(val){
  const v = (val || "").toString().trim();
  if(!v) return "—";
  if(v.toUpperCase().includes("PENDIENTE")) return `<span class="estado-badge estado-pendiente">${esc(v)}</span>`;
  const up = v.toUpperCase();
  let cls = "estado-regular";
  if(up.includes("MALO")) cls = "estado-malo";
  else if(up.includes("BUENO") || up.includes("ÓPTIMO") || up.includes("OPTIMO")) cls = "estado-bueno";
  return `<span class="estado-badge ${cls}">${esc(v)}</span>`;
}
function renderFotoMiniatura(url){
  if(!url) return `<span style="font-size:22px;opacity:.4;">◈</span>`;
  if(!url.startsWith("http") && url.length > 20) url = `https://drive.google.com/uc?export=view&id=${url}`;
  return `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:22px;opacity:.4;&quot;>◈</span>'">`;
}
function normalizarUrlFoto(url){
  if(!url) return "";
  if(url.startsWith("http")) return url;
  if(url.length > 20) return `https://drive.google.com/uc?export=view&id=${url}`;
  return "";
}
function detectarTipoBusqueda(texto){
  const t = texto.trim().toUpperCase();
  if(!t) return "vacio";
  if(/^[A-Z0-9]{6,}$/.test(t) && /\d/.test(t) && /[A-Z]/.test(t)) return "codigo";
  if(/^\d+[A-Z]?$/.test(t)) return "id";
  return "nombre";
}

/* ============================================================
   [S04.1] EFECTOS DE CLICK — RIPPLE + SHAKE + FLASH
   ============================================================ */
function aplicarEfectoClick(el, x, y){
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.4;

  /* Coordenadas relativas al elemento */
  const clickX = (x !== undefined ? x : rect.left + rect.width / 2) - rect.left;
  const clickY = (y !== undefined ? y : rect.top + rect.height / 2) - rect.top;

  /* Asegurar posición relativa */
  const posOriginal = getComputedStyle(el).position;
  if(posOriginal === "static") el.style.position = "relative";
  if(getComputedStyle(el).overflow === "visible") el.style.overflow = "hidden";

  /* Ripple cian */
  const r1 = document.createElement("span");
  r1.className = "click-ripple cian";
  r1.style.width = size + "px";
  r1.style.height = size + "px";
  r1.style.left = (clickX - size / 2) + "px";
  r1.style.top = (clickY - size / 2) + "px";
  el.appendChild(r1);

  /* Ripple magenta retardado */
  setTimeout(() => {
    const r2 = document.createElement("span");
    r2.className = "click-ripple magenta";
    r2.style.width = size * 0.7 + "px";
    r2.style.height = size * 0.7 + "px";
    r2.style.left = (clickX - size * 0.35) + "px";
    r2.style.top = (clickY - size * 0.35) + "px";
    el.appendChild(r2);
    setTimeout(() => r2.remove(), 700);
  }, 80);

  /* Flash del borde */
  el.classList.remove("click-flash");
  void el.offsetWidth;
  el.classList.add("click-flash");

const PALABRAS_DEL = [
  "CONSULTORIO","COMANDO","MURO","GABINETE","TINGLADO","PATIO","JARDIN","JARDÍN",
  "DEPOSITO","DEPÓSITO","AMBIENTE","PARRILLERO","PALCO","GIMNASIO","MUSEO",
  "BASURERO","POLIGONO","POLÍGONO","SNACK","ESTACIONAMIENTO","SEFAM","TELECENTRO",
  "SALON","SALÓN","HORNO","PABELLON","PABELLÓN","MERCADO","PASILLO"
];
const PALABRAS_DE_LA = [
  "OFICINA","SECRETARIA","SECRETARÍA","AYUDANTIA","AYUDANTÍA","INSPECTORIA","INSPECTORÍA",
  "JEFATURA","COCINA","PANADERIA","PANADERÍA","PELUQUERIA","PELUQUERÍA","SASTRERIA","SASTRERÍA",
  "BIBLIOTECA","VIVIENDA","AVENIDA","PLAZA","SALA","SECCION","SECCIÓN","SUBSECCION","SUBSECCIÓN",
  "COMPANIA","COMPAÑÍA","BANDA","UNIDAD","CASA","ESCUELA","CANCHA"
];
function obtenerArticuloArticulo(nombreOficina){
  if(!nombreOficina) return "DEL";
  const limpio = nombreOficina.trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(/^DE LA\s/.test(limpio) || /^DEL\s/.test(limpio)) return "";
  if(/^DE\s/.test(limpio)) return "";
  const primera = limpio.split(/\s+/)[0];
  const primeraNorm = primera.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for(const p of PALABRAS_DEL){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DEL";
  }
  for(const p of PALABRAS_DE_LA){
    const pn = p.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(primeraNorm === pn) return "DE LA";
  }
  return "DEL";
}
function oficinaConArticulo(nombreOficina){
  if(!nombreOficina) return "";
  const art = obtenerArticuloArticulo(nombreOficina);
  if(art === "") return nombreOficina;
  return art + " " + nombreOficina;
}

/* ============================================================
   [S06] NOMBRES
   ============================================================ */
function abreviarNombresDePila(nombres){
  if(!nombres) return "";
  const tokens = nombres.trim().split(/\s+/).filter(Boolean);
  if(tokens.length <= 1) return nombres.trim();
  return tokens.map((n, i) => {
    if(i === 0) return n;
    if(n.endsWith(".")) return n;
    return n.charAt(0).toUpperCase() + ".";
  }).join(" ");
}
function construirNombreFirmante(grado, nombres, apPat, apMat){
  const gradoLimpio = (grado || "").trim();
  const nombresAbr = abreviarNombresDePila(nombres || "");
  const apPatLimpio = (apPat || "").trim();
  const apMatLimpio = (apMat || "").trim();
  return [gradoLimpio, nombresAbr, apPatLimpio, apMatLimpio].filter(Boolean).join(" ");
}

function generarResumenBienes(cantFijos, cantFungibles, cantInternos, cantPrestados){
  const partes = [];
  if(cantFijos > 0) partes.push(`${cantFijos} ${cantFijos === 1 ? 'ACTIVO FIJO' : 'ACTIVOS FIJOS'}`);
  if(cantFungibles > 0) partes.push(`${cantFungibles} ${cantFungibles === 1 ? 'FUNGIBLE' : 'FUNGIBLES'}`);
  if(cantInternos > 0) partes.push(`${cantInternos} ${cantInternos === 1 ? 'INTERNO' : 'INTERNOS'}`);
  if(cantPrestados > 0) partes.push(`${cantPrestados} ${cantPrestados === 1 ? 'BIEN PRESTADO' : 'BIENES PRESTADOS'}`);
  if(partes.length === 0) return "";
  if(partes.length === 1) return partes[0];
  if(partes.length === 2) return partes[0] + " Y " + partes[1];
  return partes.slice(0, -1).join(", ") + " Y " + partes[partes.length - 1];
}

/* ============================================================
   [S09] PARSER CSV
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function csvAObjetos(texto){
  const filas = parseCSV(texto);
  if(filas.length < 2) return [];
  const headers = filas[0].map(h => normalizarClave(h));
  const resultado = [];
  for(let i = 1; i < filas.length; i++){
    const fila = filas[i];
    const obj = {};
    let tieneDatos = false;
    headers.forEach((h, idx) => {
      const val = (fila[idx] === undefined || fila[idx] === null) ? "" : fila[idx].toString().trim();
      obj[h] = val;
      if(val) tieneDatos = true;
    });
    if(tieneDatos) resultado.push(obj);
  }
  return resultado;
}

async function cargarDesdeNube(forzar = false){
  const cont = document.getElementById("contenido");
  if(!forzar){
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      try{
        const parsed = JSON.parse(cache);
        if(parsed && parsed.fijos && parsed.resp){
          aplicarDatos(parsed);
          console.log("✔ Datos desde caché");
          mostrarHome();
          return;
        }
      }catch(e){ console.warn("Caché corrupto"); }
    }
  }
  cont.innerHTML = `<div class="loading">☁ SINCRONIZANDO CON LA NUBE...</div>`;
  document.getElementById("statusText").textContent = "SYNC";
  try{
    const hojas = [
      { key: "fijos",     nombre: "BD_FIJOS" },
      { key: "fungibles", nombre: "BD_FUNG" },
      { key: "internos",  nombre: "BD_INTERNO" },
      { key: "prestados", nombre: "BD_PRESTADOS" },
      { key: "resp",      nombre: "RESP" }
    ];
    const resultados = await Promise.all(
      hojas.map(h => fetch(`${API_URL_NUBE}?sheet=${h.nombre}`)
        .then(r => r.text())
        .then(texto => ({ key: h.key, nombre: h.nombre, texto }))
      )
    );
    const nuevo = { fijos: [], fungibles: [], internos: [], prestados: [], resp: [] };
    resultados.forEach(({ key, nombre, texto }) => {
      if(texto.trim().startsWith("<") || texto.trim().startsWith("{")){
        console.warn(`⚠ ${nombre}: respuesta no válida`);
        nuevo[key] = [];
        return;
      }
      nuevo[key] = csvAObjetos(texto);
    });
    nuevo.fijos = nuevo.fijos.filter(o => obtenerIdAsig(o));
    nuevo.fungibles = nuevo.fungibles.filter(o => obtenerIdAsig(o));
    nuevo.internos = nuevo.internos.filter(o => obtenerIdAsig(o));
    nuevo.prestados = nuevo.prestados.filter(o => obtenerIdAsig(o) || getVal(o, "DESCRIPCION DEL ACTIVO"));
    nuevo.resp = nuevo.resp.filter(o => getVal(o, "ID") && getNombreCompletoResp(o));
    if(forzar){
      const cambios = contarCambios(DATA, nuevo);
      if(cambios === 0) mostrarToast("Datos al día", "info", "ℹ");
      else mostrarToast(`Datos actualizados — ${cambios} cambio(s)`, "success", "✔");
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(nuevo));
    localStorage.setItem(CACHE_HOJA_KEY, Date.now().toString());
    aplicarDatos(nuevo);
    document.getElementById("statusText").textContent = "ONLINE";
    mostrarHome();
  }catch(err){
    console.error(err);
    cont.innerHTML = `<div class="error">⚠ NO SE PUDIERON CARGAR LOS DATOS<br><br><small>${esc(err.message)}</small></div>`;
    document.getElementById("statusText").textContent = "ERROR";
    mostrarToast("Error al cargar datos", "error", "⚠");
  }
}
function aplicarDatos(obj){
  DATA.fijos = obj.fijos || [];
  DATA.fungibles = obj.fungibles || [];
  DATA.internos = obj.internos || [];
  DATA.prestados = obj.prestados || [];

}

  let cambios = 0;
  ["fijos","fungibles","internos","prestados","resp"].forEach(k => {
    if((antes[k] || []).length !== (despues[k] || []).length) cambios++;

function getResponsablePorId(id){

}
function getOficinaResponsablePorId(id){
  const r = getResponsablePorId(id);

function ordenarIdAsignacion(a, b){
  const parse = (id) => {
    const m = (id || "").match(/^(\d+)([A-Z]*)$/i);
    if(!m) return [99999, ""];
    return [parseInt(m[1], 10), (m[2] || "").toUpperCase()];
  };
  const [numA, letA] = parse(a);
  const [numB, letB] = parse(b);
  if(numA !== numB) return numA - numB;
  return letA.localeCompare(letB);
}
function contarBienesPorAsignacion(id){
  const idLimpio = (id || "").trim();
  let total = 0;
  total += DATA.fijos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.fungibles.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.internos.filter(o => obtenerIdAsig(o) === idLimpio).length;
  total += DATA.prestados.filter(o => obtenerIdAsig(o) === idLimpio).length;
  return total;
}

function buscarResponsables(termino){
  const t = norm(termino);
  if(t.length < 1) return [];
  const coincidencias = DATA.resp.filter(r => norm(getNombreCompletoResp(r)).includes(t));
  const mapa = new Map();
  coincidencias.forEach(r => {
    const ced = getCedulaResp(r) || norm(getNombreCompletoResp(r));
    if(!mapa.has(ced)){
      mapa.set(ced, {
        cedula: ced,
        nombre: getNombreCompletoResp(r),
        cargo: getVal(r, "CARGO"),
        grado: getVal(r, "GRADO"),
        nombres: getVal(r, "NOMBRES"),
        apPat: getVal(r, "AP PAT"),
        apMat: getVal(r, "AP MAT"),
        asignaciones: []
      });
    }
    mapa.get(ced).asignaciones.push({ id: getVal(r, "ID"), oficina: getVal(r, "OFICINA"), cargo: getVal(r, "CARGO") });
  });
  const lista = Array.from(mapa.values());
  lista.forEach(per => per.asignaciones.sort((a,b) => ordenarIdAsignacion(a.id, b.id)));
  lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  return lista;
}

function tablaGeneral(tipo, lista){
  const titulos = { fijos: "FIJOS", fungibles: "FUNGIBLES", internos: "INTERNOS", prestados: "PRESTADOS" };
  const colorMap = { fijos: "verde", fungibles: "azul", internos: "marron", prestados: "vino" };
  const titulo = titulos[tipo] || tipo.toUpperCase();
  const color = colorMap[tipo] || "verde";
  let columnas = [];
  if(tipo === "fijos") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "ESTADO"];
  else if(tipo === "fungibles") columnas = ["ASIGNACIÓN", "RESPONSABLE", "CODIGO", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO"];
  else columnas = ["ASIGNACIÓN", "RESPONSABLE", "DESCRIPCION DEL ACTIVO", "CANTIDAD", "ESTADO", "OBS"];
  let html = `<div class="tabla-section">
    <div class="tabla-header" data-color="${color}">
      <div class="tabla-header-titulo"><span class="dot"></span>${titulo}</div>
      <div class="tabla-header-count">${lista.length}</div>
    </div>
    <div class="tabla-scroll"><table><thead><tr>`;
  columnas.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;
  const listaOrdenada = [...lista].sort((a, b) => ordenarIdAsignacion(obtenerIdAsig(a), obtenerIdAsig(b)));
  const tipoUpper = tipo.toUpperCase();
  listaOrdenada.forEach((item, i) => {
    html += `<tr style="animation-delay:${i * 8}ms" onclick="abrirDetalleBienDesdeModal('${escAttr(getVal(item, 'CODIGO'))}', '${tipoUpper}')">`;
    columnas.forEach(col => {
      let val = "";
      if(col === "ASIGNACIÓN") val = esc(obtenerIdAsig(item)) || "—";
      else if(col === "RESPONSABLE") val = esc(getNombreResponsablePorId(obtenerIdAsig(item)));
      else if(col === "CODIGO") val = getVal(item, "CODIGO") || "—";
      else if(col === "DESCRIPCION DEL ACTIVO") val = getVal(item, "DESCRIPCION DEL ACTIVO");
      else if(col === "CANTIDAD") val = getVal(item, "CANTIDAD") || "—";
      else if(col === "ESTADO") val = renderEstado(getVal(item, "ESTADO"));
      else if(col === "OBS") val = getVal(item, "OBS") || "—";
      html += `<td>${val}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDetalleBien(bien){
  if(!bien) return "";
  const tipo = bien.__tipo || "FIJOS";
  const tipoClase = tipo.toLowerCase();
  const idAsig = obtenerIdAsig(bien);
  const r = getResponsablePorId(idAsig);
  const oficina = r ? getVal(r, "OFICINA") : "—";
  const responsable = r ? getNombreCompletoResp(r) : "—";
  let campos = [];
  if(tipo === "FIJOS"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["AUXILIAR CONTABLE", getVal(bien, "AUXILIAR CONTABLE")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["COSTO HISTÓRICO", getVal(bien, "COSTO HISTORICO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR NETO", getVal(bien, "VALOR NETO")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["N°", getVal(bien, "N", "NRO")],["ORDEN DE OFICINAS", getVal(bien, "ORDEN DE OFICINAS")]
    ];
  } else if(tipo === "FUNGIBLES"){
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["CÓDIGO", getVal(bien, "CODIGO")],["CANTIDAD", getVal(bien, "CANTIDAD")],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["VALOR UNITARIO", getVal(bien, "VALOR UNITARIO")],
      ["FECHA (DÍA/MES/AÑO)", [getVal(bien,"DIA"), getVal(bien,"MES"), getVal(bien,"AÑO")].filter(Boolean).join(" / ")],
      ["VALOR TOTAL", getVal(bien, "VALOR TOTAL")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["NRO.", getVal(bien, "NRO")]
    ];
  } else {
    campos = [
      ["ASIGNACIÓN ID", idAsig],["RESPONSABLE", responsable],["OFICINA", oficina],
      ["DESCRIPCIÓN DEL ACTIVO", getVal(bien, "DESCRIPCION DEL ACTIVO")],
      ["CANTIDAD", getVal(bien, "CANTIDAD")],["ESTADO", getVal(bien, "ESTADO"), "estado"],
      ["OBSERVACIONES", getVal(bien, "OBS")]
    ];
  }
  const fotoRaw = obtenerFoto(bien);
  const fotoUrl = normalizarUrlFoto(fotoRaw);
  const tieneFoto = !!fotoUrl;
  const fotoHTML = tieneFoto
    ? `<img src="${escAttr(fotoUrl)}" alt="Foto" onclick="event.stopPropagation();abrirLightbox('${escAttr(fotoUrl)}')">`
    : `<span style="font-size:28px;opacity:.5;">◈</span>`;
  let btnVolver = estado.responsableActual
    ? `<button class="btn-nav" onclick="volverATablasDesdeDetalleBien()">← Volver a tablas</button>`
    : `<button class="btn-nav" onclick="cerrarModal()">← Cerrar</button>`;
  let html = `${btnVolver}
    <div class="bien-detalle">
      <div class="bien-detalle-header">
        <div class="bien-detalle-foto">${fotoHTML}</div>
        <div style="flex:1;min-width:0;">
          <div class="bien-detalle-codigo">${esc(getVal(bien, "CODIGO") || "SIN CÓDIGO")}</div>
          <div class="bien-detalle-nombre">${esc(getVal(bien, "DESCRIPCION DEL ACTIVO") || "Sin descripción")}</div>

        </div>
      </div>
      <div class="bien-detalle-campos">`;
  campos.forEach(([label, valor, tipoRender]) => {
    const v = (valor === null || valor === undefined) ? "" : valor.toString().trim();
    let contenido;
    if(tipoRender === "estado") contenido = v ? renderEstado(v) : `<span class="bien-detalle-valor vacio">—</span>`;
    else if(!v) contenido = `<span class="bien-detalle-valor vacio">—</span>`;
    else if(v.toUpperCase().includes("PENDIENTE")) contenido = `<span class="bien-detalle-valor pendiente">${esc(v)}</span>`;
    else contenido = `<span class="bien-detalle-valor">${esc(v)}</span>`;
    html += `<div class="bien-detalle-campo"><div class="bien-detalle-label">${esc(label)}</div><div style="flex:1;">${contenido}</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

/* ============================================================
   [S18] GENERAR HTML DEL ACTA — LLENADO EXACTO v4
   ------------------------------------------------------------
   Estrategia:
     1. Se mide la altura del título de sección, thead, y CADA fila.
     2. Se llena la hoja fila por fila hasta el borde real.
     3. Si una tabla se corta, la continuación NO repite título
        (solo thead para mantener estructura).
     4. Firmas: se colocan al final si caben; si no, nueva hoja.
     5. Encabezado de continuación SOLO si las firmas van solas.
   ============================================================ */
function generarHTMLActa(r, oficina, datos){
  const idAsignacion = oficina.id;
  const fijos = DATA.fijos.filter(b => obtenerIdAsig(b) === idAsignacion);
  const fungibles = DATA.fungibles.filter(b => obtenerIdAsig(b) === idAsignacion);
  const internos = DATA.internos.filter(b => obtenerIdAsig(b) === idAsignacion);
  const prestados = DATA.prestados.filter(b => obtenerIdAsig(b) === idAsignacion);

  const fechaActual = new Date();
  const fechaLarga = `Tupiza, ${mesCapitalizado(fechaActual.getMonth())} ${fechaActual.getDate()} del ${fechaActual.getFullYear()}`;

  const nombreOficina = oficina.oficina;
  const oficinaConArt = oficinaConArticulo(nombreOficina);

  /* --- Saliente --- */
  const salienteGrado = r.grado || "";
  const salienteNombres = r.nombres || "";
  const salienteApPat = r.apPat || "";
  const salienteApMat = r.apMat || "";
  let nombreSaliente = construirNombreFirmante(salienteGrado, salienteNombres, salienteApPat, salienteApMat);
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = r.nombre || "";
  if(!nombreSaliente || nombreSaliente.trim() === "") nombreSaliente = "___________________________________";
  const cargoSaliente = (r.cargo || "").toUpperCase();

  /* --- Entrante --- */
  const nombreEntrante = construirNombreFirmante(datos.entrante.grado, datos.entrante.nombres, datos.entrante.appat, datos.entrante.apmat);
  const cargoEntrante = (datos.entrante.cargo || "").toUpperCase() || "RESPONSABLE ENTRANTE";

  /* --- Supervisores --- */
  const nombreSup1 = construirNombreFirmante(datos.sup1.grado, datos.sup1.nombres, datos.sup1.appat, datos.sup1.apmat);
  const cargoSup1 = (datos.sup1.cargo || "").toUpperCase();
  const nombreSup2 = construirNombreFirmante(datos.sup2.grado, datos.sup2.nombres, datos.sup2.appat, datos.sup2.apmat);
  const cargoSup2 = (datos.sup2.cargo || "").toUpperCase();

  /* --- Vo.Bo. --- */
  const nombreVobo = construirNombreFirmante(datos.vobo.grado, datos.vobo.nombres, datos.vobo.appat, datos.vobo.apmat);
  const cargoVobo = (datos.vobo.cargo || "").toUpperCase();

  const tituloL1 = `ACTA DE ENTREGA Y RECEPCIÓN`;
  const tituloL2 = `DEL INVENTARIO ${oficinaConArt.toUpperCase()} DE LA <span style="white-space:nowrap">DIV-10</span>`;

  /* ============================================================
     [S18.1] MEDICIÓN
     ============================================================ */
  const contMed = document.getElementById("actaMedicion");
  function medirHTML(html){
    contMed.innerHTML = html;
    void contMed.offsetHeight;
    return contMed.scrollHeight;
  }

  /* --- Header --- */
  const headerHTML = `
    <div class="acta-membrete">
      <div class="linea1">COMANDO GENERAL DEL EJÉRCITO</div>
      <div class="linea2">DÉCIMA DIVISIÓN DEL EJÉRCITO</div>
      <div class="linea3">BOLIVIA</div>
    </div>
    <div class="acta-titulo">
      <span class="titulo-linea1">${esc(tituloL1)}</span>
      <span class="titulo-linea2">${tituloL2}</span>
    </div>
  `;
  const headerAltura = medirHTML(headerHTML);

  /* --- Firmas --- */
  const firmasHTML = generarBloqueFirmas({
    nombreSaliente, cargoSaliente, nombreEntrante, cargoEntrante,
    nombreSup1, cargoSup1, nombreSup2, cargoSup2,
    nombreVobo, cargoVobo, fechaLarga
  });
  const firmasAltura = medirHTML(firmasHTML);

  /* --- Resumen --- */
  const resumenBienes = generarResumenBienes(fijos.length, fungibles.length, internos.length, prestados.length);

  function generarEncabezadoContinuacion(numHoja){
    const texto = `${ordinalHoja(numHoja)} HOJA DEL INVENTARIO ${oficinaConArt.toUpperCase()} DIV-10`;
    let h = `<div class="acta-continuacion">${esc(texto)}</div>`;
    if(resumenBienes){
      h += `<div class="acta-continuacion-resumen">${esc(resumenBienes)}</div>`;
    }
    return h;
  }
  const encabezadoAltura = medirHTML(generarEncabezadoContinuacion(2));

  /* ============================================================
     [S18.2] CONSTRUCCIÓN DE SECCIONES CON ALTURA POR FILA
     ------------------------------------------------------------
     Para cada sección se calcula:
       - alturaTituloSeccion: altura del título romano
       - alturaThead: altura del thead
       - alturasFilas[]: altura de cada fila individual
     ============================================================ */
  const seccionesDef = [
    { nombre: "FIJOS",     num: "I.- ",   titulo: "INVENTARIO DE ACTIVOS FIJOS (VSIAF.)", lista: fijos,     tipo: "fijos" },
    { nombre: "FUNGIBLES", num: "II.- ",  titulo: "INVENTARIO DE ACTIVOS FUNGIBLES",     lista: fungibles, tipo: "fungibles" },
    { nombre: "INTERNOS",  num: "III.- ", titulo: "INVENTARIO INTERNO",                  lista: internos,  tipo: "internos" },
    { nombre: "PRESTADOS", num: "IV.- ",  titulo: "INVENTARIO DE BIENES PRESTADOS",      lista: prestados, tipo: "prestados" }
  ];

  /* Se construye una estructura de "secciones" con alturas por fila */
  const secciones = seccionesDef.map(sec => {
    const tituloHTML = `<div class="acta-seccion-titulo">${sec.num}<span class="subrayado">${esc(sec.titulo)}</span>.</div>`;
    const alturaTitulo = medirHTML(tituloHTML);

    const theadHTML = `<table class="acta-tabla"><thead><tr>${columnasDeTipo(sec.tipo)}</tr></thead></table>`;
    const alturaThead = medirHTML(theadHTML);

    /* Si la lista está vacía, generar una sola fila "NO CUENTA" */
    if(!sec.lista.length){
      const filaVaciaHTML = `<table class="acta-tabla"><tbody><tr><td class="vacia" colspan="4">NO CUENTA</td></tr></tbody></table>`;
      const alturaFilaVacia = medirHTML(filaVaciaHTML);
      return {
        ...sec,
        alturaTitulo,
        alturaThead,
        filas: [{ html: `<tr><td class="vacia" colspan="4">NO CUENTA</td></tr>`, altura: alturaFilaVacia }],
        vacia: true
      };
    }

    /* Medir cada fila individualmente */
    const filas = sec.lista.map((b, i) => {
      const filaHTML = `<table class="acta-tabla"><tbody>${generarFilaTabla(b, i, sec.tipo)}</tbody></table>`;
      const altura = medirHTML(filaHTML);
      return {
        html: generarFilaTabla(b, i, sec.tipo),
        altura: altura
      };
    });

    return {
      ...sec,
      alturaTitulo,
      alturaThead,
      filas,
      vacia: false
    };
  });

  /* ============================================================
     [S18.3] EMPAQUETADOR — LLENADO EXACTO POR FILA
     ============================================================ */
  let htmlFinal = "";
  let alturaAcumulada = 0;
  let hojaActual = 1;
  let hojaActualTieneTabla = false;

  /* Colocar header en hoja 1 */
  htmlFinal += headerHTML;
  alturaAcumulada += headerAltura;

  /* Cierra la tabla abierta (si hay) antes de un page-break o al final */
  let tablaAbierta = false;

  function cerrarTablaSiAbierta(){
    if(tablaAbierta){
      htmlFinal += `</tbody></table></div>`;
      tablaAbierta = false;
    }
  }

  /* Inserta page-break SIN encabezado */
  function nuevaHojaSinEncabezado(){
    cerrarTablaSiAbierta();
    htmlFinal += `<div class="saltar-pagina"></div>`;
    hojaActual++;
    alturaAcumulada = 0;
    hojaActualTieneTabla = false;
  }

  /* Inserta page-break CON encabezado de continuación */
  function nuevaHojaConEncabezado(){
    cerrarTablaSiAbierta();
    htmlFinal += `<div class="saltar-pagina"></div>`;
    hojaActual++;
    const enc = generarEncabezadoContinuacion(hojaActual);
    htmlFinal += enc;
    alturaAcumulada = encabezadoAltura;
    hojaActualTieneTabla = false;
  }

  /* Recorrer secciones */
  for(let s = 0; s < secciones.length; s++){
    const sec = secciones[s];

    /* ¿Cabe el título + thead + al menos 1 fila? */
    const primeraFilaAltura = sec.filas.length > 0 ? sec.filas[0].altura : 0;
    const espacioNecesarioInicio = sec.alturaTitulo + sec.alturaThead + primeraFilaAltura;
    const espacioRestanteInicial = ALTURA_UTIL_HOJA - alturaAcumulada;

    /* Si no cabe ni siquiera el inicio, nueva hoja SIN encabezado */
    if(espacioNecesarioInicio > espacioRestanteInicial){
      nuevaHojaSinEncabezado();
    }

    /* Abrir sección: título + inicio de tabla */
    htmlFinal += `<div class="acta-seccion">`;
    htmlFinal += `<div class="acta-seccion-titulo">${sec.num}<span class="subrayado">${esc(sec.titulo)}</span>.</div>`;
    htmlFinal += `<table class="acta-tabla"><thead><tr>${columnasDeTipo(sec.tipo)}</tr></thead><tbody>`;
    tablaAbierta = true;
    alturaAcumulada += sec.alturaTitulo + sec.alturaThead;
    hojaActualTieneTabla = true;

    /* Colocar filas una por una */
    for(let f = 0; f < sec.filas.length; f++){
      const fila = sec.filas[f];
      const espacioRestante = ALTURA_UTIL_HOJA - alturaAcumulada;

      if(fila.altura <= espacioRestante){
        /* Cabe → colocar */
        htmlFinal += fila.html;
        alturaAcumulada += fila.altura;
      } else {
        /* No cabe → cerrar tabla, nueva hoja SIN encabezado,
           reabrir tabla con thead (para que la continuación sea legible) */
        cerrarTablaSiAbierta();
        htmlFinal += `<div class="saltar-pagina"></div>`;
        hojaActual++;
        alturaAcumulada = 0;
        hojaActualTieneTabla = false;

        /* Reabrir tabla en la nueva hoja: solo thead, sin título romano */
        htmlFinal += `<div class="acta-seccion">`;
        htmlFinal += `<table class="acta-tabla"><thead><tr>${columnasDeTipo(sec.tipo)}</tr></thead><tbody>`;
        tablaAbierta = true;
        alturaAcumulada += sec.alturaThead;
        hojaActualTieneTabla = true;

        /* Colocar la fila */
        htmlFinal += fila.html;
        alturaAcumulada += fila.altura;
      }
    }

    /* Cerrar tabla de esta sección */
    cerrarTablaSiAbierta();
  }

  /* ============================================================
     [S18.4] DECISIÓN DE LAS FIRMAS
     ------------------------------------------------------------
     Si las firmas caben en la hoja actual → colocar directamente.
     Si NO caben → nueva hoja CON encabezado de continuación.
     ============================================================ */
  const espacioParaFirmas = ALTURA_UTIL_HOJA - alturaAcumulada;

  if(firmasAltura <= espacioParaFirmas){
    /* Caben en la hoja actual → sin encabezado de continuación */
    htmlFinal += firmasHTML;
  } else {
    /* No caben → nueva hoja con encabezado de continuación
       (porque la nueva hoja va a tener SOLO las firmas) */
    nuevaHojaConEncabezado();
    htmlFinal += firmasHTML;
  }

  return htmlFinal;
}
/* ============================================================
   [S19] HELPERS DE TABLA DEL ACTA
   ============================================================ */
function columnasDeTipo(tipo){
  if(tipo === "fijos"){
    return `<th style="width:8%;">N°</th><th style="width:22%;">CÓDIGO (VSIAF.)</th><th style="width:55%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
  }
  return `<th style="width:8%;">N°</th><th style="width:10%;">CANTIDAD</th><th style="width:67%;">DESCRIPCIÓN</th><th style="width:15%;">ESTADO</th>`;
}
function generarFilaTabla(b, i, tipo){
  const codigo = getVal(b, "CODIGO");
  const cant = getVal(b, "CANTIDAD");
  const desc = getVal(b, "DESCRIPCION DEL ACTIVO");
  const estado = getVal(b, "ESTADO");
  if(tipo === "fijos"){
    return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(codigo)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
  }
  return `<tr><td class="center">${i+1}.-</td><td class="center">${esc(cant)}</td><td class="descripcion">${esc(desc)}</td><td class="center">${esc(estado)}</td></tr>`;
}

/* ============================================================
   [S20] BLOQUE DE FIRMAS
   ============================================================ */
function generarBloqueFirmas(d){
  let bloqueFirmasHTML = `
    <div class="acta-firmas-fila">
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">ENTREGUÉ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreSaliente)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSaliente)}</div>
      </div>
      <div class="acta-firma-bloque-lado">
        <div class="acta-firma-rol">RECIBÍ CONFORME:</div>
        <div class="acta-firma-nombre">${esc(d.nombreEntrante)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoEntrante)}</div>
      </div>
    </div>
  `;
  if(d.nombreSup1 && d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firmas-fila">
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
        </div>
        <div class="acta-firma-bloque-lado">
          <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
          <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
        </div>
      </div>`;
  } else if(d.nombreSup1){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup1)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup1)}</div>
      </div>`;
  } else if(d.nombreSup2){
    bloqueFirmasHTML += `
      <div class="acta-firma-bloque">
        <div class="acta-firma-nombre" style="margin-top:0;">${esc(d.nombreSup2)}</div>
        <div class="acta-firma-cargo">${esc(d.cargoSup2)}</div>
      </div>`;
  }
  bloqueFirmasHTML += `
    <div class="acta-firma-bloque">
      <div class="acta-vobo">Vo. Bo.</div>
      <div class="acta-firma-nombre">${esc(d.nombreVobo)}</div>
      <div class="acta-firma-cargo">${esc(d.cargoVobo)}</div>
    </div>
  `;
  return `<div class="acta-bloque-firmas">
    <div class="acta-fecha-firmas">${esc(d.fechaLarga)}</div>
    <div class="acta-firmas">${bloqueFirmasHTML}</div>
  </div>`;
}

/* ============================================================
   [S21] MESES
   ============================================================ */
function mesCapitalizado(m){
  const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return meses[m];
}

/* ============================================================
   [S22] LIGHTBOX
   ============================================================ */
function abrirLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("visible");
}
function cerrarLightbox(){ document.getElementById("lightbox").classList.remove("visible"); }

/* ============================================================
   [S23] ATAJOS
   ============================================================ */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    if(estado.pantalla !== "busqueda") irBusqueda();
    else document.getElementById("buscador").focus();
  }
  if((e.ctrlKey || e.metaKey) && e.key === "t"){ e.preventDefault(); toggleTheme(); }
  if(e.key === "Escape"){
    if(document.getElementById("lightbox").classList.contains("visible")) cerrarLightbox();
    else if(document.getElementById("modalVistaPrevia").classList.contains("visible")) cerrarModalVistaPrevia();
    else if(document.getElementById("modalEntrante").classList.contains("visible")) cerrarModalEntrante();
    else if(document.getElementById("modal").classList.contains("visible")) cerrarModal();
  }
});

/* ============================================================
   [S24] INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  try{
    history.replaceState({ pantalla: "home" }, "");
    history.pushState({ pantalla: "home" }, "");
  }catch(e){}
  cargarDesdeNube(false);
});
